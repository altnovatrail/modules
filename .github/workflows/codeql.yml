# CodeQL over the repository's workflows and its languages (R09 .github), pinned to a release of
# .github. The job gives the shared workflow what it needs to upload its results.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: altnovatrail/.github/.github/workflows/codeql.yml@982ffe64b1f26f1ca4e0279c093d83cbb8ff3882 # v0.1.19
    # The tests of the recipes, test/*.mjs, are JavaScript, and the recipes themselves bash, which
    # CodeQL does not read (R10); the port of standalone's tasks, tools/port, is Go (R12).
    with:
      languages: javascript-typescript go
