# NovaTrail's shared checks, pinned to a release of .github by SHA with its version beside it;
# Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33

  # The Go code of tools/port, by the justfile's recipes ci-lint, ci-test, ci-vuln and ci-licenses.
  # Its coverage goes to Codecov by OIDC, with no secret, so the job gives the shared workflow
  # id-token: write, which only its coverage job asks for.
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/go.yml@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33

  # The repository's own jobs run in a stage of .devcontainer/Dockerfile, by spec's toolchain.sh
  # from the submodule. The two signatures and "Gate" run in toolchain-core, by TOOLCHAIN_STAGE,
  # since release-verify and module-kit are in the core; "Modules" runs in toolchain, which adds
  # canvas's generator that eval-match draws with. Each job decides what to run itself, with no
  # paths filter on the workflow: a required check of a skipped workflow stays "Pending" (R03).
  #
  # Each job takes the image from the cache of GitHub Actions: a file of docker save by the sha256
  # of the Dockerfile, which pins everything it fetches, so that on a hit an outage of nodejs.org,
  # GitHub or the Ubuntu snapshot fails no check. The path and key of each stage,
  # novatrail-<stage>.tar under <stage>-…, are those of .github's workflows, so that the own jobs,
  # "Documents" and the jobs of "Go" share one entry a stage. Only a push to main saves the file, on
  # a miss: an entry never changes, and one of a pull request is read by its own re-runs alone, so a
  # run that saves nothing hands toolchain.sh no file to write. A broken entry stays until it is
  # deleted (gh cache delete): toolchain.sh warns of it and builds. The release takes no cache: what
  # it signs is built from the Dockerfile alone (R31 spec).

  # The signature of the module-kit release whose binary the stage installs, by spec's
  # release-verify, and the Dockerfile's sums against that release's SHA256SUMS, on every run.
  module-kit:
    name: module-kit signature
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - id: cache
        name: Core image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain-core.tar
          key: toolchain-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}
      - id: toolchain
        name: Core image
        env:
          TOOLCHAIN_STAGE: toolchain-core
          TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-toolchain-core.tar
          SAVE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$SAVE" != true ] && [ ! -f "$TOOLCHAIN_IMAGE_FILE" ]; then
              unset TOOLCHAIN_IMAGE_FILE
          fi
          sh spec/tools/toolchain/toolchain.sh build
      - name: Core image to the cache
        if: ${{ steps.toolchain.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain-core.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Free the file of the core image
        if: ${{ !cancelled() }}
        run: rm -f -- "$RUNNER_TEMP/novatrail-toolchain-core.tar"
      - name: module-kit-verify
        run: sh spec/tools/toolchain/toolchain.sh run just module-kit-verify

  # The signature of the canvas release whose generator of synthetic samples the stage toolchain
  # installs, by spec's release-verify, and the Dockerfile's sum against that release's SHA256SUMS,
  # on every run. It reads the Dockerfile and the release, not the installed file, so it runs in the
  # core.
  canvas:
    name: canvas signature
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - id: cache
        name: Core image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain-core.tar
          key: toolchain-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}
      - id: toolchain
        name: Core image
        env:
          TOOLCHAIN_STAGE: toolchain-core
          TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-toolchain-core.tar
          SAVE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$SAVE" != true ] && [ ! -f "$TOOLCHAIN_IMAGE_FILE" ]; then
              unset TOOLCHAIN_IMAGE_FILE
          fi
          sh spec/tools/toolchain/toolchain.sh build
      - name: Core image to the cache
        if: ${{ steps.toolchain.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain-core.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Free the file of the core image
        if: ${{ !cancelled() }}
        run: rm -f -- "$RUNNER_TEMP/novatrail-toolchain-core.tar"
      - name: canvas-verify
        run: sh spec/tools/toolchain/toolchain.sh run just canvas-verify

  # The tree of modules/ and every module, by module-kit check and build, and each against its
  # published versions by module-kit diff — the index of the newest release, checked by
  # release-verify, or --first before the first release; diff's status is the job's. The tests of
  # the recipes run first. Then the layout of each module's eval/ and its eval set by spec's
  # sample-check --eval-set: no key, and the network only for sample-check's tools from their lock
  # file, so a pull request from a fork runs it too; it runs even when a step before it failed, so
  # that a refused sample shows on the first run. Then eval-match, as eval-check runs, holds each
  # sample to the package of the commit — a synthetic one drawn again by canvas's generator, a
  # person's by the digest of its task's open view —, with no network and no key.
  #
  # Each step is a container of its own whose home toolchain.sh throws away, so the steps share one
  # cache of Go, a folder of the checkout that toolchain.sh mounts at /work and git ignores: the port
  # is compiled once, by the tests, and the pictures' steps reuse it. Across runs the folder lives
  # in the cache of GitHub Actions by the rules of .github's go.yml: the key is the runner's OS and
  # architecture, the Dockerfile, which pins Go, and go.sum, which pins the modules, with no restore
  # key; what the cache gave passes go mod verify before any step builds from it, or is deleted with
  # a warning; only a push to main saves. go.yml restores by the prefix without go.sum, and this job
  # does not.
  modules:
    name: Modules
    needs: [module-kit, canvas]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GO_CACHE: GOCACHE=/work/.cache/go/build
      GO_MODULES: GOMODCACHE=/work/.cache/go/mod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - id: cache
        name: Toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}
      - id: toolchain
        name: Toolchain image
        env:
          TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-toolchain.tar
          SAVE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$SAVE" != true ] && [ ! -f "$TOOLCHAIN_IMAGE_FILE" ]; then
              unset TOOLCHAIN_IMAGE_FILE
          fi
          sh spec/tools/toolchain/toolchain.sh build
      - name: Toolchain image to the cache
        if: ${{ steps.toolchain.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Free the file of the toolchain image
        if: ${{ !cancelled() }}
        run: rm -f -- "$RUNNER_TEMP/novatrail-toolchain.tar"
      # After the checkout, so nothing cleans the folder once it is restored, and the modules go
      # writes read-only need no -modcacherw.
      - id: go-cache
        name: Go caches from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/go
          key: go-${{ runner.os }}-${{ runner.arch }}-modules-${{ hashFiles('.devcontainer/Dockerfile') }}-${{ hashFiles('go.sum') }}
      # go mod verify in the root module, the one module the steps build (.devcontainer/gopls/ is
      # gopls's lock file, which the stage builds), hashes each module of its build again against
      # the hash go checked against go.sum when it was downloaded. A check that fails or cannot run
      # costs the run its cache, not its verdict. A verified cache has its builds touched: go
      # deletes a build unused for five days, by its time, at the end of a command, and an entry
      # keeps the times of its save, so the first step would delete what the next ones need.
      - name: Go caches
        env:
          RESTORED: ${{ steps.go-cache.outputs.cache-matched-key }}
        run: |
          cache=.cache/go
          mkdir -p -- "$cache/mod" "$cache/build"
          if [ -z "$RESTORED" ]; then
              echo "Go caches: none in the cache; the job starts with empty ones."
              exit 0
          fi
          if sh spec/tools/toolchain/toolchain.sh run env "$GO_CACHE" "$GO_MODULES" go mod verify; then
              echo "Go caches: ${RESTORED}, its modules verified."
              find "$cache/build" -type f -exec touch -c -- {} +
              exit 0
          fi
          echo "::warning::The Go caches of ${RESTORED} did not pass go mod verify: they are deleted, and the job downloads and builds without them. An entry that fails on every run stays until it is deleted (gh cache delete) or go.sum or the Dockerfile changes."
          chmod -R u+w -- "$cache"
          rm -rf -- "$cache"
          mkdir -p -- "$cache/mod" "$cache/build"
      - name: Tests of the recipes and of the templates
        run: sh spec/tools/toolchain/toolchain.sh run env "$GO_CACHE" "$GO_MODULES" just test
      - name: modules-check
        run: sh spec/tools/toolchain/toolchain.sh run env "$GO_CACHE" "$GO_MODULES" just modules-check
      - name: eval-check
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: sh spec/tools/toolchain/toolchain.sh run env "$GO_CACHE" "$GO_MODULES" just eval-check
      - name: eval-match
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: sh spec/tools/toolchain/toolchain.sh run env "$GO_CACHE" "$GO_MODULES" just eval-match
      - name: The pictures of the lessons
        run: sh spec/tools/toolchain/toolchain.sh run env "$GO_CACHE" "$GO_MODULES" just lesson-pictures modules/olympiad-math --check
      - name: The pictures of the instances of the templates
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: sh spec/tools/toolchain/toolchain.sh run env "$GO_CACHE" "$GO_MODULES" just template-pictures modules/olympiad-math --check
      # A push to main saves, once every step has passed, under a key no entry holds yet: an entry
      # is never replaced, and one a pull request saved would be read by its own re-runs alone. A
      # save that fails costs the next run its speed, not this one its verdict.
      - name: Go caches into the cache
        if: ${{ steps.go-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/go
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The gate of sim: sim at SIM_TAG and its commit SIM_COMMIT, from git, as sim's README has a
  # caller of the gate of modules take it. just gate-inputs writes the inputs in this
  # repository's stage toolchain-core — the published versions, checked by release-verify, and the
  # package of every module —, and the gate runs from the root of sim's checkout in the toolchain
  # stage of sim's own devcontainer at that commit. sim runs only what of each package changed, or
  # nothing; it holds invariants and absolute thresholds, so its exit is the job's. A pull request
  # that moves SIM_COMMIT runs every package, -all; so does a run whose base cannot be read, rather
  # than run too little.
  #
  # sim's image is cached by the sha256 of sim's Dockerfile under its own key, and the gate's caches
  # of Go by sim's go.sum and Dockerfile, as sim's gate.yml keeps them: only a push to main saves
  # either. Both checkouts lie under .cache/ of this one, which git ignores, so that the container
  # of either stage sees them at /work.
  gate:
    name: Gate
    needs: [module-kit]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SIM_TAG: v0.1.24
      SIM_COMMIT: 33d70f288682d95e12f6072c4e9ff09253417497
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: altnovatrail/sim
          ref: ${{ env.SIM_COMMIT }}
          path: .cache/sim
          persist-credentials: false
      # The tag is on the commit, as sim's gate.yml holds a caller's: an annotated tag points at its
      # commit through ^{}. A tag moved or a SHA mistyped stops the gate.
      - name: sim's tag
        run: |
          tags="$(git ls-remote https://github.com/altnovatrail/sim "refs/tags/$SIM_TAG" "refs/tags/$SIM_TAG^{}")"
          tagged="$(printf '%s\n' "$tags" | awk -v ref="refs/tags/$SIM_TAG^{}" '$2 == ref { print $1 }')"
          if [ -z "$tagged" ]; then
              tagged="$(printf '%s\n' "$tags" | awk '{ print $1 }')"
          fi
          if [ "$tagged" != "$SIM_COMMIT" ]; then
              echo "::error::sim $SIM_TAG is on ${tagged:-no commit}, and SIM_COMMIT is $SIM_COMMIT"
              exit 1
          fi
      # -all when the commit this run is checked against — the pull request's base, or the push's
      # before — pins another sim, or none, or cannot be read.
      - name: Whether sim moved
        id: moved
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=""
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] && git fetch --quiet --no-tags --depth=1 origin "$BASE"; then
              base="$(git show "$BASE:.github/workflows/ci.yml" | sed -n 's/^[[:space:]]*SIM_COMMIT:[[:space:]]*\([0-9a-f]\{40\}\)[[:space:]]*$/\1/p' || true)"
          fi
          if [ "$base" = "$SIM_COMMIT" ]; then
              echo "all=" >> "$GITHUB_OUTPUT"
              echo "sim is $SIM_TAG at $BASE too: the gate runs what changed."
          else
              echo "all=-all" >> "$GITHUB_OUTPUT"
              echo "sim moves from ${base:-nothing that can be read} to $SIM_COMMIT: the gate runs every package."
          fi
      - id: cache
        name: Core image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain-core.tar
          key: toolchain-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}
      - id: toolchain
        name: Core image
        env:
          TOOLCHAIN_STAGE: toolchain-core
          TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-toolchain-core.tar
          SAVE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$SAVE" != true ] && [ ! -f "$TOOLCHAIN_IMAGE_FILE" ]; then
              unset TOOLCHAIN_IMAGE_FILE
          fi
          sh spec/tools/toolchain/toolchain.sh build
      - name: Core image to the cache
        if: ${{ steps.toolchain.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain-core.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Free the file of the core image
        if: ${{ !cancelled() }}
        run: rm -f -- "$RUNNER_TEMP/novatrail-toolchain-core.tar"
      - name: gate-inputs
        run: sh spec/tools/toolchain/toolchain.sh run just gate-inputs .cache/gate
      - id: sim-cache
        name: sim's toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sim-toolchain.tar
          key: sim-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cache/sim/.devcontainer/Dockerfile') }}
      - id: sim-toolchain
        name: sim's toolchain image
        env:
          SAVE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          tar=$RUNNER_TEMP/sim-toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect sim-toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "sim's toolchain image: loaded from the cache."
                  exit 0
              fi
              echo "::warning::The cache's file of sim's toolchain stage does not load as the image sim-toolchain: it is built from sim's Dockerfile, on every run until the entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag sim-toolchain - < .cache/sim/.devcontainer/Dockerfile
          # Only a run that saves writes the file. A file the cache gave has its entry already, which
          # no save replaces.
          if [ "$SAVE" = true ] && [ "$restored" = false ] && ! docker save --output "$tar" sim-toolchain; then
              echo "::warning::sim's toolchain image could not be saved for the cache: the next run builds it again."
              rm -f -- "$tar"
          fi
      - name: sim's toolchain image to the cache
        if: ${{ steps.sim-toolchain.outcome == 'success' && steps.sim-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sim-toolchain.tar
          key: ${{ steps.sim-cache.outputs.cache-primary-key }}
      - name: Free the file of sim's toolchain image
        if: ${{ !cancelled() }}
        run: rm -f -- "$RUNNER_TEMP/sim-toolchain.tar"
      - id: go
        name: The caches of Go of the gate
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go
          key: gate-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cache/sim/go.sum', '.cache/sim/.devcontainer/Dockerfile') }}
          restore-keys: gate-modules-${{ runner.os }}-${{ runner.arch }}-
      # ran says whether the gate built and ran the bench, so that only such a run fills the caches
      # of Go: a run with nothing to gate builds sim alone, and its entry would stand for good.
      - id: gate
        name: Gate
        env:
          ALL: ${{ steps.moved.outputs.all }}
        run: |
          echo "ran=false" >> "$GITHUB_OUTPUT"
          mapfile -t inputs < .cache/gate/args
          if [ "${#inputs[@]}" -eq 0 ]; then
              echo "No module yet, so the gate has nothing to run." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
          fi
          all=()
          if [ -n "$ALL" ]; then
              all=("$ALL")
          fi
          mkdir -p "$RUNNER_TEMP/go"
          set -o pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env GOCACHE=/go/build --env GOMODCACHE=/go/mod \
              --volume "$RUNNER_TEMP/go:/go" --volume "$PWD:/work" --workdir /work \
              sim-toolchain just -f .cache/sim/justfile gate modules ${all[@]+"${all[@]}"} "${inputs[@]}" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/gate.txt"
          if ! grep -q '^gate: nothing the bench reads changed' "$RUNNER_TEMP/gate.txt"; then
              echo "ran=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The caches of Go of the gate to the cache
        if: ${{ github.event_name != 'pull_request' && steps.go.outputs.cache-hit != 'true' && steps.gate.outputs.ran == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go
          key: ${{ steps.go.outputs.cache-primary-key }}
