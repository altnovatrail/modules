# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@fab102d8bbb4659575e107ee488e072aaaa71821 # v0.1.24

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@fab102d8bbb4659575e107ee488e072aaaa71821 # v0.1.24

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@fab102d8bbb4659575e107ee488e072aaaa71821 # v0.1.24

  # The Go code of tools/port, the port of standalone's tasks (R12), by the recipes ci-lint, ci-test,
  # ci-vuln and ci-licenses of the justfile: "Go / lint", "Go / test", "Go / vuln" and "Go /
  # licenses". Its coverage goes to Codecov by OIDC, with no secret, so the job gives the shared
  # workflow id-token: write, which only its coverage job asks for (R48 spec).
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/go.yml@fab102d8bbb4659575e107ee488e072aaaa71821 # v0.1.24

  # The repository's own jobs run in the toolchain stage of .devcontainer/Dockerfile, as the shared
  # checks do, by spec's toolchain.sh from the submodule at the tag it pins: the stage, and the
  # recipes of the justfile in it (R10). What to run each job decides itself, with no paths filter
  # on the workflow: a required check of a skipped workflow stays "Pending" (R03).
  #
  # Each job takes the image from the cache of GitHub Actions, as spec's own CI and .github's
  # documents.yml do (R31 spec; R35): a file of docker save by the sha256 of the Dockerfile, which
  # pins everything it fetches, so that on a hit the Dockerfile does not run and an outage of
  # nodejs.org, GitHub or the Ubuntu snapshot fails no check. The path is documents.yml's, so that
  # the three jobs and "Documents" share one entry. toolchain.sh loads the file, or builds the
  # stage and writes it; the file is saved only on a miss, since an entry never changes, and a
  # broken entry stays until it is deleted (gh cache delete): toolchain.sh warns of it and builds.
  # The scope of main is filled by the runs on main. The release takes no cache (R31 spec).

  # The signature of the module-kit release whose binary the stage installs, by spec's
  # release-verify, and the Dockerfile's sums against that release's SHA256SUMS (R77 spec), on
  # every run (R10).
  module-kit:
    name: module-kit signature
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - id: cache
        name: Toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}
      - id: toolchain
        name: Toolchain image
        env:
          TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-toolchain.tar
        run: sh spec/tools/toolchain/toolchain.sh build
      - name: Toolchain image to the cache
        if: ${{ steps.toolchain.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Free the file of the toolchain image
        if: ${{ !cancelled() }}
        run: rm -f -- "$RUNNER_TEMP/novatrail-toolchain.tar"
      - name: module-kit-verify
        run: sh spec/tools/toolchain/toolchain.sh run just module-kit-verify

  # The signature of the canvas release whose generator of synthetic samples the stage installs, by
  # spec's release-verify, and the Dockerfile's sum against that release's SHA256SUMS (R77 spec), on
  # every run (R29).
  canvas:
    name: canvas signature
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - id: cache
        name: Toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}
      - id: toolchain
        name: Toolchain image
        env:
          TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-toolchain.tar
        run: sh spec/tools/toolchain/toolchain.sh build
      - name: Toolchain image to the cache
        if: ${{ steps.toolchain.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Free the file of the toolchain image
        if: ${{ !cancelled() }}
        run: rm -f -- "$RUNNER_TEMP/novatrail-toolchain.tar"
      - name: canvas-verify
        run: sh spec/tools/toolchain/toolchain.sh run just canvas-verify

  # The tree of modules/ and every module in it, by module-kit check and build, and each against its
  # published versions by module-kit diff — the index of the newest release of modules, checked by
  # release-verify, or --first before the first release (R11) —, once the signatures of
  # module-kit's binary and of canvas's generator have passed; the tests of the recipes first. diff's status is the job's. Then the layout of each
  # module's eval/, and each module's eval set by spec's sample-check --eval-set (R04, R25): no key,
  # and the network only for the tools of sample-check from their lock file, so a pull request from
  # a fork runs it too, and it runs even when a step before it failed, so that a refused sample
  # shows on the first run. Then eval-match holds each sample to the package of the commit: a
  # synthetic one drawn again by canvas's generator, a person's by the digest of its task's open
  # view (amendment T59 to R25), with no network and no key, and as eval-check runs.
  modules:
    name: Modules
    needs: [module-kit, canvas]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - id: cache
        name: Toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}
      - id: toolchain
        name: Toolchain image
        env:
          TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-toolchain.tar
        run: sh spec/tools/toolchain/toolchain.sh build
      - name: Toolchain image to the cache
        if: ${{ steps.toolchain.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Free the file of the toolchain image
        if: ${{ !cancelled() }}
        run: rm -f -- "$RUNNER_TEMP/novatrail-toolchain.tar"
      - name: Tests of the recipes and of the templates
        run: sh spec/tools/toolchain/toolchain.sh run just test
      - name: modules-check
        run: sh spec/tools/toolchain/toolchain.sh run just modules-check
      - name: eval-check
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: sh spec/tools/toolchain/toolchain.sh run just eval-check
      - name: eval-match
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: sh spec/tools/toolchain/toolchain.sh run just eval-match
      - name: The pictures of the lessons
        run: sh spec/tools/toolchain/toolchain.sh run just lesson-pictures modules/olympiad-math --check
      - name: The pictures of the instances of the templates
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: sh spec/tools/toolchain/toolchain.sh run just template-pictures modules/olympiad-math --check
