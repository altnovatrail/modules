# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@89d3ceee0b9977b3334488a4133d084d76474e0d # v0.1.15

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@89d3ceee0b9977b3334488a4133d084d76474e0d # v0.1.15

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@f3addb7403d084c560c61481e217b93f8e7ee1f3 # v0.1.10

  # The Go code of tools/port, the port of standalone's tasks (R12), by the recipes ci-lint, ci-test,
  # ci-vuln and ci-licenses of the justfile: "Go / lint", "Go / test", "Go / vuln" and "Go /
  # licenses". Its coverage goes to Codecov by OIDC, with no secret, so the job gives the shared
  # workflow id-token: write, which only its coverage job asks for (R48 spec).
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/go.yml@89d3ceee0b9977b3334488a4133d084d76474e0d # v0.1.15

  # The repository's own jobs run in the toolchain stage of .devcontainer/Dockerfile, as the shared
  # checks do, by spec's toolchain.sh from the submodule at the tag it pins: the stage, and the
  # recipes of the justfile in it (R10). What to run each job decides itself, with no paths filter
  # on the workflow: a required check of a skipped workflow stays "Pending" (R03).

  # The signature of the module-kit release whose binary the stage installs, by spec's
  # release-verify, and the Dockerfile's sums against that release's SHA256SUMS (R77 spec), on
  # every run (R10).
  module-kit:
    name: module-kit signature
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Toolchain image
        run: sh spec/tools/toolchain/toolchain.sh build
      - name: module-kit-verify
        run: sh spec/tools/toolchain/toolchain.sh run just module-kit-verify

  # The tree of modules/ and every module in it, by module-kit check and build, and each against its
  # published versions by module-kit diff — the index of the newest release of modules, checked by
  # release-verify, or --first before the first release (R11) —, once the binary's signature has
  # passed; the tests of the recipes first. diff's status is the job's. Then the layout of each
  # module's eval/, and each module's eval set by spec's sample-check --eval-set (R04, R25): no key,
  # and the network only for the tools of sample-check from their lock file, so a pull request from
  # a fork runs it too, and it runs even when a step before it failed, so that a refused sample
  # shows on the first run.
  modules:
    name: Modules
    needs: module-kit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Toolchain image
        id: toolchain
        run: sh spec/tools/toolchain/toolchain.sh build
      - name: Tests of the recipes and of the templates
        run: sh spec/tools/toolchain/toolchain.sh run just test
      - name: modules-check
        run: sh spec/tools/toolchain/toolchain.sh run just modules-check
      - name: eval-check
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: sh spec/tools/toolchain/toolchain.sh run just eval-check
      - name: The pictures of the lessons
        run: sh spec/tools/toolchain/toolchain.sh run just lesson-pictures modules/olympiad-math --check
      - name: The pictures of the instances of the templates
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: sh spec/tools/toolchain/toolchain.sh run just template-pictures modules/olympiad-math --check
