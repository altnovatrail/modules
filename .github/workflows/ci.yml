# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@fab102d8bbb4659575e107ee488e072aaaa71821 # v0.1.24

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@fab102d8bbb4659575e107ee488e072aaaa71821 # v0.1.24

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@fab102d8bbb4659575e107ee488e072aaaa71821 # v0.1.24

  # The Go code of tools/port, the port of standalone's tasks (R12), by the recipes ci-lint, ci-test,
  # ci-vuln and ci-licenses of the justfile: "Go / lint", "Go / test", "Go / vuln" and "Go /
  # licenses". Its coverage goes to Codecov by OIDC, with no secret, so the job gives the shared
  # workflow id-token: write, which only its coverage job asks for (R48 spec).
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/go.yml@fab102d8bbb4659575e107ee488e072aaaa71821 # v0.1.24

  # The repository's own jobs run in the toolchain stage of .devcontainer/Dockerfile, as the shared
  # checks do, by spec's toolchain.sh from the submodule at the tag it pins: the stage, and the
  # recipes of the justfile in it (R10). What to run each job decides itself, with no paths filter
  # on the workflow: a required check of a skipped workflow stays "Pending" (R03).
  #
  # Each job takes the image from the cache of GitHub Actions, as spec's own CI and .github's
  # documents.yml do (R31 spec; R35): a file of docker save by the sha256 of the Dockerfile, which
  # pins everything it fetches, so that on a hit the Dockerfile does not run and an outage of
  # nodejs.org, GitHub or the Ubuntu snapshot fails no check. The path is documents.yml's, so that
  # the three jobs and "Documents" share one entry. toolchain.sh loads the file, or builds the
  # stage and writes it; the file is saved only on a miss, since an entry never changes, and a
  # broken entry stays until it is deleted (gh cache delete): toolchain.sh warns of it and builds.
  # The scope of main is filled by the runs on main. The release takes no cache (R31 spec).

  # The signature of the module-kit release whose binary the stage installs, by spec's
  # release-verify, and the Dockerfile's sums against that release's SHA256SUMS (R77 spec), on
  # every run (R10).
  module-kit:
    name: module-kit signature
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - id: cache
        name: Toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}
      - id: toolchain
        name: Toolchain image
        env:
          TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-toolchain.tar
        run: sh spec/tools/toolchain/toolchain.sh build
      - name: Toolchain image to the cache
        if: ${{ steps.toolchain.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Free the file of the toolchain image
        if: ${{ !cancelled() }}
        run: rm -f -- "$RUNNER_TEMP/novatrail-toolchain.tar"
      - name: module-kit-verify
        run: sh spec/tools/toolchain/toolchain.sh run just module-kit-verify

  # The signature of the canvas release whose generator of synthetic samples the stage installs, by
  # spec's release-verify, and the Dockerfile's sum against that release's SHA256SUMS (R77 spec), on
  # every run (R29).
  canvas:
    name: canvas signature
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - id: cache
        name: Toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}
      - id: toolchain
        name: Toolchain image
        env:
          TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-toolchain.tar
        run: sh spec/tools/toolchain/toolchain.sh build
      - name: Toolchain image to the cache
        if: ${{ steps.toolchain.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Free the file of the toolchain image
        if: ${{ !cancelled() }}
        run: rm -f -- "$RUNNER_TEMP/novatrail-toolchain.tar"
      - name: canvas-verify
        run: sh spec/tools/toolchain/toolchain.sh run just canvas-verify

  # The tree of modules/ and every module in it, by module-kit check and build, and each against its
  # published versions by module-kit diff — the index of the newest release of modules, checked by
  # release-verify, or --first before the first release (R11) —, once the signatures of
  # module-kit's binary and of canvas's generator have passed; the tests of the recipes first. diff's status is the job's. Then the layout of each
  # module's eval/, and each module's eval set by spec's sample-check --eval-set (R04, R25): no key,
  # and the network only for the tools of sample-check from their lock file, so a pull request from
  # a fork runs it too, and it runs even when a step before it failed, so that a refused sample
  # shows on the first run. Then eval-match holds each sample to the package of the commit: a
  # synthetic one drawn again by canvas's generator, a person's by the digest of its task's open
  # view (amendment T59 to R25), with no network and no key, and as eval-check runs.
  #
  # Each step is a container of its own, whose home toolchain.sh throws away, so the steps share
  # one cache of Go, a folder of the checkout that toolchain.sh mounts at /work: the port is
  # compiled once, by the tests, and the pictures' steps reuse it (R36). The folder lives for the
  # run only, and git ignores it.
  modules:
    name: Modules
    needs: [module-kit, canvas]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GO_CACHE: GOCACHE=/work/.cache/go/build
      GO_MODULES: GOMODCACHE=/work/.cache/go/mod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - id: cache
        name: Toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}
      - id: toolchain
        name: Toolchain image
        env:
          TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-toolchain.tar
        run: sh spec/tools/toolchain/toolchain.sh build
      - name: Toolchain image to the cache
        if: ${{ steps.toolchain.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Free the file of the toolchain image
        if: ${{ !cancelled() }}
        run: rm -f -- "$RUNNER_TEMP/novatrail-toolchain.tar"
      - name: Tests of the recipes and of the templates
        run: sh spec/tools/toolchain/toolchain.sh run env "$GO_CACHE" "$GO_MODULES" just test
      - name: modules-check
        run: sh spec/tools/toolchain/toolchain.sh run env "$GO_CACHE" "$GO_MODULES" just modules-check
      - name: eval-check
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: sh spec/tools/toolchain/toolchain.sh run env "$GO_CACHE" "$GO_MODULES" just eval-check
      - name: eval-match
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: sh spec/tools/toolchain/toolchain.sh run env "$GO_CACHE" "$GO_MODULES" just eval-match
      - name: The pictures of the lessons
        run: sh spec/tools/toolchain/toolchain.sh run env "$GO_CACHE" "$GO_MODULES" just lesson-pictures modules/olympiad-math --check
      - name: The pictures of the instances of the templates
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: sh spec/tools/toolchain/toolchain.sh run env "$GO_CACHE" "$GO_MODULES" just template-pictures modules/olympiad-math --check

  # The gate of sim (R37; R103 spec; architecture 3.2): sim at the tag and the SHA of its commit
  # below, as its README has a caller of the gate of modules take it, from git. The inputs come from
  # just gate-inputs in this repository's toolchain stage — the published versions, checked by
  # release-verify, and the package of every module —, and the gate runs from the root of sim's
  # checkout, in the toolchain stage of sim's own devcontainer at that commit. sim says what of each
  # package changed and runs only that, or nothing; it holds invariants and absolute thresholds, so
  # its exit is the job's. A pull request that moves SIM_COMMIT runs every package, -all; so does a
  # run whose base cannot be read, rather than run too little.
  #
  # sim's image is in the cache of GitHub Actions by the sha256 of sim's Dockerfile, under its own
  # key, as the image of this repository's stage is; the caches of Go of the gate, by sim's go.sum
  # and Dockerfile, as sim's gate.yml keeps them: a pull request only reads them, a push to main
  # saves them. Both checkouts lie under .cache/ of this one, which git ignores, so that the
  # container of either stage sees them at /work.
  gate:
    name: Gate
    needs: [module-kit]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SIM_TAG: v0.1.24
      SIM_COMMIT: 33d70f288682d95e12f6072c4e9ff09253417497
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: altnovatrail/sim
          ref: ${{ env.SIM_COMMIT }}
          path: .cache/sim
          persist-credentials: false
      # The tag is on the commit, as sim's gate.yml holds a caller's: an annotated tag points at its
      # commit through ^{}. A tag moved or a SHA mistyped stops the gate.
      - name: sim's tag
        run: |
          tags="$(git ls-remote https://github.com/altnovatrail/sim "refs/tags/$SIM_TAG" "refs/tags/$SIM_TAG^{}")"
          tagged="$(printf '%s\n' "$tags" | awk -v ref="refs/tags/$SIM_TAG^{}" '$2 == ref { print $1 }')"
          if [ -z "$tagged" ]; then
              tagged="$(printf '%s\n' "$tags" | awk '{ print $1 }')"
          fi
          if [ "$tagged" != "$SIM_COMMIT" ]; then
              echo "::error::sim $SIM_TAG is on ${tagged:-no commit}, and SIM_COMMIT is $SIM_COMMIT"
              exit 1
          fi
      # -all when the commit this run is checked against — the pull request's base, or the push's
      # before — pins another sim, or none, or cannot be read.
      - name: Whether sim moved
        id: moved
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=""
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] && git fetch --quiet --no-tags --depth=1 origin "$BASE"; then
              base="$(git show "$BASE:.github/workflows/ci.yml" | sed -n 's/^[[:space:]]*SIM_COMMIT:[[:space:]]*\([0-9a-f]\{40\}\)[[:space:]]*$/\1/p' || true)"
          fi
          if [ "$base" = "$SIM_COMMIT" ]; then
              echo "all=" >> "$GITHUB_OUTPUT"
              echo "sim is $SIM_TAG at $BASE too: the gate runs what changed."
          else
              echo "all=-all" >> "$GITHUB_OUTPUT"
              echo "sim moves from ${base:-nothing that can be read} to $SIM_COMMIT: the gate runs every package."
          fi
      - id: cache
        name: Toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}
      - id: toolchain
        name: Toolchain image
        env:
          TOOLCHAIN_IMAGE_FILE: ${{ runner.temp }}/novatrail-toolchain.tar
        run: sh spec/tools/toolchain/toolchain.sh build
      - name: Toolchain image to the cache
        if: ${{ steps.toolchain.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Free the file of the toolchain image
        if: ${{ !cancelled() }}
        run: rm -f -- "$RUNNER_TEMP/novatrail-toolchain.tar"
      - name: gate-inputs
        run: sh spec/tools/toolchain/toolchain.sh run just gate-inputs .cache/gate
      - id: sim-cache
        name: sim's toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sim-toolchain.tar
          key: sim-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cache/sim/.devcontainer/Dockerfile') }}
      - id: sim-toolchain
        name: sim's toolchain image
        run: |
          tar=$RUNNER_TEMP/sim-toolchain.tar
          restored=false
          if [ -f "$tar" ]; then
              restored=true
              if docker load --quiet --input "$tar" && docker image inspect sim-toolchain > /dev/null; then
                  rm -f -- "$tar"
                  echo "sim's toolchain image: loaded from the cache."
                  exit 0
              fi
              echo "::warning::The cache's file of sim's toolchain stage does not load as the image sim-toolchain: it is built from sim's Dockerfile, on every run until the entry is deleted (gh cache delete) or the Dockerfile changes."
              rm -f -- "$tar"
          fi
          docker build --target toolchain --tag sim-toolchain - < .cache/sim/.devcontainer/Dockerfile
          # A file the cache gave has its entry already, which no save replaces.
          if [ "$restored" = false ] && ! docker save --output "$tar" sim-toolchain; then
              echo "::warning::sim's toolchain image could not be saved for the cache: the next run builds it again."
              rm -f -- "$tar"
          fi
      - name: sim's toolchain image to the cache
        if: ${{ steps.sim-toolchain.outcome == 'success' && steps.sim-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sim-toolchain.tar
          key: ${{ steps.sim-cache.outputs.cache-primary-key }}
      - name: Free the file of sim's toolchain image
        if: ${{ !cancelled() }}
        run: rm -f -- "$RUNNER_TEMP/sim-toolchain.tar"
      - id: go
        name: The caches of Go of the gate
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go
          key: gate-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cache/sim/go.sum', '.cache/sim/.devcontainer/Dockerfile') }}
          restore-keys: gate-modules-${{ runner.os }}-${{ runner.arch }}-
      # ran says whether the gate built and ran the bench, so that only such a run fills the caches
      # of Go: a run with nothing to gate builds sim alone, and its entry would stand for good.
      - id: gate
        name: Gate
        env:
          ALL: ${{ steps.moved.outputs.all }}
        run: |
          echo "ran=false" >> "$GITHUB_OUTPUT"
          mapfile -t inputs < .cache/gate/args
          if [ "${#inputs[@]}" -eq 0 ]; then
              echo "No module yet, so the gate has nothing to run." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
          fi
          all=()
          if [ -n "$ALL" ]; then
              all=("$ALL")
          fi
          mkdir -p "$RUNNER_TEMP/go"
          set -o pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env GOCACHE=/go/build --env GOMODCACHE=/go/mod \
              --volume "$RUNNER_TEMP/go:/go" --volume "$PWD:/work" --workdir /work \
              sim-toolchain just -f .cache/sim/justfile gate modules ${all[@]+"${all[@]}"} "${inputs[@]}" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/gate.txt"
          if ! grep -q '^gate: nothing the bench reads changed' "$RUNNER_TEMP/gate.txt"; then
              echo "ran=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The caches of Go of the gate to the cache
        if: ${{ github.event_name != 'pull_request' && steps.go.outputs.cache-hit != 'true' && steps.gate.outputs.ran == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go
          key: ${{ steps.go.outputs.cache-primary-key }}
