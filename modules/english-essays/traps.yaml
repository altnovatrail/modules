# The trap catalog of the module of short essays (R16): its tasks with a key, the choice of a first
# sentence, catch by a wrong option the ways a first sentence lets a reader go. Two are the
# format's example's as it has them, and giving-it-all-away is this module's own. No essay names a
# trap: a rubric gives no verdict, and so no wrong value.
traps:
  flat-opening:
    description: Chose a first sentence that could open any story, and so promises nothing.
    skills: [choosing-a-first-sentence]
    trap_advice: "Ask what a reader wants to know after the first sentence: if nothing, it opens no story."
  announcing-the-topic:
    description: Chose a first sentence that says what the text is about instead of beginning it.
    skills: [choosing-a-first-sentence]
    trap_advice: "Start where something happens: the reader learns the topic on the way."
  giving-it-all-away:
    description: Chose a first sentence that tells the whole story at once, and so leaves the reader nothing to find out.
    skills: [choosing-a-first-sentence]
    trap_advice: "Keep something back: a first sentence opens a question and lets the essay answer it."
