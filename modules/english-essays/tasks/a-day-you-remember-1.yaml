# An essay on the learner's own life, which the module gives to adults alone, since a topic under 18
# is made-up or general: the format's example of this task, with its third criterion asking for a
# person or a place of that day rather than for one by name. The statement holds no reminder to
# write no names: the platform puts none before Check of an essay.
id: a-day-you-remember-1
statement:
  - text: Write a short essay about a day of your life that you remember well.
canvas:
  kind: handwriting_sheet
  grid: lines
items:
  - answer_slots:
      - binding: sheet
        check:
          kind: rubric
          criteria:
            - text: It tells of one day, in paragraphs, in the order things happened.
            - text: Its ending says why the day is remembered.
            - text: It tells of at least one person or place of that day.
skills:
  primary: [paragraphs, endings]
band: whole-essays
difficulty: 3
age_categories: [adult]
