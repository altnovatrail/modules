# A task of the module of short essays with a key (R16): three first sentences on one invented
# topic, each of them about the topic, and only one leaves a question. One wrong option could open
# any story about snow, and the other tells the whole story at once. The key is an option that the
# learner sees, so a leak phrase keeps it.
id: best-first-sentence-3
statement:
  - text: An essay tells of a town where the snow never stops. Which first sentence makes a reader want to go on?
canvas:
  kind: handwriting_sheet
  grid: lines
items:
  - answer_slots:
      - binding: choice
        options:
          - Snow is cold and white, and it falls on our town.
          - In our town the snow never stops, and this morning it did.
          - In our town the snow never stops, but one morning it did, the sun melted it all, and we had our first summer.
        check:
          kind: choice
          key: In our town the snow never stops, and this morning it did.
          trap_values:
            - value: Snow is cold and white, and it falls on our town.
              trap: flat-opening
              text: This sentence is true of almost any snowy place. What does it make you want to ask? Look for one that makes you wonder.
            - value: In our town the snow never stops, but one morning it did, the sun melted it all, and we had our first summer.
              trap: giving-it-all-away
              text: This sentence already tells how the story ends. Look for one that keeps the end back.
solution:
  - text: "\"In our town the snow never stops, and this morning it did\" tells something strange and leaves a question: why did it stop, and what happens now? The first sentence could open any story about snow, and the third tells the whole story at once."
leak_phrases: [this morning it did]
techniques: [start-in-the-middle]
skills:
  primary: [choosing-a-first-sentence]
band: first-steps
difficulty: 5
