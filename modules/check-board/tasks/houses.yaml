# The check board's task houses of tutor's eval/free-bank.json, as internal/task.Sheet builds it
# (R68 tutor). Its leak phrases end with the key in words, since the leak check reads no number in
# words (R33). Its leak phrase in English, "counted twice", is left out: the module is in Russian.
id: houses
statement:
  - text: "В ряд стоят домики. Домик с флажком — четвёртый слева и шестой справа. Сколько домиков в ряду?"
canvas:
  kind: handwriting_sheet
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "9"
solution:
  - text: "рисунок: ряд домиков — 3 слева от домика с флажком, он сам и 5 справа"
  - text: "3 + 1 + 5 = 9"
  - text: "Ответ: 9 домиков"
traps: [counted-twice, place-for-count, self-forgotten]
leak_phrases: ["4 + 6 − 1", "посчитан дважды", "девять"]
skills:
  primary: [free-solution]
  supporting: [writing-on-a-sheet]
band: board
difficulty: 1
