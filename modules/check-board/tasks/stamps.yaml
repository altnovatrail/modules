# The check board's task stamps of tutor (R33), from its eval/free-bank.json at v0.1.35, as
# internal/task.Sheet builds it (R68 tutor): the statement, a handwriting sheet of the default
# grid, one answer slot anywhere with the number of the bank's key "7", the solution a
# paragraph to a line, the bank's traps with no trap values, and its leak phrases, with the key in
# words after them.
# Its leak phrase in English, "take away the extra 6", is left out: the module is in Russian.
id: stamps
statement:
  - text: "У двух братьев вместе 20 марок. У старшего на 6 марок больше, чем у младшего. Сколько марок у младшего?"
canvas:
  kind: handwriting_sheet
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "7"
solution:
  - text: "схема: отрезок младшего и отрезок старшего, длиннее на 6, — вместе 20"
  - text: "20 − 6 = 14 — это два отрезка младшего"
  - text: "14 : 2 = 7"
  - text: "Ответ: 7 марок"
traps: [halved-total, difference-added, longer-segment]
leak_phrases: ["14 : 2", "убрать лишние 6", "семь"]
skills:
  primary: [free-solution]
  supporting: [writing-on-a-sheet]
band: board
difficulty: 2
