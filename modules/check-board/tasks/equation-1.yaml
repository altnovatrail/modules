# The check board's task equation-1 of tutor (R33), from its eval/bank.json at v0.1.35, as
# internal/task.Sheet builds it (R68 tutor): the statement, a handwriting sheet of the default
# grid, one answer slot anywhere with the number of the bank's key "x = 2", the solution a
# paragraph to a line, the bank's traps with no trap values, and its leak phrases, with the key in
# words after them.
id: equation-1
statement:
  - text: "Реши уравнение 3x + 1 = 7."
canvas:
  kind: handwriting_sheet
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "2"
solution:
  - text: "3x + 1 = 7"
  - text: "3x = 6"
  - text: "x = 2"
traps: [sign-on-transfer, one-side-division]
leak_phrases: ["3x = 6", "6 : 3", "два", "двум"]
skills:
  primary: [linear-equation]
  supporting: [writing-on-a-sheet]
band: board
difficulty: 2
