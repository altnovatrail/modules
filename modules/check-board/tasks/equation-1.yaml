# The check board's task equation-1 of tutor's eval/bank.json, as internal/task.Sheet builds it
# (R68 tutor). Its leak phrases end with the key in words, since the leak check reads no number in
# words (R33).
id: equation-1
statement:
  - text: "Реши уравнение 3x + 1 = 7."
canvas:
  kind: handwriting_sheet
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "2"
solution:
  - text: "3x + 1 = 7"
  - text: "3x = 6"
  - text: "x = 2"
traps: [sign-on-transfer, one-side-division]
leak_phrases: ["3x = 6", "6 : 3", "два", "двум"]
skills:
  primary: [linear-equation]
  supporting: [writing-on-a-sheet]
band: board
difficulty: 2
