# The check board's task posts of tutor's eval/bank.json, as internal/task.Sheet builds it
# (R68 tutor). Its leak phrases end with the key with its noun too, since the statement frees the
# key (R33). Its leak phrase in English, "one more post than gaps", is left out: the module is in
# Russian.
id: posts
statement:
  - text: "Вдоль дорожки длиной 20 м через каждые 5 м стоят столбы, первый — в начале, последний — в конце. Сколько всего столбов?"
canvas:
  kind: handwriting_sheet
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "5"
solution:
  - text: "20 : 5 = 4 — столько промежутков"
  - text: "4 + 1 = 5 — столбов на один больше, чем промежутков"
  - text: "Ответ: 5 столбов"
traps: [gaps-for-posts, both-ends-added]
leak_phrases: ["4 + 1", "на один больше", "5 столбов", "пять"]
skills:
  primary: [free-solution]
  supporting: [writing-on-a-sheet]
band: board
difficulty: 2
