# A lesson of the set of school mathematics for grade 3 (R15): an explanation, a worked example on
# a workbook and the three pages of the skill, in the order of their difficulty. Its texts name no
# digit and no fraction, since the keys of its pages are small numbers and fractions; the lines of
# the example and their values hold them, which the leak check does not search, and none of its
# lines is a line of a page of the lesson (T55).
id: fractions-of-a-whole
title: Fractions of a whole
skills: [fractions-of-a-whole]
segments:
  - explanation:
      - text: A fraction names equal parts of a whole. The bottom number says how many equal parts the whole is cut into, and the top number says how many of them you take.
      - text: To find a fraction of a number, share the number into as many equal parts as the bottom says. That is one part. Then take as many parts as the top says.
      - text: The same part of a whole can be written as more than one fraction. A fraction is in lowest terms when no number but one divides both its top and its bottom. To get there, divide them both by the same number.
  - worked_example:
      statement:
        - text: Write the missing numbers.
      canvas:
        kind: workbook
      lines:
        - line:
            - text: "1/3 of 15 ="
            - binding: box
              value: "5"
        - line:
            - text: "3/4 of 12 ="
            - binding: box
              value: "9"
      demo:
        - text: A third of fifteen is one of three equal parts. Share fifteen into three equal parts, and each part is five.
        - fill: {line: 1, box: 1}
        - text: Find one quarter of twelve first, which is three. Three quarters are three of those parts.
        - fill: {line: 2, box: 1}
  - task: fractions-of-a-whole-d1
  - task: fractions-of-a-whole-d3
  - task: fractions-of-a-whole-d5
