# A lesson of the set of school mathematics for grade 3 (R15): an explanation, a worked example on
# a workbook and the three pages of the skill, in the order of their difficulty. Its texts name no
# digit and no sign, since the keys of its pages are fractions and signs; the lines of the example
# and their values hold them, which the leak check does not search, and none of its lines is a line
# of a page of the lesson (T55). The skill graph puts it after the lesson of fractions of a whole.
id: comparing-fractions
title: Comparing fractions
skills: [comparing-fractions]
segments:
  - explanation:
      - text: When two fractions have the same bottom number, their parts are the same size. The fraction that takes more of them is the greater.
      - text: When two fractions have the same top number, they take as many parts each. A whole cut into fewer parts has bigger parts, so the fraction with the smaller bottom number is the greater.
      - text: Say the comparison in words first. Then write the sign with its open side towards the greater fraction, or the sign of two equal fractions when they are the same.
  - worked_example:
      statement:
        - text: Compare the two fractions, and write the sign between them.
      canvas:
        kind: workbook
      lines:
        - line:
            - text: "2/9"
            - binding: box
              value: "<"
            - text: "5/9"
        - line:
            - text: "1/4"
            - binding: box
              value: ">"
            - text: "1/9"
      demo:
        - text: The bottom numbers are the same, so the parts are the same size. Two parts are fewer than five, and the first fraction is the smaller.
        - fill: {line: 1, box: 1}
        - text: The top numbers are the same. A whole cut into four parts has bigger parts than one cut into nine, so the first fraction is the greater.
        - fill: {line: 2, box: 1}
  - task: comparing-fractions-d1
  - task: comparing-fractions-d3
  - task: comparing-fractions-d5
