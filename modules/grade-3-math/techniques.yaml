# The technique catalog of the set of school mathematics for grade 3 (R15): ways into a page of
# the workbook. Three are the format's example's as it has them, and draw-the-parts is the
# fractions'. A technique with a title alone has no description. The texts hold no number.
techniques:
  count-up:
    title: Count up in steps
    description: Say the times table of the number out loud until you reach the product you need.
  undo-it:
    title: Undo it
    description: "To check a division, multiply back: the groups times the size of a group, plus what is left, is where you began."
  say-it-in-words:
    title: Say it in words
  draw-the-parts:
    title: Draw the parts
    description: Draw the whole cut into equal parts, and shade the parts that the fraction takes.
