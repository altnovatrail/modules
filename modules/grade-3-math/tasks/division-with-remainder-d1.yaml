# A page of the workbook of school mathematics for grade 3 (R15): eight divisions of small numbers,
# each line with a box for the quotient and one for the remainder. A quotient one too small, which
# leaves a remainder too big, is the trap each line knows, and only its first box names it, so
# that one mistake counts once.
id: division-with-remainder-d1
statement:
  - text: Divide, and write the quotient and the remainder.
canvas:
  kind: workbook
items:
  - line:
      - text: "7 ÷ 2 ="
      - binding: box
        check:
          kind: number
          key: "3"
          trap_values:
            - value: "2"
              trap: remainder-too-big
              text: One more group still fits into the number shared. Multiply back and see what is left.
      - text: r
      - binding: box
        check:
          kind: number
          key: "1"
  - line:
      - text: "9 ÷ 4 ="
      - binding: box
        check:
          kind: number
          key: "2"
          trap_values:
            - value: "1"
              trap: remainder-too-big
              text: One more group still fits into the number shared. Multiply back and see what is left.
      - text: r
      - binding: box
        check:
          kind: number
          key: "1"
  - line:
