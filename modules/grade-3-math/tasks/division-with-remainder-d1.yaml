              text: One more group still fits into the number shared. Multiply back and see what is left.
      - text: r
      - binding: box
        check:
          kind: number
          key: "1"
solution:
  - text: "3 × 2 = 6, and 7 − 6 = 1, so 7 ÷ 2 = 3 r 1."
  - text: "2 × 4 = 8, and 9 − 8 = 1, so 9 ÷ 4 = 2 r 1."
  - text: "3 × 3 = 9, and 11 − 9 = 2, so 11 ÷ 3 = 3 r 2."
  - text: "2 × 5 = 10, and 13 − 10 = 3, so 13 ÷ 5 = 2 r 3."
  - text: "3 × 5 = 15, and 17 − 15 = 2, so 17 ÷ 5 = 3 r 2."
  - text: "3 × 3 = 9, and 10 − 9 = 1, so 10 ÷ 3 = 3 r 1."
  - text: "3 × 4 = 12, and 15 − 12 = 3, so 15 ÷ 4 = 3 r 3."
  - text: "3 × 6 = 18, and 19 − 18 = 1, so 19 ÷ 6 = 3 r 1."
techniques: [undo-it]
