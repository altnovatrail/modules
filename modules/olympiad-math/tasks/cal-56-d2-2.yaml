id: "cal-56-d2-2"
statement:
  - text: "2028 is a leap year: its February has 29 days. What is the date 100 days after 1 January 2028?"
givens: ["2028 is a leap year: its February has 29 days."]
unknown: "The date 100 days after 1 January 2028."
leading_question: "Count the days left in January, then February and March. How many of the 100 days are still left after that?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["10 April 2028", "11 April 2028", "9 April 2028", "1 April 2028", "23 September 2027"]
        check:
          kind: "choice"
          key: "10 April 2028"
          trap_values:
            - value: "11 April 2028"
              trap: "ignored-condition"
              text: "11 April counts February with 28 days, but in 2028 it has 29."
            - value: "9 April 2028"
              trap: "off-by-one"
              text: "9 April counts 1 January itself as the first of the 100 days."
            - value: "1 April 2028"
              trap: "stopped-early"
              text: "1 April stops after the whole months, but some of the 100 days are still to come."
            - value: "23 September 2027"
              trap: "reversed-relation"
              text: "23 September 2027 is 100 days before 1 January 2028, not after it."
    simpler_case: "Try 40 days after 1 January 2028. What date is it?"
solution:
  - text: "After 1 January there are 30 more days in January, then 29 in February and 31 in March: 30 + 29 + 31 = 90 days, which brings us to 31 March. The 10 days left lead to 10 April 2028."
  - text: "100 − 30 − 29 − 31 = 10"
