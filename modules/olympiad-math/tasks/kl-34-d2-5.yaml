statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Ann says: 'Ben is a knight.' Ben says: 'One of us two is a knight and the other is a liar.' Who are Ann and Ben?"
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Ann says: 'Ben is a knight.'", "Ben says: 'One of us two is a knight and the other is a liar.'"]
