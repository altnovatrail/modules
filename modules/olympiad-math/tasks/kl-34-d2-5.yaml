items:
  - answer_slots:
      - binding: "choice"
        options: ["Both are knights", "Ann is a knight, Ben is a liar", "Ann is a liar, Ben is a knight", "Both are liars", "It is impossible to tell"]
        check:
          kind: "choice"
          key: "Both are liars"
          trap_values:
            - value: "Both are knights"
              trap: "trusted-statement"
