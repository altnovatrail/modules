              trap: "double-count"
              text: "Ann and Ben is the same pair as Ben and Ann."
            - value: "36"
              trap: "ignored-condition"
              text: "A pair is two different children, so a child cannot be paired with herself."
    simpler_case: "Try 3 children first. List every pair once."
solution:
  - text: "The first child can be paired with 5 others, the second with 4 new ones, and so on: 5 + 4 + 3 + 2 + 1 = 15 pairs."
