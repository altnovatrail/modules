id: "enum-12-d4-2"
statement:
  - text: "There are 6 children in a group. The teacher picks 2 of them to water the plants. How many different pairs can she pick?"
givens: ["There are 6 children in the group.", "The teacher picks 2 of them."]
unknown: "How many different pairs she can pick."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "15"
          units: ["pair", "pairs"]
          trap_values:
            - value: "6"
              trap: "number-from-text"
              text: "6 is the number of children."
            - value: "12"
              trap: "wrong-operation"
              text: "You doubled 6. Count the pairs: let each child pair only with the children after them."
