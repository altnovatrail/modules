id: "pct-56-d4-2"
statement:
  - text: "20% of Mia's stamps is the same number of stamps as 30% of Sam's. Together they have 200 stamps. How many stamps does Mia have?"
givens: ["20% of Mia's stamps is as many as 30% of Sam's.", "Together they have 200 stamps."]
unknown: "How many stamps Mia has."
leading_question: "Who has more stamps, Mia or Sam? Try a few ways of splitting 200."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "120"
          units: ["stamp", "stamps"]
          trap_values:
            - value: "40"
              trap: "percent-wrong-base"
              text: "40 is 20% of all 200 stamps, not the number of Mia's stamps."
            - value: "80"
              trap: "answered-other-question"
              text: "80 is not Mia's number of stamps."
            - value: "100"
              trap: "ignored-condition"
              text: "100 splits the stamps equally, but then 20% and 30% of them would not be the same number."
            - value: "24"
              trap: "stopped-early"
              text: "24 is part of Mia's stamps, not all of them."
    simpler_case: "Try: 50% of Mia's stamps is as many as all of Sam's, and together they have 30. How many does Mia have?"
solution:
  - text: "20% is 2 tenths and 30% is 3 tenths, so 2 tenths of Mia's stamps equal 3 tenths of Sam's. That means Mia has 3 stamps for every 2 of Sam's, and 200 splits as 120 and 80. Check: 20% of 120 is 24, and 30% of 80 is 24."
skills:
  primary: ["percent-basic"]
band: "grades-5-6"
difficulty: 4
