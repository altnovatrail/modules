id: "par-56-d3-4"
statement:
  - text: "The picture shows a crown of ten tiles that are all alike: each has the same five numbers in the same order round it. Where two tiles touch, the numbers next to the shared side are equal. Which number is in the triangle marked ?"
  - picture: "pictures/par-56-d3-4.png"
    alt: "A ring of ten pentagon tiles, each cut into five triangles. The first tile shows 1, 2, 3, 4 and 5 round it, starting from the side it shares with the last tile. The eighth tile has a question mark in its fourth triangle. The other triangles are empty."
    width: 364
    height: 348
givens: ["The ten tiles are all alike: each has the same five numbers in the same order round it.", "Where two tiles touch, the numbers next to the shared side are equal."]
unknown: "The number in the triangle marked ?."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "3"
          trap_values:
            - value: "4"
              trap: "off-by-one"
              text: "That is the next triangle along."
            - value: "5"
              trap: "stopped-early"
              text: "That is where the marked tile starts."
            - value: "2"
              trap: "reversed-relation"
              text: "The triangles were read the other way round."
    simpler_case: "Try a ring of three tiles that each read 1, 2, 3 round them. Which number does the second tile start with?"
solution:
  - text: "Each tile starts with the number the tile before it has at its joint. The tiles start with 1, 3, 5, 2, 4 and then again 1, 3, 5, so the eighth tile starts with 5 and its marked triangle holds 3."
