id: "pig-56-d3-2"
statement:
  - text: "Every pupil in a group writes a two-digit number and adds up its two digits. How many pupils must the group have to be sure that two of them get the same sum?"
givens: ["Every pupil writes a two-digit number.", "Every pupil adds up the two digits of that number."]
unknown: "How many pupils the group must have to be sure that two of them get the same sum."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "19"
          units: ["pupil", "pupils"]
          trap_values:
            - value: "18"
              trap: "off-by-one"
              text: "18 pupils could all get different sums, one for each sum from 1 to 18."
            - value: "11"
              trap: "answered-other-question"
              text: "11 makes sure that two numbers end in the same digit, not that their digits add up to the same sum."
            - value: "2"
              trap: "best-case-not-worst"
              text: "Two pupils could get the same sum by luck, but they need not."
            - value: "20"
              trap: "ignored-condition"
              text: "20 also counts a sum of 0, but the digits of a two-digit number never add up to 0."
    simpler_case: "Try the numbers from 10 to 15 first. Which sums of their digits come up?"
solution:
  - text: "The digits of a two-digit number add up to at least 1, as in 10, and at most 18, as in 99, and every sum in between comes up too. So there are 18 different sums. 18 pupils could all get different sums, but with 19 pupils two of them must get the same one."
