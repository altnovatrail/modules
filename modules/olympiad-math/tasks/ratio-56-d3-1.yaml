id: "ratio-56-d3-1"
statement:
  - text: "Three baskets, A, B and C, hold 90 walnuts in the ratio 3 : 5 : 7. How many more walnuts are in basket C than in basket A?"
  - picture: "pictures/ratio-56-d3-1.png"
    alt: "Three bars: A of 3, B of 5 and C of 7 equal parts, with the notes A + B + C = 90 and C - A = ?."
    width: 245
    height: 182
givens: ["Baskets A, B and C hold 90 walnuts in the ratio 3 : 5 : 7."]
unknown: "How many more walnuts are in C than in A."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "24"
          units: ["walnut", "walnuts"]
          trap_values:
            - value: "36"
              trap: "ratio-total-confusion"
              text: "36 counts only the parts of A and C, 10 in all, so a part seems to be 9 walnuts; there are 15 parts."
            - value: "42"
              trap: "answered-other-question"
              text: "42 is not how many more walnuts C has than A."
            - value: "4"
              trap: "stopped-early"
              text: "4 is not a number of walnuts."
            - value: "12"
              trap: "answered-other-question"
              text: "12 is how many more are in B than in A, or in C than in B."
    simpler_case: "Try 30 walnuts in two baskets in the ratio 1 : 2. How many more are in the second basket?"
solution:
  - text: "There are 3 + 5 + 7 = 15 equal parts, so each part is 90 ÷ 15 = 6 walnuts. Basket C has 7 - 3 = 4 parts more than basket A, which is 4 × 6 = 24 walnuts."
