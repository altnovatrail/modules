id: "enum-12-d2-5"
statement:
  - text: "Tom has many 1-cent and 2-cent coins. In how many different ways can he pay exactly 5 cents? The order of the coins does not matter."
givens: ["Tom has many 1-cent and 2-cent coins.", "He pays exactly 5 cents.", "The order of the coins does not matter."]
unknown: "In how many different ways he can pay."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "3"
          units: ["way", "ways"]
          trap_values:
            - value: "2"
              trap: "missed-case"
              text: "You missed a way. Sort the ways by how many 2-cent coins they use."
            - value: "4"
              trap: "off-by-one"
              text: "Three 2-cent coins make 6 cents, too much. Count only the ways that make exactly 5 cents."
            - value: "5"
              trap: "number-from-text"
              text: "5 is the amount in cents, not the number of ways."
            - value: "8"
              trap: "double-count"
              text: "The order of the coins does not matter, so 2 + 1 + 2 and 1 + 2 + 2 are the same way."
    simpler_case: "Try paying 2 cents first. List the ways."
solution:
  - text: "He can use no 2-cent coins and five 1-cent coins, one 2-cent coin and three 1-cent coins, or two 2-cent coins and one 1-cent coin. That is 3 ways."
  - picture: "pictures/enum-12-d2-5-solution.png"
    alt: "A table of the ways, one row each: five 1-cent coins; a 2-cent coin and three 1-cent coins; two 2-cent coins and a 1-cent coin."
    width: 204
    height: 108
