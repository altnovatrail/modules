id: "par-56-d2-2"
statement:
  - text: "A knight stands on a chessboard. In one move it goes two squares in a straight line and then one square to the side. After which of these numbers of moves can it be back on the square it started from?"
givens: ["A knight moves two squares in a line and then one to the side."]
unknown: "After which of the numbers of moves it can be back where it started."
leading_question: "What colour is the square the knight lands on after one move? After two moves?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["7", "13", "10", "9", "15"]
        check:
          kind: "choice"
          key: "10"
          trap_values:
            - value: "7"
              trap: "wrong-parity"
              text: "After an odd number of moves, such as 7, the knight stands on a square of the other colour."
            - value: "13"
              trap: "wrong-parity"
              text: "After an odd number of moves, such as 13, the knight stands on a square of the other colour."
            - value: "9"
              trap: "wrong-parity"
              text: "After an odd number of moves, such as 9, the knight stands on a square of the other colour."
            - value: "15"
              trap: "wrong-parity"
              text: "After an odd number of moves, such as 15, the knight stands on a square of the other colour."
    simpler_case: "Try one move and then two moves. Can the knight be back after either?"
solution:
  - text: "Each move takes the knight to a square of the other colour. So after an odd number of moves its square has the other colour from its first square, and it cannot be back there. After 10 moves it can be back: it jumps away and back again five times."
