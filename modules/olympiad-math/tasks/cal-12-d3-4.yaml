id: "cal-12-d3-4"
statement:
  - text: "Olya goes swimming every 3 days: on the 2nd, the 5th, the 8th and so on. How many times does she go swimming in a month of 30 days?"
givens: ["Olya swims every 3 days: on the 2nd, the 5th, the 8th and so on.", "The month has 30 days."]
unknown: "How many times she swims that month."
