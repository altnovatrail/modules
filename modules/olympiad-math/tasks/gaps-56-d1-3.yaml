id: "gaps-56-d1-3"
statement:
  - text: "Sam has a long liquorice lace. Again and again, he bites 3 cm out of a piece, never at its end, so that the piece splits in two. At the end he has five pieces, 2, 4, 6, 8 and 10 cm long. How long was the lace?"
givens: ["Each bite takes 3 cm out of a piece and splits it in two.", "At the end there are five pieces: 2, 4, 6, 8 and 10 cm long."]
unknown: "How long the lace was."
leading_question: "Each bite turns one piece into two. How many bites does it take to get 5 pieces from one?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "42"
          units: ["centimetre", "centimetres", "cm"]
          trap_values:
            - value: "12"
              trap: "answered-other-question"
              text: "12 cm is how much Sam ate, not how long the lace was."
            - value: "45"
              trap: "off-by-one"
              text: "45 cm counts a bite for each of the 5 pieces, but one lace becomes 5 pieces in 4 bites."
            - value: "30"
              trap: "stopped-early"
              text: "30 cm is what is left. The 12 cm Sam ate were part of the lace too."
            - value: "18"
              trap: "wrong-operation"
              text: "18 cm takes the 12 cm Sam ate away from the pieces, but what he ate was part of the lace, so it is added to them."
    simpler_case: "Try a lace bitten once into two pieces first. How many bites made two pieces?"
solution:
  - text: "The lace was one piece, and each bite adds one piece, so 5 pieces took 4 bites. The bites ate 4 × 3 = 12 cm, and the pieces left are 2 + 4 + 6 + 8 + 10 = 30 cm long. So the lace was 30 + 12 = 42 cm long."
techniques: ["draw", "small-numbers"]
skills:
  primary: ["counting-gaps"]
band: "grades-5-6"
difficulty: 1
