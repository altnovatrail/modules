id: "clk-12-d5-2"
statement:
  - text: "A merry-go-round ride lasts 5 minutes, and there is a 2-minute break before every next ride. The first ride starts at 3:00. At what time does the fourth ride end?"
  - picture: "pictures/clk-12-d5-2.png"
    alt: "A clock showing 3 o'clock."
    width: 200
    height: 200
  - text: "Write the time as hours and minutes, like 9:15."
givens: ["A ride lasts 5 minutes.", "A 2-minute break comes before every next ride.", "The first ride starts at 3:00."]
unknown: "The time when the fourth ride ends."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "choice"
          key: "3:26"
          options: ["3:05", "3:26", "3:20", "3:21", "3:28"]
          trap_values:
            - value: "3:05"
              trap: "stopped-early"
              text: "3:05 is when the first ride ends."
            - value: "3:20"
              trap: "ignored-condition"
              text: "You forgot the breaks between rides."
