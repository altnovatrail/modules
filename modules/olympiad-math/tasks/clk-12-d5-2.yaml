              trap: "off-by-one"
              text: "Count the breaks between 4 rides again."
    simpler_case: "Try rides of 5 minutes with 1-minute breaks, the first at 3:00. At what time does the second ride end?"
solution:
  - text: "Four rides take 4 × 5 = 20 minutes, and there are 3 breaks between them: 6 minutes. 3:00 + 26 minutes = 3:26."
