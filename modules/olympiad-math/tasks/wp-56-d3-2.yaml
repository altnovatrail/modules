id: "wp-56-d3-2"
statement:
  - text: "Two of four coins are fake. The fakes are lighter than the real coins, which all weigh the same. How many weighings on a balance without weights are needed, at the least, to be sure which two coins are fake?"
givens: ["Two of four coins are lighter fakes.", "The real coins all weigh the same, and the balance has no weights."]
unknown: "The smallest number of weighings to be sure which two coins are fake."
leading_question: "Weigh one coin against another. What can each result tell you?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "2"
          units: ["weighing", "weighings"]
          trap_values:
            - value: "1"
              trap: "best-case-not-worst"
              text: "Two coins against two can show both fakes at once, but only if they happen to lie on the same pan."
            - value: "3"
              trap: "missed-case"
              text: "3 finds one fake first and then looks for the other, but the first weighing already tells something about both."
            - value: "6"
              trap: "answered-other-question"
              text: "6 is the number of possible pairs of fakes, not the number of weighings."
            - value: "4"
              trap: "wrong-operation"
              text: "4 counts two weighings for each fake, as if the fakes had to be found one after the other."
    simpler_case: "Try 3 coins with one lighter fake. How many weighings find it?"
solution:
  - text: "Weigh coin 1 against coin 2. If coin 1 is lighter, it is fake; weigh coin 3 against coin 4, and the lighter of them is the other fake, or, if they balance, both are real and the other fake is coin 2, which can happen only when the two fakes weigh differently. If coins 1 and 2 balance, they are both real or both fake, and weighing coin 1 against coin 3 shows which. So 2 weighings always do. One is not enough: there are 6 possible pairs of fakes, and a weighing has only 3 results."
skills:
  primary: ["algorithms-weighing-pouring"]
band: "grades-5-6"
difficulty: 3
