id: "sets-56-d5-3"
statement:
  - text: "A zoo may or may not keep lions, zebras and camels, so there are 8 kinds of zoo. Three rules hold. A zoo with lions keeps zebras too. A zoo with camels keeps zebras too. A zoo with zebras keeps lions too. How many of the 8 kinds of zoo do the rules allow?"
givens: ["A zoo may or may not keep lions, zebras and camels: 8 kinds of zoo.", "A zoo with lions keeps zebras, a zoo with camels keeps zebras, and a zoo with zebras keeps lions."]
unknown: "How many of the 8 kinds the rules allow."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "3"
          units: ["kind", "kinds"]
          trap_values:
            - value: "5"
              trap: "missed-case"
              text: "5 crosses out one kind for each rule, but each rule forbids two kinds: the first forbids lions alone and lions with camels."
            - value: "2"
              trap: "double-count"
              text: "2 crosses out lions with camels twice, once for each of the first two rules."
            - value: "8"
              trap: "ignored-condition"
              text: "8 forgets the rules. Each of them forbids two kinds of zoo."
            - value: "1"
              trap: "missed-case"
              text: "1 keeps only the zoo with all three animals, but other kinds break no rule either."
    simpler_case: "Try only the rule that a zoo with lions keeps zebras too. How many of the 8 kinds does it allow?"
solution:
  - text: "The first rule forbids lions without zebras: lions alone, and lions with camels. The second forbids camels without zebras: camels alone, and lions with camels again. The third forbids zebras without lions: zebras alone, and zebras with camels. That crosses out 5 different kinds, so 8 − 5 = 3 are allowed: no animals at all, lions with zebras, and all three."
skills:
  primary: ["logic-sets"]
band: "grades-5-6"
difficulty: 5
