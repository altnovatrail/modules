id: "par-56-d1-3"
statement:
  - text: "Sam picks two different whole numbers greater than 0, multiplies them, and multiplies the result by the difference of the two numbers. Which of these numbers can he get?"
givens: ["Sam picks two different whole numbers greater than 0.", "He multiplies them and multiplies the result by their difference."]
unknown: "Which of the numbers he can get."
leading_question: "If both numbers are odd, what kind of number is their difference?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["21", "15", "6", "35", "10"]
        check:
          kind: "choice"
          key: "6"
          trap_values:
            - value: "21"
              trap: "wrong-parity"
              text: "21 is odd, and the result is always even: two odd numbers have an even difference."
            - value: "15"
              trap: "wrong-parity"
              text: "15 is odd, but the result is always even: if the two numbers are both odd, their difference is even."
            - value: "35"
              trap: "wrong-parity"
              text: "35 is odd. Either one of the numbers is even, or both are odd and their difference is even, so the result is even."
            - value: "10"
              trap: "stopped-early"
              text: "10 is even, but no two numbers give it. The result is always even, but not every even number can be made."
    simpler_case: "Try the numbers 1 and 2, then 1 and 3. What does Sam get?"
solution:
  - text: "If one of the two numbers is even, their product is even. If both are odd, their difference is even. Either way the result is even, so 15, 21 and 35 are impossible. 10 cannot be made either, while 3 and 2 give (3 − 2) × 3 × 2 = 6."
