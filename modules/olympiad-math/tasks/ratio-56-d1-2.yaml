id: "ratio-56-d1-2"
statement:
  - text: "Nina and Omar cycle the same road from the school to the park, each at a steady speed. Nina takes 30 minutes and Omar takes 20 minutes. Nina rides at 12 km an hour. How fast does Omar ride?"
givens: ["Nina and Omar ride the same road at steady speeds.", "Nina takes 30 minutes and Omar 20 minutes.", "Nina rides at 12 km an hour."]
unknown: "How fast Omar rides."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "18"
          units: ["km an hour", "km per hour", "km/h", "kilometres an hour"]
          trap_values:
            - value: "8"
              trap: "reversed-relation"
              text: "8 km an hour makes Omar slower than Nina. He takes less time on the same road, so he rides faster."
            - value: "22"
              trap: "wrong-operation"
              text: "22 adds the 10 minutes Omar saves to Nina's speed. On the same road, a shorter time makes the speed so many times as big, not so much bigger."
            - value: "20"
              trap: "number-from-text"
              text: "20 is the number of minutes Omar takes, a number from the question, not his speed."
            - value: "6"
              trap: "stopped-early"
              text: "6 km is the length of the road, found on the way. The question asks how fast Omar rides."
    simpler_case: "Try Nina taking 20 minutes and Omar 10 minutes on the same road, Nina at 12 km an hour. How fast does Omar ride?"
solution:
  - text: "Nina rides for half an hour at 12 km an hour, so the road is 6 km long. Omar rides those 6 km in 20 minutes, a third of an hour, so in a whole hour he would ride 3 × 6 = 18 km. He rides at 18 km an hour."
