solution:
  - text: "The discount saves the most on a wheel, so Tom should buy the last wheel after paying 320 coins. Two wheels cost 300 coins, so he also buys 2 bolts, one of them spare, and pays 320. Then the third wheel costs 150 − 30 = 120 coins. In all he pays 320 + 120 = 440 coins, less than the 458 coins of buying the 3 wheels first."
