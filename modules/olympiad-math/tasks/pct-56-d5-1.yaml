  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "440"
          units: ["coin", "coins"]
          trap_values:
            - value: "460"
              trap: "ignored-condition"
              text: "460 pays full price for everything. Think whether paying in several goes can help."
            - value: "458"
              trap: "missed-case"
              text: "458 buys the 3 wheels first and then the bolt with the discount. Think which thing is best bought cheaper."
            - value: "430"
