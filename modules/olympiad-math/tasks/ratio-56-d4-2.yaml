id: "ratio-56-d4-2"
statement:
  - text: "Two shepherds share their bread with a hunter: one shepherd has 5 loaves and the other has 3. The three of them eat all 8 loaves in equal shares. The hunter pays 8 coins, and each shepherd is paid for the bread he gave the hunter, at the same price. How many coins should the shepherd with 5 loaves get?"
givens: ["One shepherd has 5 loaves and the other 3.", "The two shepherds and a hunter eat all 8 loaves in equal shares.", "The hunter pays 8 coins, shared for the bread each shepherd gave him."]
unknown: "How many coins the shepherd with 5 loaves gets."
leading_question: "Cut every loaf into 3 equal pieces. How many pieces does each person eat?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "7"
          units: ["coin", "coins"]
          trap_values:
            - value: "5"
              trap: "part-whole-swap"
              text: "5 shares the coins like the loaves, but he also ate some of his own bread."
            - value: "4"
              trap: "ignored-condition"
              text: "4 shares the coins equally, but the two shepherds did not give the hunter the same amount of bread."
            - value: "1"
              trap: "answered-other-question"
              text: "1 coin is not what the shepherd with 5 loaves gets."
            - value: "3"
              trap: "stopped-early"
              text: "3 coins is the price of one whole loaf, not what the shepherd is owed."
    simpler_case: "Try two shepherds with 2 loaves and 1 loaf, who share all 3 loaves equally with a hunter. How much bread does the first shepherd give the hunter?"
solution:
  - text: "Cut every loaf into 3 pieces: that makes 24 pieces, 8 for each person. The first shepherd had 15 pieces and ate 8, so he gave the hunter 7. The second had 9, ate 8 and gave 1. So the 8 coins go 7 and 1, and the shepherd with 5 loaves gets 7."
