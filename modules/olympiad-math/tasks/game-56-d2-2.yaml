statement:
  - text: "Kate and Leo count up to 22 together, and Kate starts. She says 1, 2 or 3. After that, each of them in turn adds 1, 2 or 3 to the last number said, and nobody may go past 22. Whoever says 22 wins. Leo plays as well as he can. What number should Kate say first?"
