  - text: "If Kate says 18, Leo can only reach 19, 20 or 21, and then 22 is in her reach. So 18 is a number to say, and in the same way so are 14, 10, 6 and 2. Kate says 2, then after each of Leo's turns she adds enough to make 4 in that round."
