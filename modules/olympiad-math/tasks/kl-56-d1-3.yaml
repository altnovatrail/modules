id: "kl-56-d1-3"
statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Five islanders stand in a row. The first says: 'At least one of us five is a knight.' The second says: 'At least two of us are knights,' the third 'At least three,' the fourth 'At least four,' and the fifth 'All five of us are knights.' How many knights can there be among the five?"
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Five islanders stand in a row.", "The first says at least one of the five is a knight, the second at least two, the third at least three, the fourth at least four, and the fifth all five."]
unknown: "How many knights there can be."
leading_question: "Try two knights. Who would they have to be, and would the other three then lie?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["None: the five sentences cannot all fit", "Exactly 5", "Exactly 0", "Exactly 3", "Any number from 0 to 5"]
        check:
          kind: "choice"
          key: "Any number from 0 to 5"
          trap_values:
            - value: "None: the five sentences cannot all fit"
              trap: "stopped-early"
              text: "Try a number of knights and check whether the sentences fit."
            - value: "Exactly 5"
              trap: "trusted-statement"
              text: "5 takes all five at their word. That fits, but try other numbers too."
            - value: "Exactly 0"
              trap: "missed-case"
              text: "0 fits, since then every sentence is false, but try other numbers too."
            - value: "Exactly 3"
              trap: "reversed-relation"
              text: "3 reads each 'at least' as 'at most'."
    simpler_case: "Try one islander who says: 'At least one of us is a knight', speaking of himself and a liar. Can he be a knight? Can he be a liar?"
solution:
  - text: "Say there are h knights. Then the sentences from 'at least one' up to 'at least h' are true and the others false. The first h islanders said true sentences, so they are knights, and the others said false ones, so they are liars: that makes h knights, as supposed. This works for every h from 0 to 5, so any number of knights from 0 to 5 fits."
techniques: ["opposite"]
skills:
  primary: ["logic-knights-liars"]
band: "grades-5-6"
difficulty: 1
