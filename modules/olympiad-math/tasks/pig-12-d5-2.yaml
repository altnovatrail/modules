id: "pig-12-d5-2"
statement:
  - text: "A drawer has 3 pairs of red gloves and 3 pairs of blue gloves, all mixed up. Every pair has a left glove and a right glove. In the dark, how many gloves must you take to be sure of a left and a right glove of the same colour?"
givens: ["The drawer has 3 pairs of red gloves and 3 pairs of blue gloves, all mixed up.", "Every pair has a left glove and a right glove.", "You take gloves in the dark."]
unknown: "How many gloves you must take to be sure of a left and a right glove of the same colour."
