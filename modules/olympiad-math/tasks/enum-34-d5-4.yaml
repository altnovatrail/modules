    simpler_case: "Try a tournament of 3 games in all, every two players playing once. How many players took part?"
solution:
  - text: "With 8 players, the first plays 7 games, the second 6 new ones, and so on: 7 + 6 + 5 + 4 + 3 + 2 + 1 = 28. So there were 8 players."
