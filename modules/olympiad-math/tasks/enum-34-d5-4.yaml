id: "enum-34-d5-4"
statement:
  - text: "In a chess tournament every two players played each other exactly once. There were 28 games in all. How many players took part?"
givens: ["Every two players played each other exactly once.", "There were 28 games in all."]
unknown: "How many players took part."
canvas:
