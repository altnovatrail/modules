id: "frac-56-d5-2"
statement:
  - text: "Four friends ate a whole pot of honey. Ben ate a third as much as Al. Cy ate a third of what Al did not eat. Dan got only a quarter of the pot. What part of the pot did Al eat?"
givens: ["Four friends ate a whole pot of honey.", "Ben ate a third as much as Al, and Cy a third of what Al did not eat.", "Dan ate a quarter of the pot."]
unknown: "The part of the pot Al ate."
leading_question: "Add up what Ben and Cy ate: a third of what Al ate and a third of what he did not eat."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "fraction"
          key: "5/12"
          trap_values:
            - value: "5/36"
              trap: "answered-other-question"
              text: "5/36 is not Al's part."
            - value: "5/16"
              trap: "part-whole-swap"
              text: "5/16 takes a third of what Al did not eat as a third of the whole pot. It is a third of the part Al left."
            - value: "9/20"
              trap: "part-whole-swap"
              text: "9/20 takes a third of what Al did not eat as a third of what Al ate. Cy's part comes from the rest of the pot."
            - value: "3/4"
              trap: "stopped-early"
              text: "3/4 is what is left once Dan's quarter is taken away. Ben and Cy ate part of it too."
    simpler_case: "Try three friends: Ben ate a third as much as Al, and Dan half of the pot. What part did Al eat?"
solution:
  - text: "Ben ate a third of Al's part, and Cy ate a third of the rest of the pot. Together they ate a third of the whole pot. Dan ate a quarter, so Al ate 1 − 1/3 − 1/4 = 5/12 of the pot."
