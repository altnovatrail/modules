id: "clk-34-d3-5"
statement:
  - text: "From 9:15 to 11:45 a school has 3 lessons of the same length, with a 15-minute break between every two lessons. How many minutes long is one lesson?"
  - picture: "pictures/clk-34-d3-5.png"
    alt: "A clock showing 9:15."
    width: 200
    height: 200
givens: ["From 9:15 to 11:45 there are 3 lessons of the same length.", "A 15-minute break comes between every two lessons."]
unknown: "How many minutes long one lesson is."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "40"
          units: ["minute", "minutes"]
          trap_values:
            - value: "30"
              trap: "wrong-operation"
              text: "30 minutes is the time of both breaks, not of a lesson."
            - value: "35"
              trap: "off-by-one"
              text: "Count the breaks between 3 lessons again."
            - value: "45"
              trap: "wrong-operation"
              text: "You took away only one break."
            - value: "50"
              trap: "ignored-condition"
              text: "You forgot the breaks."
    simpler_case: "Try 2 lessons from 9:00 to 10:00 with one 10-minute break. How many minutes long is one lesson?"
solution:
  - text: "From 9:15 to 11:45 is 150 minutes. There are 2 breaks: 30 minutes. 150 - 30 = 120 minutes for 3 lessons, so one lesson is 40 minutes."
