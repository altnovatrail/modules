statement:
  - text: "Masha writes the numbers 1 to 20 on 20 cards. Without looking, how many cards must she take to be sure that two of her cards add up to 21?"
givens: ["The cards have the numbers 1 to 20.", "Masha takes cards without looking."]
unknown: "How many cards she must take to be sure that two of them add up to 21."
