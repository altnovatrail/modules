id: "div-56-d5-2"
statement:
  - text: "Multiply the two digits of a two-digit number. For how many two-digit numbers does the number itself divide by what you get?"
givens: ["The two digits of a two-digit number are multiplied."]
unknown: "For how many two-digit numbers the number divides by that product."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "5"
          units: ["number", "numbers"]
          trap_values:
            - value: "4"
              trap: "missed-case"
              text: "4 leaves out a number whose digits multiply to 1."
            - value: "14"
              trap: "stopped-early"
              text: "14 counts the numbers that divide by each of their digits, a step on the way. Most of them, such as 22, do not divide by the product of their digits."
            - value: "36"
              trap: "answered-other-question"
              text: "36 is the largest such number. The question asks how many there are."
            - value: "23"
              trap: "wrong-operation"
              text: "23 counts the numbers that divide by the sum of their digits, such as 10 and 18. The question asks about the product."
    simpler_case: "Try the numbers from 10 to 19. For how many does the number divide by the product of its digits?"
solution:
  - text: "A number with a 0 among its digits is out, since no number divides by 0. A number that divides by the product of its digits divides by each of them, and the two-digit numbers that do are 11, 12, 15, 22, 24, 33, 36, 44, 48, 55, 66, 77, 88 and 99. Of these, only 11, 12, 15, 24 and 36 divide by the product of their digits: 11 by 1, 12 by 2, 15 by 5, 24 by 8 and 36 by 18. So there are 5."
