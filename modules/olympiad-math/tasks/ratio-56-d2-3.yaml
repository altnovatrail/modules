id: "ratio-56-d2-3"
statement:
  - text: "In a fish tank, there are 3 gold fish (G) for every 5 silver fish (S), and every fish is gold or silver. There are 20 silver fish. How many fish are in the tank?"
  - picture: "pictures/ratio-56-d2-3.png"
    alt: "Two bars: G of 3 equal parts and S of 5 equal parts, with the notes S = 20 and G + S = ?."
    width: 190
    height: 140
givens: ["There are 3 gold fish for every 5 silver fish, and every fish is gold or silver.", "There are 20 silver fish."]
unknown: "How many fish are in the tank."
leading_question: "How many groups of 5 silver fish are there?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "32"
          units: ["fish"]
          trap_values:
            - value: "50"
              trap: "ratio-total-confusion"
              text: "50 takes 3 of every 5 fish to be gold, but it is 3 gold for every 5 silver, 8 fish in each group."
            - value: "38"
              trap: "wrong-operation"
              text: "38 makes the gold fish 2 fewer than the silver ones, 18, but the ratio grows with the groups."
            - value: "12"
              trap: "part-whole-swap"
              text: "12 is only part of the fish."
            - value: "20"
              trap: "number-from-text"
              text: "20 is the number of silver fish, copied from the question."
    simpler_case: "Try 1 gold fish for every 2 silver fish, with 6 silver fish. How many fish are there?"
solution:
  - text: "20 silver fish make 4 groups of 5, so there are 4 groups of 3 gold fish, which is 12. Altogether there are 20 + 12 = 32 fish."
skills:
  primary: ["ratio-sharing"]
band: "grades-5-6"
difficulty: 2
