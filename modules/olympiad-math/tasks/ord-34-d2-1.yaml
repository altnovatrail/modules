id: "ord-34-d2-1"
statement:
  - text: "Four villages, Oak, Pine, Reed and Stone, lie along a straight road. Pine lies between Oak and Reed. Stone lies at one end of the road, right next to Reed. Which village lies at the other end of the road?"
givens: ["Oak, Pine, Reed and Stone lie along a straight road.", "Pine lies between Oak and Reed.", "Stone lies at one end, right next to Reed."]
unknown: "Which village lies at the other end."
