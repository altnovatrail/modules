      - binding: "anywhere"
        check:
          kind: "choice"
          notation: "word"
          key: "Oak"
          options: ["Pine", "Reed", "Stone", "It is impossible to tell", "Oak"]
          trap_values:
            - value: "Pine"
              trap: "ignored-condition"
              text: "Pine lies between two villages, so it is not at an end."
