id: "pig-56-d4-2"
statement:
  - text: "How many whole numbers must you choose to be sure that three of them have a sum that can be divided by 3?"
givens: ["You choose whole numbers.", "Three of them must have a sum that can be divided by 3."]
unknown: "How many numbers you must choose to be sure of it."
leading_question: "Look only at the remainder each number leaves when it is divided by 3."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "5"
          units: ["number", "numbers"]
          trap_values:
            - value: "7"
              trap: "missed-case"
              text: "7 waits for three numbers with the same remainder, but three numbers with three different remainders also work."
            - value: "3"
              trap: "best-case-not-worst"
              text: "Three numbers could have such a sum by luck, but they need not."
            - value: "9"
              trap: "wrong-operation"
              text: "9 multiplies 3 by 3, but far fewer numbers are already enough."
            - value: "4"
              trap: "off-by-one"
              text: "4 is not enough: of 3, 6, 1 and 4, no three have a sum that divides by 3."
    simpler_case: "Try to be sure that two of your numbers have the same remainder on division by 3. How many numbers does that take?"
solution:
  - text: "Only the remainders when dividing by 3 matter: 0, 1 or 2. Three numbers work if their remainders are all the same or all different. Four numbers can fail, as 3, 6, 1 and 4 do. With five numbers, either some remainder comes up three times or all three remainders come up, and either way three of the numbers have a sum that divides by 3."
