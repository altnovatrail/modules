id: "ratio-56-d3-3"
statement:
  - text: "A dough is made of flour and sugar only, in the ratio 5 : 2 by weight. A baker has 1000 g of flour and 300 g of sugar and makes as much dough as she can. How many grams of flour are left over?"
givens: ["The dough is flour and sugar in the ratio 5 : 2 by weight.", "The baker has 1000 g of flour and 300 g of sugar and makes as much dough as she can."]
unknown: "How many grams of flour are left over."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "250"
          units: ["g", "gram", "grams"]
          trap_values:
            - value: "550"
              trap: "ratio-total-confusion"
              text: "550 takes the sugar as 2/5 of the dough, but it is 2 parts out of 7."
            - value: "700"
              trap: "wrong-operation"
              text: "700 is 1000 - 300, which takes the sugar away from the flour."
            - value: "0"
              trap: "ignored-condition"
              text: "0 uses all the flour, but that would need 400 g of sugar, and there are only 300 g."
            - value: "1050"
              trap: "answered-other-question"
              text: "1050 g is the dough she makes, not the flour left over."
    simpler_case: "Try flour and sugar in the ratio 2 : 1, with 500 g of flour and 200 g of sugar. How many grams of flour are left over?"
solution:
  - text: "300 g of sugar is 2 parts, so a part is 150 g and the dough takes 5 × 150 = 750 g of flour. All the flour would need 400 g of sugar, which she does not have. So 1000 - 750 = 250 g of flour are left over."
skills:
  primary: ["ratio-sharing"]
band: "grades-5-6"
difficulty: 3
