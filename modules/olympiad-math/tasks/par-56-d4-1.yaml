id: "par-56-d4-1"
statement:
  - text: "Three frogs sit on a number line: frog P at 0, frog Q at 1 and frog R at 2. In each move one frog jumps over another frog and lands as far on the other side as it was before, like a jump from 1 over 2 to 3. After some moves, where can the frogs be?"
  - picture: "pictures/par-56-d4-1.png"
    alt: "A number line from 0 to 6 with frog P marked at 0, frog Q at 1 and frog R at 2."
    width: 264
    height: 92
givens: ["Frog P is at 0, frog Q at 1 and frog R at 2.", "In a move one frog jumps over another and lands as far on the other side."]
unknown: "Where the frogs can be after some moves."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["P at 0, Q at 4, R at 5", "P at 0, Q at 5, R at 4", "P at 0, Q at 2, R at 4", "P at 1, Q at 3, R at 4", "P at 2, Q at 1, R at 3"]
        check:
          kind: "choice"
          key: "P at 0, Q at 5, R at 4"
          trap_values:
            - value: "P at 0, Q at 4, R at 5"
              trap: "wrong-parity"
              text: "Q always stays on an odd point and R on an even one, but here Q is at 4 and R at 5."
            - value: "P at 0, Q at 2, R at 4"
              trap: "wrong-parity"
              text: "Q always stays on an odd point, but here Q is at 2."
            - value: "P at 1, Q at 3, R at 4"
              trap: "wrong-parity"
              text: "P always stays on an even point, but here P is at 1."
            - value: "P at 2, Q at 1, R at 3"
              trap: "wrong-parity"
              text: "R always stays on an even point, but here R is at 3."
    simpler_case: "Try one jump: Q jumps over R. Where does Q land?"
solution:
  - text: "A jumping frog moves twice the distance between it and the frog it jumps over, and twice a whole number is even. So each frog stays on even points or on odd points, as it started: P and R always sit on even points, and Q on odd ones. Of the options, only P at 0, Q at 5 and R at 4 keeps to this. It can be reached: Q jumps over R to 3, R jumps over Q to 4, and Q jumps over R to 5."
  - picture: "pictures/par-56-d4-1-solution.png"
    alt: "A number line from 0 to 6 with frog P marked at 0, frog R at 4 and frog Q at 5."
    width: 264
    height: 92
