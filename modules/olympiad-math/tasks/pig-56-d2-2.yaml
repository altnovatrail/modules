id: "pig-56-d2-2"
statement:
  - text: "A drawer holds socks of 3 colours, and each colour comes in 2 sizes, many of each kind, all mixed up. In the dark, how many socks must you take to be sure of 2 socks of the same colour and the same size?"
givens: ["The socks come in 3 colours.", "Each colour comes in 2 sizes, many of each kind, all mixed up.", "You take socks in the dark."]
unknown: "How many socks you must take to be sure of 2 socks of the same colour and the same size."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "7"
          units: ["sock", "socks"]
          trap_values:
            - value: "2"
              trap: "best-case-not-worst"
              text: "Two socks could match by luck, but they need not."
            - value: "6"
              trap: "off-by-one"
              text: "6 socks could be one of each of the 6 kinds, with no two alike."
            - value: "4"
              trap: "ignored-condition"
              text: "4 socks make sure of 2 of the same colour, but those two may still differ in size."
            - value: "12"
              trap: "wrong-operation"
              text: "12 takes two socks of every kind, but you do not need a pair of every kind: one pair of one kind is enough."
    simpler_case: "Try socks of 2 colours in 1 size first. How many make you sure of 2 alike?"
solution:
  - text: "One colour and one size make a kind of sock, and there are 3 × 2 = 6 kinds. You could be unlucky and take one sock of each kind: 6 socks with no two alike. The 7th sock must match one of them in both colour and size."
techniques: ["pigeonhole"]
skills:
  primary: ["pigeonhole-basic"]
band: "grades-5-6"
difficulty: 2
