id: "pig-34-d2-4"
statement:
  - text: "The numbers 1 to 10 are written on 10 cards. Without looking, how many cards must you take to be sure that two of them add up to 11?"
givens: ["The cards have the numbers 1 to 10.", "You take cards without looking."]
unknown: "How many cards you must take to be sure that two of them add up to 11."
