id: "pct-56-d1-3"
statement:
  - text: "Sam puts 500 coins in a bank. Every year the bank adds 20% of the 500 coins he first put in. How many coins does Sam have after 3 years?"
givens: ["Sam puts 500 coins in a bank.", "Every year the bank adds 20% of the first 500 coins."]
