solution:
  - text: "Even numbers do not change whether a sum is odd or even, so the sum is odd exactly when it has an odd count of odd numbers. With 13 even numbers, the other 7 are odd, and 7 is odd, so the sum can be odd, and 13 is more than half of 20. With 12, 16 or 20 even numbers, there are 8, 4 or 0 odd ones, an even count, and the sum is even. And 7 even numbers are not more than half."
