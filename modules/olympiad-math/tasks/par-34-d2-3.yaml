id: "par-34-d2-3"
statement:
  - text: "15 children stand in a circle holding hands. Can boys and girls take turns all the way round the circle?"
givens: ["15 children stand in a circle holding hands."]
unknown: "Whether boys and girls can take turns all the way round."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["Yes", "No", "Only if there are 8 girls", "Only if there are 7 girls", "It is impossible to tell"]
        check:
          kind: "choice"
          key: "No"
          trap_values:
            - value: "Yes"
              trap: "wrong-parity"
