              trap: "stopped-early"
              text: "With 7 girls and 8 boys, two boys would stand together somewhere."
            - value: "It is impossible to tell"
              trap: "ignored-condition"
              text: "It can be told: look whether the number of children is even or odd."
    simpler_case: "Try 4 children and then 5 children in a circle. Can boys and girls take turns?"
solution:
  - text: "If boys and girls take turns all the way round, they come in boy-girl pairs, so the number of children must be even. 15 is odd, so it is not possible."
