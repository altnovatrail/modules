# A template of counting-gaps (T35; R22): the solver of mathtrail-standalone
# content/solvers/counting.gaps/positions.star at 42b4408, made a solver of the template. It came
# from reference task gaps-34-d5-3, whose numbers are one of its instances.
# The numbers of reference task gaps-34-d5-3: side 20, apart 4.
# Its capitals SIDE and APART are the numbers that the statement shows. The constraint keeps a whole
# number of gaps on a side, from 3 to 8, so that the instances are alike in difficulty, and other
# than the spacing; posts every 4 metres make as many posts as metres of a side, so only the
# reference task keeps them. The trap values are derived numbers, the mistakes of the reference
# task, and stay apart for every instance.
