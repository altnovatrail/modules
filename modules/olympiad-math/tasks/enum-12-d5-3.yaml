id: "enum-12-d5-3"
statement:
  - text: "From Ash to Birch there are 3 roads, and from Birch to Cedar there are 2 roads. There is also 1 road that goes straight from Ash to Cedar. How many different ways are there to get from Ash to Cedar?"
givens: ["There are 3 roads from Ash to Birch.", "There are 2 roads from Birch to Cedar.", "1 road goes straight from Ash to Cedar."]
