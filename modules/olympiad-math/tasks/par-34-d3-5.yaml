id: "par-34-d3-5"
statement:
  - text: "9 lamps in a row are numbered 1 to 9, and all of them are off. Anna switches every lamp whose number is even. Then Ben switches every lamp whose number can be divided by 3. How many lamps are on now?"
givens: ["9 lamps are numbered 1 to 9, all off.", "Anna switches every lamp with an even number.", "Then Ben switches every lamp whose number divides by 3."]
unknown: "How many lamps are on now."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "5"
          units: ["lamp", "lamps"]
          trap_values:
            - value: "3"
              trap: "answered-other-question"
              text: "3 is how many lamps Ben switches."
            - value: "4"
              trap: "stopped-early"
              text: "4 lamps are on after Anna, but Ben switches some lamps too."
            - value: "6"
              trap: "ignored-condition"
              text: "Lamp 6 was switched twice, so it is off again."
            - value: "7"
              trap: "double-count"
              text: "Lamp 6 was switched by both, so it is off; do not count it at all."
    simpler_case: "Try 4 lamps first, with the same switches. How many are on?"
solution:
  - text: "After Anna, lamps 2, 4, 6 and 8 are on. Ben switches lamps 3, 6 and 9: lamps 3 and 9 go on, and lamp 6 goes off. Now lamps 2, 3, 4, 8 and 9 are on: 5 lamps."
  - text: "4 − 1 + 2 = 5"
