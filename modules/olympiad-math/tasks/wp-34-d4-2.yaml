    simpler_case: "Try having exactly 2 litres in one jug. How many steps does it take?"
solution:
  - text: "Fill the 7-litre jug and pour it into the 5-litre jug: 2 litres stay. Empty the small jug and pour the 2 litres into it. Fill the big jug again and pour until the small jug is full: 4 litres stay. Empty the small jug, pour the 4 litres into it, fill the big jug and pour until the small jug is full: 6 litres stay. That is 10 steps, and there is no shorter way."
