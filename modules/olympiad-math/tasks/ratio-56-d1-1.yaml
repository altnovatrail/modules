id: "ratio-56-d1-1"
statement:
  - text: "In a class, the ratio of boys to girls is 2 : 3. What fraction of the class are boys?"
givens: ["The ratio of boys to girls in the class is 2 : 3."]
unknown: "The fraction of the class that are boys."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "fraction"
          key: "2/5"
          trap_values:
            - value: "2/3"
              trap: "ratio-total-confusion"
              text: "2/3 compares the boys with the girls, not with the whole class."
            - value: "3/5"
              trap: "answered-other-question"
              text: "3/5 is not the fraction of boys."
            - value: "3/2"
              trap: "reversed-relation"
              text: "3/2 turns the ratio round, and it is more than a whole. A part of the class cannot be bigger than the class."
            - value: "1/2"
              trap: "ignored-condition"
              text: "1/2 makes the class half boys, as if there were as many boys as girls. For every 2 boys there are 3 girls."
    simpler_case: "Try a class with 1 boy for every 3 girls. What fraction of the class are boys?"
solution:
  - text: "For every 2 boys there are 3 girls, so every group of 2 + 3 = 5 children holds 2 boys. The boys are 2/5 of the class."
skills:
  primary: ["ratio-sharing"]
band: "grades-5-6"
difficulty: 1
