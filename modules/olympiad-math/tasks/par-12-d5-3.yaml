id: "par-12-d5-3"
statement:
  - text: "Kate writes the numbers 1 to 20 on the board. Then again and again she rubs out any two numbers and writes their sum instead, until only one number is left. Is that last number even or odd?"
givens: ["The numbers 1 to 20 are on the board.", "Again and again two numbers are rubbed out, and their sum is written instead."]
unknown: "Whether the last number is even or odd."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "choice"
          key: "even"
          options: ["odd", "sometimes even, sometimes odd", "even", "It is impossible to tell", "It is always 0"]
          trap_values:
            - value: "odd"
              trap: "wrong-parity"
              text: "The total of all the numbers never changes. Work out the total at the start."
            - value: "sometimes even, sometimes odd"
              trap: "ignored-condition"
              text: "The total never changes, so the last number is always the same. Work out the total at the start."
            - value: "It is impossible to tell"
              trap: "ignored-condition"
              text: "The total of all numbers never changes, so you can tell."
            - value: "It is always 0"
              trap: "wrong-operation"
              text: "Adding numbers never gives 0 here."
    simpler_case: "Try the numbers 1, 2 and 3 first. What is the last number?"
solution:
  - text: "Writing the sum of two numbers instead of them does not change the total of all numbers on the board. At the start the total is 1 + 2 + ... + 20 = 210. So the last number is 210, which is even."
