id: "sets-56-d4-1"
statement:
  - text: "There are 32 pupils in Year 6. 15 sing in the choir, 13 act in the drama group and 12 paint in the art group. 5 are in both choir and drama, 4 in both choir and art, and 3 in both drama and art. These numbers include the 2 pupils who are in all three groups. How many pupils are in none of the groups?"
givens: ["Year 6 has 32 pupils.", "15 sing in the choir, 13 act in drama and 12 paint in art.", "5 are in choir and drama, 4 in choir and art, and 3 in drama and art, counting the 2 who are in all three."]
unknown: "How many pupils are in none of the groups."
leading_question: "Add the three groups, then deal with the pupils counted more than once. How many times is a pupil in all three groups counted by the end?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "2"
          units: ["pupil", "pupils"]
          trap_values:
            - value: "4"
              trap: "missed-case"
              text: "4 forgets to add back the pupils in all three groups."
            - value: "6"
              trap: "double-count"
              text: "6 takes the pupils in all three groups away once too often."
            - value: "9"
              trap: "stopped-early"
              text: "9 uses only the choir and drama: 32 - (15 + 13 - 5) = 9. The art group was never counted."
            - value: "0"
              trap: "ignored-condition"
              text: "0 assumes every pupil is in some group, but the question never says so."
    simpler_case: "Try 10 pupils: 6 in the choir, 5 in drama and 4 in both. How many are in neither?"
solution:
  - text: "15 + 13 + 12 = 40 counts each pupil in two groups twice, so take away 5 + 4 + 3 = 12. A pupil in all three groups was counted three times and taken away three times, so add the 2 back: 40 - 12 + 2 = 30 pupils are in some group. That leaves 32 - 30 = 2."
leak_phrases: ["2 pupils in none", "two pupils in none"]
skills:
  primary: ["logic-sets"]
band: "grades-5-6"
difficulty: 4
