id: "sets-56-d1-3"
statement:
  - text: "In a music club, one in every 3 pupils who sing also plays the drum. One in every 5 pupils who play the drum also sings. 12 pupils of the club sing. How many pupils of the club play the drum?"
givens: ["One in every 3 pupils who sing also plays the drum.", "One in every 5 pupils who play the drum also sings.", "12 pupils sing."]
unknown: "How many pupils play the drum."
leading_question: "How many pupils both sing and play the drum?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "20"
          units: ["pupil", "pupils"]
          trap_values:
            - value: "4"
              trap: "stopped-early"
              text: "4 is the number who both sing and play the drum, not all the drummers."
            - value: "36"
              trap: "wrong-operation"
              text: "36 multiplies the 12 singers by 3, where they should be divided by 3."
            - value: "24"
              trap: "ratio-total-confusion"
              text: "24 takes one in every 5 as one singer to every 5 drummers who do not sing."
            - value: "60"
              trap: "part-whole-swap"
              text: "60 takes all 12 singers as the drummers who sing, but only one in every 3 of them plays the drum."
    simpler_case: "Try 10 singers, one in every 2 of them playing the drum, and every drummer singing. How many drummers are there?"
solution:
  - text: "One in every 3 of the 12 singers plays the drum, so 12 ÷ 3 = 4 pupils do both. These 4 are one in every 5 drummers, so there are 4 × 5 = 20 drummers."
skills:
  primary: ["logic-sets"]
band: "grades-5-6"
difficulty: 1
