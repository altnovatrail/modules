id: "par-34-d2-5"
statement:
  - text: "Masha writes the numbers 1 to 11 in a row and puts a plus or a minus sign between every two neighbours. Which of these results can she get?"
givens: ["The numbers 1 to 11 stand in a row.", "A plus or a minus stands between every two neighbours."]
unknown: "Which of the results Masha can get."
