id: "grid-56-d4-2"
statement:
  - text: "A square pond fills the middle of a 3 by 3 grid, and the other 8 squares are paving slabs. Rows are A to C from the top, columns 1 to 3 from the left. Two gardeners share the slabs, 4 each, and each gardener's slabs have to stay joined by whole sides. Splits count as different when the groups of slabs are different. How many splits are possible?"
  - picture: "pictures/grid-56-d4-2.png"
    alt: "A 3 by 3 grid with rows A to C from the top and columns 1 to 3 from the left; every square but the middle one, B2, is shaded."
    width: 149
    height: 154
givens: ["A pond fills the middle square of a 3 by 3 grid, and the other 8 are slabs.", "Two gardeners take 4 slabs each, and each gardener's slabs stay joined by whole sides."]
unknown: "How many splits are possible."
leading_question: "The slabs make a ring around the pond. What must a group of 4 joined slabs look like?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "4"
          units: ["split", "splits"]
          trap_values:
            - value: "8"
              trap: "double-count"
              text: "8 counts each split more than once."
            - value: "28"
              trap: "ignored-condition"
              text: "28 cuts the ring in any two places and forgets the 4 each."
            - value: "1"
              trap: "stopped-early"
              text: "1 stops after the first split; turn it around the ring."
            - value: "2"
              trap: "missed-case"
              text: "2 finds the splits across the rows but not across the columns."
    simpler_case: "Try a ring of 6 slabs shared 3 each, each gardener's slabs joined. How many splits are possible?"
solution:
  - text: "The 8 slabs form a ring, so 4 slabs that stay joined are 4 in a row around it, and so are the other 4. The ring has 8 such runs of 4, and each split uses two of them: 8 ÷ 2 = 4 splits."
techniques: ["draw"]
leak_phrases: ["4 splits", "four splits"]
