id: "pig-34-d5-4"
statement:
  - text: "A drawer has socks of 4 colours, many of each colour. In the dark, how many socks must you take to be sure to have 2 pairs? A pair is 2 socks of the same colour, and the two pairs may be of the same colour or of different colours."
givens: ["The socks are of 4 colours, many of each.", "A pair is 2 socks of the same colour.", "The two pairs may be of the same colour or of different colours."]
unknown: "How many socks you must take in the dark to be sure of 2 pairs."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "7"
          units: ["sock", "socks"]
          trap_values:
            - value: "4"
              trap: "best-case-not-worst"
              text: "4 socks can be 4 different colours."
            - value: "5"
              trap: "stopped-early"
              text: "5 socks make you sure of one pair, not two."
            - value: "6"
              trap: "off-by-one"
              text: "6 socks can be 3 of one colour and 1 of each other colour: only one pair."
            - value: "8"
              trap: "wrong-operation"
              text: "You multiplied 4 by 2. Fewer socks are already enough."
    simpler_case: "Try socks of 2 colours, many of each, first. How many socks make you sure of 2 pairs?"
solution:
  - text: "The unlucky case: 3 socks of one colour and 1 sock of each other colour, 6 socks with only one pair. The 7th sock makes a second pair."
techniques: ["pigeonhole"]
skills:
  primary: ["pigeonhole-basic"]
