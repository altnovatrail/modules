id: "grid-56-d3-4"
statement:
  - text: "The filled cells in the picture make a shape, and the cells marked 1 make a piece. Pieces like piece 1, turned as needed but never turned over, must cover the shape with no gaps and no overlaps. How many pieces are needed?"
  - picture: "pictures/grid-56-d3-4.png"
    alt: "On the left, a block of filled cells, four cells wide and three high: the shape. On the right, apart from it, three cells marked 1: the seventh column in the top two rows and the eighth column in the second row, an L of three cells."
    width: 368
    height: 168
givens: ["The filled cells make a shape, and the cells marked 1 make a piece.", "Pieces like it, turned but never turned over, must cover the shape with no gaps or overlaps."]
unknown: "How many pieces are needed."
leading_question: "How many cells does the shape have, and how many does one piece cover?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "4"
          units: ["piece", "pieces"]
          trap_values:
            - value: "3"
              trap: "off-by-one"
              text: "Check whether the pieces cover every cell."
            - value: "12"
              trap: "answered-other-question"
              text: "That is the cells, not the pieces."
            - value: "5"
              trap: "wrong-operation"
              text: "Check how many cells the pieces cover in all."
    simpler_case: "Try a shape of 6 cells, three wide and two high. How many such pieces cover it?"
solution:
  - text: "The shape has 12 cells and a piece covers 3, so 4 pieces are needed, and four pieces do fit: two of them fill each half of the shape."
  - text: "12 ÷ 3 = 4"
  - picture: "pictures/grid-56-d3-4-solution.png"
    alt: "The shape split into L pieces of three cells, each piece numbered."
    width: 208
    height: 168
