id: "wp-34-d4-5"
statement:
  - text: "There are 10 bags of coins, numbered 1 to 10. In nine bags every coin weighs 10 g; in one bag every coin weighs 11 g. Vera takes 1 coin from bag 1, 2 coins from bag 2, and so on, up to 10 coins from bag 10, and puts all of them on a scale that shows the weight. The scale shows 553 g. Which bag has the heavy coins?"
givens: ["Nine bags have coins of 10 g, and one bag coins of 11 g.", "Vera takes 1 coin from bag 1, 2 from bag 2, and so on up to 10 from bag 10.", "All of them weigh 553 g."]
unknown: "Which bag has the heavy coins."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["bag 3", "bag 1", "bag 5", "bag 10", "It is impossible to tell"]
        check:
          kind: "choice"
          key: "bag 3"
          trap_values:
            - value: "bag 1"
              trap: "ignored-condition"
              text: "Count the extra grams first."
            - value: "bag 5"
              trap: "number-from-text"
              text: "5 is a digit of 553, not the number of extra grams."
