    simpler_case: "Try 3 bags, taking 1, 2 and 3 coins, with all of them weighing 62 g. Which bag has the heavy coins?"
solution:
  - text: "Vera took 1 + 2 + ... + 10 = 55 coins. If all of them weighed 10 g, they would weigh 550 g. There are 3 extra grams, and each heavy coin adds 1 g, so there are 3 heavy coins: they come from bag 3."
