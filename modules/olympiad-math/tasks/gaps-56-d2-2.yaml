id: "gaps-56-d2-2"
statement:
  - text: "An orchard is a rectangle 20 metres wide and 30 metres long. Apple trees grow in straight rows 5 metres apart, and in every row the trees are 5 metres apart. There are trees along all four edges, one in each corner. How many trees are there?"
givens: ["The orchard is 20 metres wide and 30 metres long.", "The rows are 5 metres apart, and in a row the trees are 5 metres apart.", "There are trees along all four edges, one in each corner."]
unknown: "How many trees there are."
leading_question: "How many trees stand along the 20-metre side? And along the 30-metre side?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "35"
          units: ["tree", "trees", "apple tree", "apple trees"]
          trap_values:
            - value: "24"
              trap: "off-by-one"
              text: "24 multiplies the gaps, 4 and 6, but each side has one tree more than gaps."
            - value: "20"
              trap: "answered-other-question"
              text: "20 counts only the trees along the four edges; the rows inside have trees too."
            - value: "48"
              trap: "off-by-one"
              text: "48 adds one tree too many each way: 6 and 8 instead of 5 and 7."
            - value: "12"
              trap: "wrong-operation"
              text: "12 adds the 5 and the 7, but the trees fill 5 rows of 7."
    simpler_case: "Try an orchard 10 metres by 10 metres, with trees every 5 metres both ways and one in each corner. How many trees are there?"
solution:
  - text: "Along the 20-metre side the trees stand at 0, 5, 10, 15 and 20 metres: 5 trees. Along the 30-metre side there are 7. The trees fill 5 rows of 7, so there are 5 × 7 = 35."
