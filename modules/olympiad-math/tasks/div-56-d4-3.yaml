id: "div-56-d4-3"
statement:
  - text: "A number leaves a remainder of 22 when it is divided by 24. What remainder does the same number leave when it is divided by 3?"
givens: ["The number leaves 22 when divided by 24."]
unknown: "Its remainder when divided by 3."
leading_question: "What remainder does a multiple of 24 leave when it is divided by 3?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "1"
          trap_values:
            - value: "7"
              trap: "remainder-vs-quotient"
              text: "7 is a number of threes, not what is left over."
            - value: "22"
              trap: "number-from-text"
              text: "22 is the remainder for 24, and a remainder when dividing by 3 is always less than 3."
            - value: "0"
              trap: "stopped-early"
              text: "0 notices that 24 divides by 3 but forgets the 22 left over."
            - value: "2"
              trap: "answered-other-question"
              text: "2 is how much the number is short of the next multiple of 24."
    simpler_case: "Try a number that leaves 4 when divided by 6. What does it leave when divided by 2?"
solution:
  - text: "The number is a multiple of 24 plus 22. Every multiple of 24 divides by 3, and 22 = 7 × 3 + 1, so the number leaves a remainder of 1."
