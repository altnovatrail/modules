              text: "From 4 to 6 would be 2 hours only if she had started at 4:00."
    simpler_case: "Try homework from 4:50 to 5:15. How long did it take?"
solution:
  - text: "From 4:50 to 5:00 is 10 minutes. From 5:00 to 6:10 is 1 hour 10 minutes. In all 1 hour 20 minutes."
