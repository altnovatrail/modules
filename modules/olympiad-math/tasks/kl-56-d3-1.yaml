id: "kl-56-d3-1"
statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Lou says: 'If you asked Meg, she would say that Ned is a liar.' Meg says: 'Ned is a knight.' Ned says: 'Lou is a liar.' Who is lying?"
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Lou says: 'If you asked Meg, she would say that Ned is a liar.'", "Meg says: 'Ned is a knight.'", "Ned says: 'Lou is a liar.'"]
unknown: "Who is lying."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["Only Ned", "Only Meg", "Only Lou", "Nobody", "It is impossible to tell"]
        check:
          kind: "choice"
          key: "Only Lou"
          trap_values:
            - value: "Only Ned"
              trap: "trusted-statement"
              text: "Believing Lou makes Ned a liar, but Meg calls Ned a knight and would not answer differently if asked."
            - value: "Only Meg"
              trap: "trusted-statement"
              text: "Believing Lou makes Meg's words about Ned a lie, but if only Meg lied, Ned would be a knight and her words 'Ned is a knight' would be true."
            - value: "Nobody"
              trap: "ignored-condition"
              text: "If nobody lied, Ned's words 'Lou is a liar' would be false."
            - value: "It is impossible to tell"
              trap: "stopped-early"
              text: "Check Lou's words against what Meg has already said."
    simpler_case: "Try two: Meg says 'Ned is a knight', and Ned says '2 + 2 = 4.' Who is lying?"
solution:
  - text: "Meg has already spoken about Ned: she says Ned is a knight. A knight gives the same true answer every time, and a liar the same false one, so Meg would never say that Ned is a liar. Lou's words are false, and Lou is a liar. Then Ned's words 'Lou is a liar' are true, so Ned is a knight, and Meg's words 'Ned is a knight' are true, so Meg is a knight too. Only Lou lies."
