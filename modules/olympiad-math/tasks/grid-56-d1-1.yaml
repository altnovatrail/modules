id: "grid-56-d1-1"
statement:
  - text: "A bishop stands on cell C3 of a 5 by 5 board. Rows are A to E from the top, columns 1 to 5 from the left. A bishop moves any number of cells along a diagonal. How many cells can it move to in one move?"
  - picture: "pictures/grid-56-d1-1.png"
    alt: "A 5 by 5 board with rows A to E from the top and columns 1 to 5 from the left; cell C3 is shaded."
    width: 221
    height: 226
givens: ["The board has 5 by 5 cells, rows A to E from the top and columns 1 to 5 from the left.", "A bishop on C3 moves any number of cells along a diagonal."]
unknown: "How many cells the bishop can move to in one move."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "8"
          units: ["cell", "cells"]
          trap_values:
            - value: "10"
              trap: "double-count"
              text: "10 counts both diagonals whole, so C3 is counted twice."
            - value: "4"
              trap: "missed-case"
              text: "4 counts the cells of one diagonal only. A second diagonal crosses it at C3."
            - value: "16"
              trap: "answered-other-question"
              text: "16 is how many cells a queen on C3 could move to, along its row and its column as well. A bishop moves along diagonals only."
            - value: "9"
              trap: "off-by-one"
              text: "Count only the cells the bishop can move to."
    simpler_case: "Try a 3 by 3 board with the bishop on A1. How many cells can it move to?"
solution:
  - text: "One diagonal through C3 holds A1, B2, D4 and E5, and the other holds A5, B4, D2 and E1. That makes 4 + 4 = 8 cells. C3 itself does not count, since a move goes to another cell."
