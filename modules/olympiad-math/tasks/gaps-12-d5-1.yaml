id: "gaps-12-d5-1"
statement:
  - text: "Three logs are each sawn into 4 pieces. Each cut takes 2 minutes. How many minutes does all the sawing take?"
givens: ["There are three logs.", "Each log is sawn into 4 pieces.", "Each cut takes 2 minutes."]
unknown: "How many minutes all the sawing takes."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "18"
          units: ["minute", "minutes", "min"]
          trap_values:
            - value: "6"
              trap: "stopped-early"
              text: "6 minutes is only for one log. There are three logs."
            - value: "9"
              trap: "stopped-early"
              text: "9 is the number of cuts. Each cut takes 2 minutes."
            - value: "12"
              trap: "answered-other-question"
              text: "12 is the number of pieces, not minutes."
