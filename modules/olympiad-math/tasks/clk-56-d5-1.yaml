id: "clk-56-d5-1"
statement:
  - text: "A bus leaves town A at 8:00 and gets to town B at 14:00. Another bus leaves B at 9:00 and gets to A at 12:00. Both go along the same road, each at its own steady speed. At what time do they meet?"
  - text: "Write the time as hours and minutes, like 9:15."
givens: ["One bus leaves A at 8:00 and gets to B at 14:00.", "Another leaves B at 9:00 and gets to A at 12:00.", "Both go along the same road, each at its own steady speed."]
unknown: "The time when they meet."
leading_question: "What part of the road does each bus cover in an hour? Where is the first bus at 9:00?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "time"
          key: "10:40"
          trap_values:
            - value: "10:00"
              trap: "ignored-condition"
              text: "10:00 starts both buses at 8:00, but the second leaves B an hour later, at 9:00."
            - value: "10:20"
              trap: "reversed-relation"
              text: "10:20 swaps the buses' speeds. The first bus takes 6 hours, so it is the slower one."
            - value: "11:06"
              trap: "time-unit-mixup"
              text: "11:06 reads part of an hour as minutes the wrong way: two thirds of an hour is not 66 minutes."
            - value: "1:40"
              trap: "stopped-early"
              text: "1:40 is a length of time, not the time on the clock."
    simpler_case: "Try two buses that both leave at 8:00 from the two ends, each taking 2 hours for the road. At what time do they meet?"
solution:
  - text: "The first bus covers the road in 6 hours, a sixth of it each hour, and the second in 3 hours, a third of it each hour. By 9:00 the first bus has covered a sixth, so five sixths of the road lie between them. Together they cover a sixth and a third, half the road, each hour, so they need 5/6 ÷ 1/2 = 5/3 hours, 1 hour 40 minutes, and meet at 10:40."
skills:
  primary: ["time-clocks"]
band: "grades-5-6"
difficulty: 5
