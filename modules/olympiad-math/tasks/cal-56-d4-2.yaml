solution:
  - text: "5 June moves 1 day on from one year to the next, or 2 days when the February in between has 29 days, as in 2028, 2032 and 2036. Friday in 2026 becomes Saturday in 2027, Monday in 2028, then Tuesday, Wednesday and Thursday in 2031, Saturday in 2032, then Sunday, Monday and Tuesday in 2035, Thursday in 2036 and Friday in 2037."
