id: "kl-34-d5-4"
statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. A traveller asks Ann: 'Are you a knight or a liar?' Ann answers, but the traveller does not hear her. Ben says: 'Ann said that she is a liar.' Kim says: 'Ben is lying.' Who are Ben and Kim?"
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Ann answered a traveller's question 'Are you a knight or a liar?', but he did not hear her.", "Ben says: 'Ann said that she is a liar.'", "Kim says: 'Ben is lying.'"]
unknown: "Who Ben and Kim are."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["Ben is a liar, Kim is a knight", "Both are knights", "Both are liars", "Ben is a knight, Kim is a liar", "It is impossible to tell"]
        check:
          kind: "choice"
          key: "Ben is a liar, Kim is a knight"
          trap_values:
            - value: "Both are knights"
              trap: "trusted-statement"
              text: "Can anyone on the island say 'I am a liar'?"
            - value: "Both are liars"
              trap: "ignored-condition"
              text: "Check Ben's words first, then Kim's."
            - value: "Ben is a knight, Kim is a liar"
              trap: "trusted-statement"
              text: "You believed Ben. Can anyone on the island say 'I am a liar'?"
