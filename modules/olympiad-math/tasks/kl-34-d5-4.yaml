    simpler_case: "Try one islander who says: 'I once said that I am a liar.' Can he be a knight?"
solution:
  - text: "Nobody on the island can say 'I am a liar': a knight would be lying and a liar would be telling the truth. So Ann said 'I am a knight', and Ben's words are false: Ben is a liar. Then Kim's words 'Ben is lying' are true, so Kim is a knight."
