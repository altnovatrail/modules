id: "cube-12-d4-1"
statement:
  - text: "The net in the picture is folded into a die. Opposite faces of a die add up to 7. Which number goes on the empty face?"
  - picture: "pictures/cube-12-d4-1.png"
    alt: "A net of six squares: a column of four, with 1, 3 and 6 in the top three and the bottom one empty, and a square on each side of the second one: 2 on its left and 5 on its right."
    width: 168
    height: 208
givens: ["The net is folded into a die.", "Opposite faces of a die add up to 7."]
unknown: "The number for the empty face."
