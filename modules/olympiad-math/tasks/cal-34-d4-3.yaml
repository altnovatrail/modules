id: "cal-34-d4-3"
statement:
  - text: "A month has 5 Fridays and 5 Saturdays, but only 4 Thursdays and 4 Sundays. What day of the week is the 1st of this month?"
givens: ["The month has 5 Fridays and 5 Saturdays.", "It has only 4 Thursdays and 4 Sundays."]
unknown: "The day of the week of the 1st."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["Thursday", "Saturday", "Sunday", "Friday", "Monday"]
        check:
          kind: "choice"
          key: "Friday"
          trap_values:
            - value: "Thursday"
              trap: "ignored-condition"
              text: "If the 1st were a Thursday, there would be 5 Thursdays."
