    simpler_case: "Try a month of 29 days that starts on a Tuesday. Which day of the week appears 5 times?"
solution:
  - text: "A month is 4 full weeks plus 0 to 3 extra days, and only the days of the week of the extra days appear 5 times. Here only Friday and Saturday appear 5 times, so the month has 30 days and starts on a Friday."
