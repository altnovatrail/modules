statement:
  - text: "Tom and Ann walk at steady speeds. In the time Tom walks 3 km, Ann walks 2 km. How far has Ann walked when Tom has walked 12 km?"
givens: ["Tom and Ann walk at steady speeds.", "While Tom walks 3 km, Ann walks 2 km."]
