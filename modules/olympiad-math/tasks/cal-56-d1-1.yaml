  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["31 December", "23 December", "5 December", "14 December", "26 December"]
        check:
          kind: "choice"
          key: "23 December"
          trap_values:
            - value: "31 December"
              trap: "ignored-condition"
              text: "31 December is the last day of the year, but its digits add up to 3 + 1 + 1 + 2 = 7, not 8."
            - value: "5 December"
              trap: "reversed-relation"
              text: "5 December is the first date of December whose digits add up to 8. The question asks for the last."
            - value: "14 December"
              trap: "stopped-early"
              text: "The digits of 14 December do add up to 8, but a later date of December works too."
            - value: "26 December"
              trap: "ignored-condition"
              text: "26 makes 2 + 6 = 8 from the day alone, but the digits of the month count too: 2 + 6 + 1 + 2 = 11."
    simpler_case: "Try only the dates of January 2024. Which is the last one whose digits add up to 8?"
solution:
  - text: "The digits of 2024 add up to 8, and those of December to 1 + 2 = 3, so the digits of the day must add up to 5. Going back from 31 December, the first such day is the 23rd, since 2 + 3 = 5. So the last date is 23 December."
