              trap: "ignored-condition"
              text: "You do not need all 12 balls."
    simpler_case: "Try a box with 1 red and 2 blue balls first. How many balls make sure of both colours?"
solution:
  - text: "The unlucky case: all 5 green and all 4 blue balls come first, 9 balls with no red. The 10th ball must be red. So 10 balls are needed."
