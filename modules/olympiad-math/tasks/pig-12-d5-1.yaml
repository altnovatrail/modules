id: "pig-12-d5-1"
statement:
  - text: "A box has 3 red, 4 blue and 5 green balls. Without looking, how many balls must you take to be sure to have at least one ball of each colour?"
givens: ["The box has 3 red, 4 blue and 5 green balls.", "You take balls out without looking."]
unknown: "How many balls you must take to be sure of one ball of each colour."
