id: "kl-34-d4-5"
statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Six islanders sit at a round table. Each of them says: 'My neighbour on the right is a knight, and my neighbour on the left is a liar.' How many knights are at the table?"
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Six islanders sit at a round table.", "Each says: 'My neighbour on the right is a knight, and my neighbour on the left is a liar.'"]
unknown: "How many knights are at the table."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "0"
          units: ["knight", "knights"]
          trap_values:
            - value: "1"
              trap: "stopped-early"
              text: "A knight's right neighbour is a knight too, so there cannot be just one knight."
            - value: "2"
              trap: "stopped-early"
              text: "Follow a knight's right neighbour round the table."
            - value: "3"
              trap: "ignored-condition"
              text: "Knights and liars cannot take turns: a knight's right neighbour must be a knight."
            - value: "6"
              trap: "ignored-condition"
              text: "If all were knights, nobody would have a liar on the left."
    simpler_case: "Try two islanders at a table, each saying 'My neighbour is a knight.' Can you tell how many knights there are?"
solution:
  - text: "If someone were a knight, the person on his right would be a knight too, and so would the next one, all the way round the table. Then everyone would be a knight, and nobody would have a liar on the left. So there are no knights. If all are liars, every sentence is false, which fits."
