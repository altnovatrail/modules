id: "ord-56-d5-3"
statement:
  - text: "Six children compared their heights in pairs and wrote down what they found. Ann is taller than Dan. Dan is taller than Ben and taller than Eve. Kim is shorter than Ben and shorter than Eve. Fay is shorter than Kim. Which two children cannot be put in order of height from these results?"
givens: ["Ann is taller than Dan.", "Dan is taller than Ben and taller than Eve.", "Kim is shorter than Ben and shorter than Eve.", "Fay is shorter than Kim."]
unknown: "Which two children cannot be put in order of height."
leading_question: "Draw an arrow from each child to each child known to be shorter. Which two are joined by no chain of arrows?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["Dan and Kim", "Ann and Fay", "Eve and Fay", "None: all six can be put in order", "Ben and Eve"]
        check:
          kind: "choice"
          key: "Ben and Eve"
          trap_values:
            - value: "Dan and Kim"
              trap: "stopped-early"
              text: "Dan and Kim were never compared, but Dan is taller than Ben, and Ben is taller than Kim."
            - value: "Ann and Fay"
              trap: "stopped-early"
              text: "Ann and Fay were never compared, but Ann is taller than Dan, Dan than Ben, Ben than Kim and Kim than Fay, so Ann is taller."
            - value: "Eve and Fay"
              trap: "reversed-relation"
              text: "Eve and Fay would be left unknown if Kim were taller than Eve, but Kim is shorter than Eve, so Eve is taller than Fay."
            - value: "None: all six can be put in order"
              trap: "missed-case"
              text: "Look for two children whom no chain of results compares."
    simpler_case: "Try four children: Ann is taller than Dan, and Dan is taller than Ben and taller than Kim. Which two cannot be put in order?"
solution:
  - text: "Ann is taller than Dan, Dan taller than Ben and Eve, Ben and Eve taller than Kim, and Kim taller than Fay. So Ann is the tallest, then Dan, and Kim and Fay are the two shortest. Ben and Eve both stand between Dan and Kim, but no result compares the two of them, directly or through anyone else. So Ben and Eve cannot be put in order."
skills:
  primary: ["logic-ordering"]
band: "grades-5-6"
difficulty: 5
