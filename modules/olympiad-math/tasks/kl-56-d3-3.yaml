id: "kl-56-d3-3"
statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Olly says: 'Rex and I are both knights or both liars.' Pam says: 'One of Olly and Sue is a knight and the other is a liar.' Rex says: 'At least one of Pam and Sue is a knight.' Sue says: 'Exactly three of us four are knights.' Who is certainly a knight?"
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Olly says: 'Rex and I are both knights or both liars.'", "Pam says: 'One of Olly and Sue is a knight and the other is a liar.'", "Rex says: 'At least one of Pam and Sue is a knight.'", "Sue says: 'Exactly three of us four are knights.'"]
unknown: "Who is certainly a knight."
leading_question: "Whatever Olly is, what can you say about Rex? Then try Sue as a liar."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["Olly, Rex and Sue", "Rex and Sue", "It is impossible to tell", "All four", "Only Rex"]
        check:
          kind: "choice"
          key: "Rex and Sue"
          trap_values:
            - value: "Olly, Rex and Sue"
              trap: "stopped-early"
              text: "That is one mix that fits, but another fits too, so not all three are certain."
            - value: "It is impossible to tell"
              trap: "answered-other-question"
              text: "Not everyone can be told, but some are knights in every mix that fits."
            - value: "All four"
              trap: "trusted-statement"
              text: "Believing everyone fails: Pam says Olly and Sue are one knight and one liar."
            - value: "Only Rex"
              trap: "ignored-condition"
              text: "Check every islander, not only Rex."
    simpler_case: "Try two: Pam says 'Sue is a liar', and Sue says '2 + 2 = 4.' Who is certainly a knight?"
solution:
  - text: "If Olly is a knight, Rex is like him, a knight. If Olly lies, Rex is not like him, so again Rex is a knight. So Rex's words are true: Pam or Sue is a knight. If Sue lied, Pam would be a knight, and Pam's words would make Olly a knight: three knights, just as Sue said, so Sue would be telling the truth. So Sue is a knight, and there are exactly three knights. Olly and Pam are one knight and one liar, and either can be which. Only Rex and Sue are certainly knights."
