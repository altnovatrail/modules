id: "par-12-d4-1"
statement:
  - text: "Beads on a string go red, red, blue, red, red, blue, and so on. What colour is the 20th bead?"
givens: ["The beads go red, red, blue, red, red, blue, and so on."]
unknown: "The colour of the 20th bead."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "choice"
          key: "red"
          options: ["blue", "green", "red or blue", "It is impossible to tell", "red"]
          trap_values:
            - value: "blue"
              trap: "off-by-one"
              text: "The blue beads are the 3rd, 6th, ..., 18th and 21st."
            - value: "green"
              trap: "ignored-condition"
              text: "The string has only two colours, and green is not one of them."
            - value: "red or blue"
              trap: "stopped-early"
              text: "The pattern tells exactly which colour each bead has. Draw the beads in groups of three."
            - value: "It is impossible to tell"
              trap: "ignored-condition"
              text: "The pattern is fixed, so the colour of any bead can be worked out."
    simpler_case: "Try the 7th bead first. Draw the beads in groups of three."
solution:
  - text: "The pattern repeats every 3 beads. The 18th bead ends a group, so the 19th and 20th beads are the first two of a new group: red, red."
