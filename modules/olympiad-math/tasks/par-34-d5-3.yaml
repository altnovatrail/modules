    simpler_case: "Try 1, 2, 4 and 5 with plus or minus between them. Which results can you get?"
solution:
  - text: "1 + 2 + ... + 9 = 45 is odd, and turning a plus into a minus takes that number away twice, so the result is always odd. Only 3 is odd, and it works: 1 + 2 + 3 - 4 + 5 + 6 + 7 - 8 - 9 = 3."
