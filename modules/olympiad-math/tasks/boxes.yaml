id: boxes
template:
  parameters:
    items: {from: 9, to: 15}
    boxes: {from: 3, to: 4}
  derived:
    under: (items - 1) // boxes
    under_total: boxes * ((items - 1) // boxes)
    spread: items - boxes
  constraint: (items - 1) // boxes >= 2 and (items + boxes - 1) // boxes != boxes and (items - 1) // boxes != boxes and items - boxes != boxes and items - boxes != (items + boxes - 1) // boxes
  solver:
    program: |
      # For "at least how many in the fullest box": try every way to share the items
      # out among the boxes, and the answer is the fullest box of the most even way.
      # That is ITEMS + 1 to the power BOXES ways to try, so keep the numbers small.

      def total(values):
          # The dialect of the format has no sum, so add them up.
          result = 0
          for value in values:
              result += value
          return result

      def solve(numbers):
          items, boxes = numbers["items"], numbers["boxes"]
          ways = 1
          for _ in range(boxes):
              ways *= items + 1
          fullest = items
          counts = [0] * boxes
          for _ in range(ways):
              if total(counts) == items:
                  fullest = min(fullest, max(counts))
              for place in range(boxes):  # the next way, as an odometer turns
                  if counts[place] < items:
                      counts[place] += 1
                      break
                  counts[place] = 0
          return {"fullest": fullest}
    results: [fullest]
statement:
  - text: "{items} children sit on {boxes} benches. At least how many children must sit on the bench with the most children?"
givens:
  - "{items} children sit on {boxes} benches."
unknown: At least how many children sit on the bench with the most children.
canvas:
  kind: handwriting_sheet
  grid: squares
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "{fullest}"
          units: [child, children]
          trap_values:
            - value: "{under}"
              trap: best-case-not-worst
              text: "{boxes} benches with {under} children each hold only {under_total} children."
            - value: "{boxes}"
              trap: number-from-text
              text: That is the number of benches.
            - value: "{items}"
              trap: number-from-text
              text: That is the number of children.
            - value: "{spread}"
              trap: ignored-condition
              text: The children can spread out more evenly over the benches. Try to fill the fullest bench as little as you can.
    simpler_case: Try one more child than there are benches. How few can the fullest bench have?
solution:
  - text: If each bench had at most {under} children, only {under_total} children would fit. There are {items}, so some bench has at least {fullest}.
techniques: [pigeonhole]
leak_phrases: ["at least {fullest}"]
skills:
  primary: [pigeonhole-basic]
band: grades-1-2
difficulty: 3
