id: "div-56-d1-2"
statement:
  - text: "Five whole numbers in a row, such as 8, 9, 10, 11 and 12, always hold a number that divides by 2. They also hold one that divides by 3. What is the largest number sure to divide one of any five whole numbers in a row?"
givens: ["Five whole numbers in a row always hold one that divides by 2, and one that divides by 3."]
unknown: "The largest number sure to divide one of any five whole numbers in a row."
leading_question: "Try five numbers in a row that start at 7. Which of them divides by 6?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "5"
          trap_values:
            - value: "6"
              trap: "off-by-one"
              text: "6 needs six numbers in a row to be sure. Five numbers such as 7, 8, 9, 10 and 11 hold no multiple of 6."
            - value: "4"
              trap: "missed-case"
              text: "4 is sure to divide one of them, but a larger number is too."
            - value: "12"
              trap: "number-from-text"
              text: "12 is one of the numbers in the example, not a number that divides one of any five in a row."
            - value: "20"
              trap: "wrong-operation"
              text: "20 is too big: some five numbers in a row hold no multiple of it."
    simpler_case: "Try three whole numbers in a row. What is the largest number sure to divide one of them?"
solution:
  - text: "Five numbers in a row leave five different remainders when divided by 5, so one of them leaves none: it divides by 5. But 7, 8, 9, 10 and 11 hold no multiple of 6, and 1, 2, 3, 4 and 5 hold no multiple of any number larger than 5. So the answer is 5."
