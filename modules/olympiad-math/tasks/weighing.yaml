id: weighing
template:
  parameters:
    coins: {from: 10, to: 27}
  derived:
    pairs: coins // 2
    real: coins - 1
  solver:
    program: |
      # For the fewest weighings on a balance without weights: fill in the answer for
      # every number of coins from the bottom up, because a function may not call
      # itself here. Putting k coins on each pan leaves the fake among the k on the
      # pan that rises, or among the rest when the pans balance.

      def solve(numbers):
          coins = numbers["coins"]
          best = {0: 0, 1: 0}  # weighings that find the fake among that many coins
          for count in range(2, coins + 1):
              best[count] = min([1 + max([best[k], best[count - 2 * k]]) for k in range(1, count // 2 + 1)])
          return {"weighings": best[coins]}
    results: [weighings]
statement:
  - text: There are {coins} coins that look the same. One of them is fake and lighter than the others; all real coins weigh the same. What is the smallest number of weighings on a balance without weights that is sure to find the fake coin?
givens:
  - There are {coins} coins that look the same, and one of them is a lighter fake.
  - The real coins all weigh the same, and the balance has no weights.
unknown: The smallest number of weighings that is sure to find the fake.
canvas:
  kind: handwriting_sheet
  grid: squares
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "{weighings}"
          units: [weighing, weighings]
          trap_values:
            - value: "2"
              trap: stopped-early
              text: "2 weighings have only 9 outcomes, but there are {coins} coins."
            - value: "4"
              trap: off-by-one
              text: Count the weighings again in the worst case.
            - value: "{pairs}"
              trap: wrong-operation
              text: Weighing in pairs is slow; try bigger groups.
            - value: "{real}"
              trap: answered-other-question
              text: That is how many coins are real.
    simpler_case: Try two coins with one lighter fake. How many weighings find it?
solution:
  - text: Split the coins into three groups as equal as can be, and weigh two of them. The fake is in the lighter group, or in the third one when the pans balance. Do the same with that group.
  - text: Each weighing has 3 outcomes, so 2 weighings tell apart only 9 coins, and {weighings} weighings are needed for {coins}.
leak_phrases: ["{weighings} weighings"]
skills:
  primary: [algorithms-weighing-pouring]
band: grades-3-4
difficulty: 4
