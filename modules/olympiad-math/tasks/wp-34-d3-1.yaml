id: "wp-34-d3-1"
statement:
  - text: "A bucket holds 8 litres of water. There are two empty jugs of 5 litres and 3 litres. There is no tap, and no water may be poured away. Each step is pouring from one container into another until the first is empty or the second is full. What is the smallest number of steps needed to have exactly 4 litres in one of the containers?"
  - picture: "pictures/wp-34-d3-1.png"
    alt: "A full 8-litre bucket, an empty 5-litre jug and an empty 3-litre jug."
    width: 272
    height: 161
givens: ["An 8-litre bucket is full, and jugs of 5 and 3 litres are empty.", "There is no tap, and no water may be poured away.", "A step pours from one container into another until the first is empty or the second is full."]
unknown: "The smallest number of steps to have exactly 4 litres in one container."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "6"
          units: ["step", "steps"]
          trap_values:
            - value: "4"
              trap: "stopped-early"
              text: "4 steps are not enough."
            - value: "5"
              trap: "off-by-one"
              text: "Count the pourings again."
            - value: "7"
              trap: "answered-other-question"
              text: "One container with 4 litres is enough; look for a shorter way."
    simpler_case: "Try having exactly 3 litres in the bucket. How many steps does it take?"
solution:
  - text: "Write the litres in the bucket, the 5-litre jug and the 3-litre jug. One shortest way: (8, 0, 0), (3, 5, 0), (3, 2, 3), (6, 2, 0), (6, 0, 2), (1, 5, 2), (1, 4, 3). After 6 steps the 5-litre jug holds 4 litres."
  - picture: "pictures/wp-34-d3-1-solution.png"
    alt: "A table of the litres in the 8-, 5- and 3-litre containers after each step: 8, 0, 0; 3, 5, 0; 3, 2, 3; 6, 2, 0; 6, 0, 2; 1, 5, 2; 1, 4, 3."
    width: 132
    height: 248
