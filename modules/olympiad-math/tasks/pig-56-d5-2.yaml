id: "pig-56-d5-2"
statement:
  - text: "20 birds fly into a photo studio: 9 sparrows, 6 robins and 5 finches. Each time the photographer takes a picture, one of the birds flies away for good. At most how many pictures can be taken to be sure that at least 4 birds of one kind and 3 of another stay?"
givens: ["20 birds fly in: 9 sparrows, 6 robins and 5 finches.", "With each picture, one bird flies away for good.", "At least 4 birds of one kind and 3 of another must stay."]
unknown: "At most how many pictures can be taken to be sure of it."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "6"
          units: ["picture", "pictures"]
          trap_values:
            - value: "8"
              trap: "wrong-operation"
              text: "8 keeps 4 × 3 = 12 birds, but the birds needed are 4 of one kind and 3 of another, 4 + 3 of them, and the worst case needs more than that."
            - value: "13"
              trap: "best-case-not-worst"
              text: "13 pictures leave 7 birds, which could be 4 of one kind and 3 of another, but only if the right birds fly away."
            - value: "7"
              trap: "off-by-one"
              text: "After 7 pictures 13 birds stay, and they could be 9 sparrows, 2 robins and 2 finches, with no 3 of a second kind."
            - value: "14"
              trap: "answered-other-question"
              text: "14 is how many birds must stay, not how many pictures can be taken."
    simpler_case: "Try 6 birds, 3 sparrows and 3 robins, where 2 of one kind must stay. At most how many can fly away?"
solution:
  - text: "In the worst case the robins and the finches fly away first, until 2 of each are left: then 9 sparrows, 2 robins and 2 finches, 13 birds, have no 3 of a second kind. But 14 birds always have 4 of one kind and 3 of another: with no kind of 4, at most 3 + 3 + 3 = 9 birds stay, and with only one kind of 3 or more, at most 9 + 2 + 2 = 13. So the photographer is sure while 14 birds stay, and can take 20 − 14 = 6 pictures."
techniques: ["pigeonhole"]
leak_phrases: ["6 pictures", "six pictures"]
skills:
  primary: ["pigeonhole-basic"]
band: "grades-5-6"
difficulty: 5
