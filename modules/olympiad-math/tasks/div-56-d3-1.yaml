id: "div-56-d3-1"
statement:
  - text: "The seats in a hall are numbered row by row, with 18 seats in each row. Row 1 has seats 1 to 18, row 2 has seats 19 to 36, and so on. In which row is seat 97?"
  - picture: "pictures/div-56-d3-1.png"
    alt: "A table of the seats: row 1 has seats 1 to 18, row 2 seats 19 to 36, and a row marked ? holds seat 97."
    width: 240
    height: 136
givens: ["Each row has 18 seats, numbered row by row.", "Row 1 has seats 1 to 18, row 2 seats 19 to 36, and so on."]
unknown: "The row of seat 97."
leading_question: "How many full rows come before seat 97?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "6"
          trap_values:
            - value: "5"
              trap: "off-by-one"
              text: "5 counts only the full rows before seat 97."
            - value: "7"
              trap: "remainder-vs-quotient"
              text: "7 is where seat 97 is within its row, what is left over after the full rows."
            - value: "18"
              trap: "number-from-text"
              text: "18 is the number of seats in a row, copied from the question."
            - value: "90"
              trap: "answered-other-question"
              text: "90 is the number of a seat, not of a row."
    simpler_case: "Try rows of 10 seats. In which row is seat 35?"
solution:
  - text: "97 = 5 × 18 + 7, so 5 full rows end at seat 90, and seat 97 is the 7th seat of the next row, row 6."
  - text: "90 ÷ 18 + 1 = 6"
  - picture: "pictures/div-56-d3-1-solution.png"
    alt: "The table on to row 6: row 5 ends at seat 90, and row 6 holds seats 91 to 108, seat 97 among them."
    width: 242
    height: 164
skills:
  primary: ["number-divisibility"]
  supporting: ["core.division-with-remainder"]
band: "grades-5-6"
difficulty: 3
