id: "enum-12-d3-1"
statement:
  - text: "Five friends want to talk on the phone. Every two of them talk to each other once. How many phone calls are there?"
givens: ["There are five friends.", "Every two of them talk to each other once."]
unknown: "How many phone calls there are."
canvas:
