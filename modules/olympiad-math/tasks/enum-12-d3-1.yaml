              trap: "wrong-operation"
              text: "You multiplied 5 by 5. Nobody calls themselves."
    simpler_case: "Try three friends first. How many calls do they make?"
solution:
  - text: "The first friend calls 4 others, the second 3 new ones, the third 2, the fourth 1. 4 + 3 + 2 + 1 = 10."
