id: "enum-12-d5-2"
statement:
  - text: "Dima has 3 shirts and 3 pairs of trousers. The red shirt must not be worn with the green trousers. How many different outfits of one shirt and one pair of trousers can he wear?"
givens: ["Dima has 3 shirts and 3 pairs of trousers.", "The red shirt must not be worn with the green trousers."]
unknown: "How many different outfits of one shirt and one pair of trousers he can wear."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "8"
          units: ["outfit", "outfits"]
          trap_values:
            - value: "5"
              trap: "wrong-operation"
              text: "You added 3 and 3 and took 1 away. Each shirt goes with each pair of trousers."
            - value: "6"
              trap: "wrong-operation"
              text: "You added 3 and 3. Each shirt goes with each pair of trousers."
            - value: "7"
              trap: "off-by-one"
              text: "Only one outfit is not allowed, not two."
