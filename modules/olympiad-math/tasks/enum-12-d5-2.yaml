    simpler_case: "Try 2 shirts and 2 pairs of trousers first, with no rule. How many outfits are there?"
solution:
  - text: "3 shirts with 3 pairs of trousers make 9 outfits. One of them, the red shirt with the green trousers, is not allowed: 9 - 1 = 8."
