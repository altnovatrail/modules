id: "fig-56-d3-1"
statement:
  - text: "How many triangles can you find in the figure in the picture? Count every triangle, small or big, whose sides are lines of the figure."
  - picture: "pictures/fig-56-d3-1.png"
    alt: "A right triangle with its right angle at the top left. From the middle of its left side a line runs across to the long side, and from the middle of its top side a line runs down to the long side, where the two meet. A line also runs from the right-angle corner to the middle of the long side."
    width: 208
    height: 208
givens: ["Triangles of any size whose sides are lines of the figure are counted."]
unknown: "How many triangles there are."
leading_question: "How many small triangles are there, and which of them join into bigger ones?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "7"
          units: ["triangle", "triangles"]
          trap_values:
            - value: "5"
              trap: "missed-case"
              text: "Triangles of two pieces count too."
            - value: "4"
              trap: "stopped-early"
              text: "Only the smallest triangles were counted."
            - value: "6"
              trap: "missed-case"
              text: "Triangles of other sizes count too."
            - value: "9"
              trap: "double-count"
              text: "Some triangles were counted twice."
    simpler_case: "Try a triangle with one line from a corner to the middle of the opposite side. How many triangles are there?"
solution:
  - text: "The lines cut the big triangle into 4 small triangles. The line from the corner has a bigger triangle on each side of it, each made of two small ones, and the whole figure is one more. So there are 4 + 2 + 1 = 7 triangles."
  - text: "4 + 2 + 1 = 7"
  - picture: "pictures/fig-56-d3-1-solution.png"
    alt: "The small triangles numbered."
    width: 208
    height: 208
