statement:
  - text: "There are five sisters: Amy, Beth, Cleo, Dora and Gwen. Amy is older than exactly one of the others. Beth is younger than exactly one of the others. Cleo is older than Amy but younger than Gwen. Who is the eldest?"
givens: ["Amy, Beth, Cleo, Dora and Gwen are sisters.", "Amy is older than exactly one of the others.", "Beth is younger than exactly one of the others.", "Cleo is older than Amy but younger than Gwen."]
unknown: "Who is the eldest."
