    simpler_case: "Try three sisters, Amy, Beth and Cleo: Amy is older than exactly one of the others, and Cleo older than Amy. Who is the eldest?"
solution:
  - text: "Only one sister is younger than Amy, so Amy is 4th from the eldest. Only one sister is older than Beth, so Beth is 2nd. That leaves places 1, 3 and 5. Cleo is older than Amy and Gwen is older than Cleo, so Gwen is 1st, Cleo 3rd and Dora 5th. Gwen is the eldest."
