  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "choice"
          notation: "word"
          key: "Gwen"
          options: ["Cleo", "Beth", "Gwen", "Dora", "It is impossible to tell"]
          trap_values:
            - value: "Cleo"
              trap: "ignored-condition"
              text: "Cleo is younger than one of the sisters, so she cannot be the eldest."
            - value: "Beth"
              trap: "off-by-one"
