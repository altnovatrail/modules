# Its capitals YEARS_ON, BEN_THEN and OLDER_BY are the numbers that the statement shows. The trap
# values are derived numbers, the mistakes of the reference task, and the constraint keeps the key
# and Ben's age now apart from them and from the numbers that the statement shows.
