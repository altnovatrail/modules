id: "cal-56-d5-3"
statement:
  - text: "On a planet, a year has 366 days. It is split into months of 29, 30 and 31 days, with at least one month of each length. How many months does the year have?"
givens: ["A year has 366 days.", "Its months have 29, 30 and 31 days, with at least one month of each length."]
unknown: "How many months the year has."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "12"
          units: ["month", "months"]
          trap_values:
            - value: "13"
              trap: "ignored-condition"
              text: "13 months make at least 13 × 29 = 377 days, even if all of them are short, more than 366."
            - value: "11"
              trap: "ignored-condition"
              text: "11 months make at most 11 × 31 = 341 days, even if all of them are long, fewer than 366."
    simpler_case: "Try a year of 92 days, split into months of 30 and 31 days. How many months does it have?"
solution:
  - text: "Give every month 30 days first: n months make 30n days. Each 29-day month takes a day away, each 31-day month adds one, and a 30-day month changes nothing, so the year is less than n days away from 30n. Only 12 months come that close to 366: 11 months make at most 341 days, and 13 at least 377. So the year has 12 months, for example one of 29 days, four of 30 and seven of 31."
