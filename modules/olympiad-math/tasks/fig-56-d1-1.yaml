id: "fig-56-d1-1"
statement:
  - text: "The picture shows a rectangle of squared paper with all its lines. How many squares of every size can be found on its lines?"
  - picture: "pictures/fig-56-d1-1.png"
    alt: "A rectangle of squared paper four cells wide and three cells high, with all its lines."
    width: 208
    height: 168
givens: ["The rectangle of squared paper is drawn with all its lines."]
unknown: "How many squares of every size can be found on its lines."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "20"
          units: ["square", "squares"]
          trap_values:
            - value: "12"
              trap: "missed-case"
              text: "Bigger squares count too."
            - value: "18"
              trap: "stopped-early"
              text: "The three by three squares were missed."
            - value: "14"
              trap: "missed-case"
              text: "The two by two squares were missed."
            - value: "24"
              trap: "double-count"
              text: "Some squares were counted twice."
    simpler_case: "Try a rectangle of 3 by 2 cells. How many squares of every size are there?"
solution:
  - text: "Squares of one cell: 4 in a row and 3 rows, 12. Squares of two by two: 3 in a row and 2 rows, 6. Squares of three by three: 2 in a row and 1 row, 2. So there are 12 + 6 + 2 = 20 squares."
  - text: "12 + 6 + 2 = 20"
  - picture: "pictures/fig-56-d1-1-solution.png"
    alt: "The counts of each size of square written in the top row."
    width: 208
    height: 168
