id: "grid-56-d3-5"
statement:
  - text: "The dashed line should be an axis of symmetry of the filled cells. What is the least number of cells you must fill?"
  - picture: "pictures/grid-56-d3-5.png"
    alt: "A square of four by four cells with a dashed line down the middle. Left of it, five cells are filled: the first and second cells of the top row, the first cell of the second row, the second cell of the third row and the first cell of the bottom row. The right half is empty."
    width: 208
    height: 208
givens: ["The dashed line should be an axis of symmetry of the filled cells."]
unknown: "The least number of cells you must fill."
leading_question: "Where is the mirror image of each filled cell in the dashed line?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "5"
          units: ["cell", "cells"]
          trap_values:
            - value: "10"
              trap: "answered-other-question"
              text: "10 is not the cells you must fill."
            - value: "4"
              trap: "missed-case"
              text: "Check the mirror image of every filled cell."
            - value: "6"
              trap: "off-by-one"
              text: "One mirror image was counted twice."
