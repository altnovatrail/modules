              trap: "stopped-early"
              text: "Not every cell's image was filled."
    simpler_case: "Try a 2 by 2 square with the top left cell filled and a dashed line down the middle. How many cells must you fill?"
solution:
  - text: "Each filled cell needs its mirror image in the dashed line filled too. None of the 5 images is filled yet, so 5 cells must be filled."
