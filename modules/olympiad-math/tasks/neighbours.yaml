# The numbers of reference task gaps-34-d4-4: told_steps 36, told_to 3, asked_from 3, asked_to 7.
# Its capitals TOLD_TO, TOLD_STEPS, ASKED_FROM and ASKED_TO are the numbers that the statement
# shows; TOLD_FROM stays 1, as in the reference task. The constraint keeps a flight of 10 to 18
# steps, a whole number of them; the trap values are derived numbers, the mistakes of the reference
# task, and the constraint keeps them whole and apart.
