id: fewest-moves
template:
  parameters:
    coins: {from: 5, to: 9}
    per_move: {from: 3, to: 7}
  constraint: coins % 2 == 1 and per_move % 2 == 1 and per_move < coins and coins % per_move != 0
  solver:
    program: |
      # For "the fewest moves" that turn, swap or flip things to reach a goal: a
      # breadth-first search over the states, nearest first, so the first time the
      # goal comes up is the fewest moves.

      def combinations_of(count, size):
          # The sets of size places among count, through every mask of the places.
          found = []
          for mask in range(1 << count):
              places = [place for place in range(count) if mask & (1 << place)]
              if len(places) == size:
                  found.append(places)
          return found

      def solve(numbers):
          coins, per_move = numbers["coins"], numbers["per_move"]
          start = tuple([1] * coins)  # 1 is heads, 0 is tails
          goal = tuple([0] * coins)
          choices = combinations_of(coins, per_move)
          moves = {start: 0}
          queue = [start]
          head = 0
          while head < len(queue):
              state = queue[head]
              head += 1
              if state == goal:
                  return {"moves": moves[state]}
              for chosen in choices:
                  turned = tuple([1 - side if place in chosen else side for place, side in enumerate(state)])
                  if turned not in moves:
                      moves[turned] = moves[state] + 1
                      queue.append(turned)
          fail("it can never be done")
    results: [moves]
statement:
  - text: "{coins} coins lie heads up. In one move you turn over exactly {per_move} coins. What is the smallest number of moves needed to make all {coins} coins tails up?"
givens:
  - "{coins} coins lie heads up."
  - In one move exactly {per_move} coins are turned over.
unknown: The smallest number of moves that makes all {coins} coins tails up.
canvas:
  kind: handwriting_sheet
  grid: squares
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "{moves}"
          units: [move, moves]
          trap_values:
            - value: "1"
              trap: ignored-condition
              text: One move turns only {per_move} of the {coins} coins.
            - value: "2"
              trap: wrong-parity
              text: After 2 moves some coin is turned an even number of times and is heads up again.
            - value: "{coins}"
              trap: stopped-early
              text: "{coins} moves would work too, but fewer moves are already enough."
    simpler_case: Try 4 coins heads up, with 1 coin turned in a move. How many moves does it take?
solution:
  - text: Every coin must be turned an odd number of times. Count the turns that the moves give, and see how few moves can give each coin an odd number.
  - text: The fewest moves are {moves}.
techniques: [parity]
traps: [wrong-parity]
leak_phrases: ["{moves} moves", "three moves"]
skills:
  primary: [parity-alternation]
band: grades-3-4
difficulty: 4
