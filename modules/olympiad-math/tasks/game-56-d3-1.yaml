              text: "One of the starts Mia wins from was missed."
    simpler_case: "Try stacks of 4, 5 and 6 cards with the same rules. For how many can Mia be sure to win?"
solution:
  - text: "Both moves remove an odd number of cards, so every move turns an even stack into an odd one and back. A player facing an even stack always leaves an odd one, so she can never leave 0 cards, and 0 is even. So even stacks lose and odd stacks win, and among the starts only 11 and 13 are odd."
