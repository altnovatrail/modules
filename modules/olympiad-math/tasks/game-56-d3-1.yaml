id: "game-56-d3-1"
statement:
  - text: "Mia and Tom play with a stack of cards. They take turns to remove 1 or 3 cards, and Mia goes first. Whoever removes the last card wins, and both play as well as they can. The stack may start with 10, 11, 12, 13 or 14 cards. For how many of these starts can Mia be sure to win?"
givens: ["A turn removes 1 or 3 cards, Mia first, and removing the last card wins.", "Both play as well as they can.", "The stack may start with 10, 11, 12, 13 or 14 cards."]
unknown: "For how many of these starts Mia can be sure to win."
