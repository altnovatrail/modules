id: long-way
template:
  parameters:
    first: {from: 20, to: 100}
  derived:
    first_1: first - 1
    first_2: first - 2
    first_3: first - 3
    pairs_less: first // 2 - 1
  constraint: first % 2 == 0
  solver:
    program: |
      # For a long sum or a long product: write it out as it stands and let the
      # computer do the whole of it; the shortcut a person would look for is not
      # needed to find the value, only to check it.

      def solve(numbers):
          total = 0
          for n in range(numbers["first"], 0, -1):
              total += n if n % 2 == 0 else -n  # even terms added, odd ones taken away
          return {"value": total}
    results: [value]
statement:
  - text: What is {first} - {first_1} + {first_2} - {first_3} + ... + 4 - 3 + 2 - 1?
givens:
  - The signs go minus, plus, minus and so on, from {first} down to 1.
unknown: The value of the expression.
canvas:
  kind: handwriting_sheet
  grid: squares
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "{value}"
          trap_values:
            - value: "0"
              trap: wrong-operation
              text: Each pair like {first} - {first_1} is 1, not 0.
            - value: "1"
              trap: stopped-early
              text: That is only one pair, {first} - {first_1}.
            - value: "{pairs_less}"
              trap: off-by-one
              text: Count the pairs again, two numbers in each pair.
            - value: "{first}"
              trap: number-from-text
              text: That is the first number.
    simpler_case: Try 6 - 5 + 4 - 3 + 2 - 1 first. Group the numbers in pairs.
solution:
  - text: Group in pairs, ({first} - {first_1}) + ({first_2} - {first_3}) + ... + (2 - 1). Each pair is 1, and the {first} numbers make {value} pairs, so the value is {value}.
leak_phrases: ["{value} pairs"]
skills:
  primary: [arithmetic-tricks]
band: grades-1-2
difficulty: 5
