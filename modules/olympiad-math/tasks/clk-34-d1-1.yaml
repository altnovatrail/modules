id: "clk-34-d1-1"
statement:
  - text: "A lesson starts at 10:55 and lasts 45 minutes. At what time does it end?"
  - picture: "pictures/clk-34-d1-1.png"
    alt: "A clock showing 10:55."
    width: 200
    height: 200
  - text: "Write the time as hours and minutes, like 9:15."
givens: ["The lesson starts at 10:55.", "It lasts 45 minutes."]
unknown: "The time when it ends."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "choice"
          key: "11:40"
          options: ["10:10", "10:100", "11:00", "11:40", "11:45"]
          trap_values:
            - value: "10:10"
              trap: "reversed-relation"
              text: "The lesson ends after it starts, so count forward."
            - value: "10:100"
              trap: "time-unit-mixup"
              text: "An hour has 60 minutes, so 10:100 is not a time."
            - value: "11:00"
              trap: "stopped-early"
              text: "11:00 is only 5 minutes after the start."
            - value: "11:45"
              trap: "wrong-operation"
              text: "11:45 is 50 minutes after 10:55."
    simpler_case: "Try a lesson of 15 minutes from 10:55. At what time does it end?"
solution:
  - text: "5 minutes after 10:55 it is 11:00. The other 40 minutes take it to 11:40."
skills:
  primary: ["time-clocks"]
band: "grades-3-4"
difficulty: 1
