id: "frac-56-d2-1"
statement:
  - text: "Two thirds of a number N is 24. What is three quarters of N?"
  - picture: "pictures/frac-56-d2-1.png"
    alt: "Two bars for N: the first cut into 3 parts, 2 of them shaded and braced as 24; the second cut into 4 parts, 3 of them shaded and braced as ?."
    width: 385
    height: 154
givens: ["Two thirds of a number N is 24."]
unknown: "Three quarters of N."
leading_question: "First find the whole number. How much is one third of it?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "27"
          trap_values:
            - value: "18"
              trap: "part-whole-swap"
              text: "18 is three quarters of 24, as if 24 were the whole number. It is only two thirds of it."
            - value: "36"
              trap: "stopped-early"
              text: "36 is not three quarters of N."
            - value: "16"
              trap: "wrong-operation"
              text: "16 takes two thirds of 24, but 24 already is the two thirds, so the number is bigger than 24, not smaller."
