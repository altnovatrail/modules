    simpler_case: "Try: half of a number is 10. What is a quarter of it?"
solution:
  - text: "Two thirds are 24, so one third is 12 and the whole number is 36. One quarter of 36 is 9, so three quarters are 27."
  - text: "36 ÷ 4 × 3 = 27"
