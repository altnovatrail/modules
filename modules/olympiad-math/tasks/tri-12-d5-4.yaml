id: "tri-12-d5-4"
statement:
  - text: "Masha had some sweets. She gave half of them to Ann, and then she gave 1 sweet to Ben. Now she has 4 sweets. How many sweets did Masha have at first?"
givens: ["Masha gave half of her sweets to Ann.", "Then she gave 1 sweet to Ben.", "Now she has 4 sweets."]
unknown: "How many sweets Masha had at first."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "10"
          units: ["sweet", "sweets"]
          trap_values:
            - value: "4"
              trap: "number-from-text"
              text: "4 is how many sweets Masha has now."
            - value: "5"
              trap: "stopped-early"
              text: "5 is how many she had before giving 1 to Ben; she also gave half away."
            - value: "8"
              trap: "ignored-condition"
              text: "8 forgets the sweet Masha gave to Ben."
            - value: "9"
              trap: "wrong-operation"
              text: "You undid the steps in the wrong order: 4 doubled, plus 1."
    simpler_case: "Try Masha giving half to Ann and then 1 to Ben, and having 2 left. How many did she have?"
solution:
  - text: "Before giving 1 sweet to Ben, Masha had 4 + 1 = 5. That is the half she kept, so at first she had 5 + 5 = 10."
