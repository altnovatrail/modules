id: split
template:
  parameters:
    total: {from: 60, to: 150}
  derived:
    part: total // 15
    ten_parts: "4 * total // 10"
    c_basket: "7 * total // 15"
    b_minus_a: "2 * total // 15"
  constraint: total % 30 == 0
  solver:
    program: |
      # For a quantity shared in a ratio: try every size of one part, make the
      # shares from it, keep the ones that fit what the question says, and answer
      # what it asks about the shares.

      ratio = [3, 5, 7]  # the ratio of the shares, in the order the question names them

      def solve(numbers):
          answers = set()
          for part in range(1, 1001):
              shares = [part * number for number in ratio]
              together = 0
              for share in shares:
                  together += share
              if together == numbers["total"]:
                  answers.add(shares[2] - shares[0])
          if len(answers) != 1:
              fail("the shares that fit give %d different answers" % len(answers))
          return {"more": list(answers)[0]}
    results: [more]
statement:
  - text: "Three baskets, A, B and C, hold {total} walnuts in the ratio 3 : 5 : 7. How many more walnuts are in basket C than in basket A?"
givens:
  - "Baskets A, B and C hold {total} walnuts in the ratio 3 : 5 : 7."
unknown: How many more walnuts are in C than in A.
canvas:
  kind: handwriting_sheet
  grid: squares
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "{more}"
          units: [walnut, walnuts]
          trap_values:
            - value: "{ten_parts}"
              trap: ratio-total-confusion
              text: That counts only the parts of A and C, 10 in all, but there are 15 parts.
            - value: "{c_basket}"
              trap: answered-other-question
              text: That is not how many more walnuts C has than A.
            - value: "4"
              trap: stopped-early
              text: That is not a number of walnuts.
            - value: "{b_minus_a}"
              trap: answered-other-question
              text: That is how many more are in B than in A, or in C than in B.
    simpler_case: "Try 30 walnuts in two baskets in the ratio 1 : 2. How many more are in the second basket?"
solution:
  - text: There are 3 + 5 + 7 = 15 equal parts, so each part is {total} ÷ 15 = {part} walnuts. Basket C has 7 - 3 = 4 parts more than basket A, which is {more} walnuts.
leak_phrases: ["{more} more walnuts"]
skills:
  primary: [ratio-sharing]
band: grades-5-6
difficulty: 3
