# A template of ratio-sharing (T37; R22): the solver of mathtrail-standalone
# content/solvers/ratio.sharing/split.star at 42b4408, made a solver of the template. It came from
# reference task ratio-56-d3-1, whose numbers are one of its instances.
# The numbers of reference task ratio-56-d3-1: total 90.
# The total of the baskets, which the reference task writes into fits, is the number that the
# statement shows and the template varies: a multiple of 30 from 60 to 150, so that a part of the
# ratio and the trap that takes 10 parts for 15 are whole; the ratio stays 3 : 5 : 7. standalone's sandbox
# gives it sum, which the dialect of the format has not (format/README.md, section 24), so a loop
# adds the shares. The reference task's picture is left out: one picture for every instance would
# show its 90 walnuts. The trap values are derived numbers, its mistakes, and the number 4.
