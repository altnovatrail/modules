              trap: "ignored-condition"
              text: "If all four lied, Tom's words 'Uma is lying' would be true."
    simpler_case: "Try two: Tom says 'Uma is lying', and Uma says '2 + 2 = 5.' Who are the knights?"
solution:
  - text: "If Val told the truth, Tom and Uma would both be lying. But Tom says Uma is lying, so Tom would be telling the truth. So Val is lying. Then Uma's words 'Val is lying' are true, and Uma is a knight. Tom calls Uma a liar, so Tom is lying. Of Tom, Uma and Val only Uma tells the truth, so Wes is right and a knight. The knights are Uma and Wes."
