id: "kl-56-d4-2"
statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Tom says: 'Uma is lying.' Uma says: 'Val is lying.' Val says: 'Tom and Uma are both lying.' Wes says: 'Exactly one of Tom, Uma and Val is telling the truth.' Who are the knights among the four?"
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Tom says: 'Uma is lying.'", "Uma says: 'Val is lying.'", "Val says: 'Tom and Uma are both lying.'", "Wes says: 'Exactly one of Tom, Uma and Val is telling the truth.'"]
unknown: "Who the knights are."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["Tom and Val", "Only Uma", "Uma and Wes", "Uma and Val", "Nobody"]
        check:
          kind: "choice"
          key: "Uma and Wes"
          trap_values:
            - value: "Tom and Val"
              trap: "trusted-statement"
              text: "Believing Tom makes Uma a liar and Val a knight, but Val's words say Tom is lying."
            - value: "Only Uma"
              trap: "stopped-early"
              text: "Check Wes's words too."
            - value: "Uma and Val"
              trap: "ignored-condition"
              text: "Uma says Val is lying, so if Uma is a knight, Val is a liar."
