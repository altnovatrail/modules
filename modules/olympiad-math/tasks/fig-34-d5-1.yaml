id: "fig-34-d5-1"
statement:
  - text: "Each line in the picture is a match. Count every square, small or big. How many matches are a side of two squares at once?"
  - picture: "pictures/fig-34-d5-1.png"
    alt: "Matches laid as a square of two by two small squares."
    width: 128
    height: 128
givens: ["Each line is a match, and squares of every size count."]
unknown: "How many matches are a side of two squares at once."
leading_question: "Is a match on the outside a side of the big square too?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "12"
          units: ["match", "matches"]
          trap_values:
            - value: "5"
              trap: "answered-other-question"
              text: "That is the number of squares."
            - value: "4"
              trap: "missed-case"
              text: "The big square has sides too."
            - value: "8"
              trap: "answered-other-question"
              text: "That is the matches round the outside."
            - value: "16"
              trap: "double-count"
              text: "Each match counts once."
    simpler_case: "Try a row of 2 squares of matches. How many matches are a side of two squares at once?"
solution:
  - text: "Each of the 4 inside matches is a side of two small squares. Each of the 8 outside matches is a side of one small square and of the big square. So all 4 + 8 = 12 matches are a side of two squares."
  - text: "4 + 8 = 12"
