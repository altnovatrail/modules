id: "grid-56-d2-4"
statement:
  - text: "The filled cells in the picture are a sheet of paper, and the lines drawn on it are cuts. Into how many pieces do the cuts split the sheet?"
  - picture: "pictures/grid-56-d2-4.png"
    alt: "A square sheet of four by four filled cells. One cut runs from top to bottom down the middle. Another cut runs from the left edge to the middle cut, halfway down."
    width: 208
    height: 208
givens: ["The filled cells are a sheet of paper.", "The lines drawn on it are cuts."]
unknown: "Into how many pieces the cuts split the sheet."
leading_question: "Which cells stay joined across a side that is not cut?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "3"
          units: ["piece", "pieces"]
          trap_values:
            - value: "4"
              trap: "off-by-one"
              text: "Check which cuts make new pieces."
            - value: "2"
              trap: "missed-case"
              text: "Look again for small pieces."
            - value: "8"
              trap: "answered-other-question"
              text: "That is the largest piece, in cells."
            - value: "16"
              trap: "answered-other-question"
              text: "That is the cells, not the pieces."
    simpler_case: "Try a sheet with one cut that runs from an edge only halfway in. Into how many pieces does it split?"
solution:
  - text: "The long cut splits the sheet into two halves of 8 cells, and the short cut splits the left half into two pieces of 4. So the cuts make 3 pieces: 4, 4 and 8 cells."
  - picture: "pictures/grid-56-d2-4-solution.png"
    alt: "The sheet with its pieces numbered: 1 in the top left quarter, 2 in the bottom left quarter, and 3 in the whole right half."
    width: 208
    height: 208
techniques: ["draw"]
skills:
  primary: ["geometry-grid"]
band: "grades-5-6"
difficulty: 2
