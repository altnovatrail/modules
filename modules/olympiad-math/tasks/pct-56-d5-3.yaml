id: "pct-56-d5-3"
statement:
  - text: "One coin buys a loaf of bread and a bottle of milk. After prices rise by 25%, the same coin buys only half a loaf and a bottle of milk. What part of the coin will the milk alone cost after prices rise by another 20%?"
  - text: "Write the part of the coin as a percentage, like 50%."
givens: ["One coin buys a loaf and a bottle of milk.", "After prices rise by 25%, it buys half a loaf and a bottle of milk.", "Then prices rise by another 20%."]
unknown: "The part of the coin the milk alone then costs."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "90"
          units: ["%"]
          trap_values:
            - value: "75"
              trap: "stopped-early"
              text: "75% is not the price after both rises."
            - value: "105"
              trap: "percent-wrong-base"
              text: "105% adds 25% and 20% of the whole coin. Each rise is a percentage of the price of the milk, not of the coin."
            - value: "87"
              trap: "wrong-operation"
              text: "87% adds the two rises as one rise of 45%. Each rise is a percentage of the price before it."
            - value: "60"
              trap: "answered-other-question"
              text: "60% is the price of the milk before any rise. The question asks after both rises."
    simpler_case: "Try: one coin buys a loaf and a bottle of milk, and the loaf costs as much as the milk. What percentage of the coin does the milk cost?"
solution:
  - text: "After the rise, half a loaf and the milk cost the whole coin, so before it they cost 1 ÷ 1.25 = 0.8 of the coin. A whole loaf and the milk cost the whole coin, so the other half of the loaf cost 0.2 and the milk 0.8 − 0.2 = 0.6. After both rises the milk costs 0.6 × 1.25 × 1.2 = 0.9 of the coin, which is 90%."
skills:
  primary: ["percent-basic"]
band: "grades-5-6"
difficulty: 5
