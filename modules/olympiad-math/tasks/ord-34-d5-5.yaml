    simpler_case: "Try four houses, green, yellow, blue and white: the yellow house is at the left end, the green one next to it, and the white one at the right end. What colour is the house second from the right?"
solution:
  - text: "Green is 2nd and white is 5th. Red is not next to white, so red is not 4th. Red is next to blue, so red cannot be 1st, because blue would then have to be 2nd. So red is 3rd, blue is 4th and yellow is 1st."
