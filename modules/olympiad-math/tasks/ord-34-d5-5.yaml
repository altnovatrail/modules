id: "ord-34-d5-5"
statement:
  - text: "Five houses in a row are painted red, blue, green, white and yellow. The green house is second from the left. The white house is at the right end and is not next to the red one. The yellow house is next to the green one. The red house is next to the blue one. What colour is the house in the middle?"
givens: ["Five houses in a row are red, blue, green, white and yellow.", "The green house is second from the left, and the yellow house next to it.", "The white house is at the right end and not next to the red one.", "The red house is next to the blue one."]
unknown: "The colour of the house in the middle."
