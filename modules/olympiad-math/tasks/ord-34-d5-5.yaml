  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "choice"
          notation: "word"
          key: "red"
          options: ["blue", "red", "green", "white", "yellow"]
          trap_values:
            - value: "blue"
              trap: "ignored-not"
              text: "With blue in the middle, check the fact about the white house."
            - value: "green"
              trap: "ignored-condition"
