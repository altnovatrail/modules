id: "game-56-d4-3"
statement:
  - text: "The number 12 is written on a board. Ivy and Paul take turns, and Ivy goes first. On each turn a player picks a divisor of the number on the board that is smaller than that number, and takes it away from the number. The number 1 counts as a divisor. A player who cannot move loses. Paul plays as well as he can. How many of Ivy's possible first moves let her be sure to win?"
givens: ["The number 12 is on the board, and Ivy goes first.", "A move takes away a divisor smaller than the number, 1 included.", "A player who cannot move loses, and Paul plays as well as he can."]
unknown: "How many of Ivy's first moves let her be sure to win."
leading_question: "Who wins when the board shows the smallest numbers? Go up one number at a time."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "2"
          units: ["move", "moves"]
          trap_values:
            - value: "5"
              trap: "first-move-assumed"
              text: "Not every move works: after some moves Paul has a good reply."
            - value: "3"
              trap: "wrong-parity"
              text: "3 counts the moves that leave an even number."
            - value: "1"
              trap: "missed-case"
              text: "One of the winning moves was missed."
            - value: "0"
              trap: "reversed-relation"
              text: "12 is a winning number, not a losing one."
    simpler_case: "Try the number 4 on the board. How many of Ivy's first moves let her be sure to win?"
solution:
  - text: "Odd numbers lose for the player to move. An odd number has only odd divisors, so any move leaves an even number, and from 1 there is no move at all. From an even number, taking away 1 leaves an odd one. So Ivy must leave an odd number: 12 - 1 = 11 or 12 - 3 = 9. That is 2 moves."
