id: "cube-56-d4-1"
statement:
  - text: "A sheet of paper is folded along the dashed lines in the order of their numbers. Each fold lays the part on the left over the part on the right, or the part above over the part below. Then a hole is punched through every layer at cell O. How many holes are there when the sheet is opened out?"
  - picture: "pictures/cube-56-d4-1.png"
    alt: "A square sheet of four by four cells. Dashed line 1 runs down the middle, dashed line 2 runs across the middle, and dashed line 3 runs down between the third and fourth columns. The bottom right cell is marked O."
    width: 208
    height: 208
givens: ["The sheet is folded along the dashed lines in the order of their numbers: left over right, or top over bottom.", "A hole is punched through every layer at cell O."]
unknown: "How many holes there are in the opened sheet."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "8"
          units: ["hole", "holes"]
          trap_values:
            - value: "16"
              trap: "answered-other-question"
              text: "That is all the cells of the sheet."
            - value: "4"
              trap: "stopped-early"
              text: "The third fold adds layers too."
            - value: "6"
              trap: "missed-case"
              text: "Count the layers at O after each fold."
            - value: "1"
              trap: "ignored-condition"
              text: "Every layer gets a hole."
    simpler_case: "Try a sheet folded in half once, with a hole punched through both layers. How many holes are there?"
solution:
  - text: "The first fold gives the right half 2 layers, and the second gives the bottom right quarter 4. The third fold lays the third column of that quarter over the fourth, so cell O has 4 + 4 = 8 layers. The opened sheet has 8 holes."
  - text: "4 + 4 = 8"
  - picture: "pictures/cube-56-d4-1-solution.png"
    alt: "The opened sheet with O in every cell that gets a hole."
    width: 208
    height: 208
