id: "enum-56-d5-3"
statement:
  - text: "Mia has 9 balls: 4 red, 3 blue and 2 green. Balls of one colour are all alike. She puts them into three bags, 3 balls in each, and the bags are all alike too. In how many different ways can she do it?"
givens: ["Mia has 4 red, 3 blue and 2 green balls; balls of one colour are alike.", "She puts them into three bags, 3 balls in each.", "The bags are alike too."]
unknown: "In how many different ways she can do it."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "9"
          units: ["way", "ways"]
          trap_values:
            - value: "280"
              trap: "ignored-condition"
              text: "280 counts the balls as all different, but balls of one colour are alike."
            - value: "12"
              trap: "double-count"
              text: "12 counts the two bags with a green ball in both orders, though the bags are alike."
            - value: "4"
              trap: "missed-case"
              text: "4 counts only the ways with both green balls in one bag. The 5 ways with the green balls in two bags are left out."
            - value: "45"
              trap: "ignored-condition"
              text: "45 counts the bags as different, but the bags are alike, so swapping the contents of two bags gives the same way."
    simpler_case: "Try 2 red and 2 blue balls in two bags of 2 balls each, the bags alike. In how many ways can it be done?"
solution:
  - text: "If both green balls share a bag, its third ball is red or blue. With a red one, the other 3 red and 3 blue balls fill the other two bags in 2 ways: red-red-red with blue-blue-blue, or red-red-blue with red-blue-blue. With a blue one, the 4 red and 2 blue balls left fill them in 2 ways too. If the green balls are in two bags, the bag without green holds red-red-red, red-red-blue, red-blue-blue or blue-blue-blue, and the other balls go with the green ones in 1, 2, 1 and 1 ways. So there are 2 + 2 + 5 = 9 ways."
techniques: ["systematic"]
leak_phrases: ["9 ways", "nine ways"]
skills:
  primary: ["combinatorics-enumeration"]
band: "grades-5-6"
difficulty: 5
