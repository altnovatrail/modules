              trap: "wrong-operation"
              text: "You multiplied 12 by 2. Find how many 2-metre pieces there are."
    simpler_case: "Try a log 4 metres long first. How many 2-metre pieces, and how many cuts?"
solution:
  - text: "12 metres make 6 pieces of 2 metres. 6 pieces need 5 cuts: the last piece is left over after the fifth cut."
