id: "frac-56-d3-2"
statement:
  - text: "A jug full of juice weighs 1500 g, jug and juice together. When only 1/3 of the juice is left in it, the jug weighs 700 g. How many grams of juice does the full jug hold?"
givens: ["The full jug weighs 1500 g.", "With 1/3 of the juice left in it, it weighs 700 g."]
unknown: "How many grams of juice the full jug holds."
leading_question: "What does the difference between 1500 g and 700 g weigh?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "1200"
          units: ["g", "gram", "grams"]
          trap_values:
            - value: "300"
              trap: "answered-other-question"
              text: "Find what the juice alone weighs."
            - value: "800"
              trap: "stopped-early"
              text: "800 g is only the juice that was drunk."
            - value: "1500"
              trap: "part-whole-swap"
              text: "1500 g is the jug and the juice together, and the jug itself is part of that weight."
            - value: "400"
              trap: "answered-other-question"
              text: "400 g is the juice still left in the jug, not all of it."
    simpler_case: "Try a jug that weighs 900 g full and 500 g with half of the juice left. How many grams of juice does it hold?"
solution:
  - text: "The difference, 1500 - 700 = 800 g, is the juice that was drunk, and that is 2/3 of the juice. So 1/3 of the juice weighs 400 g, and all of it weighs 1200 g."
skills:
  primary: ["fractions-parts"]
  supporting: ["core.fractions-of-a-whole"]
band: "grades-5-6"
difficulty: 3
