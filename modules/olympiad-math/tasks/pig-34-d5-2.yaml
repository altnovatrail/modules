id: "pig-34-d5-2"
statement:
  - text: "Each pupil in a group names a favourite day of the week. What is the smallest number of pupils in the group for which you can be sure that 4 of them name the same day?"
givens: ["Each pupil names a favourite day of the week.", "A week has 7 days."]
unknown: "The smallest number of pupils that makes you sure that 4 of them name the same day."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "22"
          units: ["pupil", "pupils"]
          trap_values:
            - value: "4"
              trap: "best-case-not-worst"
              text: "4 pupils can name 4 different days."
            - value: "21"
              trap: "stopped-early"
              text: "21 pupils can be 3 for each of the 7 days."
            - value: "28"
              trap: "wrong-operation"
              text: "You multiplied 7 by 4. Think of the unluckiest group: how many pupils can name days with no 4 alike?"
            - value: "29"
              trap: "wrong-operation"
              text: "7 × 4 + 1 is more than you need. Think again how many pupils can name days with no 4 alike."
    simpler_case: "Try to be sure of 2 pupils with the same day first. How many pupils does that take?"
solution:
  - text: "With 21 pupils, each of the 7 days could be named by exactly 3 pupils. With 22 pupils, some day is named by at least 4."
