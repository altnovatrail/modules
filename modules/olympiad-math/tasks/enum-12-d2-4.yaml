id: "enum-12-d2-4"
statement:
  - text: "Masha has one red, one blue and one green bead. She puts all three on a string in a row. How many different rows can she make?"
givens: ["Masha has one red, one blue and one green bead.", "She puts all three on a string in a row."]
unknown: "How many different rows she can make."
