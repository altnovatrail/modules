id: "fig-34-d3-1"
statement:
  - text: "How many triangles can you find in the figure in the picture? Count every triangle, small or big, whose sides are lines of the figure."
  - picture: "pictures/fig-34-d3-1.png"
    alt: "A rectangle twice as wide as it is high, with a line from its top left corner to its bottom right corner and an upright line down its middle."
    width: 208
    height: 128
givens: ["Triangles of any size whose sides are lines of the figure are counted."]
unknown: "How many triangles there are."
leading_question: "How many triangles does the long line make with the sides of the rectangle?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "4"
          units: ["triangle", "triangles"]
          trap_values:
            - value: "2"
              trap: "stopped-early"
              text: "Only the small triangles were counted."
            - value: "3"
              trap: "missed-case"
              text: "Some triangles were missed."
            - value: "5"
              trap: "double-count"
              text: "Some triangles were counted twice."
            - value: "6"
              trap: "ignored-condition"
              text: "Shapes with four corners do not count."
    simpler_case: "Try a rectangle with one line from corner to corner. How many triangles are there?"
solution:
  - text: "The long line cuts the rectangle into 2 big triangles. The short line cuts a small triangle off each of them, and the other piece of each has four corners, so it is no triangle. So there are 2 + 2 = 4 triangles."
  - text: "2 + 2 = 4"
  - picture: "pictures/fig-34-d3-1-solution.png"
    alt: "The same rectangle with its two lines."
    width: 208
    height: 128
techniques: ["systematic"]
skills:
  primary: ["counting-figures"]
band: "grades-3-4"
difficulty: 3
