id: "kl-34-d3-1"
statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Three islanders each say: 'Exactly one of us three is a knight.' How many knights are among them?"
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Three islanders each say: 'Exactly one of us three is a knight.'"]
unknown: "How many knights are among them."
