  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "0"
          units: ["knight", "knights"]
          trap_values:
            - value: "1"
              trap: "trusted-statement"
              text: "With one knight the words are true, but then the two liars could not say them."
            - value: "2"
              trap: "ignored-condition"
              text: "With two knights the words are false, and a knight cannot say them."
            - value: "3"
              trap: "ignored-condition"
              text: "With three knights the words are false, and a knight cannot say them."
    simpler_case: "Try one islander who says: 'I am a knight and 2 + 2 = 5.' What is he?"
solution:
  - text: "If there were exactly one knight, the words would be true, and the two liars could not say them. If there were 2 or 3 knights, the knights would be saying something false. So there are no knights: all three are liars, and their words are indeed false."
