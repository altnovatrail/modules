              text: "You do not need all 15 balls."
    simpler_case: "Try a box with 1 red, 1 blue and 1 green ball first. How many balls must you take?"
solution:
  - text: "You may be unlucky and take all 5 red and all 5 blue balls first: 10 balls, and still no green. The 11th ball must be green. So 11 balls are needed."
