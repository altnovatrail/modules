id: "pig-12-d3-1"
statement:
  - text: "A box has 5 red, 5 blue and 5 green balls. Without looking, how many balls must you take to be sure to have at least one ball of each colour?"
givens: ["The box has 5 red, 5 blue and 5 green balls.", "You take balls out without looking."]
unknown: "How many balls you must take to be sure of one ball of each colour."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "11"
          units: ["ball", "balls"]
          trap_values:
            - value: "3"
              trap: "best-case-not-worst"
              text: "3 balls could all be the same colour."
