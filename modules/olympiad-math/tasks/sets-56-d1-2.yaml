id: "sets-56-d1-2"
statement:
  - text: "Two purses hold four coins in all, and one purse holds twice as many coins as the other. How many coins does the purse that holds more have inside it?"
givens: ["Two purses hold four coins in all.", "One purse holds twice as many coins as the other."]
unknown: "How many coins the purse that holds more has inside it."
leading_question: "Must the two purses lie side by side?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "4"
          units: ["coin", "coins"]
          trap_values:
            - value: "2"
              trap: "answered-other-question"
              text: "2 is not what the purse that holds more has."
            - value: "8/3"
              trap: "wrong-operation"
              text: "8/3 shares the four coins in the ratio 2 to 1, but a coin cannot be cut."
            - value: "6"
              trap: "double-count"
              text: "6 counts the coins in the small purse twice, once for each purse."
    simpler_case: "Try two purses side by side with 9 coins in all, one holding twice as many as the other. How many does the bigger one hold?"
solution:
  - text: "Side by side, the purses would hold three equal parts of the coins, and four coins do not make three equal parts. But one purse can lie inside the other. Put two coins in the small purse, then put the small purse and the other two coins in the big one. The small purse holds 2 coins, and the big purse holds 4: its own two and the two in the small purse."
