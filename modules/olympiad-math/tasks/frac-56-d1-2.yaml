id: "frac-56-d1-2"
statement:
  - text: "A jug holds two and a half litres of juice. Each glass holds a quarter of a litre. How many glasses can be filled from the full jug?"
givens: ["The jug holds two and a half litres.", "Each glass holds a quarter of a litre."]
unknown: "How many glasses the full jug fills."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "10"
          units: ["glass", "glasses"]
          trap_values:
            - value: "8"
              trap: "stopped-early"
              text: "8 glasses do not hold all the juice."
            - value: "5/8"
              trap: "wrong-operation"
              text: "5/8 multiplies two and a half by a quarter. To find how many quarters fit, divide by a quarter instead."
            - value: "12"
              trap: "part-whole-swap"
              text: "12 counts the half litre as if it were a whole litre."
    simpler_case: "Try a jug of one and a half litres. How many quarter-litre glasses does it fill?"
solution:
  - text: "One litre fills 4 glasses of a quarter litre, so two litres fill 8 glasses, and half a litre fills 2 more. So the jug fills 8 + 2 = 10 glasses."
