id: "clk-12-d5-5"
statement:
  - text: "Mum puts a cake in the oven at 4:50. It must bake for 1 hour 25 minutes. At what time should she take it out?"
  - picture: "pictures/clk-12-d5-5.png"
    alt: "A clock showing 4:50."
    width: 200
    height: 200
  - text: "Write the time as hours and minutes, like 9:15."
givens: ["The cake goes in the oven at 4:50.", "It must bake for 1 hour 25 minutes."]
unknown: "The time to take it out."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "time"
          key: "6:15"
          trap_values:
            - value: "3:25"
              trap: "reversed-relation"
              text: "The cake comes out after it goes in, so count forward."
            - value: "5:15"
              trap: "stopped-early"
              text: "You added only the 25 minutes. Add the hour too."
            - value: "5:75"
              trap: "time-unit-mixup"
              text: "An hour has 60 minutes, so there is no 5:75."
            - value: "6:25"
              trap: "wrong-operation"
              text: "You added 1 hour 35 minutes, not 1 hour 25 minutes."
    simpler_case: "Try a cake that bakes for 10 minutes from 4:50. At what time does it come out?"
solution:
  - text: "1 hour after 4:50 it is 5:50. 10 more minutes give 6:00, and 15 more give 6:15. 10 + 15 = 25 minutes."
