id: "game-56-d2-3"
statement:
  - text: "Zoe and Max share a box of 12 matches. Zoe starts, and they go one after the other, each time picking up 1, 2 or 3 matches. Picking up the last match wins. Both of them play perfectly. Who wins?"
givens: ["Zoe and Max share 12 matches, Zoe first.", "Each picks up 1, 2 or 3 matches in turn, and picking up the last match wins.", "Both play perfectly."]
unknown: "Who wins."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["Zoe, whatever she does", "Zoe, if she picks up 1 first", "It depends on luck", "Max, whatever Zoe does", "Zoe, if she picks up 3 first"]
        check:
          kind: "choice"
          key: "Max, whatever Zoe does"
          trap_values:
            - value: "Zoe, whatever she does"
              trap: "first-move-assumed"
              text: "Going first does not decide it here."
            - value: "Zoe, if she picks up 1 first"
              trap: "best-case-not-worst"
              text: "After Zoe picks up 1, Max has a good reply."
            - value: "It depends on luck"
              trap: "ignored-condition"
              text: "Nothing is left to chance: both players see every match and choose every move."
            - value: "Zoe, if she picks up 3 first"
              trap: "best-case-not-worst"
              text: "After Zoe picks up 3, Max has a good reply."
    simpler_case: "Try a box of 5 matches with the same rules. Who wins?"
solution:
  - text: "A box of 4 loses for the player whose turn it is: whatever she picks up, the other player picks up the rest. So 8 and 12 lose too. Whatever Zoe picks up from 12, Max picks up enough to make 4 in that round. He leaves her 8, then 4, and picks up the last match himself."
