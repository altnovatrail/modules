id: "ratio-56-d4-3"
statement:
  - text: "Bag A has 1 red bead for every 2 blue beads. Bag B holds twice as many beads as bag A, with 3 red beads for every 1 blue bead. All the beads are tipped into one box. What is the ratio of red beads to blue beads in the box?"
givens: ["Bag A has 1 red bead for every 2 blue beads.", "Bag B holds twice as many beads as bag A, with 3 red beads for every blue bead.", "All the beads are tipped into one box."]
unknown: "The ratio of red beads to blue beads in the box."
leading_question: "Choose a size for bag A, such as 12 beads, and count."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["11 : 7", "4 : 3", "7 : 11", "11 : 18", "3 : 1"]
        check:
          kind: "choice"
          key: "11 : 7"
          trap_values:
            - value: "4 : 3"
              trap: "ratio-total-confusion"
              text: "4 : 3 adds the two ratios part by part, 1 + 3 and 2 + 1, but the bags hold different numbers of beads."
            - value: "7 : 11"
              trap: "reversed-relation"
              text: "Check which colour comes first in the question."
            - value: "11 : 18"
              trap: "part-whole-swap"
              text: "11 : 18 compares the red beads with all the beads."
            - value: "3 : 1"
              trap: "ignored-condition"
              text: "3 : 1 is bag B alone, but the beads of bag A are in the box too."
    simpler_case: "Try bag A with 1 red bead for every blue bead, and bag B, twice as big, with only red beads. What is the ratio of red to blue in the box?"
solution:
  - text: "Take 12 beads in bag A: 4 red and 8 blue. Bag B then has 24 beads: 18 red and 6 blue. The box has 22 red and 14 blue beads, and 22 : 14 = 11 : 7."
skills:
  primary: ["ratio-sharing"]
band: "grades-5-6"
difficulty: 4
