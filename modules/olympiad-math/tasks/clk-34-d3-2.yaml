id: "clk-34-d3-2"
statement:
  - text: "One clock is 7 minutes fast, and another is 5 minutes slow. The fast clock shows 10:02. What does the slow clock show?"
  - picture: "pictures/clk-34-d3-2.png"
    alt: "A clock showing 10:02."
    width: 200
    height: 200
  - text: "Write the time as hours and minutes, like 9:15."
givens: ["One clock is 7 minutes fast, and another is 5 minutes slow.", "The fast clock shows 10:02."]
unknown: "What the slow clock shows."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "time"
          key: "9:50"
          trap_values:
            - value: "9:55"
              trap: "stopped-early"
              text: "9:55 takes off only the 7 minutes of the fast clock. The slow clock is behind the real time too."
            - value: "9:57"
              trap: "wrong-operation"
              text: "You took away only 5 minutes from the fast clock."
            - value: "10:00"
              trap: "wrong-operation"
              text: "You took away the difference of 2 minutes, but one clock is fast and the other slow."
            - value: "10:14"
              trap: "reversed-relation"
              text: "The slow clock shows less than the fast one, not more."
    simpler_case: "Try only one clock: it shows 10:02 and is 4 minutes fast. What is the real time?"
solution:
  - text: "The real time is 7 minutes earlier than the fast clock: 9:55. The slow clock is 5 minutes behind the real time: 9:50."
  - picture: "pictures/clk-34-d3-2-solution.png"
    alt: "A clock showing 9:50."
    width: 200
    height: 200
skills:
  primary: ["time-clocks"]
