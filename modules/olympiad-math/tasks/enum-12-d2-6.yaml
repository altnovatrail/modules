id: "enum-12-d2-6"
statement:
  - text: "In the picture, each round mark is a flavour of ice cream and each square mark is a topping. A cone has one flavour and one topping. How many different cones can be made?"
  - picture: "pictures/enum-12-d2-6.png"
    alt: "Two piles of marks: 3 round marks in the first and 2 square marks in the second."
    width: 78
    height: 84
givens: ["Each round mark in the picture is a flavour.", "Each square mark is a topping.", "A cone has one flavour and one topping."]
unknown: "How many different cones can be made."
leading_question: "Pick one flavour. How many toppings can go with it?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "6"
          units: ["cone", "cones"]
          trap_values:
            - value: "5"
              trap: "wrong-operation"
              text: "The numbers were added, not multiplied."
            - value: "9"
              trap: "double-count"
              text: "Some cones were counted twice."
            - value: "3"
              trap: "stopped-early"
              text: "Only the flavours were counted."
            - value: "2"
              trap: "number-from-text"
              text: "That is only the toppings."
    simpler_case: "Try 2 flavours and 2 toppings. How many cones can be made?"
solution:
  - text: "Each of the 3 flavours can go with each of the 2 toppings. That makes 3 times 2, which is 6 cones."
  - text: "3 × 2 = 6"
