  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "7"
          units: ["step", "steps"]
          trap_values:
            - value: "5"
              trap: "stopped-early"
