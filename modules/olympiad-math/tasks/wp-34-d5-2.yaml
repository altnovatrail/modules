solution:
  - text: "Write the litres in the bucket, the 5-litre jug and the 3-litre jug: (8, 0, 0), (3, 5, 0), (3, 2, 3), (6, 2, 0), (6, 0, 2), (1, 5, 2), (1, 4, 3), (4, 4, 0). That is 7 steps, and there is no shorter way."
