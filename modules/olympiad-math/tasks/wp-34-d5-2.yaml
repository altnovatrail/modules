id: "wp-34-d5-2"
statement:
  - text: "A bucket holds 8 litres of water. There are two empty jugs of 5 litres and 3 litres. There is no tap, and no water may be poured away. Each step is pouring from one container into another until the first is empty or the second is full. What is the smallest number of steps needed to share the water into two equal parts: 4 litres in the bucket and 4 litres in the 5-litre jug?"
  - picture: "pictures/wp-34-d5-2.png"
    alt: "A full 8-litre bucket, an empty 5-litre jug and an empty 3-litre jug."
    width: 272
    height: 161
