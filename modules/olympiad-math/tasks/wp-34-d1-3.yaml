id: "wp-34-d1-3"
statement:
  - text: "There are 3 coins that look the same. One of them is fake and lighter than the others; the other two weigh the same. What is the smallest number of weighings on a balance without weights that is sure to find the fake coin?"
givens: ["There are 3 coins that look the same, and one of them is a lighter fake.", "The real coins all weigh the same, and the balance has no weights."]
unknown: "The smallest number of weighings that is sure to find the fake."
