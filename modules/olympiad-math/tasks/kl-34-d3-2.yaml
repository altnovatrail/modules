id: "kl-34-d3-2"
statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Four islanders sit at a round table. Each of them says: 'My neighbour on the left is a liar.' How many knights are at the table?"
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Four islanders sit at a round table.", "Each says: 'My neighbour on the left is a liar.'"]
unknown: "How many knights are at the table."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "2"
          units: ["knight", "knights"]
          trap_values:
            - value: "0"
              trap: "ignored-condition"
              text: "If all were liars, each would be telling the truth about the left neighbour."
            - value: "1"
              trap: "off-by-one"
              text: "With only 1 knight, some liar would have a liar on the left and would be telling the truth."
            - value: "3"
              trap: "off-by-one"
              text: "Check who can sit to the left of a knight, and of a liar."
