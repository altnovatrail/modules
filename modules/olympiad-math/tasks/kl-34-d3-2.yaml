    simpler_case: "Try two islanders at a table, each saying 'My neighbour is a liar.' How many knights are there?"
solution:
  - text: "A knight's left neighbour is a liar, and a liar's left neighbour is a knight. So knights and liars take turns around the table, and 4 people make 2 knights and 2 liars."
