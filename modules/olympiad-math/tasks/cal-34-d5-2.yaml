    simpler_case: "Try a girl as many months old as her grandmother is years old, the girl being 6. How old is the grandmother?"
solution:
  - text: "A year has 12 months, so the grandfather is 12 times as old as the boy. Their ages are 1 part and 12 parts, 13 parts in all. 65 ÷ 13 = 5. The boy is 5 and the grandfather is 60."
