id: "cal-34-d5-2"
statement:
  - text: "A boy is as many months old as his grandfather is years old. Together they are 65 years old. How old is the boy in years?"
givens: ["The boy is as many months old as his grandfather is years old.", "Together they are 65 years old."]
unknown: "The boy's age in years."
