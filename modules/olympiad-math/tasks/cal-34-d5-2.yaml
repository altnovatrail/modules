  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "5"
          units: ["year", "years"]
          trap_values:
            - value: "6"
              trap: "off-by-one"
              text: "If the boy were 6, the grandfather would be 72 and together they would be 78."
            - value: "12"
              trap: "time-unit-mixup"
              text: "12 is how many months are in a year, not the boy's age."
