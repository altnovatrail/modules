id: "par-56-d4-3"
statement:
  - text: "On a board of 3 by 3 squares there is a bug on every square. At the same moment every bug crawls to a square that shares a side with its own square. At least how many squares must be empty?"
givens: ["The board is 3 by 3 squares with a bug on every square.", "At once every bug crawls to a square that shares a side with its own."]
unknown: "At least how many squares must be empty."
leading_question: "Where can the bugs from the middles of the four sides go?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "1"
          units: ["square", "squares"]
          trap_values:
            - value: "0"
              trap: "wrong-parity"
              text: "Colour the board like a chess board, and see where the bugs on each colour can go."
            - value: "5"
              trap: "stopped-early"
              text: "5 squares are left by the bugs on the dark squares, but the bugs from the light squares fill some of them."
            - value: "2"
              trap: "off-by-one"
              text: "2 is too many: look for a way that leaves fewer squares empty."
            - value: "4"
              trap: "answered-other-question"
              text: "4 is how many bugs come from the light squares, not how many squares stay empty."
    simpler_case: "Try a board of 2 by 2 squares with a bug on each. At least how many squares are empty after they crawl?"
solution:
  - text: "Colour the board like a chessboard with dark corners: the 4 corners and the centre are dark, and the 4 middles of the sides are light. Every bug crawls to a square of the other colour, so the 5 dark squares can only get the 4 bugs from the light squares, and one dark square stays empty. One is enough: the 8 bugs round the edge each crawl one square on round the edge in the same direction, and the bug in the centre crawls to the middle of any side, which leaves only the centre empty."
techniques: ["parity"]
skills:
  primary: ["parity-alternation"]
band: "grades-5-6"
difficulty: 4
