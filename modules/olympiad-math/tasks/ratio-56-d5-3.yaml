id: "ratio-56-d5-3"
statement:
  - text: "Mia and Leo ate a jar of jam together. Leo ate 20% fewer spoonfuls than Mia, but his spoon held 100% more jam than hers. What part of the jar did Leo eat?"
givens: ["Leo ate 20% fewer spoonfuls than Mia.", "His spoon held 100% more jam than hers."]
unknown: "The part of the jar Leo ate."
leading_question: "Compare one of Leo's spoonfuls with one of Mia's, and the number of spoonfuls each ate."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "fraction"
          key: "8/13"
          trap_values:
            - value: "5/13"
              trap: "answered-other-question"
              text: "5/13 is not Leo's part."
            - value: "8/5"
              trap: "ratio-total-confusion"
              text: "8/5 is Leo's jam against Mia's, not against the whole jar."
            - value: "9/14"
              trap: "wrong-operation"
              text: "9/14 adds the changes, 100% − 20%, as if Leo ate 180% of Mia's jam. The changes multiply: 80% of the spoonfuls times twice the spoon."
            - value: "1/2"
              trap: "ignored-condition"
              text: "1/2 would mean they ate the same. Leo's bigger spoon more than makes up for his fewer spoonfuls."
    simpler_case: "Try: Leo ate as many spoonfuls as Mia, but his spoon held twice as much. What part of the jar did Leo eat?"
solution:
  - text: "Leo ate 80% as many spoonfuls as Mia, and each of his held twice as much as hers. So he ate 0.8 × 2 = 1.6 times as much jam as Mia. The jar splits 8 : 5 between Leo and Mia, so Leo ate 8/13 of it."
skills:
  primary: ["ratio-sharing"]
band: "grades-5-6"
difficulty: 5
