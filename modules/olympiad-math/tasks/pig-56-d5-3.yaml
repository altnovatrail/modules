id: "pig-56-d5-3"
statement:
  - text: "Four monkeys, Mo, Kiki, Lulu and Pip, ate 20 bowls of porridge between them, and each ate at least two bowls. Kiki and Lulu ate 11 bowls together. Mo ate more bowls than each of the other three. How many bowls did Pip eat?"
givens: ["Mo, Kiki, Lulu and Pip ate 20 bowls between them, each at least two.", "Kiki and Lulu ate 11 bowls together.", "Mo ate more bowls than each of the other three."]
unknown: "How many bowls Pip ate."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "2"
          units: ["bowl", "bowls"]
          trap_values:
            - value: "9"
              trap: "answered-other-question"
              text: "9 is how many bowls Mo and Pip ate together. The question asks about Pip alone."
            - value: "3"
              trap: "best-case-not-worst"
              text: "3 counts on Kiki and Lulu sharing their 11 bowls as evenly as they can, as if each ate 5 and a half. But bowls come whole: one of them ate more than the other."
            - value: "4"
              trap: "ignored-condition"
              text: "4 leaves Mo 5 bowls, but one of Kiki and Lulu ate at least 6, and Mo ate more than each of the others."
    simpler_case: "Try two monkeys who ate 9 bowls, each at least two, where one ate more than the other. How many can the other have eaten?"
solution:
  - text: "One of Kiki and Lulu ate at least 6 of their 11 bowls, since two numbers of 5 or less make at most 10. Mo ate more than that monkey, so at least 7. Mo and Pip ate 20 − 11 = 9 bowls together, so Pip ate at most 2, and each monkey ate at least two bowls. So Pip ate 2 bowls."
techniques: ["pigeonhole"]
traps: ["stopped-early"]
skills:
  primary: ["pigeonhole-basic"]
band: "grades-5-6"
difficulty: 5
