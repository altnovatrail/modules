    simpler_case: "Try a town of 367 people first. Must two of them share a birthday?"
solution:
  - text: "There are 366 birthdays, 29 February among them. If no birthday had more than 19 people, the town would have at most 366 × 19 = 6,954 people. It has 7,310, so some birthday has at least 20 of them. No more is sure: the people can be spread out with 19 or 20 on each birthday."
