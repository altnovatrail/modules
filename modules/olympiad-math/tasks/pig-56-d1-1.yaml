id: "pig-56-d1-1"
statement:
  - text: "A town has 7,310 people. A birthday is a day of the year, such as 5 May, and 29 February counts as one too. At least how many people of the town are sure to share one birthday?"
givens: ["The town has 7,310 people.", "A birthday is a day of the year, and 29 February counts as one too."]
unknown: "At least how many people of the town are sure to share one birthday."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "20"
          units: ["person", "people"]
          trap_values:
            - value: "19"
              trap: "off-by-one"
              text: "19 is one short: 19 people on each of the 366 birthdays make only 6,954, fewer than the town has. Where do the other people go?"
            - value: "21"
              trap: "ignored-condition"
              text: "21 counts 365 birthdays, but with 29 February there are 366."
            - value: "1"
              trap: "best-case-not-worst"
              text: "1 hopes that nobody shares a birthday, but 7,310 people cannot all have different birthdays when there are only 366."
