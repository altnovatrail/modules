              text: "3:00 takes the 3 hours of flying away instead of adding them."
    simpler_case: "Try a flight of 2 hours to a city whose clocks show 1 hour less. When does it land?"
solution:
  - text: "The plane lands 3 hours after take-off, at 13:00 by the clocks of the city it left. The clocks where it lands show 4 hours less: 9:00. So it lands at a local time earlier than the time it took off."
