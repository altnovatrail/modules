id: "clk-56-d2-3"
statement:
  - text: "A plane takes off at 10:00 local time and flies for 3 hours. In the city where it lands, the clocks show 4 hours less than where it took off. What is the local time when it lands?"
  - picture: "pictures/clk-56-d2-3.png"
    alt: "A clock showing 10 o'clock."
    width: 200
    height: 200
  - text: "Write the time as hours and minutes, like 9:15."
givens: ["The plane takes off at 10:00 local time and flies for 3 hours.", "Where it lands, the clocks show 4 hours less."]
unknown: "The local time when it lands."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "time"
          key: "9:00"
          trap_values:
            - value: "13:00"
              trap: "stopped-early"
              text: "13:00 is the time in the city it left, not where it lands."
            - value: "17:00"
              trap: "reversed-relation"
              text: "17:00 adds the 4 hours, but the clocks where it lands show less, not more."
            - value: "6:00"
              trap: "ignored-condition"
              text: "6:00 turns 10:00 into the other city's time but leaves out the 3 hours of flying."
