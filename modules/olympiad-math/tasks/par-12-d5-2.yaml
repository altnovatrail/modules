id: "par-12-d5-2"
statement:
  - text: "3 glasses stand upside down. In one move you turn over exactly 2 of them. What is the smallest number of moves needed to make all three glasses stand the right way up?"
givens: ["3 glasses stand upside down.", "In one move exactly 2 of them are turned over."]
unknown: "The smallest number of moves that makes all three stand the right way up."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["1", "It can never be done", "2", "3", "4"]
        check:
          kind: "choice"
          key: "It can never be done"
          trap_values:
            - value: "1"
              trap: "ignored-condition"
              text: "One move turns only 2 glasses; the third stays upside down."
            - value: "2"
              trap: "wrong-parity"
              text: "Follow how many glasses are upside down after each move: can it ever reach 0?"
            - value: "3"
              trap: "wrong-parity"
              text: "3 moves turn 6 glasses in all, but some glass is turned twice and ends upside down again."
            - value: "4"
              trap: "wrong-parity"
              text: "4 moves turn 8 glasses in all. Follow how many glasses are upside down after each move."
    simpler_case: "Try 2 glasses upside down first. How many moves does it take?"
solution:
  - text: "Each move turns 2 glasses, so the number of upside-down glasses changes by 2 or stays the same: it goes 3, 1, 3, 1, ... and is always odd. It can never become 0, so it can never be done."
techniques: ["parity"]
skills:
  primary: ["parity-alternation"]
band: "grades-1-2"
difficulty: 5
