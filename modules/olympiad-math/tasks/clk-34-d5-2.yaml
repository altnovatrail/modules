  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "228"
          units: ["time", "times"]
          trap_values:
            - value: "150"
              trap: "stopped-early"
              text: "The full hours strike twice in a day, not once."
            - value: "156"
              trap: "missed-case"
              text: "You forgot the quarter strikes."
            - value: "204"
              trap: "missed-case"
              text: "Count the quarter strikes in each hour again."
