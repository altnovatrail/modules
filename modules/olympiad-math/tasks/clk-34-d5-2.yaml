id: "clk-34-d5-2"
statement:
  - text: "A clock strikes once at a quarter past, at half past and at a quarter to every hour. At every full hour it strikes as many times as the hour, from 1 to 12. How many times does it strike in a whole day of 24 hours?"
givens: ["The clock strikes once at a quarter past, at half past and at a quarter to every hour.", "At every full hour it strikes as many times as the hour, from 1 to 12."]
unknown: "How many times it strikes in 24 hours."
canvas:
