    simpler_case: "Try a party where 50% chose vanilla and the other 4 guests chose chocolate. How many guests were there?"
solution:
  - text: "Vanilla and chocolate make 60% + 30% = 90%, so the 3 strawberry guests are the other 10%. If 10% is 3 guests, then 100% is 30 guests."
