id: "gaps-34-d1-1"
statement:
  - text: "Trees grow along one side of a road, 5 metres apart. There are 21 trees from the first to the last. How many metres is it from the first tree to the last?"
  - picture: "pictures/gaps-34-d1-1.png"
    alt: "Trees in a row along a road, with a stretch of the row left out in the middle, and every gap drawn between two trees marked 5."
    width: 272
    height: 74
givens: ["The trees are 5 metres apart.", "There are 21 trees from the first to the last."]
unknown: "How many metres it is from the first tree to the last."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "100"
          units: ["metre", "metres", "m"]
          trap_values:
            - value: "21"
              trap: "number-from-text"
              text: "21 is the number of trees, not metres."
            - value: "26"
              trap: "wrong-operation"
              text: "You added 21 and 5. Multiply the gaps by 5 metres."
            - value: "95"
              trap: "off-by-one"
              text: "21 trees have 20 gaps, not 19."
            - value: "105"
              trap: "off-by-one"
              text: "21 trees have 20 gaps, not 21."
    simpler_case: "Try 3 trees, 5 metres apart. How far is it from the first tree to the last?"
solution:
  - text: "21 trees in a row have 20 gaps. 20 × 5 = 100 metres."
