id: "frac-56-d1-3"
statement:
  - text: "Max and his sister Lily walk to a concert at the same steady speed. After a fifth of the way, Max goes back home for his ticket, grabs it at once and walks to the concert. Lily gets there 50 minutes after they left home. How many minutes after Lily does Max get there?"
givens: ["Max and Lily walk at the same steady speed.", "After a fifth of the way, Max goes back home, and then walks to the concert.", "Lily gets there 50 minutes after they left."]
unknown: "How many minutes after Lily Max gets there."
leading_question: "How many minutes does a fifth of the way take?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "20"
          units: ["minute", "minutes"]
          trap_values:
            - value: "10"
              trap: "stopped-early"
              text: "10 minutes is not all of Max's extra walking."
            - value: "16"
              trap: "part-whole-swap"
              text: "16 takes the walk back and the walk again as two fifths of the 40 minutes Lily walks after they part. A fifth of the way is a fifth of the whole walk of 50 minutes."
            - value: "70"
              trap: "answered-other-question"
              text: "The question asks how much later than Lily Max arrives, not how long he takes."
            - value: "50"
              trap: "number-from-text"
              text: "50 minutes is Lily's time, a number from the question, not how much later Max gets there."
    simpler_case: "Try a walk of 30 minutes in all, with Max going back after a sixth of the way. How many minutes after Lily does he arrive?"
solution:
  - text: "The whole way takes 50 minutes, so a fifth of it takes 10 minutes. Max walks that fifth back home and then walks it again, so he walks 2 × 10 = 20 minutes more than Lily. He gets there 20 minutes after her."
