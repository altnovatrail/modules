id: groups
template:
  parameters:
    seat: {from: 60, to: 120}
    size: {from: 12, to: 20}
  derived:
    full: seat // size
    place: seat % size
    last_full: seat // size * size
    second_row: size + 1
    second_end: "2 * size"
    row2_second: size + 2
    row2_third: size + 3
    row2_place: size + seat % size
    full_first: (seat // size - 1) * size + 1
    full_place: (seat // size - 1) * size + seat % size
    next_row: seat // size + 1
    next_first: seat // size * size + 1
    next_end: (seat // size + 1) * size
  constraint: seat % size >= 3 and seat // size + 1 >= 4 and seat // size + 1 <= 10 and seat % size != seat // size and seat % size != seat // size + 1
  solver:
    program: |
      # For things counted in groups of the same size, such as seats in rows: split
      # the number into full groups and its place in the next one, places counting
      # from 1, so that the last thing of a group is never place 0 of the next.

      def solve(numbers):
          number, size = numbers["seat"], numbers["size"]
          splits = [(full, place) for full in range(0, number + 1) for place in range(1, size + 1)
                    if full * size + place == number]
          if len(splits) != 1:
              fail("%d ways of placing %d" % (len(splits), number))
          full, place = splits[0]
          return {"row": full + 1}
    results: [row]
statement:
  - text: The seats in a hall are numbered row by row, with {size} seats in each row. Row 1 has seats 1 to {size}, row 2 has seats {second_row} to {second_end}, and so on. In which row is seat {seat}?
  - picture: pictures/groups-{seat}-{size}.png
    alt: "A table of the seats: row 1 has seats 1 to {size}, row 2 seats {second_row} to {second_end}, and a row marked ? holds seat {seat}."
    width: 242
    height: 136
givens:
  - Each row has {size} seats, numbered row by row.
  - Row 1 has seats 1 to {size}, row 2 seats {second_row} to {second_end}, and so on.
unknown: The row of seat {seat}.
leading_question: How many full rows come before seat {seat}?
canvas:
  kind: handwriting_sheet
  grid: squares
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "{row}"
          trap_values:
            - value: "{full}"
              trap: off-by-one
              text: That counts only the full rows before seat {seat}.
            - value: "{place}"
              trap: remainder-vs-quotient
              text: That is where seat {seat} is within its row, what is left over after the full rows.
            - value: "{size}"
              trap: number-from-text
              text: That is the number of seats in a row, copied from the question.
            - value: "{last_full}"
              trap: answered-other-question
              text: That is the number of a seat, not of a row.
    simpler_case: Try rows of three seats. In which row is the seventh seat?
solution:
  - text: "{seat} = {full} × {size} + {place}, so {full} full rows end at seat {last_full}, and seat {seat} is in the next row, row {row}."
  - text: "{last_full} ÷ {size} + 1 = {row}"
  - picture: pictures/groups-solution-{seat}-{size}.png
    alt: "The table on to row {next_row}: row {full} ends at seat {last_full}, and row {next_row} holds seats {next_first} to {next_end}, seat {seat} among them."
    width: 245
    height: 164
leak_phrases: ["row {row}"]
skills:
  primary: [number-divisibility]
  supporting: [core.division-with-remainder]
band: grades-5-6
difficulty: 3
