id: "enum-12-d1-1"
statement:
  - text: "Ann has 3 hats: red, blue and yellow. She also has 2 scarves: green and white. She puts on one hat and one scarf. How many different pairs can she make?"
givens: ["Ann has 3 hats: red, blue and yellow.", "She has 2 scarves: green and white.", "She wears one hat and one scarf."]
unknown: "How many different pairs of a hat and a scarf she can make."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "6"
          units: ["pair", "pairs"]
          trap_values:
            - value: "3"
              trap: "number-from-text"
              text: "3 is the number of hats, not pairs."
            - value: "4"
              trap: "missed-case"
              text: "You missed some pairs. Draw the hats and the scarves, and join every hat to a scarf in every way you can."
            - value: "5"
              trap: "wrong-operation"
              text: "You added 3 and 2. Each hat can be worn with either scarf."
            - value: "12"
              trap: "double-count"
              text: "You counted every pair twice."
    simpler_case: "Try 2 hats and 2 scarves first. Draw each hat with each scarf."
solution:
  - text: "Each of the 3 hats can go with the green scarf or with the white scarf. That is 2 + 2 + 2 = 6 pairs."
techniques: ["systematic"]
skills:
  primary: ["combinatorics-enumeration"]
band: "grades-1-2"
difficulty: 1
