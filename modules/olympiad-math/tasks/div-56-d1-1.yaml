id: "div-56-d1-1"
statement:
  - text: "Kim divides a number by 7 and gets 5 with 3 left over. Then she divides four times that number by four times 7. What does she get this time?"
givens: ["A number divided by 7 gives 5 with 3 left over.", "Four times that number is divided by four times 7."]
unknown: "What the second division gives."
leading_question: "The number is 7 × 5 + 3. What is four times it?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["5 with 12 left over", "5 with 3 left over", "20 with 12 left over", "20 with 3 left over", "12 with 5 left over"]
        check:
          kind: "choice"
          key: "5 with 12 left over"
          trap_values:
            - value: "5 with 3 left over"
              trap: "ignored-condition"
              text: "5 with 3 left over keeps the number left over as it was, but it changes too."
            - value: "20 with 12 left over"
              trap: "wrong-operation"
              text: "20 multiplies the answer by four as well."
            - value: "20 with 3 left over"
              trap: "remainder-vs-quotient"
              text: "20 with 3 left over changes the wrong one of the two."
            - value: "12 with 5 left over"
              trap: "remainder-vs-quotient"
              text: "12 with 5 left over swaps the two."
    simpler_case: "Try a number that gives 2 with 1 left over when divided by 3. What does twice the number divided by 6 give?"
solution:
  - text: "The number is 7 × 5 + 3 = 38, so four times it is 152 = 28 × 5 + 12. Divided by 28, which is four times 7, it gives 5 with 12 left over: the answer stays 5, and the number left over is four times 3."
skills:
  primary: ["number-divisibility"]
  supporting: ["core.division-with-remainder"]
band: "grades-5-6"
difficulty: 1
