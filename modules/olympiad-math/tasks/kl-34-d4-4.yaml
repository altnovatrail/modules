statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Ann says: 'Ben is a liar.' Ben says: 'Ann and Kim are both liars.' Kim says: 'Ben is a knight.' Who is a knight?"
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Ann says: 'Ben is a liar.'", "Ben says: 'Ann and Kim are both liars.'", "Kim says: 'Ben is a knight.'"]
