id: two-groups
template:
  parameters:
    total: {from: 20, to: 30}
    dog: {from: 12, to: 18}
    cat: {from: 10, to: 16}
  derived:
    both_sum: dog + cat
    no_dog: total - dog
  constraint: dog > cat and dog < total and dog + cat - total >= 2 and dog + cat - total <= 4 and dog + cat - total != total - dog
  solver:
    program: |
      # For two overlapping groups: try every number in both, and every size of a
      # group the question does not give, keep the splits that fit everything it
      # says, and answer from them. Here it asks for the fewest in both.

      def solve(numbers):
          total, first, second = numbers["total"], numbers["dog"], numbers["cat"]
          found = []
          for both in range(0, total + 1):
              first_only = first - both
              second_only = second - both
              neither = total - first_only - second_only - both
              if min(first_only, second_only, neither) >= 0:
                  found.append(both)
          if len(found) == 0:
              fail("no split fits everything the question says")
          return {"both": min(found)}
    results: [both]
statement:
  - text: In a group of {total} children, {dog} have a dog and {cat} have a cat. What is the smallest number of children who could have both a dog and a cat?
givens:
  - The group has {total} children.
  - "{dog} have a dog and {cat} have a cat."
unknown: The smallest number who could have both.
canvas:
  kind: handwriting_sheet
  grid: squares
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "{both}"
          units: [child, children]
          trap_values:
            - value: "0"
              trap: ignored-condition
              text: That forgets there are only {total} children, too few for {dog} and {cat} to stay apart.
            - value: "{cat}"
              trap: reversed-relation
              text: That is the largest number who could have both, not the smallest.
            - value: "{both_sum}"
              trap: double-count
              text: That is not a number of children with both pets.
            - value: "{no_dog}"
              trap: answered-other-question
              text: That is not the number with both pets.
    simpler_case: Try 10 children, 6 with a dog and 5 with a cat. What is the smallest number who could have both?
solution:
  - text: Keeping the two groups apart would need {dog} + {cat} = {both_sum} children, but there are only {total}. So at least {both} children have both, and {both} is possible.
leak_phrases: ["{both} children have both"]
skills:
  primary: [logic-sets]
band: grades-5-6
difficulty: 3
