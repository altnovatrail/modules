id: "par-34-d4-4"
statement:
  - text: "12 children stand in a circle and are numbered 1 to 12 in order. The ball starts with child 1 and is always passed 4 places on: from 1 to 5, from 5 to 9, and so on. How many different children hold the ball before it comes back to child 1, counting child 1?"
givens: ["12 children stand in a circle, numbered 1 to 12.", "The ball starts with child 1 and is passed 4 places on each time."]
unknown: "How many different children hold the ball before it comes back to child 1, counting child 1."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "3"
          units: ["child", "children"]
          trap_values:
            - value: "4"
              trap: "number-from-text"
              text: "4 is how many places the ball moves each time."
            - value: "6"
              trap: "wrong-operation"
              text: "You halved 12. Follow the ball from child 1 until it comes back."
            - value: "12"
              trap: "ignored-condition"
              text: "The ball comes back to child 1 before reaching everyone."
            - value: "48"
              trap: "wrong-operation"
              text: "You multiplied 12 by 4."
    simpler_case: "Try 6 children with the ball passed 2 places on. How many hold it?"
solution:
  - text: "The ball goes from 1 to 5, then to 9, and 4 places on from 9 is child 1 again. So only 3 children hold it."
