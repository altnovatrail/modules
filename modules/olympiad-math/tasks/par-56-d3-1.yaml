id: "par-56-d3-1"
statement:
  - text: "The numbers 1 to 10 are written on the board. In one step you add 1 to any two of the numbers. What is the smallest number of steps after which all ten numbers are equal?"
givens: ["The numbers 1 to 10 are on the board.", "In one step 1 is added to any two of the numbers."]
unknown: "The smallest number of steps after which all ten numbers are equal."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["23", "It can never be done", "45", "9", "10"]
        check:
          kind: "choice"
          key: "It can never be done"
          trap_values:
            - value: "23"
              trap: "wrong-parity"
              text: "23 steps make the sum 101. Check whether ten equal numbers can add up to that."
            - value: "45"
              trap: "ignored-condition"
              text: "45 steps would do if each step added 1 to just one number, but each step adds 1 to two numbers."
            - value: "9"
              trap: "ignored-condition"
              text: "In 9 steps the 1 can catch up with the 10, but all ten numbers must end equal, not just those two."
            - value: "10"
              trap: "number-from-text"
              text: "10 is how many numbers are on the board, copied from the question."
    simpler_case: "Try the numbers 1 and 2 only, adding 1 to both in a step. Can they become equal?"
solution:
  - text: "The sum 1 + 2 + ... + 10 is 55, an odd number. Each step adds 2 to the sum, so the sum stays odd. But ten equal numbers add up to 10 times one of them, which is even. So the numbers can never all be equal."
techniques: ["parity"]
skills:
  primary: ["parity-alternation"]
band: "grades-5-6"
difficulty: 3
