id: "wp-34-d5-5"
statement:
  - text: "A bag holds 24 kg of nails. With a balance without weights, you can split any amount of nails into two equal parts in one weighing, and you can pour parts together without weighing. What is the smallest number of weighings needed to get exactly 9 kg of nails in one pile?"
givens: ["A bag holds 24 kg of nails.", "One weighing on a balance without weights splits any amount into two equal parts.", "Parts may be poured together without weighing."]
unknown: "The smallest number of weighings to get exactly 9 kg in one pile."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "3"
          units: ["weighing", "weighings"]
          trap_values:
            - value: "1"
              trap: "stopped-early"
              text: "One weighing only gives two piles of 12 kg."
            - value: "2"
              trap: "stopped-early"
              text: "After 2 weighings the piles are 12, 6 and 6 kg, and no group of them adds up to 9."
            - value: "4"
              trap: "off-by-one"
              text: "Count the weighings again."
    simpler_case: "Try getting 4 kg from 16 kg of nails. How many weighings does it take?"
solution:
  - text: "Split 24 kg into 12 + 12, then 12 into 6 + 6, then 6 into 3 + 3. Now pour 6 kg and 3 kg together: 9 kg, after 3 weighings. After 2 weighings the piles are 12, 6 and 6 kg, and no group of them adds up to 9."
techniques: ["backwards"]
traps: ["ignored-condition"]
