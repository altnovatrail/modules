id: "clk-34-d4-1"
statement:
  - text: "A clock gains 3 minutes every hour. It was set right at 8:00. Now the clock shows 12:12. What is the real time?"
  - picture: "pictures/clk-34-d4-1.png"
    alt: "A clock showing 12:12."
    width: 200
    height: 200
  - text: "Write the time as hours and minutes, like 9:15."
