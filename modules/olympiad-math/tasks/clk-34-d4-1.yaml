    simpler_case: "Try a clock that gains 3 minutes an hour, set right at 8:00, that now shows 9:03. What is the real time?"
solution:
  - text: "In each real hour the clock moves on 63 minutes. It has moved from 8:00 to 12:12, which is 252 minutes = 4 × 63. So 4 real hours have passed: it is 12:00."
