id: "cube-56-d3-1"
statement:
  - text: "The seven filled cells in the picture are one cell too many for a cube. How many of the cells could be cut away so that the other six fold into a cube?"
  - picture: "pictures/cube-56-d3-1.png"
    alt: "Seven filled cells: a column of four, with a cell on each side of the second one and one more cell to the right of the third."
    width: 168
    height: 208
givens: ["The seven filled cells are one cell too many for a cube."]
unknown: "How many of the cells could be cut away so that the other six fold into a cube."
