id: "pig-56-d2-1"
statement:
  - text: "A die has the numbers 1 to 6 on its faces. How many times must you roll it to be sure that some number comes up three times?"
givens: ["The die has the numbers 1 to 6.", "Some number must come up three times."]
unknown: "How many times you must roll it to be sure of it."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "13"
          units: ["time", "times"]
          trap_values:
            - value: "12"
              trap: "off-by-one"
              text: "In 12 rolls every number could come up exactly twice, and none three times."
            - value: "7"
              trap: "answered-other-question"
              text: "7 rolls make sure that some number comes up twice, not three times."
            - value: "3"
              trap: "best-case-not-worst"
              text: "Three rolls could show the same number by luck, but they need not."
            - value: "18"
              trap: "wrong-operation"
              text: "18 multiplies 3 by 6, but you do not need every number three times: one number three times is enough."
    simpler_case: "Try a coin, heads or tails, first. How many tosses make you sure that one side comes up three times?"
solution:
  - text: "Each roll shows one of 6 numbers. You could be unlucky and roll every number twice: 12 rolls with no number three times. The next roll must show a number that has already come up twice, so 13 rolls are enough."
  - text: "6 × 2 + 1 = 13"
