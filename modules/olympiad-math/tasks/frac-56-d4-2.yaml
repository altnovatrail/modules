    simpler_case: "Try a box of fewer than 10 sweets with exactly 1/2 toffees and 1/3 mints. How many chocolates are there?"
solution:
  - text: "A third and three eighths of the sweets must both be whole, so their number divides by 3 and by 8, that is, by 24. Between 20 and 40 only 24 does. Then there are 8 toffees and 9 mints, which leaves 24 - 8 - 9 = 7 chocolates."
