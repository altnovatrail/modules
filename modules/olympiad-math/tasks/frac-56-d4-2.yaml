id: "frac-56-d4-2"
statement:
  - text: "A box holds more than 20 but fewer than 40 sweets. Exactly 1/3 of them are toffees and exactly 3/8 are mints, and the rest are chocolates. How many chocolates are in the box?"
givens: ["The box holds more than 20 but fewer than 40 sweets.", "Exactly 1/3 are toffees and exactly 3/8 are mints; the rest are chocolates."]
unknown: "How many chocolates are in the box."
leading_question: "For which numbers of sweets are a third and three eighths both whole numbers?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "7"
          units: ["chocolate", "chocolates"]
          trap_values:
            - value: "24"
              trap: "part-whole-swap"
              text: "24 is the whole box; the chocolates are only part of it."
            - value: "17"
              trap: "answered-other-question"
              text: "17 is not the chocolates."
