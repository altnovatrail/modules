id: "fig-12-d2-1"
statement:
  - text: "The picture shows a square with two lines from corner to corner. How many triangles can you see in it?"
  - picture: "pictures/fig-12-d2-1.png"
    alt: "A square with both of its diagonals drawn, from corner to corner."
    width: 128
    height: 128
givens: ["The square has two lines from corner to corner."]
unknown: "How many triangles there are."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "8"
          units: ["triangle", "triangles"]
          trap_values:
            - value: "7"
              trap: "off-by-one"
              text: "Some triangles were missed."
            - value: "4"
              trap: "stopped-early"
              text: "Only the smallest triangles were counted."
            - value: "6"
              trap: "missed-case"
              text: "Some triangles of two pieces were missed."
            - value: "10"
              trap: "double-count"
              text: "Some triangles were counted twice."
    simpler_case: "Try a square with one line from corner to corner. How many triangles are there?"
solution:
  - text: "The two lines cut the square into 4 small triangles. Two small triangles side by side make a bigger triangle, and there are 4 of those, one along each side of the square. So there are 4 + 4 = 8 triangles."
  - text: "4 + 4 = 8"
  - picture: "pictures/fig-12-d2-1-solution.png"
    alt: "The same square with both diagonals."
    width: 128
    height: 128
techniques: ["systematic"]
skills:
  primary: ["counting-figures"]
band: "grades-1-2"
difficulty: 2
