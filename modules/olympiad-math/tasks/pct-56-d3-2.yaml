id: "pct-56-d3-2"
statement:
  - text: "On a farm, 60% of the birds are hens, and 25% of the hens are brown. What percentage of all the birds on the farm are brown hens?"
givens: ["60% of the birds are hens.", "25% of the hens are brown."]
unknown: "The percentage of all the birds that are brown hens."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "15"
          units: ["%"]
          trap_values:
            - value: "25"
              trap: "percent-wrong-base"
              text: "25% is the brown share of the hens, not of all the birds."
            - value: "60"
              trap: "part-whole-swap"
              text: "60% is all the hens, and only some of them are brown."
            - value: "85"
              trap: "wrong-operation"
              text: "85% adds 60% and 25%, but the 25% is a part of the 60%, not extra birds."
            - value: "35"
              trap: "wrong-operation"
              text: "35% takes 25% away from 60%, but the brown hens are a quarter of the hens, not what is left of them."
    simpler_case: "Try: 50% of the birds are hens, and 20% of the hens are brown. What percentage of the birds are brown hens?"
solution:
  - text: "Take 100 birds: 60 of them are hens. A quarter of 60 is 15, so 15 of the 100 birds are brown hens, which is 15%."
