id: "game-56-d1-2"
statement:
  - text: "Ann cuts a strip of 12 squares into two pieces along a line between squares. Then Ben takes the piece he likes better, and Ann gets the other one. What is the largest number of squares Ann can be sure to get?"
givens: ["Ann cuts a strip of 12 squares into two pieces.", "Ben takes the piece he likes better, and Ann gets the other."]
unknown: "The largest number of squares Ann can be sure to get."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "6"
          units: ["square", "squares"]
          trap_values:
            - value: "7"
              trap: "first-move-assumed"
              text: "7 is the longer piece of a cut into 7 and 5, but cutting first does not let Ann choose. Ben chooses, and he takes the 7."
            - value: "11"
              trap: "best-case-not-worst"
              text: "11 is what Ann gets only if Ben chooses badly."
            - value: "12"
              trap: "ignored-condition"
              text: "12 is the whole strip, but Ann has to cut it into two pieces, and Ben takes one of them."
            - value: "5"
              trap: "missed-case"
              text: "5 is what Ann is sure of after cutting the strip into 7 and 5, but another cut gives her more."
    simpler_case: "Try a strip of 8 squares. What is the largest number Ann can be sure to get?"
solution:
  - text: "Ben takes the longer piece, so Ann gets the shorter one. The shorter piece is longest when the two pieces are equal, 6 and 6. So Ann can be sure of 6 squares."
