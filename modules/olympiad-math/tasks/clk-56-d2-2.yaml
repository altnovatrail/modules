  - answer_slots:
      - binding: "choice"
        options: ["4:15 on Tuesday", "21:15 on Tuesday", "3:30 on Wednesday", "4:15 on Wednesday", "14:15 on Tuesday"]
        check:
          kind: "choice"
          key: "4:15 on Wednesday"
          trap_values:
            - value: "4:15 on Tuesday"
              trap: "ignored-condition"
