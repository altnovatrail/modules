# A template of algorithms-weighing-pouring (T36; R22): the solver of mathtrail-standalone
# content/solvers/algorithms.weighing_pouring/pouring.star at 42b4408, made a solver of the
# template. It came from reference task wp-34-d1-1, whose numbers are one of its instances.
# The numbers of reference task wp-34-d1-1: small 3, big 5.
# Its capital CAPACITIES, the two jugs that the statement shows, becomes the parameters small and
# big. standalone's solver holds the amount wanted, 2, inside reached rather than as a capital: here
# it is the difference of the two jugs, a derived number, as in the reference task, so that every
# instance is the same easy search of difficulty 1 and its key the same. The constraint keeps the
# amount wanted at 2 litres or more, apart from the jugs and from the trap values 3 and 4, and equal
# to the key only in the reference task. The trap values are the mistakes of the reference task,
# numbers of their own; as there, 3 or 4 is also the small jug.
