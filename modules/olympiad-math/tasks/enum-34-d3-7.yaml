id: "enum-34-d3-7"
statement:
  - text: "In the picture, each round mark is a flavour and each square mark is a topping. A cone has one flavour, with one topping or with no topping at all. How many different cones are there?"
  - picture: "pictures/enum-34-d3-7.png"
    alt: "Two piles of marks: 3 round marks in the first and 3 square marks in the second."
    width: 78
    height: 84
givens: ["Each round mark in the picture is a flavour.", "Each square mark is a topping.", "A cone has one flavour, with one topping or with no topping."]
unknown: "How many different cones there are."
leading_question: "With one flavour, how many choices are there for the top: toppings and none?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "12"
          units: ["cone", "cones"]
          trap_values:
            - value: "9"
              trap: "missed-case"
              text: "The cones with no topping were left out."
            - value: "6"
              trap: "wrong-operation"
              text: "Flavours and toppings were added."
            - value: "10"
              trap: "off-by-one"
              text: "No topping is one more choice for each flavour."
            - value: "4"
              trap: "stopped-early"
              text: "That is the choices for one flavour."
    simpler_case: "Try 2 flavours and 1 topping, a cone with the topping or without it. How many cones are there?"
solution:
  - text: "With each flavour there are 4 choices: one of the 3 toppings or no topping. So there are 3 times 4, which is 12 cones."
  - text: "3 × 4 = 12"
