              trap: "wrong-operation"
              text: "You multiplied 6 by 6. A team does not play itself."
    simpler_case: "Try 4 teams first. How many games does the first round take?"
solution:
  - text: "Every pair of teams plays once: 5 + 4 + 3 + 2 + 1 = 15 games. Plus the final: 16."
