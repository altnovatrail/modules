      - binding: "anywhere"
        check:
          kind: "number"
          key: "16"
          units: ["game", "games"]
          trap_values:
            - value: "15"
              trap: "stopped-early"
              text: "Do not forget the final game."
            - value: "30"
              trap: "double-count"
              text: "A game between two teams is one game. You counted each twice and forgot the final."
