id: "enum-34-d3-2"
statement:
  - text: "Six teams play a tournament. First every team plays every other team once. Then the two best teams play one final game. How many games are played in all?"
givens: ["Six teams play.", "First every team plays every other team once.", "Then the two best teams play one final game."]
unknown: "How many games are played in all."
