id: "ratio-56-d4-1"
statement:
  - text: "A flower stall sells only roses (R), tulips (T) and daisies (D). It has 2 roses for every 3 tulips, and 4 tulips for every 5 daisies. There are 30 daisies. How many flowers does the stall have?"
  - picture: "pictures/ratio-56-d4-1.png"
    alt: "Four bars: R of 2 parts, T of 3 parts, T of 4 parts and D of 5 parts, with the notes D = 30 and R + T + D = ?."
    width: 329
    height: 224
givens: ["The stall sells only roses, tulips and daisies.", "There are 2 roses for every 3 tulips, and 4 tulips for every 5 daisies.", "There are 30 daisies."]
unknown: "How many flowers the stall has."
leading_question: "Find the tulips first, then the roses."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "70"
          units: ["flower", "flowers"]
          trap_values:
            - value: "60"
              trap: "ratio-total-confusion"
              text: "60 joins the ratios into 2 : 3 : 5, but the 3 tulips and the 4 tulips belong to different groups."
            - value: "66"
              trap: "ratio-total-confusion"
              text: "66 joins the ratios into 2 : 4 : 5, but 2 roses go with 3 tulips, not with 4."
            - value: "87"
              trap: "wrong-operation"
              text: "87 counts one flower fewer each time, 30, 29 and 28, as if for every meant one fewer."
            - value: "54"
              trap: "part-whole-swap"
              text: "54 leaves out one kind of flower."
    simpler_case: "Try 1 rose for every 2 tulips, with 10 tulips and no other flowers. How many flowers are there?"
solution:
  - text: "30 daisies make 6 groups of 5, so there are 6 × 4 = 24 tulips. 24 tulips make 8 groups of 3, so there are 8 × 2 = 16 roses. Altogether there are 30 + 24 + 16 = 70 flowers."
skills:
  primary: ["ratio-sharing"]
band: "grades-5-6"
difficulty: 4
