id: "fig-12-d3-1"
statement:
  - text: "Each line in the picture is a match. How many matches are in the picture?"
  - picture: "pictures/fig-12-d3-1.png"
    alt: "A row of three squares side by side, made of matches."
    width: 168
    height: 88
givens: ["Each line in the picture is a match."]
unknown: "How many matches there are."
leading_question: "Is a side two squares share one match or two?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "10"
          units: ["match", "matches"]
          trap_values:
            - value: "11"
              trap: "off-by-one"
              text: "Some matches were counted twice."
            - value: "12"
              trap: "double-count"
              text: "A shared side is one match."
            - value: "3"
              trap: "answered-other-question"
              text: "That is the squares, not the matches."
            - value: "9"
              trap: "missed-case"
              text: "Some matches were missed."
    simpler_case: "Try two squares of matches side by side. How many matches are there?"
solution:
  - text: "There are 3 matches along the top and 3 along the bottom. Up and down there are 4 more, since two squares side by side share one match. So there are 3 + 3 + 4 = 10 matches."
  - text: "3 + 3 + 4 = 10"
  - picture: "pictures/fig-12-d3-1-solution.png"
    alt: "The same row with the upright matches dashed."
    width: 168
    height: 88
techniques: ["systematic"]
skills:
  primary: ["counting-figures"]
band: "grades-1-2"
difficulty: 3
