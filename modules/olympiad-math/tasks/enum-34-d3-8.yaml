id: "enum-34-d3-8"
statement:
  - text: "The picture shows a maze on squared paper, and its lines are walls. A move goes from a cell to the cell next to it, never through a wall. What is the least number of moves from S to E?"
  - picture: "pictures/enum-34-d3-8.png"
    alt: "A maze of 4 by 4 cells, S in the top left cell and E in the bottom right one. Three walls run up and down: along the right side of the first column from the top, 3 cells long; along the right side of the second column from the bottom, 3 cells long; and along the right side of the third column from the top, 3 cells long."
    width: 208
    height: 208
givens: ["The lines of the maze are walls.", "A move goes to the cell next to it, never through a wall."]
unknown: "The least number of moves from S to E."
leading_question: "Which cells can you reach in one move from S, and from those?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "12"
          units: ["move", "moves"]
          trap_values:
            - value: "13"
              trap: "off-by-one"
              text: "The start cell is not a move."
            - value: "6"
              trap: "missed-case"
              text: "That is the way straight across."
            - value: "11"
              trap: "off-by-one"
              text: "One move of the way was missed."
    simpler_case: "Try a maze of 2 by 2 cells with one wall between the two top cells. What is the least number of moves from the top left cell to the top right one?"
solution:
  - text: "Going round the walls, the shortest way from S to E takes 12 moves. Every other way is longer."
