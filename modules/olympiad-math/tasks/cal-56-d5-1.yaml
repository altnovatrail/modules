id: "cal-56-d5-1"
statement:
  - text: "In Europe the date 3/5 means 3 May, with the day first, but in the USA it means 5 March, with the month first. Ann writes every date from 1 January to 30 June the European way. For how many of these dates would a reader from the USA get a different real date?"
givens: ["In Europe 3/5 means 3 May, and in the USA it means 5 March.", "Ann writes every date from 1 January to 30 June the European way."]
unknown: "How many of these dates a reader from the USA takes for a different real date."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "66"
          units: ["date", "dates"]
          trap_values:
            - value: "72"
              trap: "ignored-condition"
              text: "72 counts dates that read the same either way."
            - value: "132"
              trap: "answered-other-question"
              text: "132 counts the whole year, but Ann writes only the dates from January to June."
            - value: "11"
              trap: "stopped-early"
              text: "11 is the count for one month only."
            - value: "30"
              trap: "answered-other-question"
              text: "30 counts only the dates whose other reading falls in January to June too, but any month up to December gives a real date."
    simpler_case: "Try only the dates from 1 to 3 January. For how many would the reader get a different real date?"
solution:
  - text: "Read the other way, the day becomes the month, so the reading is a real date only when the day is at most 12, and a different date only when the day is not the month's own number. Each of the six months has 12 such days less one, so 11. So there are 6 × 11 = 66 dates."
