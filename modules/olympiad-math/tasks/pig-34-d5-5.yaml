id: "pig-34-d5-5"
statement:
  - text: "In a tournament, 6 teams play some games. Two teams play each other at most once, and no team plays itself. Can you be sure that two teams have played the same number of games?"
givens: ["6 teams play some games.", "Two teams play each other at most once, and no team plays itself."]
unknown: "Whether you can be sure that two teams have played the same number of games."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["No, never", "Yes, always", "Only if every team has played", "Only if some team has played no games", "It is impossible to tell"]
        check:
          kind: "choice"
          key: "Yes, always"
          trap_values:
            - value: "No, never"
              trap: "best-case-not-worst"
              text: "Look at the luckiest case: can the 6 teams all have different numbers of games? Think of a team with 0 games and a team with 5."
            - value: "Only if every team has played"
              trap: "ignored-condition"
              text: "Look at the case where some team has played no games too."
            - value: "Only if some team has played no games"
              trap: "ignored-condition"
              text: "Look at the case where every team has played too."
            - value: "It is impossible to tell"
              trap: "stopped-early"
              text: "It can be told: think whether a team with 0 games and a team with 5 games can both be there."
    simpler_case: "Try 3 teams first. List the numbers of games each can have played."
solution:
  - text: "Each team has played 0 to 5 games: 6 possible numbers for 6 teams. But 0 and 5 cannot both happen: a team with 5 games has played everyone, so no team has 0. So only 5 numbers are possible for 6 teams, and two teams must share one."
techniques: ["pigeonhole"]
leak_phrases: ["yes, always"]
skills:
  primary: ["pigeonhole-basic"]
band: "grades-3-4"
difficulty: 5
