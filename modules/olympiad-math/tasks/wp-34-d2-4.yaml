  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "2"
          units: ["weighing", "weighings"]
          trap_values:
            - value: "1"
              trap: "best-case-not-worst"
              text: "One weighing finds the fake only if you are lucky; you must be sure."
            - value: "3"
              trap: "off-by-one"
              text: "Count the weighings again in the worst case."
            - value: "4"
              trap: "number-from-text"
              text: "4 is the number of coins."
