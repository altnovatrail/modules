id: "wp-34-d5-4"
statement:
  - text: "There are 10 coins that look the same. One of them is fake and lighter than the others; all real coins weigh the same. What is the smallest number of weighings on a balance without weights that is sure to find the fake coin?"
givens: ["There are 10 coins that look the same, and one of them is a lighter fake.", "The real coins all weigh the same, and the balance has no weights."]
unknown: "The smallest number of weighings that is sure to find the fake."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "3"
          units: ["weighing", "weighings"]
          trap_values:
            - value: "2"
              trap: "stopped-early"
              text: "2 weighings are enough for 9 coins, but there are 10."
            - value: "4"
              trap: "off-by-one"
              text: "Count the weighings again in the worst case."
            - value: "5"
              trap: "wrong-operation"
              text: "Weighing in pairs takes 5 weighings; try bigger groups."
            - value: "9"
              trap: "answered-other-question"
              text: "9 is how many coins are real."
    simpler_case: "Try 4 coins with one lighter fake. How many weighings find it?"
solution:
  - text: "2 weighings have only 3 × 3 = 9 outcomes, and there are 10 coins, so 2 are not enough. 3 are enough: weigh 3 coins against 3. The fake is among the lighter 3, or among the 4 not weighed; 3 coins need 1 more weighing and 4 coins need 2 more."
skills:
  primary: ["algorithms-weighing-pouring"]
band: "grades-3-4"
difficulty: 5
