id: "cube-34-d1-1"
statement:
  - text: "The five cells in the picture fold up into a box with no lid. Which number is on the bottom of the box?"
  - picture: "pictures/cube-34-d1-1.png"
    alt: "Five cells: a row of three numbered 1, 2 and 3, and below the middle one a column of two, 4 and then 5."
    width: 168
    height: 168
givens: ["The five cells fold up into a box with no lid."]
unknown: "The number on the bottom of the box."
