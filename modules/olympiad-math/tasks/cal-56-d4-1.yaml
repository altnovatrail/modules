id: "cal-56-d4-1"
statement:
  - text: "A family has a mother, a father and two children. Now their four ages add up to 73 years. Five years ago their ages added up to 54 years. How old is the younger child now?"
givens: ["The family is a mother, a father and two children.", "Their four ages now add up to 73.", "Five years ago their ages added up to 54."]
unknown: "The younger child's age now."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "4"
          units: ["year", "years"]
          trap_values:
            - value: "19"
              trap: "stopped-early"
              text: "19 is how much the sum grew in five years, not an age."
            - value: "1"
              trap: "stopped-early"
              text: "1 is how much less the sum grew than it would have with all four alive, a step on the way."
            - value: "5"
              trap: "ignored-condition"
              text: "5 would mean the child was born exactly five years ago, but then the sum would have grown by 20, not 19."
            - value: "15"
              trap: "answered-other-question"
              text: "15 is how much the three older people grew together, not an age."
    simpler_case: "Try a family of three whose ages add up to 62 now and to 54 three years ago. How old is the child?"
solution:
  - text: "In five years everybody who is alive grows 5 years older. If all four had been alive five years ago, the sum would have grown by 4 × 5 = 20, from 53 to 73. It grew by 19, one year less, so the younger child had not been born yet. The other three grew by 15 years together, and the younger child's age makes up the rest: 19 − 15 = 4."
techniques: ["draw"]
skills:
  primary: ["time-calendar"]
band: "grades-5-6"
difficulty: 4
