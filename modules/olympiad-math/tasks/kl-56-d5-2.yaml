solution:
  - text: "Ann says Kim ate some cake and Ben says Kim ate none, so they cannot both be knights. If Ann is a knight, Ben is a liar and Kim, who says both are liars, is a liar too. If Ben is a knight, Ann and Kim are liars in the same way. If both Ann and Ben are liars, Kim tells the truth and is a knight. So exactly one of Ann, Ben and Kim is a knight, Dan's 'exactly two' is false, and Dan is a liar: one of the four is a knight."
