givens: ["Ali, Bea, Cal, Dina and Eli stand in a queue.", "Bea stands somewhere in front of Dina, and Dina somewhere in front of Ali.", "Cal stands right behind Ali.", "Eli is not last, and Eli does not stand next to Bea."]
