id: "fig-34-d2-1"
statement:
  - text: "Look at cell X in the picture. Count the squares of filled cells, small or big, that have X inside them."
  - picture: "pictures/fig-34-d2-1.png"
    alt: "A square of three by three filled cells; the cell in the middle of the left column is marked X."
    width: 168
    height: 168
givens: ["Cell X is in the picture.", "Squares of filled cells, small or big, are counted."]
unknown: "How many of them have X inside them."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "4"
          units: ["square", "squares"]
          trap_values:
            - value: "14"
              trap: "answered-other-question"
              text: "That counts every square, not only those with X."
            - value: "3"
              trap: "missed-case"
              text: "Squares of other sizes hold X too."
            - value: "2"
              trap: "stopped-early"
              text: "Squares of four cells hold X too."
            - value: "5"
              trap: "double-count"
              text: "Some squares were counted twice."
    simpler_case: "Try a square of 2 by 2 filled cells, with X in one corner cell. How many squares hold X?"
solution:
  - text: "Cell X is a square of its own. Two squares of four cells hold it: the one at the top left and the one at the bottom left. The big square of nine cells holds it too. So 1 + 2 + 1 = 4 squares hold X."
  - text: "1 + 2 + 1 = 4"
  - picture: "pictures/fig-34-d2-1-solution.png"
    alt: "The six cells of the left two columns, with X in the middle of the left column."
    width: 168
    height: 168
techniques: ["systematic"]
skills:
  primary: ["counting-figures"]
band: "grades-3-4"
difficulty: 2
