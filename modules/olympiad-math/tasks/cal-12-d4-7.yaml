id: "cal-12-d4-7"
statement:
  - text: "A family spends 3 nights in a hotel and the next 2 nights at grandma's. The day they leave home and the day they come back both count. How many days does the trip take?"
givens: ["The family spends 3 nights in a hotel and the next 2 nights at grandma's.", "The day they leave home and the day they come back both count."]
unknown: "How many days the trip takes."
leading_question: "How many nights does the whole trip have? Each night lies between two days."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "6"
          units: ["day", "days"]
          trap_values:
            - value: "7"
              trap: "double-count"
              text: "7 counts twice the day they move from the hotel to grandma's."
            - value: "5"
              trap: "off-by-one"
              text: "5 is the number of nights, not of days."
            - value: "4"
              trap: "stopped-early"
              text: "4 days are only the part of the trip spent in the hotel."
            - value: "10"
              trap: "wrong-operation"
              text: "10 doubles the 5 nights, as if each night had two days of its own."
    simpler_case: "Try 1 night in a hotel and the next night at grandma's. How many days is that?"
solution:
  - text: "The family goes from the hotel straight to grandma's, so the trip has 3 + 2 = 5 nights in a row. 5 nights lie between 6 days."
