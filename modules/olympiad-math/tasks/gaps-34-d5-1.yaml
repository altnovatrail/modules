      - binding: "anywhere"
        check:
          kind: "number"
          key: "33"
          units: ["minute", "minutes", "min"]
          trap_values:
            - value: "25"
              trap: "ignored-condition"
              text: "You forgot the rests between the cuts."
            - value: "35"
              trap: "off-by-one"
              text: "There is no rest after the last cut: 4 rests, not 5."
            - value: "37"
              trap: "off-by-one"
