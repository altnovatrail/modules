id: "gaps-34-d5-1"
statement:
  - text: "A worker saws a log into 6 pieces. Each cut takes 5 minutes. After every cut except the last one, he rests for 2 minutes. How many minutes does the whole job take?"
givens: ["The log is sawn into 6 pieces.", "Each cut takes 5 minutes.", "After every cut except the last, he rests for 2 minutes."]
unknown: "How many minutes the whole job takes."
