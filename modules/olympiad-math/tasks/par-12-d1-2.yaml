id: "par-12-d1-2"
statement:
  - text: "Beads on a string go red, blue, red, blue, and so on. The first bead is red. What colour is the 9th bead?"
givens: ["The beads go red, blue, red, blue, and so on.", "The first bead is red."]
unknown: "The colour of the 9th bead."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "choice"
          key: "red"
          options: ["blue", "green", "red", "red or blue", "It is impossible to tell"]
          trap_values:
            - value: "blue"
              trap: "wrong-parity"
              text: "Blue beads are in even places: 2nd, 4th, 6th, 8th. 9 is odd."
            - value: "green"
              trap: "ignored-condition"
              text: "The string has only two colours, and green is not one of them."
            - value: "red or blue"
              trap: "stopped-early"
              text: "The pattern tells exactly which colour each bead has. Draw the beads up to the 9th."
            - value: "It is impossible to tell"
              trap: "ignored-condition"
              text: "The pattern repeats, so every place has a known colour."
    simpler_case: "Try the 4th bead first. Draw the beads up to it."
solution:
  - text: "The beads in odd places, the 1st, 3rd, 5th, 7th and 9th, are red. So the 9th bead is red."
