# A template of arithmetic-tricks (T36; R22): the solver of mathtrail-standalone
# content/solvers/arithmetic.tricks/number-thought-of.star at 42b4408, made a solver of the
# template, as the format's example of this template makes it. It came from reference task
# tri-12-d5-4, whose numbers are one of its instances.
# The numbers of reference task tri-12-d5-4: to_ben 1, left 4.
# Its capitals TO_BEN and LEFT are the numbers that the statement shows, and it tries every whole
# number from 0 to 1000 and keeps the one the steps of the story turn into what is left. The trap
# values are derived numbers, the mistakes of the reference task; the constraint keeps them apart
# from each other and from the sweets given to Ben.
