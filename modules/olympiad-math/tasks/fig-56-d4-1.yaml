id: "fig-56-d4-1"
statement:
  - text: "Each line in the picture is a match. What is the least number of matches you must take away so that no square of any size is left?"
  - picture: "pictures/fig-56-d4-1.png"
    alt: "Matches laid as a square of two by two small squares."
    width: 128
    height: 128
givens: ["Each line in the picture is a match."]
unknown: "The least number of matches to take away so that no square of any size is left."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "3"
          units: ["match", "matches"]
          trap_values:
            - value: "1"
              trap: "best-case-not-worst"
              text: "One match leaves squares behind."
            - value: "4"
              trap: "missed-case"
              text: "One match can break two squares."
            - value: "2"
              trap: "stopped-early"
              text: "Two matches leave a square standing."
            - value: "5"
              trap: "answered-other-question"
              text: "That is the number of squares."
    simpler_case: "Try a row of 2 squares of matches. What is the least number of matches to take away so that no square is left?"
solution:
  - text: "There are 5 squares: 4 small ones and the big one. A match is a side of at most 2 of them, so 2 matches leave a square whole. Taking away the two inside matches that stand up and down breaks all four small squares, and one match of the top side breaks the big one: 3 matches."
  - picture: "pictures/fig-56-d4-1-solution.png"
    alt: "The same matches with the ones to take away dashed."
    width: 128
    height: 128
