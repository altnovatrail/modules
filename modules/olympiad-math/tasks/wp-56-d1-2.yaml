id: "wp-56-d1-2"
statement:
  - text: "Tim has a 4-litre jug and a 6-litre jug, both empty, and a tap. He may fill a jug from the tap, empty a jug, or pour from one jug into the other until one is empty or the other is full. Which of these amounts can he end up with in one of the jugs?"
  - picture: "pictures/wp-56-d1-2.png"
    alt: "An empty 4-litre jug and an empty 6-litre jug."
    width: 188
    height: 133
givens: ["Tim has an empty 4-litre jug, an empty 6-litre jug and a tap.", "He may fill a jug, empty a jug, or pour from one into the other until one is empty or the other is full."]
unknown: "Which amount he can end up with in one jug."
leading_question: "What amounts can each step make, starting from two empty jugs? Are they even or odd?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["2 litres", "1 litre", "3 litres", "5 litres", "10 litres"]
        check:
          kind: "choice"
          key: "2 litres"
          trap_values:
            - value: "1 litre"
              trap: "wrong-parity"
              text: "Check which amounts the jugs can ever hold."
            - value: "3 litres"
              trap: "wrong-parity"
              text: "Check which amounts the jugs can ever hold."
            - value: "5 litres"
              trap: "wrong-parity"
              text: "Check which amounts the jugs can ever hold."
            - value: "10 litres"
              trap: "ignored-condition"
              text: "10 litres is 4 + 6, but the amount must be in one jug, and the bigger one holds only 6 litres."
    simpler_case: "Try a 2-litre jug and a 3-litre jug. Can you end up with 1 litre in one of them?"
solution:
  - text: "Fill the 6-litre jug and pour from it into the 4-litre jug until that one is full: 2 litres are left. Both jugs hold an even number of litres, so every step keeps the amounts in them even, and 1, 3 and 5 litres can never be made. 10 litres fit in neither jug."
