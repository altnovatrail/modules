    simpler_case: "Try three shapes, a circle, a square and a star, each red, green or yellow: the circle is at the left end, the red shape right after it, and the star is yellow. What colour is the circle?"
solution:
  - text: "The circle is first and the heart last, so the square and the star are second and third. The second shape is red and the star is yellow, so the square is second and red, and the star is third. The green shape lies next to the star, so it is the heart, and blue is the colour left for the circle."
