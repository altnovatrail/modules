  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "choice"
          notation: "word"
          key: "Blue"
          options: ["Blue", "Green", "Red", "Yellow", "It cannot be told"]
          trap_values:
            - value: "Green"
              trap: "ignored-condition"
              text: "Green fits the circle only if the green shape need not lie next to the star. The heart lies next to the star, and it is green."
            - value: "Red"
