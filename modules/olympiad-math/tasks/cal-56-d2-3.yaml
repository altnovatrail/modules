id: "cal-56-d2-3"
statement:
  - text: "In four years Anya will be 3 times as old as she was eight years ago. How old is Anya now?"
givens: ["In four years Anya will be 3 times as old as she was eight years ago."]
unknown: "Anya's age now."
leading_question: "From eight years ago to four years from now is 12 years. By how much does her age grow in that time, compared with her age eight years ago?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "14"
          units: ["year", "years"]
          trap_values:
            - value: "18"
              trap: "answered-other-question"
              text: "18 is an age in four years, not now."
            - value: "6"
              trap: "answered-other-question"
              text: "6 is an age eight years ago, not now."
            - value: "10"
              trap: "reversed-relation"
              text: "10 mixes up the gaps: it takes four years ago and eight years ahead, not eight years ago and four years ahead."
            - value: "12"
              trap: "wrong-operation"
              text: "12 divides the 12 years by 3, but going from an age to 3 times it adds twice that age."
    simpler_case: "Try: in three years Bob will be twice as old as he was three years ago. How old is he now?"
solution:
  - text: "In four years she will be 3 times her age of eight years ago, so in those 12 years her age grows by twice her age of eight years ago. So eight years ago she was 12 ÷ 2 = 6, and now, 8 years later, she is 14."
