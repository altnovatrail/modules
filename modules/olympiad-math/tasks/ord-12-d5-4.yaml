statement:
  - text: "Sam, Tom, Ula and Vera sit on a bench. Sam sits at one end. Tom sits next to Sam. Vera does not sit next to Tom. Who sits at the other end?"
givens: ["Sam, Tom, Ula and Vera sit on a bench.", "Sam sits at one end, and Tom next to Sam.", "Vera does not sit next to Tom."]
unknown: "Who sits at the other end."
