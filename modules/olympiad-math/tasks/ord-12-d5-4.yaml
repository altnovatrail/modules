  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "choice"
          notation: "word"
          key: "Vera"
          options: ["Sam", "Tom", "Ula", "Vera", "It is impossible to tell"]
          trap_values:
            - value: "Sam"
              trap: "answered-other-question"
              text: "Sam sits at one end; the question asks about the other end."
