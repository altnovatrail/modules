id: "ord-56-d4-2"
statement:
  - text: "Tess, Ugo, Vera and Walt took the first four places in a quiz. Afterwards three of them spoke. Tess said: 'I was first, and Ugo was second.' Ugo said: 'I was first, and Tess was third.' Vera said: 'I was second, and Walt was first.' Walt said nothing. Each of the three said one true thing and one false thing. Who won the quiz?"
givens: ["Tess, Ugo, Vera and Walt took the first four places in a quiz.", "Tess said she was first and Ugo second; Ugo said he was first and Tess third; Vera said she was second and Walt first.", "Each of the three said one true thing and one false thing."]
unknown: "Who won the quiz."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "choice"
          notation: "word"
          key: "Walt"
          options: ["Tess", "Walt", "Ugo", "Vera", "It is impossible to tell"]
          trap_values:
            - value: "Tess"
              trap: "trusted-statement"
              text: "Believing Tess's 'I was first' makes both halves of what Ugo said false."
            - value: "Ugo"
              trap: "trusted-statement"
              text: "Believing Ugo's 'I was first' makes both halves of what Tess said false."
            - value: "Vera"
              trap: "ignored-condition"
              text: "If Vera won, both halves of what she said would be false."
            - value: "It is impossible to tell"
              trap: "stopped-early"
              text: "Trying Tess first leads to a contradiction, and from there every place follows."
    simpler_case: "Try a quiz of three, Tess, Ugo and Vera. Tess said: 'I was first, and Ugo was second.' Ugo said: 'I was first, and Vera was second.' Each said one true thing and one false thing. Who won?"
solution:
  - text: "If Tess were first, Ugo's 'I was first' would be false, so his 'Tess was third' would have to be true, which cannot be. So Tess was not first, and her other half is true: Ugo was second. Then Ugo's 'I was first' is false, so Tess was third. Vera was not second, as Ugo was, so her other half is true: Walt was first. Walt won, Ugo was second, Tess third and Vera fourth."
