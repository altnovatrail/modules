    simpler_case: "Try 1 March 2026: 1 March 2025 is a Saturday, and February 2026 has 28 days. What day is 1 March 2026?"
solution:
  - text: "From 1 March 2027 to 1 March 2028 the calendar passes February 2028, which has 29 days, so the year in between has 366 days. 366 days are 52 weeks and 2 days, so the weekday moves 2 days on: from Monday to Wednesday."
