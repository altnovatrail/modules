id: "cal-56-d2-1"
statement:
  - text: "1 March 2027 is a Monday. The year 2028 is a leap year, with 29 days in February. What day of the week is 1 March 2028?"
givens: ["1 March 2027 is a Monday.", "2028 is a leap year, with 29 days in February."]
unknown: "The day of the week of 1 March 2028."
leading_question: "How many days are there from 1 March 2027 to 1 March 2028? Which February lies in between?"
