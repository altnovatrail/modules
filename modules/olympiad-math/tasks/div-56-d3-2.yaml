id: "div-56-d3-2"
statement:
  - text: "When the lemons in a crate are counted out in twos, threes, fours, fives or sixes, one lemon is always left over. There is more than one lemon. What is the smallest number of lemons the crate can hold?"
givens: ["Counted out in twos, threes, fours, fives or sixes, the lemons always leave one over.", "There is more than one lemon."]
unknown: "The smallest number of lemons."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "61"
          units: ["lemon", "lemons"]
          trap_values:
            - value: "60"
              trap: "ignored-condition"
              text: "60 leaves no lemon over."
            - value: "721"
              trap: "wrong-operation"
              text: "721 multiplies 2 × 3 × 4 × 5 × 6 and adds 1, but a much smaller number divides by all of them."
            - value: "31"
              trap: "missed-case"
              text: "31 works for twos, threes, fives and sixes, but counted out in fours it leaves 3."
            - value: "121"
              trap: "missed-case"
              text: "121 leaves one over each time too, but a smaller number works."
    simpler_case: "Try counting out in twos and threes only, with one lemon always left over and more than one lemon. What is the smallest number?"
solution:
  - text: "Without the lemon left over, the number would divide by 2, 3, 4, 5 and 6. The smallest such number is 60: it is 4 × 3 × 5, and it divides by 2 and 6 as well. With one lemon more, the crate holds 61."
skills:
  primary: ["number-divisibility"]
  supporting: ["core.division-with-remainder"]
band: "grades-5-6"
difficulty: 3
