              trap: "number-from-text"
              text: "13 is the number of children."
    simpler_case: "Try 13 children and a year of only 6 months first. How few can share the fullest month?"
solution:
  - text: "12 children could all have birthdays in different months. The 13th child shares a month with one of them. So at least 2 children have the same birthday month."
