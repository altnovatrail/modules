      - binding: "anywhere"
        check:
          kind: "number"
          key: "2"
          units: ["child", "children"]
          trap_values:
            - value: "1"
              trap: "best-case-not-worst"
              text: "There are more children than months. Think what happens when every month already has a birthday."
            - value: "3"
              trap: "ignored-condition"
              text: "The children can spread out over the months so that no month has 3 birthdays."
            - value: "12"
              trap: "number-from-text"
              text: "12 is the number of months."
