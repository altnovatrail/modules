id: "pig-12-d2-3"
statement:
  - text: "There are 13 children in a class. A year has 12 months. At least how many of the children must have their birthday in the same month?"
givens: ["There are 13 children in the class.", "A year has 12 months."]
unknown: "At least how many children have their birthday in the same month."
