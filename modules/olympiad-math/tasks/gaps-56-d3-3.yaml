id: "gaps-56-d3-3"
statement:
  - text: "Two round running tracks touch at one point, like the figure 8. The small track is 60 metres round and the big one is 100 metres round. Flags stand every 10 metres along both tracks, and one flag stands at the point where they touch. How many flags are there?"
givens: ["The small track is 60 metres round.", "The big track is 100 metres round.", "Flags stand every 10 metres along both tracks.", "One flag stands at the point where the tracks touch."]
unknown: "How many flags there are."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "15"
          units: ["flag", "flags"]
          trap_values:
            - value: "16"
              trap: "double-count"
              text: "16 counts the flag at the touching point twice, once for each track."
            - value: "18"
              trap: "off-by-one"
              text: "18 gives each track one flag more, as if it were a straight line with a flag at both ends: 7 + 11."
            - value: "17"
              trap: "off-by-one"
              text: "17 treats each track as a straight line with a flag at both ends, 7 + 11, and then takes away the shared flag."
            - value: "10"
              trap: "number-from-text"
              text: "10 is the distance between flags, copied from the question."
    simpler_case: "Try two closed tracks of 20 and 30 metres that touch at one point, with a flag every 10 metres and one where they touch. How many flags are there?"
solution:
  - text: "On a closed track there are as many flags as gaps: 60 ÷ 10 = 6 on the small track and 100 ÷ 10 = 10 on the big one. The flag where the tracks touch is on both, so it is counted once: 6 + 10 − 1 = 15."
techniques: ["draw", "small-numbers"]
skills:
  primary: ["counting-gaps"]
band: "grades-5-6"
difficulty: 3
