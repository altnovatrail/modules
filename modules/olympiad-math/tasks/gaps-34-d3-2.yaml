id: "gaps-34-d3-2"
statement:
  - text: "15 benches stand around a round lake at equal distances. Walking from one bench to the next takes 2 minutes. How many minutes does it take to walk once around the lake, from a bench back to the same bench?"
givens: ["15 benches stand around a round lake.", "The benches are at equal distances.", "Walking from one bench to the next takes 2 minutes."]
unknown: "How many minutes it takes to walk once around the lake, back to the same bench."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "30"
          units: ["minute", "minutes", "min"]
          trap_values:
            - value: "15"
              trap: "number-from-text"
              text: "15 is the number of benches, not minutes."
            - value: "17"
              trap: "wrong-operation"
              text: "You added 15 and 2. Multiply the gaps by 2 minutes."
            - value: "28"
              trap: "off-by-one"
              text: "Around a lake there are 15 gaps, not 14: you must walk back to the first bench."
            - value: "32"
              trap: "off-by-one"
              text: "15 benches in a circle have 15 gaps, not 16."
    simpler_case: "Draw 3 benches on a circle. How many walks from one bench to the next take you round once?"
solution:
  - text: "Around a lake the last bench is next to the first one, so there are 15 gaps. 15 × 2 = 30 minutes."
techniques: ["draw", "small-numbers"]
skills:
  primary: ["counting-gaps"]
band: "grades-3-4"
difficulty: 3
