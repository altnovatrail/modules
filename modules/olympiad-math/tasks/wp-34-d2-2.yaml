id: "wp-34-d2-2"
statement:
  - text: "There are 9 coins that look the same. One of them is fake and lighter than the others; all real coins weigh the same. What is the smallest number of weighings on a balance without weights that is sure to find the fake coin?"
givens: ["There are 9 coins that look the same, and one of them is a lighter fake.", "The real coins all weigh the same, and the balance has no weights."]
unknown: "The smallest number of weighings that is sure to find the fake."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "2"
          units: ["weighing", "weighings"]
          trap_values:
            - value: "1"
              trap: "stopped-early"
              text: "One weighing alone cannot pick one coin out of 9."
            - value: "3"
              trap: "off-by-one"
              text: "Count the weighings again in the worst case."
            - value: "4"
              trap: "wrong-operation"
              text: "Weighing coins in pairs is slow; try bigger groups."
            - value: "8"
              trap: "answered-other-question"
              text: "8 is how many coins are real."
    simpler_case: "Try 3 coins with one lighter fake. How many weighings find it?"
solution:
  - text: "Split the coins into three groups of 3. Weigh two groups: the fake is in the lighter group or, if they balance, in the third group. One more weighing finds the fake among those 3 coins. So 2 weighings. One weighing is not enough: it has only 3 outcomes, but there are 9 coins."
skills:
  primary: ["algorithms-weighing-pouring"]
band: "grades-3-4"
difficulty: 2
