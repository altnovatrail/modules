id: "game-56-d2-1"
statement:
  - text: "There are 10 stones on a table. Ann and Ben take turns, and Ann goes first. On each turn a player takes 1 or 2 stones. The player who takes the last stone wins. Ben plays as well as he can. How many stones should Ann take on her first turn to be sure to win?"
  - picture: "pictures/game-56-d2-1.png"
    alt: "A pile of 10 stones."
    width: 236
    height: 48
givens: ["There are 10 stones, and Ann goes first.", "A turn takes 1 or 2 stones, and taking the last stone wins.", "Ben plays as well as he can."]
unknown: "How many stones Ann should take first to be sure to win."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "1"
          units: ["stone", "stones"]
          trap_values:
            - value: "2"
              trap: "best-case-not-worst"
              text: "Taking 2 leaves 8. Ben then takes 2 and leaves 6, and now Ann is the one who loses."
            - value: "3"
              trap: "ignored-condition"
              text: "A player may take only 1 or 2 stones, so 3 is not allowed."
    simpler_case: "Try 5 stones with the same rules. How many should Ann take first?"
solution:
  - text: "A pile of 3 loses for the player whose turn it is: after 1 or 2 stones, the other player takes the rest. In the same way 6 and 9 lose. Ann takes 1 and leaves 9. Each time Ben takes some, she takes enough to make 3 in that round, so he faces 6, then 3, and she takes the last stone."
  - text: "10 − 9 = 1"
  - picture: "pictures/game-56-d2-1-solution.png"
    alt: "A pile of 1 stone taken and a pile of 9 left, in groups of 3."
    width: 219
    height: 84
