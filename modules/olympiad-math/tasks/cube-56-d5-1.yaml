id: "cube-56-d5-1"
statement:
  - text: "A die stands on the first cell of the row in the picture, with the number in that cell on top. It rolls straight along the row, tipping over one edge for each cell. Opposite faces of a die add up to 7. In how many cells of the row, the first one too, can you tell which number is on top?"
  - picture: "pictures/cube-56-d5-1.png"
    alt: "A row of seven cells; the first holds the number 3."
    width: 328
    height: 88
givens: ["The die starts on the first cell with its number on top, and rolls straight along the row, one edge for each cell.", "Opposite faces of a die add up to 7."]
unknown: "In how many cells, the first too, you can tell which number is on top."
leading_question: "After how many rolls is the top face known again?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "4"
          units: ["cell", "cells"]
          trap_values:
            - value: "3"
              trap: "off-by-one"
              text: "Check every cell of the row."
            - value: "7"
              trap: "ignored-condition"
              text: "After odd rolls a side is on top."
            - value: "2"
              trap: "stopped-early"
              text: "Check every cell of the row."
            - value: "1"
              trap: "missed-case"
              text: "Check every cell of the row."
    simpler_case: "Try a die with 3 on top that rolls twice straight on. Which number is on top?"
solution:
  - text: "After an even number of rolls the top is known: the same 3 after 4 rolls, and the 4 opposite it after 2 or 6. After an odd number of rolls a side face is on top, and it cannot be told. The first cell and the cells after 2, 4 and 6 rolls make 4 cells."
  - text: "1 + 3 = 4"
  - picture: "pictures/cube-56-d5-1-solution.png"
    alt: "The row with the number on top written in each cell where it can be told."
    width: 328
    height: 88
techniques: ["draw"]
skills:
  primary: ["geometry-cubes-paper"]
band: "grades-5-6"
difficulty: 5
