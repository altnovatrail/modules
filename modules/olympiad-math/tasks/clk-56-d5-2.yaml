id: "clk-56-d5-2"
statement:
  - text: "At 10:40 a motor boat sets off up a river, and at that moment a ball falls from it into the water and floats away with the current. At 11:05 the boat turns round and goes back down the river. Through the water, it always goes at the same speed. At what time does it reach the ball?"
givens: ["At 10:40 the boat sets off up the river, and a ball falls into the water.", "At 11:05 the boat turns round.", "Through the water the boat always goes at the same speed."]
unknown: "The time when the boat reaches the ball."
leading_question: "Look at the boat and the ball from the water, which carries them both along."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["Before 11:30, as the river speeds the boat up", "It depends on how fast the river flows", "At 12:10", "After 11:30, as the ball has floated on", "At 11:30"]
        check:
          kind: "choice"
          key: "At 11:30"
          trap_values:
            - value: "Before 11:30, as the river speeds the boat up"
              trap: "ignored-condition"
              text: "The river speeds the boat up on the way back, but it carries the ball away just as fast."
            - value: "It depends on how fast the river flows"
              trap: "stopped-early"
              text: "It can be told: the river carries the ball and the boat by the same amount, so it changes nothing between them."
            - value: "At 12:10"
              trap: "time-unit-mixup"
              text: "12:10 takes 11:05 − 10:40 as 65 minutes, as if an hour had 100 minutes. From 10:40 to 11:05 is 25 minutes."
            - value: "After 11:30, as the ball has floated on"
              trap: "ignored-condition"
              text: "The ball has floated on, but the river carries the boat just as far: between the two, the current changes nothing."
    simpler_case: "Try a lake with no current: the boat goes away from a ball for 10 minutes from 10:40, then turns. When does it reach the ball?"
solution:
  - text: "The river carries the ball and the boat by the same amount, so seen from the water the ball stays still and the boat goes at its own speed both ways. It moves away from the ball from 10:40 to 11:05, for 25 minutes, and takes 25 minutes to come back. So it reaches the ball at 11:30, however fast the river flows."
skills:
  primary: ["time-clocks"]
band: "grades-5-6"
difficulty: 5
