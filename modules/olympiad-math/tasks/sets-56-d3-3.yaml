id: "sets-56-d3-3"
statement:
  - text: "Each of the 40 pupils in a year learns English, German or both. 28 pupils learn English and 19 learn German. How many learn exactly one of the two languages?"
givens: ["Each of 40 pupils learns English, German or both.", "28 learn English and 19 German."]
unknown: "How many learn exactly one of the two."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "33"
          units: ["pupil", "pupils"]
          trap_values:
            - value: "40"
              trap: "stopped-early"
              text: "40 counts every pupil, also those who learn both."
            - value: "47"
              trap: "double-count"
              text: "47 is 28 + 19, which counts the pupils who learn both languages twice."
            - value: "7"
              trap: "answered-other-question"
              text: "7 is not the number who learn exactly one."
            - value: "12"
              trap: "missed-case"
              text: "12 is not everyone who learns exactly one language."
    simpler_case: "Try 10 pupils, 7 learning English and 5 German, each at least one. How many learn exactly one?"
solution:
  - text: "28 + 19 = 47 is 7 more than the 40 pupils, so 7 learn both. Then 28 - 7 = 21 learn only English and 19 - 7 = 12 learn only German, which makes 21 + 12 = 33."
