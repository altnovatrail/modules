id: "clk-12-d3-1"
statement:
  - text: "A cartoon lasts 25 minutes and ends at 5:10. At what time did it start?"
  - picture: "pictures/clk-12-d3-1.png"
    alt: "A clock showing 5:10."
    width: 200
    height: 200
  - text: "Write the time as hours and minutes, like 9:15."
givens: ["The cartoon lasts 25 minutes.", "It ends at 5:10."]
unknown: "The time when it started."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "choice"
          key: "4:45"
          options: ["4:15", "4:55", "4:85", "4:45", "5:35"]
          trap_values:
            - value: "4:15"
              trap: "wrong-operation"
              text: "4:15 is 55 minutes before 5:10."
            - value: "4:55"
              trap: "wrong-operation"
              text: "4:55 is only 15 minutes before 5:10."
            - value: "4:85"
              trap: "time-unit-mixup"
              text: "An hour has 60 minutes, not 100, so there is no 4:85."
            - value: "5:35"
              trap: "reversed-relation"
              text: "The cartoon started before it ended, so go back, not forward."
    simpler_case: "Try a cartoon that lasts 10 minutes and ends at 5:10. At what time did it start?"
solution:
  - text: "From 5:10 go back 10 minutes to 5:00, then 15 more minutes to 4:45. 10 + 15 = 25 minutes."
skills:
  primary: ["time-clocks"]
band: "grades-1-2"
difficulty: 3
