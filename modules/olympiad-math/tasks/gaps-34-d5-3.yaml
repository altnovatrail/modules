id: "gaps-34-d5-3"
statement:
  - text: "A square garden has a fence. Each side is 20 metres long. Posts stand every 4 metres along the fence, with a post in every corner. How many posts are there?"
givens: ["The garden is a square, and each side is 20 metres long.", "Posts stand every 4 metres along the fence.", "There is a post in every corner."]
unknown: "How many posts there are."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "20"
          units: ["post", "posts"]
          trap_values:
            - value: "5"
              trap: "answered-other-question"
              text: "5 is the number of gaps on one side."
            - value: "16"
              trap: "ignored-condition"
              text: "You forgot the 4 corner posts."
            - value: "21"
              trap: "off-by-one"
              text: "A closed fence has as many posts as gaps, not one more."
            - value: "24"
              trap: "double-count"
              text: "Each corner post belongs to two sides. You counted the corners twice."
    simpler_case: "Take one side first. How many posts stand on it, counting its corners? Then see which posts two sides share."
solution:
  - text: "The whole fence is 4 × 20 = 80 metres long and closed. 80 ÷ 4 = 20 gaps, and a closed fence has as many posts as gaps: 20."
techniques: ["draw", "small-numbers"]
leak_phrases: ["20 posts"]
skills:
  primary: ["counting-gaps"]
band: "grades-3-4"
difficulty: 5
