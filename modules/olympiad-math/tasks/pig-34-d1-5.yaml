  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["No, never", "Only if two of them are twins", "Yes, always", "Only if the party is in December", "It is impossible to tell"]
        check:
          kind: "choice"
          key: "Yes, always"
          trap_values:
