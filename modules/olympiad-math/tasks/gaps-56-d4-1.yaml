id: "gaps-56-d4-1"
statement:
  - text: "A circular path is 360 metres round. Lamps stand along it every 15 metres. They are replaced by new lamps every 40 metres, and the first new lamp stands where an old one stood. Where a new lamp stands at the place of an old one, it uses the old lamp's hole; everywhere else a new hole is dug. How many new holes are dug?"
givens: ["The circular path is 360 metres round.", "The old lamps stood every 15 metres.", "The new lamps stand every 40 metres, the first one where an old one stood.", "A new lamp at an old lamp's place uses the old hole."]
unknown: "How many new holes are dug."
leading_question: "At which places along the path do an old lamp and a new lamp stand together?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "6"
          units: ["hole", "holes", "new hole", "new holes"]
          trap_values:
            - value: "9"
              trap: "ignored-condition"
              text: "9 gives every new lamp a new hole, but 3 of them stand at old lamps' places and use old holes."
            - value: "15"
              trap: "wrong-operation"
              text: "15 takes the 9 new lamps away from the 24 old ones, which says nothing about which places are shared."
            - value: "7"
              trap: "off-by-one"
              text: "7 counts 10 new lamps, as if the path were straight with a lamp at both ends; on a closed path 360 metres is the same place as 0, so there are 9."
            - value: "3"
              trap: "answered-other-question"
              text: "3 is the number of old holes that are used again."
    simpler_case: "Try a circular path 60 metres round, old lamps every 10 metres and new ones every 15 metres, the first where an old one stood. How many new holes are dug?"
solution:
  - text: "Measured round the path from the first new lamp, the old lamps stood at every multiple of 15 metres. The new lamps stand at 0, 40, 80 and so on up to 320 metres: 360 ÷ 40 = 9 lamps, as many as gaps on a closed path. A new lamp is at an old lamp's place when its distance is a multiple of 15 as well: at 0, 120 and 240 metres. The other 9 − 3 = 6 new lamps need new holes."
techniques: ["draw", "small-numbers"]
skills:
  primary: ["counting-gaps"]
band: "grades-5-6"
difficulty: 4
