id: "gaps-12-d2-7"
statement:
  - text: "The picture shows a fence with its posts. The number under each gap is how many rails that gap takes. How many rails does the whole fence take?"
  - picture: "pictures/gaps-12-d2-7.png"
    alt: "A fence of 5 posts in a row, with the number 3 under every gap between two posts."
    width: 272
    height: 74
givens: ["The fence has posts in a row.", "The number under a gap is how many rails that gap takes."]
unknown: "How many rails the whole fence takes."
leading_question: "How many gaps are there between the posts?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "12"
          units: ["rail", "rails"]
          trap_values:
            - value: "15"
              trap: "off-by-one"
              text: "Count the gaps, not the posts."
            - value: "4"
              trap: "answered-other-question"
              text: "That is the gaps, not the rails."
            - value: "3"
              trap: "stopped-early"
              text: "That is one gap, not the fence."
