              text: "The posts and rails were added."
    simpler_case: "Try a fence of 2 posts first. How many gaps does it have?"
solution:
  - text: "There are 5 posts, so there are 4 gaps between them. Each gap takes 3 rails, so the fence takes 4 × 3 = 12 rails."
  - text: "4 × 3 = 12"
