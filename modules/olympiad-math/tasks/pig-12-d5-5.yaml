    simpler_case: "Try a box of 3 apples, some red and some green, where any two apples taken have a red one among them. How many green apples can there be?"
solution:
  - text: "If there were 3 red apples, you could take 3 red ones with no green. So there are at most 2 red apples, and in the same way at most 2 green ones. There are 4 apples in all, so 2 of them are red."
