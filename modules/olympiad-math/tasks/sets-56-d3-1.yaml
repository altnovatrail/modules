id: "sets-56-d3-1"
statement:
  - text: "In a group of 20 children, 12 have a dog (D) and 10 have a cat (C). What is the smallest number of children who could have both a dog and a cat?"
  - picture: "pictures/sets-56-d3-1.png"
    alt: "Two overlapping circles, D of 12 and C of 10, inside a box of 20, with the overlap marked ?."
    width: 256
    height: 212
givens: ["The group has 20 children.", "12 have a dog and 10 have a cat."]
unknown: "The smallest number who could have both."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "2"
          units: ["child", "children"]
          trap_values:
            - value: "0"
              trap: "ignored-condition"
              text: "0 forgets there are only 20 children, too few for 12 and 10 to stay apart."
            - value: "10"
              trap: "reversed-relation"
              text: "10 is the largest number who could have both, not the smallest."
            - value: "22"
              trap: "double-count"
              text: "22 is not a number of children with both pets."
            - value: "8"
              trap: "answered-other-question"
              text: "8 is not the number with both pets."
    simpler_case: "Try 10 children, 6 with a dog and 5 with a cat. What is the smallest number who could have both?"
solution:
  - text: "Keeping the two groups apart would need 12 + 10 = 22 children, but there are only 20. So at least 22 - 20 = 2 children have both, and 2 is possible: 10 with only a dog, 8 with only a cat and 2 with both."
skills:
  primary: ["logic-sets"]
band: "grades-5-6"
difficulty: 3
