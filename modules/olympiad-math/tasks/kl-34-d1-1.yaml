id: "kl-34-d1-1"
statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Which of these sentences can no islander ever say?"
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar."]
unknown: "Which sentence no islander can ever say."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["I am a knight.", "2 + 2 = 4.", "2 + 2 = 5.", "I am a liar.", "I am not a liar."]
        check:
          kind: "choice"
          key: "I am a liar."
          trap_values:
            - value: "I am a knight."
              trap: "trusted-statement"
              text: "Both can say it: a knight truthfully, a liar falsely."
            - value: "2 + 2 = 4."
              trap: "ignored-condition"
              text: "A knight can say it, because it is true."
            - value: "2 + 2 = 5."
              trap: "ignored-condition"
              text: "A liar can say it, because it is false."
            - value: "I am not a liar."
              trap: "trusted-statement"
              text: "'I am not a liar' means the same as 'I am a knight', so both a knight and a liar can say it."
    simpler_case: "Try one sentence: can a liar say '2 + 2 = 4'?"
solution:
  - text: "A knight cannot say 'I am a liar', because it would be false. A liar cannot say it either, because it would be true. Every other sentence can be said: a knight can say a true one, a liar a false one, and both can say 'I am a knight' or 'I am not a liar'."
techniques: ["opposite"]
