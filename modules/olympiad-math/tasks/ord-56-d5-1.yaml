id: "ord-56-d5-1"
statement:
  - text: "Six runners finished a race: Ann, Ben, Cat, Dan, Eve and Fay. Dan finished after Cat but before Eve. Ann finished right after Dan, and Ben right after Eve. Eve did not finish next to Ann. Who finished fourth?"
givens: ["Ann, Ben, Cat, Dan, Eve and Fay ran a race.", "Dan finished after Cat but before Eve.", "Ann finished right after Dan, and Ben right after Eve.", "Eve did not finish next to Ann."]
unknown: "Who finished fourth."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "choice"
          notation: "word"
          key: "Fay"
          options: ["Cat", "Eve", "Ann", "Dan", "Fay"]
          trap_values:
            - value: "Cat"
              trap: "ignored-condition"
              text: "Cat is fourth only if she need not finish before Dan, but Dan finished after Cat."
            - value: "Eve"
              trap: "ignored-not"
              text: "Eve is fourth only if she came right after Ann, but Eve did not finish next to Ann."
            - value: "Ann"
              trap: "reversed-relation"
              text: "Ann is fourth if Ben came right before Eve, but Ben finished right after Eve."
            - value: "Dan"
              trap: "reversed-relation"
              text: "Dan is fourth if Ann finished right before him, but Ann finished right after Dan."
    simpler_case: "Try five runners, Ann, Ben, Cat, Dan and Eve: Dan finished after Cat, Ann right after Dan, and Ben right after Eve, who finished after Ann. Who finished fourth?"
solution:
  - text: "Cat finished before Dan, Ann right after Dan, and Eve, with Ben right after her, later than Dan. Eve did not finish next to Ann, so someone finished between Ann and Eve, and Fay is the only runner left for that place. Cat is then first: Cat, Dan, Ann, Fay, Eve, Ben. Fay finished fourth."
