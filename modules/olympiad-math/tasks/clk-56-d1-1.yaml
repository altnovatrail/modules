id: "clk-56-d1-1"
statement:
  - text: "A baker wants fresh bread when the shop opens at 7:00. Mixing the dough takes 20 minutes, letting it rise takes 2 hours, baking takes 40 minutes and cooling takes 15 minutes. The oven needs 30 minutes to heat up, and it can heat while the dough rises. What is the latest time the baker can start?"
  - text: "Write the time as hours and minutes, like 9:15."
givens: ["The shop opens at 7:00.", "Mixing takes 20 minutes, rising 2 hours, baking 40 minutes and cooling 15 minutes.", "The oven needs 30 minutes to heat up and can heat while the dough rises."]
unknown: "The latest time the baker can start."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "choice"
          key: "3:45"
          options: ["4:00", "3:15", "10:15", "3:45", "3:35"]
          trap_values:
            - value: "4:00"
              trap: "stopped-early"
              text: "4:00 leaves out the 15 minutes of cooling, but the bread has to be cool by 7:00."
            - value: "3:15"
              trap: "ignored-condition"
              text: "3:15 adds the oven's 30 minutes as a step of its own, but the oven heats while the dough rises."
            - value: "10:15"
              trap: "reversed-relation"
              text: "10:15 adds the 3 hours 15 minutes of work to 7:00, but the work has to be done before the shop opens, not after."
            - value: "3:35"
              trap: "time-unit-mixup"
              text: "3:35 turns the minutes of work into hours the wrong way: a quarter of an hour is 15 minutes, not 25."
    simpler_case: "Try bread that only rises for 2 hours and bakes for 40 minutes, ready at 7:00. What is the latest time to start?"
solution:
  - text: "Going back from 7:00: cooling takes 15 minutes, so baking must end by 6:45 and start by 6:05. The dough rises for the 2 hours before that, from 4:05, and the oven heats during the rise, so it adds no time. Mixing takes the 20 minutes before 4:05, so the baker must start by 3:45."
