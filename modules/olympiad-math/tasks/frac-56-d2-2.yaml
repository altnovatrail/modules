id: "frac-56-d2-2"
statement:
  - text: "A pack holds 24 crayons. Ben takes a quarter of the pack, and Lucy takes a third of the whole pack. How many crayons are left in the pack?"
givens: ["A pack holds 24 crayons.", "Ben takes a quarter of the pack, and Lucy a third of the whole pack."]
unknown: "How many crayons are left."
leading_question: "Work out each child's share of the full pack before taking anything away."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "10"
          units: ["crayon", "crayons"]
          trap_values:
            - value: "14"
              trap: "answered-other-question"
              text: "14 is how many crayons Ben and Lucy take, not how many are left."
            - value: "12"
              trap: "part-whole-swap"
              text: "12 takes Lucy's third from the 18 crayons Ben left, but she takes a third of the whole pack."
            - value: "18"
              trap: "stopped-early"
              text: "18 takes away only Ben's quarter; Lucy's crayons still have to come out."
            - value: "17"
              trap: "wrong-operation"
              text: "17 is 24 - 4 - 3: the 4 and the 3 of a quarter and a third were taken away as crayons instead of dividing 24 by them."
    simpler_case: "Try a pack of 12 crayons, with Ben taking a quarter and Lucy a half of the whole pack. How many are left?"
solution:
  - text: "A quarter of 24 is 6 and a third of 24 is 8. Together they take 6 + 8 = 14 crayons, so 24 - 14 = 10 are left."
