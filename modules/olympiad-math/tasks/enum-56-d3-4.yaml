id: "enum-56-d3-4"
statement:
  - text: "The picture shows a garden on squared paper, and its lines are walls. A beetle starts in cell S and moves from a cell to the cell next to it, never through a wall. How many cells can the beetle reach, counting S?"
  - picture: "pictures/enum-56-d3-4.png"
    alt: "A garden on squared paper, six cells across and six down, S in the top left cell. Walls: down the right side of the second column from the top, 3 cells long; along the bottom of the third row under the first two columns; down the right side of the fourth column from the bottom of the second row to the bottom edge, 4 cells long; along the bottom of the second row under the fifth and sixth columns; and along the bottom of the fourth row under the third and fourth columns."
    width: 288
    height: 288
givens: ["The lines of the garden are walls.", "The beetle starts in cell S.", "It moves to the cell next to it, never through a wall."]
unknown: "How many cells the beetle can reach, counting S."
leading_question: "Which part of the garden do the walls close off from S?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "6"
          units: ["cell", "cells"]
          trap_values:
