id: "ord-56-d3-3"
statement:
  - text: "Five friends stand in a row for a photo: Alice, Ben, Dev, Ella and Kira. Alice (A) stands first on the left. Kira and Dev do not stand next to each other. Dev and Ella do not stand next to each other either. Kira stands somewhere to the left of Dev. Who stands last on the right?"
  - picture: "pictures/ord-56-d3-3.png"
    alt: "Five places in a row, the first on the left marked A."
    width: 272
    height: 74
givens: ["Alice, Ben, Dev, Ella and Kira stand in a row, and Alice first on the left.", "Kira and Dev do not stand next to each other, nor Dev and Ella.", "Kira stands somewhere to the left of Dev."]
unknown: "Who stands last on the right."
leading_question: "Which friend may stand next to the fewest of the others? Where in the row can a friend with only one possible neighbour stand?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "choice"
          notation: "word"
          key: "Dev"
          options: ["Kira", "Ella", "Ben", "Dev", "It is impossible to tell"]
          trap_values:
            - value: "Kira"
              trap: "reversed-relation"
              text: "Kira stands to the left of another friend, so she cannot be last."
            - value: "Ella"
              trap: "ignored-condition"
              text: "With Ella last, two friends who do not stand together would end up side by side."
            - value: "Ben"
              trap: "ignored-condition"
              text: "With Ben last, the friends who do not stand together cannot all be kept apart."
            - value: "It is impossible to tell"
              trap: "ignored-condition"
              text: "Without Alice at the left end, several friends could be last; with her there, only one can."
    simpler_case: "Try four friends, Alice, Ben, Gil and Kira: Alice stands first on the left, Kira and Gil do not stand next to each other, and Kira stands to the left of Gil. Who stands second?"
solution:
  - text: "Dev may not stand next to Kira or Ella. Alice could be next to him only if Dev were 2nd, but then Kira, who is to his left, would have to be 1st, where Alice is. So Dev's only possible neighbour is Ben, and Dev must stand at an end. The left end is Alice's, so Dev is last."
skills:
  primary: ["logic-ordering"]
band: "grades-5-6"
difficulty: 3
