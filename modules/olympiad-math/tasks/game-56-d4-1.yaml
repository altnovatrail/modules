    simpler_case: "Try a bag of 3 marbles with the same rules. How many should Nina remove?"
solution:
  - text: "A bag loses for the player about to move when every move leaves a winning bag. Going up from 0, the losing bags are 0, 2, 7, 9 and 14. From 15 only removing 1 leaves one of them, 14. From then on Nina can always hand Oscar another losing bag, until she empties it."
