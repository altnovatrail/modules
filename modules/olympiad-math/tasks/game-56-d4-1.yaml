  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "1"
          units: ["marble", "marbles"]
          trap_values:
            - value: "4"
              trap: "best-case-not-worst"
              text: "Removing 4 leaves 11. Oscar removes 4 as well and leaves 7, a losing bag for Nina."
            - value: "3"
              trap: "ignored-condition"
              text: "Removing 3 leaves 12, a losing pile in a game of 1, 2 or 3. Here Oscar removes 3 and leaves 9, which loses for Nina."
            - value: "2"
              trap: "ignored-condition"
