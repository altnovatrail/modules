# The numbers of reference task pct-56-d4-1: eaten 6.
# Its leading question is the hint of pct-56-d4-1, as it stands (amendment T51 to R22).
# The red apples eaten are the number that the statement shows and the template varies: 4, 6 or 8,
# so that a quarter and a tenth stay whole; the 25% and the 10% stay those of the reference task, as
# in standalone's fits. The trap values are derived numbers, its mistakes; the one that takes the
# drop from 25% to 10% as 15% of the basket is whole only for 6, and is left out.
