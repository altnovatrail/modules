id: counts
template:
  parameters:
    eaten: {from: 4, to: 8}
  derived:
    red: "3 * eaten // 2"
    others: "9 * eaten // 2"
    all_red: "4 * eaten"
  constraint: eaten % 2 == 0
  solver:
    program: |
      # For "what percentage" or "how many, if so many per cent": try every total
      # and keep the ones for which everything the question says is true, the
      # percentages taken of whole numbers only.

      def percent_of(count, percent):
          if count * percent % 100 != 0:
              return None
          return count * percent // 100

      def fits(total, eaten):
          red = percent_of(total, 25)
          if red == None or red < eaten:
              return False
          return (red - eaten) * 100 == (total - eaten) * 10

      def solve(numbers):
          totals = [total for total in range(1, 1001) if fits(total, numbers["eaten"])]
          if len(totals) != 1:
              fail("%d totals fit, and the question has one" % len(totals))
          return {"apples": totals[0]}
    results: [apples]
statement:
  - text: In a basket, 25% of the apples are red. After {eaten} red apples are eaten, 10% of the apples left are red. How many apples were in the basket at first?
givens:
  - "25% of the apples are red."
  - After {eaten} red apples are eaten, 10% of the apples left are red.
unknown: How many apples were in the basket at first.
leading_question: The apples that are not red stay in the basket. What share of it are they before and after?
canvas:
  kind: handwriting_sheet
  grid: squares
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "{apples}"
          units: [apple, apples]
          trap_values:
            - value: "{red}"
              trap: part-whole-swap
              text: That is only part of the basket.
            - value: "{others}"
              trap: part-whole-swap
              text: That is only part of the basket.
            - value: "{all_red}"
              trap: ignored-condition
              text: That takes the {eaten} eaten apples as all the red apples, but not all of them were eaten.
    simpler_case: Try a basket where 50% of the apples are red, and after 2 red apples are eaten a third of the apples left are red. How many apples were there?
solution:
  - text: The apples that are not red stay. At first there are 3 of them for every red apple, and later 9 for every red apple. So the {eaten} eaten apples are 2/9 of the others, and there are {others} other apples and {red} red ones, {apples} apples at first.
leak_phrases: ["{apples} apples at first"]
skills:
  primary: [percent-basic]
band: grades-5-6
difficulty: 4
