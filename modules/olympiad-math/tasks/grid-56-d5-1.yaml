id: "grid-56-d5-1"
statement:
  - text: "A rectangle is drawn along the lines of squared paper, and it is not a square. The number of cells inside it equals the number of cell sides around its edge. How many cells long are its sides?"
givens: ["The rectangle is drawn along the lines of squared paper, and it is not a square.", "The cells inside it are as many as the cell sides round its edge."]
unknown: "How many cells long its sides are."
leading_question: "Write the number of cells and the number of sides around the edge in terms of the two sides. Then try the shorter side as 1, 2, 3 and so on."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["3 and 6", "4 and 4", "2 and 5", "2 and 2", "4 and 5"]
        check:
          kind: "choice"
          key: "3 and 6"
          trap_values:
            - value: "4 and 4"
              trap: "ignored-condition"
              text: "4 and 4 gives 16 cells and 16 sides, but it is a square, which the question rules out."
            - value: "2 and 5"
              trap: "area-perimeter-swap"
              text: "2 and 5 has 10 cells, all of them along its edge, but the edge has 14 cell sides. It counts cells where sides are asked for."
            - value: "2 and 2"
              trap: "wrong-operation"
              text: "2 and 2 has 4 cells and 8 sides around it: it adds one width and one length instead of all four sides. It is a square, too, which the question rules out."
            - value: "4 and 5"
              trap: "stopped-early"
              text: "4 and 5 has 20 cells and 18 sides, close but not equal. The search has to go on."
    simpler_case: "Try a rectangle of 2 by 3 cells. How many cells are inside, and how many cell sides round its edge?"
solution:
  - text: "Say the shorter side is a cells and the longer b cells. The rectangle holds a × b cells and has 2 × (a + b) sides around it. With a = 3, 3b = 6 + 2b gives b = 6: 18 cells and 18 sides. With a = 4 the longer side is 4 as well, a square. With a = 1 or 2 the sides always outnumber the cells, and with a = 5 or more the cells outnumber the sides, since b is at least as long as a. So the sides are 3 and 6."
techniques: ["draw"]
leak_phrases: ["3 and 6", "3 by 6", "6 by 3"]
skills:
  primary: ["geometry-grid"]
band: "grades-5-6"
difficulty: 5
