id: digits
template:
  parameters:
    digit_sum: {from: 3, to: 7}
  derived:
    forgot_last: digit_sum * (digit_sum + 1) // 2 - 1
    with_zero: (digit_sum + 1) * (digit_sum + 2) // 2
  solver:
    program: |
      # For "how many numbers" with a property of their digits: go through every
      # number of the range and test its digits, taken off one at a time with % 10
      # and // 10.

      def digits(number):
          found = []
          while number > 0:
              found.append(number % 10)
              number = number // 10
          return found

      def total(values):
          # The dialect of the format has no sum, so add them up.
          result = 0
          for value in values:
              result += value
          return result

      def solve(numbers):
          wanted = numbers["digit_sum"]
          return {"count": len([n for n in range(100, 1000) if total(digits(n)) == wanted])}
    results: [count]
statement:
  - text: How many three-digit numbers have digits that add up to {digit_sum}?
givens:
  - The numbers have three digits.
  - Their digits add up to {digit_sum}.
unknown: How many such numbers there are.
canvas:
  kind: handwriting_sheet
  grid: squares
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "{count}"
          units: [number, numbers]
          trap_values:
            - value: "{digit_sum}"
              trap: number-from-text
              text: That is the sum of the digits, not how many numbers there are.
            - value: "{forgot_last}"
              trap: missed-case
              text: You missed a number. Do not forget the one that starts with {digit_sum}.
            - value: "{with_zero}"
              trap: ignored-condition
              text: A three-digit number cannot start with 0.
    simpler_case: Try three-digit numbers whose digits add up to 1. How many are there?
solution:
  - text: Go through the first digit from 1 to {digit_sum}. The other two digits share what is left, and each way of sharing it gives one number.
  - text: Adding the numbers for every first digit gives {count}.
techniques: [systematic]
leak_phrases: ["{count} numbers"]
skills:
  primary: [combinatorics-enumeration]
band: grades-3-4
difficulty: 5
