id: "tri-34-d3-6"
statement:
  - text: "In the picture, each shape stands for a number, the same number every time. The number beside a row is the sum of its shapes. What number is the question mark?"
  - picture: "pictures/tri-34-d3-6.png"
    alt: "Four rows of shapes. The first row has a triangle and a square, with 9 beside it. The second row has a square and a circle, with 7 beside it. The third row has a triangle and a circle, with 8 beside it. The fourth row has a triangle, a square and a circle, with a question mark beside it."
    width: 199
    height: 184
givens: ["Each shape stands for a number, the same number every time.", "The number beside a row is the sum of its shapes."]
unknown: "The number that the question mark stands for."
leading_question: "What do the first three rows add up to together?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "12"
          trap_values:
            - value: "15"
              trap: "missed-case"
              text: "That adds two rows and leaves one out."
            - value: "24"
              trap: "stopped-early"
              text: "The three rows count each shape twice."
            - value: "8"
              trap: "number-from-text"
              text: "That is one of the sums."
