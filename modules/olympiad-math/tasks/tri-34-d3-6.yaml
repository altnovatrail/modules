    simpler_case: "Try a triangle and a square that make 5, and two triangles that make 4. What is the square?"
solution:
  - text: "The first three rows together hold each shape twice, and they add up to 9 plus 7 plus 8, which is 24. So one of each shape is half of 24, which is 12."
  - text: "24 ÷ 2 = 12"
