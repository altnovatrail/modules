id: "par-56-d4-2"
statement:
  - text: "Eight lamps stand in a row, and all of them are off. In one move you switch three lamps that stand next to each other: those that were off go on, and those that were on go off. What is the smallest number of moves after which all eight lamps are on?"
givens: ["Eight lamps stand in a row, all off.", "In one move three lamps next to each other are switched."]
unknown: "The smallest number of moves after which all eight are on."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["4", "8", "It can never be done", "3", "6"]
        check:
          kind: "choice"
          key: "It can never be done"
          trap_values:
            - value: "4"
              trap: "wrong-parity"
              text: "Each move switches one of the lamps 1, 4 and 7, and 4 switches among them leave one off."
            - value: "8"
              trap: "number-from-text"
              text: "8 is the number of lamps, copied from the question."
            - value: "3"
              trap: "ignored-condition"
              text: "3 moves switch 9 lamps, so some lamp is switched twice, and the second switch turns it off again."
            - value: "6"
              trap: "wrong-parity"
              text: "Each move switches one of the lamps 1, 4 and 7, and 6 switches among them leave one off."
    simpler_case: "Try 3 lamps in a row first, switching all three in a move. How many moves does it take?"
solution:
  - text: "Three lamps next to each other always include exactly one of the lamps 1, 4 and 7, one of 2, 5 and 8, and one of 3 and 6. So each of these groups gets exactly as many switches in all as there are moves. For all the lamps to be on, each lamp needs an odd number of switches. Then lamps 1, 4 and 7 get an odd number in all, because three odd numbers add up to an odd number, while lamps 3 and 6 get an even number in all, because two odd numbers add up to an even number. The number of moves cannot be odd and even at once, so it can never be done."
techniques: ["parity"]
skills:
  primary: ["parity-alternation"]
band: "grades-5-6"
difficulty: 4
