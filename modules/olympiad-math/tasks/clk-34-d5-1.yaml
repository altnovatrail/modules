id: "clk-34-d5-1"
statement:
  - text: "A wall clock with 12 hours on its face goes 6 minutes too fast every day. At noon today it shows the right time. After how many days will it next show the right time?"
  - picture: "pictures/clk-34-d5-1.png"
    alt: "A clock showing 12 o'clock."
    width: 200
    height: 200
givens: ["The clock has 12 hours on its face.", "It goes 6 minutes too fast every day.", "At noon today it shows the right time."]
unknown: "After how many days it next shows the right time."
