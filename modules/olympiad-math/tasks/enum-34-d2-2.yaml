id: "enum-34-d2-2"
statement:
  - text: "Kolya has many 1-cent, 2-cent and 5-cent coins. In how many different ways can he pay exactly 7 cents? The order of the coins does not matter."
givens: ["Kolya has many 1-cent, 2-cent and 5-cent coins.", "He pays exactly 7 cents.", "The order of the coins does not matter."]
unknown: "In how many different ways he can pay."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "6"
          units: ["way", "ways"]
          trap_values:
            - value: "4"
              trap: "missed-case"
              text: "You missed some ways. Try with and without the 5-cent coin, then count the 2-cent coins."
            - value: "5"
              trap: "missed-case"
              text: "You missed one way. Seven 1-cent coins also count."
            - value: "7"
              trap: "number-from-text"
              text: "7 is the amount in cents, not the number of ways."
            - value: "8"
              trap: "off-by-one"
              text: "Check that each way adds up to exactly 7 cents, and that no way is counted twice."
    simpler_case: "Count the ways with a 5-cent coin first, and then the ways without one."
solution:
  - text: "With a 5-cent coin: 5 + 2 or 5 + 1 + 1. Without it: three 2-cent coins and one 1-cent coin, two 2-cent coins and three 1-cent coins, one 2-cent coin and five 1-cent coins, or seven 1-cent coins. That is 2 + 4 = 6 ways."
