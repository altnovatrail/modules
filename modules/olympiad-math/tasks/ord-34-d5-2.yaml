statement:
  - text: "Five friends ran a race. Eva was neither first nor last. Fedor finished right after Eva. Gosha finished before Eva. Ivan finished right after Gosha. Hanna finished after Fedor. Who finished fourth?"
givens: ["Five friends ran a race.", "Eva was neither first nor last, and Fedor finished right after Eva.", "Gosha finished before Eva, and Ivan right after Gosha.", "Hanna finished after Fedor."]
unknown: "Who finished fourth."
