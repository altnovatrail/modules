id: "frac-56-d3-3"
statement:
  - text: "In a car park, 5/8 of the cars are red and the rest are blue. There are 6 more red cars than blue cars. How many cars are in the car park?"
givens: ["5/8 of the cars are red, and the rest are blue.", "There are 6 more red cars than blue cars."]
unknown: "How many cars are in the car park."
leading_question: "What fraction of the cars are blue, and how big is the gap between the two fractions?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "24"
          units: ["car", "cars"]
          trap_values:
            - value: "15"
              trap: "part-whole-swap"
              text: "15 is only part of the car park."
            - value: "9"
              trap: "part-whole-swap"
              text: "9 is only part of the car park."
            - value: "16"
              trap: "ignored-condition"
              text: "16 takes the 6 as the number of blue cars, but 6 is how many more red cars there are."
            - value: "6"
              trap: "number-from-text"
              text: "6 is the gap between the red and the blue cars, copied from the question."
    simpler_case: "Try a car park where 3/4 of the cars are red and there are 4 more red cars than blue. How many cars are there?"
solution:
  - text: "The blue cars are 3/8 of all the cars, so there are 5/8 - 3/8 = 2/8 of the cars more red ones. That 2/8 is 6 cars, so 1/8 is 3 cars, and there are 8 × 3 = 24 cars: 15 red and 9 blue."
