statement:
  - text: "Petya's watch is 10 minutes slow, but he thinks it is 10 minutes fast. He wants to arrive at school at 9:00, and the walk takes 20 minutes. He leaves home when he believes the real time is 8:40. How many minutes late does he arrive?"
givens: ["Petya's watch is 10 minutes slow, but he thinks it is 10 minutes fast.", "He wants to arrive at school at 9:00, and the walk takes 20 minutes.", "He leaves when he believes the real time is 8:40."]
