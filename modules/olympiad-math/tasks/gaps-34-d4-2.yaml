id: "gaps-34-d4-2"
statement:
  - text: "The pages of a book are numbered 1, 2, 3 and so on. Exactly 39 digits were printed. How many pages does the book have?"
givens: ["The pages are numbered 1, 2, 3 and so on.", "Exactly 39 digits were printed."]
unknown: "How many pages the book has."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "24"
          units: ["page", "pages"]
          trap_values:
            - value: "20"
              trap: "wrong-operation"
              text: "You split all 39 digits into pairs, but pages 1 to 9 have one digit each."
            - value: "25"
              trap: "off-by-one"
              text: "Count the two-digit pages again: they start at page 10, so find the page they end on."
            - value: "30"
              trap: "stopped-early"
              text: "30 is the number of digits on two-digit pages. Each such page uses 2 digits."
            - value: "39"
              trap: "number-from-text"
              text: "39 is the number of digits, not pages."
    simpler_case: "Try a book whose page numbers use 15 digits in all. How many pages does it have?"
solution:
  - text: "Pages 1 to 9 use 9 digits. The other 39 - 9 = 30 digits are on two-digit pages: 30 ÷ 2 = 15 pages, from 10 to 24. So the book has 24 pages."
