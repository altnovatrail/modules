      - binding: "anywhere"
        check:
          kind: "number"
          key: "72"
          trap_values:
            - value: "27"
              trap: "reversed-relation"
              text: "27 is YX, the smaller number; XY − YX = 45 makes XY the larger one."
            - value: "99"
              trap: "number-from-text"
              text: "99 is the sum of the two numbers, copied from the question."
            - value: "45"
              trap: "number-from-text"
              text: "45 is the difference of the two numbers, copied from the question."
            - value: "54"
              trap: "wrong-operation"
              text: "54 takes the difference away from the sum, 99 − 45, which gives twice YX, not XY."
    simpler_case: "Try XY + YX = 55 and XY − YX = 9."
solution:
  - text: "XY + YX is 11 times the sum X + Y, so X + Y = 9. XY − YX is 9 times the difference X − Y, so X − Y = 5. So X = 7 and Y = 2, and XY is 72. Check: 72 + 27 = 99 and 72 − 27 = 45."
