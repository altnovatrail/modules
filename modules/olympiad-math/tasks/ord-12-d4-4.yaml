  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["the jam", "the honey", "the pickles", "the salt", "It is impossible to tell"]
        check:
          kind: "choice"
          key: "the pickles"
          trap_values:
            - value: "the jam"
              trap: "stopped-early"
              text: "The jam is just to the right of the honey, but the last fact still has to fit."
