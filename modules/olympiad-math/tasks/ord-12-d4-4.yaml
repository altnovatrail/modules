statement:
  - text: "Four jars stand on a shelf: jam, honey, salt and pickles. The salt is at the left end. The honey is not at either end. The jam stands just to the right of the honey. The pickles are not next to the salt. Which jar is at the right end?"
givens: ["Four jars stand on a shelf: jam, honey, salt and pickles.", "The salt is at the left end, and the honey at neither end.", "The jam stands just to the right of the honey.", "The pickles are not next to the salt."]
unknown: "Which jar is at the right end."
