    simpler_case: "Try three jars, jam, honey and salt: the salt is at the left end, and the jam just to the right of the honey. Which jar is at the right end?"
solution:
  - text: "The salt is 1st. The pickles are not next to the salt, so the 2nd jar is the honey or the jam. The jam is just to the right of the honey, so the honey is 2nd and the jam is 3rd. The pickles are at the right end."
