id: "fig-34-d1-1"
statement:
  - text: "The filled cells in the picture make a figure. How many squares of any size are made only of filled cells?"
  - picture: "pictures/fig-34-d1-1.png"
    alt: "A square of three by three cells, all filled but the top right corner."
    width: 168
    height: 168
givens: ["The filled cells make a figure."]
unknown: "How many squares of any size are made only of filled cells."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "11"
          units: ["square", "squares"]
          trap_values:
            - value: "9"
              trap: "answered-other-question"
              text: "That is the cells of a full square."
            - value: "14"
              trap: "ignored-condition"
              text: "A square with the empty cell does not count."
            - value: "8"
              trap: "missed-case"
              text: "Bigger squares count too."
            - value: "12"
              trap: "double-count"
              text: "Some squares were counted twice."
    simpler_case: "Try a square of 2 by 2 filled cells. How many squares of any size are there?"
solution:
  - text: "There are 8 small squares, one for each filled cell. A square of four cells fits in 3 places, and the fourth place has the empty cell. A square of nine cells would need the empty cell too. So there are 8 + 3 = 11 squares."
  - text: "8 + 3 = 11"
  - picture: "pictures/fig-34-d1-1-solution.png"
    alt: "Cells marked 1 to 3 at the top left corners of the squares of four cells."
    width: 168
    height: 168
