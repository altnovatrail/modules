id: "tri-56-d3-2"
statement:
  - text: "Anya thought of a number. She added half of the number to it, and then she added 5. She got 50. What number did Anya think of?"
givens: ["Anya added half of her number to it, and then added 5.", "She got 50."]
unknown: "The number Anya thought of."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "30"
          trap_values:
            - value: "45"
              trap: "stopped-early"
              text: "45 is the number and its half together; the number is two thirds of it."
            - value: "15"
              trap: "answered-other-question"
              text: "15 is half of the number, not the number."
            - value: "90"
              trap: "ignored-condition"
              text: "90 leaves out the number itself and makes half of the number equal to 45."
            - value: "22.5"
              trap: "wrong-operation"
              text: "22.5 halves 45, but 45 is three halves of the number, not two."
    simpler_case: "Try a number that gives 9 when you add half of it to it."
solution:
  - text: "Without the 5, the number and its half make 45. That is three halves of the number, so one half is 45 ÷ 3 = 15, and the number is 30. Check: 30 + 15 + 5 = 50."
skills:
  primary: ["arithmetic-tricks"]
band: "grades-5-6"
difficulty: 3
