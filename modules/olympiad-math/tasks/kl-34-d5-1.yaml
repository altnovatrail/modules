id: "kl-34-d5-1"
statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Ten islanders sit at a round table. Each of them says: 'Both my neighbours are liars.' What is the largest number of knights that can be at the table?"
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Ten islanders sit at a round table.", "Each says: 'Both my neighbours are liars.'"]
unknown: "The largest number of knights that can be at the table."
