id: "grid-56-d2-3"
statement:
  - text: "A garden is a 4 by 4 grid of square beds, with rows A to D and columns 1 to 4. Roses grow in beds B2, B3, C2 and C3. How many other beds share a whole side with a rose bed?"
  - picture: "pictures/grid-56-d2-3.png"
    alt: "A 4 by 4 grid with rows A to D from the top and columns 1 to 4 from the left; beds B2, B3, C2 and C3 are shaded."
    width: 185
    height: 190
givens: ["The garden is a 4 by 4 grid of beds, rows A to D and columns 1 to 4.", "Roses grow in B2, B3, C2 and C3."]
unknown: "How many other beds share a whole side with a rose bed."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "8"
          units: ["bed", "beds"]
          trap_values:
            - value: "6"
              trap: "missed-case"
              text: "6 leaves out the two beds along one side."
            - value: "12"
              trap: "ignored-condition"
              text: "12 adds the corner beds, which only touch at a point."
            - value: "4"
              trap: "answered-other-question"
              text: "4 is the number of rose beds themselves."
            - value: "16"
              trap: "double-count"
              text: "16 gives every rose bed four neighbours, rose beds among them."
    simpler_case: "Try a 3 by 3 grid with a rose in the corner bed A1. How many beds share a whole side with it?"
solution:
  - text: "Two beds touch each of the four sides of the rose square: A2 and A3 above, D2 and D3 below, B1 and C1 on the left, B4 and C4 on the right. That makes 8 beds."
  - text: "2 + 2 + 2 + 2 = 8"
  - picture: "pictures/grid-56-d2-3-solution.png"
    alt: "The same grid with the beds round the roses numbered 1 to 8: A2, A3, B4, C4, D3, D2, C1 and B1."
    width: 185
    height: 190
techniques: ["draw"]
skills:
  primary: ["geometry-grid"]
band: "grades-5-6"
difficulty: 2
