id: "clk-56-d1-3"
statement:
  - text: "A storyteller cat tells a tale, then sings a song, then tells a tale again, and so on, with no breaks. A tale takes 7 minutes and a song 4 minutes. The cat starts its first tale at 9:00. How many minutes after 10:00 does it start its next song?"
  - picture: "pictures/clk-56-d1-3.png"
    alt: "A clock showing 9 o'clock."
    width: 200
    height: 200
givens: ["A tale takes 7 minutes and a song 4 minutes.", "The cat tells a tale, sings a song, tells a tale again, and so on, with no breaks.", "It starts its first tale at 9:00."]
unknown: "How many minutes after 10:00 it starts its next song."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "2"
          units: ["minute", "minutes"]
          trap_values:
            - value: "3"
              trap: "ignored-condition"
              text: "3 forgets the songs between the tales: with tales alone, the tale under way at 10:00 would have begun at 9:56 and end at 10:03."
            - value: "5"
              trap: "answered-other-question"
              text: "5 minutes is how long the cat has been telling its tale at 10:00, not when the song starts."
            - value: "6"
              trap: "reversed-relation"
              text: "6 puts each song before its tale, but the cat tells a tale first and sings after it."
            - value: "7"
              trap: "stopped-early"
              text: "7 is the length of a whole tale, but the tale under way at 10:00 began before 10:00."
    simpler_case: "Try 9:30. How many minutes after 9:30 does the cat start its next song?"
solution:
  - text: "A tale and the song after it take 7 + 4 = 11 minutes, so tales start at 9:00, 9:11, 9:22, 9:33, 9:44 and 9:55. At 10:00 the cat is 5 minutes into the tale it began at 9:55, which ends at 10:02. So its next song starts 2 minutes after 10:00."
skills:
  primary: ["time-clocks"]
band: "grades-5-6"
difficulty: 1
