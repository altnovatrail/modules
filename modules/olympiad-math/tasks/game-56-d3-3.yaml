  - text: "A bowl of 1 loses for the player whose turn it is, since she must eat the last sweet. A bowl of 4 loses too: after 1 or 2 sweets, the other player leaves 1. In the same way 7 and 10 lose. Eva eats 2 and leaves 10, and each round she makes the two turns add up to 3."
