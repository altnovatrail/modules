statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Ann says: 'Ben and Kim are both knights.' Ben says: 'Kim is a liar.' How many knights are among Ann, Ben and Kim?"
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Ann says: 'Ben and Kim are both knights.'", "Ben says: 'Kim is a liar.'"]
unknown: "How many knights are among Ann, Ben and Kim."
