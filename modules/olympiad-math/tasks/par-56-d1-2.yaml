id: "par-56-d1-2"
statement:
  - text: "Children stand in a circle, holding hands. Each child holds the hands of two boys or the hands of two girls. There are 7 boys in the circle and at least one girl. How many girls are there?"
givens: ["Each child holds the hands of two boys or of two girls.", "There are 7 boys and at least one girl."]
unknown: "How many girls there are."
leading_question: "Look at a child and the next but one round the circle. Are they the same, both boys or both girls?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "7"
          units: ["girl", "girls"]
          trap_values:
            - value: "14"
              trap: "wrong-operation"
              text: "14 gives each boy two girls of his own, but each girl holds two boys too."
            - value: "6"
              trap: "wrong-parity"
              text: "With 6 girls the circle would have 13 children, an odd number, and then the rule would make all of them boys or all of them girls."
            - value: "8"
              trap: "wrong-parity"
              text: "With 8 girls the circle would have 15 children, an odd number, and then the rule would make all of them the same."
    simpler_case: "Try a circle with 2 boys and some girls, each child holding two boys or two girls. How many girls are there?"
solution:
  - text: "The two neighbours of every child are both boys or both girls, so every child is the same as the next but one. If the circle had an odd number of children, going round by twos would reach everyone and all would be the same, but there are boys and girls. So the number is even, boys and girls take turns round the circle, and there are as many girls as boys: 7."
techniques: ["parity"]
traps: ["stopped-early"]
leak_phrases: ["7 girls", "seven girls", "as many girls as boys"]
skills:
  primary: ["parity-alternation"]
band: "grades-5-6"
difficulty: 1
