id: "gaps-12-d5-4"
statement:
  - text: "A straight fence is 20 metres long. There is a post every 2 metres, and there are posts at both ends. How many posts are there?"
  - picture: "pictures/gaps-12-d5-4.png"
    alt: "Posts in a row with a stretch left out in the middle; every gap drawn is marked 2 and the whole row is marked 20."
    width: 272
    height: 104
givens: ["The fence is straight and 20 metres long.", "There is a post every 2 metres.", "There are posts at both ends."]
unknown: "How many posts there are."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "11"
          units: ["post", "posts"]
          trap_values:
            - value: "9"
              trap: "ignored-condition"
              text: "Remember the posts at both ends."
            - value: "10"
              trap: "off-by-one"
              text: "10 is the number of gaps. There is one more post than gaps."
            - value: "20"
              trap: "number-from-text"
              text: "20 is the length in metres, not the number of posts."
            - value: "40"
              trap: "wrong-operation"
              text: "You multiplied 20 by 2. Count how many 2-metre parts fit into 20 metres."
    simpler_case: "Try a fence 4 metres long with a post every 2 metres. Draw it and count the posts."
solution:
  - text: "20 metres split into 2-metre parts gives 10 gaps. 10 gaps need 10 + 1 = 11 posts."
  - text: "20 ÷ 2 + 1 = 11"
  - picture: "pictures/gaps-12-d5-4-solution.png"
    alt: "The same row with its posts numbered: 1, 2 and 3, then a stretch left out, and post 11 at the end; every gap is 2 and the whole row is 20."
    width: 272
    height: 126
techniques: ["draw", "small-numbers"]
skills:
  primary: ["counting-gaps"]
band: "grades-1-2"
difficulty: 5
