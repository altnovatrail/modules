id: "enum-34-d5-3"
statement:
  - text: "Sveta has many 2-cent, 5-cent and 10-cent coins. In how many different ways can she pay exactly 20 cents? The order of the coins does not matter."
givens: ["Sveta has many 2-cent, 5-cent and 10-cent coins.", "She pays exactly 20 cents.", "The order of the coins does not matter."]
unknown: "In how many different ways she can pay."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "6"
          units: ["way", "ways"]
          trap_values:
            - value: "4"
              trap: "missed-case"
              text: "You missed some ways. Count by the number of 10-cent coins: 2, 1 or 0."
            - value: "5"
              trap: "missed-case"
              text: "You missed one way, for example four 5-cent coins."
            - value: "7"
              trap: "off-by-one"
              text: "One 5-cent coin cannot be used alone with 2-cent coins: the 15 cents left cannot be made from 2s. Check each way."
