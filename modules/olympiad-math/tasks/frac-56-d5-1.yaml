id: "frac-56-d5-1"
statement:
  - text: "There are 32 pupils in a class. The teacher asks them to close their eyes. All the boys and a quarter of the girls close their right eye. All the girls and a quarter of the boys close their left eye. How many pupils can still see with at least one eye?"
givens: ["There are 32 pupils.", "All the boys and a quarter of the girls close their right eye.", "All the girls and a quarter of the boys close their left eye."]
unknown: "How many pupils can still see with at least one eye."
leading_question: "Think about the boys first. Which of the boys still have an eye open?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "24"
          units: ["pupil", "pupils"]
          trap_values:
            - value: "8"
              trap: "answered-other-question"
              text: "8 is not the number of pupils who can still see."
            - value: "0"
              trap: "ignored-condition"
              text: "0 forgets that each pupil closes one eye and only some close the other one too. A pupil with one eye open still sees."
            - value: "32"
              trap: "number-from-text"
              text: "32 is the whole class, but some pupils closed both eyes."
            - value: "16"
              trap: "part-whole-swap"
              text: "16 takes a quarter of the boys and a quarter of the girls as a quarter of the whole class each."
    simpler_case: "Try a class of 8 boys only: all close their right eye, and a quarter also close their left. How many can still see?"
solution:
  - text: "Every boy closes his right eye, and a quarter of the boys also close their left eye, so three quarters of the boys still see. In the same way three quarters of the girls still see. So three quarters of the whole class see: 3/4 of 32 is 24."
