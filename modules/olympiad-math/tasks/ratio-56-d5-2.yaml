id: "ratio-56-d5-2"
statement:
  - text: "A jar holds peaches in juice, and all the peaches are under the juice. Kim eats a quarter of the peaches, and the level in the jar falls by a fifth. By what part of the new level will it fall if Kim then eats half of the peaches that are left?"
givens: ["All the peaches are under the juice.", "Eating a quarter of the peaches lowers the level by a fifth.", "Then Kim eats half of the peaches that are left."]
unknown: "By what part of the new level it falls."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "fraction"
          key: "3/8"
          trap_values:
            - value: "1/5"
              trap: "ignored-condition"
              text: "1/5 repeats the first fall. But now a different number of peaches comes out, and the level is lower."
            - value: "2/5"
              trap: "wrong-operation"
              text: "2/5 doubles the first fall because half is twice a quarter. But half of the peaches left is not twice the first quarter, and the level is lower now."
            - value: "1/2"
              trap: "part-whole-swap"
              text: "1/2 takes half of the peaches as half of the jar's contents. The peaches are only part of what is in the jar."
            - value: "4/5"
              trap: "stopped-early"
              text: "4/5 is the part of the contents that all the peaches took up, found on the way."
    simpler_case: "Try a jar that holds only peaches. Kim eats half of them. By what part does the level fall?"
solution:
  - text: "A quarter of the peaches took up a fifth of the contents, so all the peaches took up four fifths, and the juice one fifth. After Kim eats a quarter, the jar holds a fifth of juice and three fifths of peaches, four fifths in all. Half of the peaches left is three tenths of the old contents, which is 3/10 ÷ 4/5 = 3/8 of the four fifths now in the jar. So the level falls by 3/8."
skills:
  primary: ["ratio-sharing"]
band: "grades-5-6"
difficulty: 5
