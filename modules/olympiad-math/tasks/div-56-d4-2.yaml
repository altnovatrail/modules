id: "div-56-d4-2"
statement:
  - text: "In a darts game, each dart scores either 3 points or 8 points, and a player can throw as many darts as she likes. What is the largest total that cannot be scored?"
givens: ["Each dart scores 3 points or 8 points.", "A player can throw as many darts as she likes."]
unknown: "The largest total that cannot be scored."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "13"
          trap_values:
            - value: "10"
              trap: "missed-case"
              text: "10 cannot be scored either, but a bigger total cannot be scored too."
            - value: "16"
              trap: "missed-case"
              text: "16 can be scored with two darts: 8 + 8."
            - value: "24"
              trap: "wrong-operation"
              text: "24 multiplies 3 by 8, and 24 = 8 + 8 + 8 can be scored."
