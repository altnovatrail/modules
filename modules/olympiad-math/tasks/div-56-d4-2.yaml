              trap: "reversed-relation"
              text: "1 is the smallest total that cannot be scored, not the largest."
    simpler_case: "Try darts of 2 and 5 points. What is the largest total that cannot be scored?"
solution:
  - text: "The totals 14, 15 and 16 can be scored (8 + 3 + 3, 3 + 3 + 3 + 3 + 3 and 8 + 8), and adding threes to them reaches every larger total. Below them, 1, 2, 4, 5, 7, 10 and 13 cannot be scored, so the largest is 13."
