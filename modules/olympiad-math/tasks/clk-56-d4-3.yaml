    simpler_case: "Try one clock that gains 5 minutes every hour and one that is always right. After how many hours is the first clock a whole hour ahead?"
solution:
  - text: "Each hour the two clocks move 2 + 3 = 5 minutes further apart. Clocks with hands show the same time again when the gap is a whole 12 hours, which is 720 minutes. That takes 720 ÷ 5 = 144 hours, which is 6 days."
