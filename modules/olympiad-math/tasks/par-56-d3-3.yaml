id: "par-56-d3-3"
statement:
  - text: "A robot walks on a board of 3 by 3 squares. Each step takes it to a square that shares a side with the one it is on. It comes back to the square it started from and visits no other square twice. How many squares can such a route visit?"
givens: ["The board is 3 by 3 squares.", "Each step goes to a square that shares a side.", "The robot comes back to its first square and visits no other square twice."]
unknown: "How many squares such a route can visit."
leading_question: "Try to draw a few such routes. What do their numbers of squares have in common?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "8"
          units: ["square", "squares"]
          trap_values:
            - value: "10"
              trap: "ignored-condition"
              text: "A board of 3 by 3 has only 9 squares, so no route visits 10."
            - value: "9"
              trap: "wrong-parity"
              text: "A route that comes back visits an even number of squares, and 9 is odd."
            - value: "3"
              trap: "wrong-parity"
              text: "A route that comes back visits an even number of squares, and 3 is odd."
            - value: "7"
              trap: "wrong-parity"
              text: "A route that comes back visits an even number of squares, and 7 is odd."
    simpler_case: "Try a board of 2 by 2 squares first. How many squares can such a route visit?"
solution:
  - text: "Colour the board like a chessboard. Each step goes to a square of the other colour, so to come back to its first square the robot makes an even number of steps. The route visits as many squares as it makes steps, so it visits an even number of squares, which rules out 9, 7 and 3, and the board has no room for 10. A route round the edge of the board visits 8 squares."
