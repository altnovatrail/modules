id: "enum-56-d1-1"
statement:
  - text: "Ann and Ben each have 6 stickers and 4 badges, and no two of these 20 things are alike. In a fair swap, each gives the other one thing of the same kind: a sticker for a sticker, or a badge for a badge. How many different fair swaps can they make?"
givens: ["Ann and Ben each have 6 stickers and 4 badges, and no two of the things are alike.", "In a fair swap each gives the other one thing of the same kind."]
unknown: "How many different fair swaps they can make."
leading_question: "Count the sticker swaps and the badge swaps on their own, then put them together."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "52"
          units: ["swap", "swaps"]
          trap_values:
            - value: "36"
              trap: "missed-case"
              text: "36 counts only the sticker swaps. The 4 × 4 = 16 badge swaps are fair too."
            - value: "100"
              trap: "ignored-condition"
              text: "100 lets a sticker go for a badge as well, but in a fair swap both things are of the same kind."
            - value: "576"
              trap: "wrong-operation"
              text: "576 multiplies the two counts, 36 × 16, as if one swap moved a sticker and a badge at once. A swap is one or the other, so the counts are added."
            - value: "20"
              trap: "wrong-operation"
              text: "20 adds the things, 6 + 6 + 4 + 4. Each of Ann's stickers can go for each of Ben's, so the stickers give 6 × 6 swaps and the badges 4 × 4."
    simpler_case: "Try each having 2 stickers and 1 badge first. How many fair swaps are there?"
solution:
  - text: "In a sticker swap, Ann gives one of her 6 stickers and Ben one of his 6, so there are 6 × 6 = 36 sticker swaps. In the same way there are 4 × 4 = 16 badge swaps. A swap is of one kind or the other, so there are 36 + 16 = 52 in all."
