id: "clk-34-d3-1"
statement:
  - text: "A clock strikes once at every half hour. At every full hour it strikes as many times as the hour, from 1 to 12. How many times does it strike in 12 hours?"
givens: ["The clock strikes once at every half hour.", "At every full hour it strikes as many times as the hour, from 1 to 12."]
unknown: "How many times it strikes in 12 hours."
