          kind: "number"
          key: "90"
          units: ["time", "times"]
          trap_values:
            - value: "78"
              trap: "missed-case"
              text: "You forgot the half-hour strikes."
            - value: "84"
              trap: "missed-case"
              text: "Count the half hours in 12 hours again."
