id: "game-56-d4-2"
statement:
  - text: "Two rows of counters lie on a table, one of 2 and one of 4. Rosa and Jack take turns, and Rosa goes first. On each turn a player either takes any number of counters from one row, or takes the same number from both rows at once. At least one counter must be taken. Whoever takes the last counter wins. Jack plays as well as he can. Which first move lets Rosa be sure to win?"
  - picture: "pictures/game-56-d4-2.png"
    alt: "Two rows of counters, one of 2 and one of 4."
    width: 113
    height: 84
givens: ["One row has 2 counters and the other 4, and Rosa goes first.", "A turn takes any number from one row, or the same number from both.", "Taking the last counter wins, and Jack plays as well as he can."]
unknown: "The first move that lets Rosa be sure to win."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["3 from the row of 4", "2 from the row of 4", "2 from both rows", "1 from both rows", "Any move, since she goes first"]
        check:
          kind: "choice"
          key: "3 from the row of 4"
          trap_values:
            - value: "2 from the row of 4"
              trap: "ignored-condition"
              text: "That leaves two rows of 2, and Jack takes 2 from both rows at once."
            - value: "2 from both rows"
              trap: "stopped-early"
              text: "That leaves a single row of 2, and Jack just takes both counters."
            - value: "1 from both rows"
              trap: "missed-case"
              text: "That leaves 1 and 3, and Jack has a good reply."
            - value: "Any move, since she goes first"
              trap: "first-move-assumed"
              text: "Going first is not enough."
    simpler_case: "Try rows of 1 and 1 with the same rules. Which move wins?"
solution:
  - text: "Rows of 1 and 2 lose for the player to move. Every move from there leaves one row, two equal rows or 1 and 1, and each of those can be cleared in one turn. From 2 and 4, taking 3 from the row of 4 leaves 2 and 1. Whatever Jack does next, Rosa takes the rest."
