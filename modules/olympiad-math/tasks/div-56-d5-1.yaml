id: "div-56-d5-1"
statement:
  - text: "Some children ate sweets, each child the same number. Each child ate 5 fewer sweets than all the other children together, but more than one sweet. How many sweets did the children eat in all?"
givens: ["Each child ate the same number of sweets, more than one.", "Each child ate 5 fewer sweets than all the other children together."]
unknown: "How many sweets the children ate in all."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "15"
          units: ["sweet", "sweets"]
          trap_values:
            - value: "7"
              trap: "ignored-condition"
              text: "7 is 7 children with one sweet each. Each child ate more than one sweet, so that cannot be it."
            - value: "10"
              trap: "off-by-one"
              text: "10 counts each child among the others too: then each of 2 children would eat 5 fewer than both together. The others are all the children but that one."
            - value: "5"
              trap: "answered-other-question"
              text: "5 is not the number of all the sweets."
            - value: "30"
              trap: "double-count"
              text: "30 counts every sweet twice."
    simpler_case: "Try children who each ate as many sweets as all the others together. How many children were there?"
solution:
  - text: "Each child ate k sweets, and the other children ate k each, so for each child k + 5 = (n − 1) × k. That gives (n − 2) × k = 5, so either n − 2 = 5 and k = 1, or n − 2 = 1 and k = 5. Each ate more than one, so there were 3 children with 5 sweets each: 15 in all."
skills:
  primary: ["number-divisibility"]
  supporting: ["core.division-with-remainder"]
band: "grades-5-6"
difficulty: 5
