id: "par-34-d5-1"
statement:
  - text: "6 glasses stand in a row, all upside down. In one move you turn over exactly 4 of them. What is the smallest number of moves needed to make all 6 glasses stand the right way up?"
givens: ["6 glasses stand in a row, all upside down.", "In one move exactly 4 of them are turned over."]
unknown: "The smallest number of moves that makes all 6 stand the right way up."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "3"
          units: ["move", "moves"]
          trap_values:
            - value: "1"
              trap: "ignored-condition"
              text: "One move turns only 4 of the 6 glasses."
            - value: "2"
              trap: "stopped-early"
              text: "In 2 moves some glass is turned twice and ends upside down again."
            - value: "4"
              trap: "off-by-one"
              text: "4 moves are not needed: fewer moves already work."
    simpler_case: "Try 4 glasses upside down, turning 2 in a move. How many moves does it take?"
solution:
  - text: "Every glass must be turned an odd number of times. In 2 moves each glass is turned at most twice, so every glass would be turned exactly once: that is only 6 turns, but 2 moves make 8. So 2 moves are not enough. 3 moves work: turn glasses 1, 2, 3, 4, then 1, 2, 3, 5, then 1, 2, 3, 6."
techniques: ["parity"]
traps: ["wrong-parity"]
skills:
  primary: ["parity-alternation"]
band: "grades-3-4"
difficulty: 5
