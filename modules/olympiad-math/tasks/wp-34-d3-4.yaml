id: "wp-34-d3-4"
statement:
  - text: "You have an empty 4-litre jug, an empty 9-litre jug and a tap. The jugs have no marks. Each step is one of these: fill a jug from the tap, empty a jug onto the ground, or pour water from one jug into the other until the first jug is empty or the second is full. What is the smallest number of steps needed to have exactly 6 litres in one of the jugs?"
  - picture: "pictures/wp-34-d3-4.png"
    alt: "An empty 4-litre jug and an empty 9-litre jug."
    width: 188
    height: 175
givens: ["There is an empty 4-litre jug, an empty 9-litre jug and a tap; the jugs have no marks.", "A step fills a jug, empties a jug, or pours from one jug into the other until the first is empty or the second is full."]
unknown: "The smallest number of steps to have exactly 6 litres in one jug."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "8"
          units: ["step", "steps"]
          trap_values:
            - value: "6"
              trap: "stopped-early"
              text: "6 steps are not enough."
