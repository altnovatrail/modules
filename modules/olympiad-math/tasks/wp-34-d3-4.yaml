              text: "10 steps work, but there is a shorter way."
    simpler_case: "Try jugs of 2 and 3 litres. How many steps does it take to have exactly 1 litre?"
solution:
  - text: "Fill the 9-litre jug, pour into the 4-litre jug, empty it, pour again, empty it: 1 litre is left in the big jug (5 steps). Pour this 1 litre into the small jug (6 steps). Fill the big jug and pour into the small jug until it is full: it takes 3 litres, and 6 litres stay in the big jug (8 steps)."
