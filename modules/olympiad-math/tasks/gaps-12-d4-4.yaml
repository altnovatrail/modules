id: "gaps-12-d4-4"
statement:
  - text: "Bushes are planted along the sides of a square flowerbed. There is a bush in every corner, and each side has exactly 3 bushes, counting the two corner bushes of that side. How many bushes are there?"
givens: ["The flowerbed is a square.", "There is a bush in every corner.", "Each side has exactly 3 bushes, counting its two corner bushes."]
unknown: "How many bushes there are."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "8"
          units: ["bush", "bushes"]
          trap_values:
            - value: "4"
              trap: "answered-other-question"
              text: "4 is the number of corners, not bushes."
            - value: "6"
              trap: "stopped-early"
              text: "You counted only two sides."
            - value: "9"
              trap: "ignored-condition"
              text: "Bushes grow only along the sides, not in the middle of the flowerbed."
            - value: "12"
              trap: "double-count"
              text: "Each corner bush belongs to two sides. You counted the corners twice."
    simpler_case: "Try a flowerbed shaped like a triangle, with a bush in every corner and 3 bushes on each side, counting its corners. How many bushes are there?"
solution:
  - text: "There are 4 corner bushes and 1 more bush in the middle of each side. 4 + 4 = 8."
techniques: ["draw", "small-numbers"]
skills:
  primary: ["counting-gaps"]
band: "grades-1-2"
difficulty: 4
