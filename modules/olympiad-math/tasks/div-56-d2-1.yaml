id: "div-56-d2-1"
statement:
  - text: "Kim reads a book from page 40 to page 100, and both of those pages count. Every page whose number can be divided by 4 with nothing left over has a picture. How many pages with pictures does Kim read?"
givens: ["Kim reads from page 40 to page 100, both counted.", "Every page whose number divides by 4 has a picture."]
unknown: "How many pages with pictures Kim reads."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "16"
          units: ["page", "pages"]
          trap_values:
            - value: "15"
              trap: "off-by-one"
              text: "15 counts the gaps between the pages with pictures, not the pages themselves."
            - value: "17"
              trap: "off-by-one"
              text: "17 adds a page at the ends that is already counted."
            - value: "25"
              trap: "ignored-condition"
              text: "25 counts the pages with pictures from page 1, but Kim starts at page 40."
            - value: "61"
              trap: "answered-other-question"
              text: "61 is how many pages Kim reads, not how many have pictures."
    simpler_case: "Try pages 8 to 20. How many of them can be divided by 4?"
solution:
  - text: "The pages with pictures are 40, 44, 48 and so on up to 100, that is 4 × 10 up to 4 × 25. That makes 25 - 10 + 1 = 16 pages."
skills:
  primary: ["number-divisibility"]
  supporting: ["core.division-with-remainder"]
band: "grades-5-6"
difficulty: 2
