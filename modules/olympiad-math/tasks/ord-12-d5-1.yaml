      - binding: "anywhere"
        check:
          kind: "number"
          key: "3"
          units: ["st", "nd", "rd", "th"]
          trap_values:
            - value: "1"
              trap: "ignored-not"
              text: "Eva is not first."
            - value: "2"
              trap: "reversed-relation"
              text: "Ben stands right in front of Ann, and that pair must fit somewhere. Try each place for Ann."
