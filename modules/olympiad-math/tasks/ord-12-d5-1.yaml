id: "ord-12-d5-1"
statement:
  - text: "Five children stand in a line. Kim is last, and Dan stands right in front of Kim. Ann is not first and not last. Ben stands right in front of Ann. Eva is not first. In which place is Eva?"
givens: ["Five children stand in a line.", "Kim is last, and Dan stands right in front of Kim.", "Ann is not first and not last, and Ben stands right in front of Ann.", "Eva is not first."]
unknown: "In which place Eva stands."
