solution:
  - text: "At first every knight sat on a blue chair, since knights tell the truth, and every liar on a red one, since a liar's 'blue' is false. So there are as many blue chairs as knights. After the change, say k knights sit on red chairs. Their blue chairs went to k liars, since the blue chairs are as many as the knights. Those who now say 'red' are the knights on red chairs and the liars on blue ones, k + k = 8, so k = 4."
