id: "pig-56-d3-3"
statement:
  - text: "Tom writes different whole numbers on the board, one after another. How many numbers must he write to be sure that two of them differ by 7, by 14 or by some other number of the 7 times table?"
givens: ["Tom writes different whole numbers.", "Two of them must differ by a number of the 7 times table."]
unknown: "How many numbers he must write to be sure of it."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "8"
          units: ["number", "numbers"]
          trap_values:
            - value: "2"
              trap: "best-case-not-worst"
              text: "Two numbers could differ by 7 or 14 by luck, but they need not."
            - value: "14"
              trap: "wrong-operation"
              text: "14 takes two numbers for each remainder, but you do not need two of every remainder: two of one remainder are enough."
            - value: "7"
              trap: "off-by-one"
              text: "7 numbers, such as 1 to 7, can all leave different remainders, so no two of them differ by 7, 14 or more."
    simpler_case: "Try differences of 2, 4, 6 and so on first. How many numbers make you sure that two differ by an even number?"
solution:
  - text: "Two numbers differ by a number of the 7 times table exactly when they leave the same remainder on division by 7. There are only 7 remainders: 0, 1, 2, 3, 4, 5 and 6. Seven numbers, such as 1 to 7, can all leave different remainders, but with 8 numbers two of them must leave the same one, so they differ by a number of the 7 times table."
