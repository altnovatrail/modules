      - binding: "anywhere"
        check:
          kind: "number"
          key: "12"
          trap_values:
            - value: "17"
              trap: "ignored-condition"
              text: "The faces with 9 and 8 touch."
            - value: "10"
              trap: "missed-case"
              text: "10 is not the largest sum."
            - value: "15"
              trap: "off-by-one"
              text: "With two squares between them, 9 and 6 touch."
            - value: "9"
              trap: "reversed-relation"
              text: "9 is the smallest sum, not the largest."
    simpler_case: "Try a row of four squares, numbered 1, 2, 3 and 4, folded into a ring. What is the largest sum of two opposite squares?"
solution:
  - text: "Imagine the long row wrapping round the cube. In a straight row, two squares with one square between them become opposite faces. So the faces with 9 and 1 are opposite, and so are the faces with 3 and 6. A cube has three pairs of opposite faces, so the two squares left over, 8 and 4, are opposite too. The sums are 9 + 1 = 10, 3 + 6 = 9 and 8 + 4 = 12. The largest is 12."
  - text: "8 + 4 = 12"
