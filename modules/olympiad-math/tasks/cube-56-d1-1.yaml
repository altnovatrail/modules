id: "cube-56-d1-1"
statement:
  - text: "Lena cuts out the net in the picture and folds it into a paper cube. Each square has a number on it. What is the largest sum of the numbers on two opposite faces of the cube?"
  - picture: "pictures/cube-56-d1-1.png"
    alt: "A net of six squares: a row of four, 9, 3, 1 and 6 from the left, with 8 above the 9 and 4 below the 1."
    width: 208
    height: 168
givens: ["The net is folded into a paper cube, with a number on each square."]
unknown: "The largest sum of the numbers on two opposite faces."
