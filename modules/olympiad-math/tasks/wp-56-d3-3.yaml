id: "wp-56-d3-3"
statement:
  - text: "Among nine rings that look alike, one is fake and lighter than the others, which all weigh the same. Kim puts 4 rings on each pan of a balance for her first weighing. Counting that one, what is the smallest number of weighings that is now sure to find the fake ring?"
givens: ["Of nine rings, one is a lighter fake, and the others weigh the same.", "Kim puts 4 rings on each pan for the first weighing."]
unknown: "The smallest number of weighings, the first one counted, that is now sure to find the fake."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "3"
          units: ["weighing", "weighings"]
          trap_values:
            - value: "2"
              trap: "ignored-condition"
              text: "2 weighings would do with a different first weighing, but Kim started with 4 rings on each pan."
            - value: "8"
              trap: "answered-other-question"
              text: "8 is how many rings lie on the pans in the first weighing."
            - value: "1"
              trap: "best-case-not-worst"
              text: "If the pans balance, one weighing is enough, but they may not balance."
            - value: "4"
              trap: "missed-case"
              text: "4 checks the four lighter rings one at a time against a real ring; weighing them against each other is faster."
    simpler_case: "Try 4 rings with one lighter fake, 2 on each pan first. How many weighings in all are sure to find it?"
solution:
  - text: "If the pans balance, the ninth ring is the fake, and Kim is done. If a pan rises, the fake is one of its 4 rings, and one weighing cannot pick one ring out of 4, because it has only 3 results. Two more weighings do: 2 rings against 2, then 1 against 1. So Kim needs 3 weighings in all."
