id: "pct-56-d1-1"
statement:
  - text: "A toy costs 50 coins. The shop meant to raise its price by 20%, but by mistake it lowered the price by 20%. How many coins less than the planned price does the toy cost now?"
givens: ["The toy costs 50 coins.", "The price was meant to go up by 20%, but went down by 20%."]
unknown: "How many coins less than the planned price the toy costs now."
leading_question: "Find the planned price and the price now. What is 20% of 50 coins?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "20"
          units: ["coin", "coins"]
          trap_values:
            - value: "10"
              trap: "stopped-early"
              text: "10 coins is 20% of 50, the change one way only."
            - value: "8"
              trap: "percent-wrong-base"
              text: "8 takes 20% of the lowered price, 40 coins. Both changes are 20% of the old price, 50 coins."
            - value: "40"
              trap: "answered-other-question"
              text: "40 coins is the price now. The question asks how much less than the planned price it is."
            - value: "12"
              trap: "percent-wrong-base"
              text: "12 takes 20% off the planned price of 60 coins. The shop lowered the old price of 50 coins."
    simpler_case: "Try a toy of 50 coins whose price was meant to rise by 10% but fell by 10%. How many coins less than planned does it cost?"
solution:
  - text: "20% of 50 coins is 10 coins. The planned price was 50 + 10 = 60 coins, and the price now is 50 − 10 = 40 coins. The toy costs 60 − 40 = 20 coins less than planned."
leak_phrases: ["20 coins", "twenty coins"]
skills:
  primary: ["percent-basic"]
band: "grades-5-6"
difficulty: 1
