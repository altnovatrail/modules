id: "gaps-12-d5-2"
statement:
  - text: "20 children stand in a line. Masha is 7th from the front and Pasha is 14th from the front. How many children stand between Masha and Pasha?"
givens: ["20 children stand in a line.", "Masha is 7th from the front.", "Pasha is 14th from the front."]
unknown: "How many children stand between Masha and Pasha."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "6"
          units: ["child", "children"]
          trap_values:
            - value: "7"
              trap: "off-by-one"
              text: "14 - 7 = 7 counts Pasha too. Only the children between them count."
