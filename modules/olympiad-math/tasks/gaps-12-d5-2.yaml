              trap: "off-by-one"
              text: "You counted Masha and Pasha as well."
            - value: "13"
              trap: "answered-other-question"
              text: "13 children stand behind Masha, not between Masha and Pasha."
            - value: "21"
              trap: "wrong-operation"
              text: "You added the two places. Count the places between them."
    simpler_case: "Try Masha 1st and Pasha 3rd first. How many children stand between them?"
solution:
  - text: "Between the 7th and the 14th places are places 8, 9, 10, 11, 12 and 13. That is 6 children."
