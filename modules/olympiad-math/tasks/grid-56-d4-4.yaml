              text: "4 is not the squares in reach."
    simpler_case: "Try a peg in an open field with the number 1. How many squares are in reach, the peg's own square too?"
solution:
  - text: "Write in each square how many steps the goat needs, starting with 0 in the peg's square and going round the shed, never through it. One step reaches 2 squares, two steps 2 more, three steps 2 more, four steps 3 more and five steps 3 more. Behind the shed, the leash comes round its left end, so three squares there are in reach. The other four squares of the field need 6 or 7 steps, which is too many. So the goat can reach 1 + 2 + 2 + 2 + 3 + 3 = 13 squares."
  - text: "1 + 2 + 2 + 2 + 3 + 3 = 13"
