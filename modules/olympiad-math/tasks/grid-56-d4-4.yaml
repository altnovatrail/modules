id: "grid-56-d4-4"
statement:
  - text: "The grid is a fenced field of grass, and the shaded squares are a shed. A goat is tied by a leash to a peg in the square with the number. Each step takes the goat across one side into the next square, but never into the shed. The leash bends round the shed's corners, so a square is in reach when the goat can get there in at most as many steps as the number. How many squares are in reach, counting the peg's own square?"
  - picture: "pictures/grid-56-d4-4.png"
    alt: "A field of 4 rows of 5 squares. In the second row from the top, the second, third and fourth squares are shaded: the shed. The square in the top row, second from the left, holds the number 5: the peg."
    width: 248
    height: 208
givens: ["The grid is a field, and the shaded squares are a shed.", "A step goes across one side into the next square, never into the shed.", "A square is in reach when the goat gets there in at most as many steps as the number in the peg's square."]
unknown: "How many squares are in reach, the peg's own square too."
leading_question: "Write 0 in the peg's square, 1 in the squares one step away, and so on, going round the shed."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
