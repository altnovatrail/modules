id: "gaps-12-d5-5"
statement:
  - text: "Anna lives on floor 3 and walks up 20 steps from floor 1 to get home. Bob lives on floor 6 of the same house. How many steps does Bob walk up from floor 1?"
givens: ["Anna walks up 20 steps from floor 1 to floor 3.", "Bob lives on floor 6 of the same house."]
unknown: "How many steps Bob walks up from floor 1."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "50"
          units: ["step", "steps"]
          trap_values:
            - value: "26"
              trap: "wrong-operation"
              text: "You added the floor number to the steps. Find the steps in one flight first."
            - value: "30"
              trap: "stopped-early"
              text: "30 steps take Bob only to floor 4."
            - value: "40"
              trap: "wrong-operation"
              text: "Floor 6 is not twice as high as floor 3: from floor 1 there are 5 flights, not 4."
            - value: "60"
              trap: "off-by-one"
              text: "From floor 1 to floor 6 there are 5 flights, not 6."
    simpler_case: "Try a house where you walk up 6 steps from floor 1 to floor 2. How many steps take you from floor 1 to floor 3?"
solution:
  - text: "From floor 1 to floor 3 there are 2 flights, so one flight has 10 steps. From floor 1 to floor 6 there are 5 flights: 5 × 10 = 50 steps."
