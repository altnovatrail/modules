id: "par-56-d3-2"
statement:
  - text: "A board of 4 by 4 squares has two opposite corner squares cut off. A domino covers two squares that share a side. At most how many dominoes can be placed on the board without overlapping?"
givens: ["The board is 4 by 4 squares, with two opposite corners cut off.", "A domino covers two squares that share a side."]
unknown: "At most how many dominoes fit without overlapping."
leading_question: "Colour the board like a chessboard. What does each domino always cover?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "6"
          units: ["domino", "dominoes"]
          trap_values:
            - value: "7"
              trap: "wrong-parity"
              text: "7 dominoes would cover 7 squares of each colour. Count the squares of each colour that are left."
            - value: "14"
              trap: "answered-other-question"
              text: "14 is how many squares are left, not how many dominoes fit."
            - value: "8"
              trap: "ignored-condition"
              text: "8 dominoes cover the whole board, but two of its squares are cut off."
            - value: "4"
              trap: "number-from-text"
              text: "4 is the length of the board's side, copied from the question."
    simpler_case: "Try a board of 2 by 2 squares with two opposite corners cut off. How many dominoes fit?"
solution:
  - text: "Colour the board like a chessboard. Opposite corners have the same colour, so after the cut the board has 8 squares of one colour and only 6 of the other. Every domino covers one square of each colour, so at most 6 dominoes fit. And 6 do fit: two along each of the two middle rows and one along each of the outer rows."
