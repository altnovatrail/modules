# A template of pigeonhole-basic (T35; R22): the solver of mathtrail-standalone
# content/solvers/pigeonhole.basic/draws.star at 42b4408, made a solver of the template. It came
# from reference task pig-12-d4-1, whose numbers are one of its instances.
# The numbers of reference task pig-12-d4-1: red 4, blue 5, green 6, wanted 3.
# Its capitals STOCK and WANTED are the numbers that the statement shows: the three colours of the
# stock, from the fewest to the most, and how many of one colour the question wants, 3 or 4, so
# that at least two of each colour can be taken. No colour has as many balls as the key, which
# would let a number copied from the statement pass for the answer. standalone's
# sandbox gives it product, which the dialect of the format has not (format/README.md, section 24),
# so three loops go through the handfuls instead. The constraint keeps every colour at least as
# many as wanted, as in the reference task; the trap values are derived numbers, its mistakes.
