id: draws
template:
  parameters:
    red: {from: 4, to: 6}
    blue: {from: 5, to: 7}
    green: {from: 6, to: 8}
    wanted: {from: 3, to: 4}
  derived:
    less: wanted - 1
    stop: "3 * (wanted - 1)"
    times: "3 * wanted"
    sure_green: red + blue + wanted
  constraint: red < blue and blue < green and red >= wanted and red != 3 * wanted - 2 and blue != 3 * wanted - 2 and green != 3 * wanted - 2
  solver:
    program: |
      # For "how many must you take to be sure": try every handful the stock allows,
      # note the sizes of the handfuls that are not yet enough, and the answer is the
      # smallest size that none of them has. Taking more never undoes what is wanted,
      # which is what makes the smallest such size the answer.

      def solve(numbers):
          stock = [numbers["red"], numbers["blue"], numbers["green"]]
          wanted = numbers["wanted"]
          failed = set()
          for red in range(stock[0] + 1):
              for blue in range(stock[1] + 1):
                  for green in range(stock[2] + 1):
                      if max(red, blue, green) < wanted:  # no colour has enough yet
                          failed.add(red + blue + green)
          for size in range(stock[0] + stock[1] + stock[2] + 1):
              if size not in failed:
                  return {"draws": size}
          fail("no number of draws is ever enough")
    results: [draws]
statement:
  - text: A box has {red} red, {blue} blue and {green} green balls. Without looking, how many balls must you take to be sure to have {wanted} balls of the same colour?
givens:
  - The box has {red} red, {blue} blue and {green} green balls.
  - You take balls out without looking.
unknown: How many balls you must take to be sure to have {wanted} balls of the same colour.
canvas:
  kind: handwriting_sheet
  grid: squares
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "{draws}"
          units: [ball, balls]
          trap_values:
            - value: "{wanted}"
              trap: best-case-not-worst
              text: "{wanted} balls need not all be of one colour."
            - value: "{stop}"
              trap: stopped-early
              text: "{stop} balls can be {less} of each colour."
            - value: "{times}"
              trap: wrong-operation
              text: You multiplied {wanted} by 3. Think of the unluckiest balls. How many can you take with no {wanted} alike?
            - value: "{sure_green}"
              trap: answered-other-question
              text: "{sure_green} balls make you sure of {wanted} green balls, but any colour will do."
    simpler_case: Try a box of red and blue balls, many of each, first. How many balls make you sure of 2 of the same colour?
solution:
  - text: You may take {less} balls of each colour, {stop} balls, and have no {wanted} alike. The next ball makes {wanted} of one colour, so you must take {draws}.
techniques: [pigeonhole]
leak_phrases: ["{draws} balls"]
skills:
  primary: [pigeonhole-basic]
band: grades-1-2
difficulty: 4
