id: "enum-12-d3-5"
statement:
  - text: "A robot makes 3 steps: 2 steps to the right and 1 step up, in any order. How many different orders of steps can it make?"
givens: ["The robot makes 3 steps.", "2 steps go to the right and 1 step goes up, in any order."]
unknown: "How many different orders of steps it can make."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "3"
          units: ["order", "orders"]
          trap_values:
            - value: "1"
              trap: "missed-case"
              text: "The step up can come in more than one place. Try each place for it."
            - value: "2"
              trap: "missed-case"
              text: "You missed an order. Try every place for the step up."
            - value: "4"
              trap: "off-by-one"
              text: "You counted an order twice. Write each order as a row of R and U, and cross out the rows that repeat."
            - value: "6"
              trap: "double-count"
              text: "The two steps to the right are the same kind of step, so swapping them gives the same order."
    simpler_case: "Try 1 step right and 1 step up first. How many orders are there?"
solution:
  - text: "The step up can be first, second or third: up-right-right, right-up-right, right-right-up. That is 3 orders."
techniques: ["systematic"]
leak_phrases: ["3 orders", "three orders"]
skills:
  primary: ["combinatorics-enumeration"]
band: "grades-1-2"
difficulty: 3
