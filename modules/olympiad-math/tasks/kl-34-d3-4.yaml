id: "kl-34-d3-4"
statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Ann says to Ben: 'At least one of us two is a liar.' Who are Ann and Ben?"
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Ann says to Ben: 'At least one of us two is a liar.'"]
unknown: "Who Ann and Ben are."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["Both are knights", "Both are liars", "Ann is a liar, Ben is a knight", "Ann is a knight, Ben is a liar", "It is impossible to tell"]
        check:
          kind: "choice"
          key: "Ann is a knight, Ben is a liar"
          trap_values:
            - value: "Both are knights"
              trap: "ignored-condition"
              text: "If both were knights, Ann's words would be false."
            - value: "Both are liars"
              trap: "trusted-statement"
              text: "If Ann were a liar, could she say these words?"
            - value: "Ann is a liar, Ben is a knight"
              trap: "reversed-relation"
              text: "If Ann were a liar, would her words be false?"
