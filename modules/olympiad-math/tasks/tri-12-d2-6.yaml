id: "tri-12-d2-6"
statement:
  - text: "In the picture, each shape stands for a number, the same number every time. The number beside a row is the sum of its shapes. What number is the question mark?"
  - picture: "pictures/tri-12-d2-6.png"
    alt: "Three rows of shapes. The first row has two triangles, with 8 beside it. The second row has a triangle and a square, with 7 beside it. The third row has a square alone, with a question mark beside it."
