id: "kl-56-d2-2"
statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Fay says: 'At least one of us three is a liar.' Gus says: 'Fay is a liar.' Hal says: 'Gus is a liar.' Who among them lies?"
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Fay says: 'At least one of us three is a liar.'", "Gus says: 'Fay is a liar.'", "Hal says: 'Gus is a liar.'"]
unknown: "Who among them lies."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["Only Fay", "Fay and Hal", "Nobody", "Gus and Hal", "Only Gus"]
        check:
          kind: "choice"
          key: "Only Gus"
          trap_values:
            - value: "Only Fay"
              trap: "trusted-statement"
              text: "Believing Gus makes Fay a liar, but then her words 'at least one of us three is a liar' would be true."
            - value: "Fay and Hal"
              trap: "trusted-statement"
              text: "Believing Gus makes Fay and Hal liars, but a lying Fay could not say that one of them lies."
            - value: "Nobody"
              trap: "ignored-condition"
              text: "If nobody lied, Fay's words that at least one of them is a liar would be false."
            - value: "Gus and Hal"
              trap: "ignored-condition"
              text: "If Gus and Hal were both liars, Hal's words 'Gus is a liar' would be true."
    simpler_case: "Try two: Fay says 'Hal is a liar', and Hal says '2 + 2 = 5.' Who lies?"
solution:
  - text: "If Fay were a liar, her words would be false, and nobody of the three would be a liar, not even Fay. So Fay is a knight and her words are true. Gus calls her a liar, so Gus is a liar. Hal calls Gus a liar, which is true, so Hal is a knight. Only Gus is a liar, and there is indeed at least one."
