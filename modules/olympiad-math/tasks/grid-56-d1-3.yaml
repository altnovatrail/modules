id: "grid-56-d1-3"
statement:
  - text: "Cell A1 of a 3 by 3 board is painted. Rows are A to C from the top, columns 1 to 3 from the left. At least how many cells, A1 among them, must be painted for the board to look the same after a quarter turn about its centre?"
  - picture: "pictures/grid-56-d1-3.png"
    alt: "A 3 by 3 board with rows A to C from the top and columns 1 to 3 from the left; cell A1 is shaded."
    width: 149
    height: 154
givens: ["Cell A1 of a 3 by 3 board is painted.", "The board must look the same after a quarter turn about its centre."]
unknown: "At least how many cells must be painted, A1 among them."
leading_question: "Where does a quarter turn take A1? Where does the next quarter turn take that cell?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "4"
          units: ["cell", "cells"]
          trap_values:
            - value: "2"
              trap: "ignored-condition"
              text: "2 paints A1 and C3, which looks the same after a half turn. A quarter turn takes A1 to A3, which would be empty."
            - value: "3"
              trap: "missed-case"
              text: "3 does not paint every cell that a quarter turn reaches."
            - value: "8"
              trap: "ignored-condition"
              text: "8 paints more cells than needed; the question asks for the fewest."
            - value: "1"
              trap: "stopped-early"
              text: "1 is A1 alone. After a quarter turn the paint would be in A3 instead."
    simpler_case: "Try a 2 by 2 board. To which cell does a quarter turn about its centre take the top left cell?"
solution:
  - text: "A quarter turn takes A1 to A3, the next one to C3, the next to C1, and the fourth back to A1. Each of these four corners must be painted, and painting them is enough, so the answer is 4 cells."
