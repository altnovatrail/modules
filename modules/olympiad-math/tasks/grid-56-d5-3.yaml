id: "grid-56-d5-3"
statement:
  - text: "A tile is made of 4 square cells, joined along whole sides into one piece. Two tiles have the same shape if one can be turned or flipped over to lie exactly on the other. How many different shapes can such a tile have?"
givens: ["A tile is 4 square cells joined along whole sides.", "Shapes are the same when one can be turned or flipped onto the other."]
unknown: "How many different shapes such a tile can have."
leading_question: "Start with four cells in a row and move one cell at a time. Which of the shapes you get are one shape turned or flipped?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "5"
          units: ["shape", "shapes"]
          trap_values:
            - value: "4"
              trap: "missed-case"
              text: "4 misses a shape."
            - value: "7"
              trap: "double-count"
              text: "7 counts a shape and its flipped copy as two."
            - value: "19"
              trap: "double-count"
              text: "19 counts every way a tile can lie as a new shape. Turned and flipped tiles have the same shape."
            - value: "3"
              trap: "missed-case"
              text: "3 counts only the line, the square and the L."
    simpler_case: "Try tiles of 3 cells. How many different shapes can they have?"
solution:
  - text: "There are five shapes: four cells in a line, a square of 2 by 2, an L, a T and a zigzag. A flipped L is still an L, and a flipped zigzag is still a zigzag, since flips are allowed. So there are 5."
techniques: ["draw"]
