id: "wp-34-d5-3"
statement:
  - text: "Pavel wants a set of weights, each weighing a whole number of kilograms, so that with his balance he can weigh any whole load from 1 to 13 kg in one weighing. The weights may go on either pan, also next to the load. What is the smallest number of weights he needs?"
givens: ["Each weight weighs a whole number of kilograms.", "With them Pavel wants to weigh any whole load from 1 to 13 kg in one weighing.", "The weights may go on either pan, also next to the load."]
unknown: "The smallest number of weights he needs."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "3"
          units: ["weight", "weights"]
          trap_values:
            - value: "2"
              trap: "stopped-early"
              text: "Two weights make at most 4 different loads, but 13 are needed."
            - value: "4"
              trap: "off-by-one"
              text: "Count the weights again."
            - value: "13"
              trap: "number-from-text"
              text: "13 kg is the heaviest load, not the number of weights."
    simpler_case: "Try loads from 1 to 4 kg, with weights on either pan. How many weights does he need?"
solution:
  - text: "Weights of 1, 3 and 9 kg work: each weight can be opposite the load, next to it, or not used, and this gives every load from 1 to 13 kg, for example 2 = 3 - 1 and 5 = 9 - 3 - 1. Two weights are not enough: they make at most 4 different loads, one weight, the other, their sum and their difference."
traps: ["ignored-condition"]
