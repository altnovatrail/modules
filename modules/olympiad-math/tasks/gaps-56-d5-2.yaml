id: "gaps-56-d5-2"
statement:
  - text: "Two TV channels start showing the same film at the same moment. The first channel cuts the whole film into parts of exactly 30 minutes each, with a 6-minute advert between every two parts. The second cuts it into parts of exactly 15 minutes each, with a 3-minute advert between every two parts. Which channel ends the film first, and how much sooner?"
givens: ["The first channel shows parts of 30 minutes, with a 6-minute advert between every two parts.", "The second channel shows parts of 15 minutes, with a 3-minute advert between every two parts.", "Both start the same film at the same moment."]
unknown: "Which channel ends the film first, and how much sooner."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["The second, as its adverts are shorter", "Both end at the same moment", "The second, 3 minutes sooner", "It cannot be told without the length of the film", "The first, 3 minutes sooner"]
        check:
          kind: "choice"
          key: "The first, 3 minutes sooner"
          trap_values:
            - value: "The second, as its adverts are shorter"
              trap: "ignored-condition"
              text: "Its adverts are shorter, but it shows twice as many of them: one every 15 minutes of film instead of every 30."
            - value: "Both end at the same moment"
              trap: "off-by-one"
              text: "This counts an advert after every part, the last one too. The adverts come only between two parts, so each channel shows one advert fewer than it has parts."
            - value: "The second, 3 minutes sooner"
              trap: "reversed-relation"
              text: "This turns the comparison round. Work out which channel shows more minutes of adverts: that one ends later."
            - value: "It cannot be told without the length of the film"
              trap: "stopped-early"
              text: "It can be told: take a film of any length cut into whole parts, and compare how many minutes of adverts each channel shows."
    simpler_case: "Try one channel that shows a 20-minute film in parts of 10 minutes, with a 2-minute advert between them. How long does it take to show?"
solution:
  - text: "Take a film of 60 minutes. The first channel shows 2 parts with 1 advert between them, 6 minutes of adverts, and the second shows 4 parts with 3 adverts, 9 minutes. Each further 30 minutes of film adds 1 part and 1 advert, 6 minutes, on the first channel, and 2 parts and 2 adverts, 6 minutes, on the second. So whatever the length of the film, the second channel shows 3 minutes more of adverts, and the first ends 3 minutes sooner."
techniques: ["draw", "small-numbers"]
leak_phrases: ["the first, 3 minutes sooner", "the first channel ends first"]
skills:
  primary: ["counting-gaps"]
band: "grades-5-6"
difficulty: 5
