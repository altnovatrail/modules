id: "gaps-34-d2-4"
statement:
  - text: "Along one side of a 60-metre fence, posts stand every 4 metres, with a post at each end. How many posts are there?"
  - picture: "pictures/gaps-34-d2-4.png"
    alt: "Posts in a row with a stretch left out in the middle; every gap drawn is marked 4 and the whole row is marked 60."
    width: 272
    height: 104
givens: ["The fence is 60 metres long.", "A post stands every 4 metres.", "There is a post at each end."]
unknown: "How many posts there are."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "16"
          units: ["post", "posts"]
          trap_values:
            - value: "14"
              trap: "ignored-condition"
              text: "Remember the posts at both ends."
            - value: "15"
              trap: "off-by-one"
              text: "15 is the number of gaps. There is one more post than gaps."
            - value: "64"
              trap: "wrong-operation"
              text: "You added 60 and 4. Divide the length by 4."
            - value: "240"
              trap: "wrong-operation"
              text: "You multiplied 60 by 4. Divide the length by 4."
    simpler_case: "Try a fence 8 metres long with a post every 4 metres. Draw it and count the posts."
solution:
  - text: "60 ÷ 4 = 15 gaps. 15 gaps need 15 + 1 = 16 posts."
techniques: ["draw", "small-numbers"]
skills:
  primary: ["counting-gaps"]
band: "grades-3-4"
