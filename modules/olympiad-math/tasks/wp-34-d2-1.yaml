solution:
  - text: "Fill the 5-litre jug and pour it into the 3-litre jug: 2 litres stay in the big jug (2 steps). Empty the small jug and pour the 2 litres into it (4 steps). Fill the big jug again and pour into the small jug until it is full: it takes 1 litre, so 4 litres stay in the big jug (6 steps). There is no shorter way."
