statement:
  - text: "You have an empty 3-litre jug, an empty 5-litre jug and a tap. The jugs have no marks. Each step is one of these: fill a jug from the tap, empty a jug onto the ground, or pour water from one jug into the other until the first jug is empty or the second is full. What is the smallest number of steps needed to have exactly 4 litres in one of the jugs?"
  - picture: "pictures/wp-34-d2-1.png"
    alt: "An empty 3-litre jug and an empty 5-litre jug."
    width: 188
    height: 119
