id: "wp-56-d2-2"
statement:
  - text: "A post office has four parcels that look alike, but no two of them weigh the same. The clerk has a balance without weights that compares two parcels at a time. What is the smallest number of weighings that is sure to find the heaviest parcel?"
givens: ["Four parcels look alike, but no two weigh the same.", "A balance without weights compares two parcels at a time."]
unknown: "The smallest number of weighings that is sure to find the heaviest parcel."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "3"
          units: ["weighing", "weighings"]
          trap_values:
            - value: "4"
              trap: "off-by-one"
              text: "The heaviest parcel never has to lose a weighing."
            - value: "12"
              trap: "wrong-operation"
              text: "12 counts every pair twice, once from each side, and even every pair once is more than needed."
            - value: "6"
              trap: "missed-case"
              text: "6 weighs every pair, but a parcel that has been lighter once need not be weighed again."
            - value: "2"
              trap: "stopped-early"
              text: "After 2 weighings two parcels may still not have been the lighter one."
    simpler_case: "Try three parcels. How many weighings are sure to find the heaviest?"
solution:
  - text: "A parcel is ruled out only once it has been the lighter one in a weighing, and each weighing rules out just one parcel. The three parcels that are not the heaviest need three weighings. Three are enough: weigh two parcels, then the heavier one against the next parcel, and so on."
skills:
  primary: ["algorithms-weighing-pouring"]
band: "grades-5-6"
difficulty: 2
