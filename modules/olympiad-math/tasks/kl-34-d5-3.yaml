    simpler_case: "Try two islanders: the first says 'At least 1 of us is a liar', the second 'At least 2 of us are liars.' How many knights are there?"
solution:
  - text: "Say there are some number of liars. Then exactly that many sentences are true, the first ones, so that many people are knights. So there are as many knights as liars: 3 and 3. Check: with 3 liars, 'at least 1, 2, 3 liars' are true and the first three are knights, while 'at least 4, 5, 6' are false and the last three are liars."
