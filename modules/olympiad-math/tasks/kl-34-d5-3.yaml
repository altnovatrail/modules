id: "kl-34-d5-3"
statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Six islanders stand in a row. The first says: 'At least 1 of us is a liar.' The second says: 'At least 2 of us are liars.' And so on: the sixth says: 'At least 6 of us are liars.' How many knights are there?"
  - picture: "pictures/kl-34-d5-3.png"
    alt: "Six islanders in a row, numbered 1 to 6."
    width: 328
    height: 74
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Six islanders stand in a row.", "The first says at least 1 of them is a liar, the second at least 2, and so on up to the sixth, at least 6."]
unknown: "How many knights there are."
