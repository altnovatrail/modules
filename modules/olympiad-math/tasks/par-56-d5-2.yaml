id: "par-56-d5-2"
statement:
  - text: "A 63-digit number is written by repeating 1234567 nine times: 12345671234567 and so on. First all the digits in odd places are crossed out. In what is left, the digits in odd places are crossed out again, and so on until nothing is left. Which digit is crossed out last?"
givens: ["The number repeats 1234567 nine times: 63 digits.", "Again and again the digits in odd places are crossed out."]
unknown: "Which digit is crossed out last."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "4"
          trap_values:
            - value: "1"
              trap: "wrong-parity"
              text: "1 is what is left if the digits in even places go each time, but it is the odd places that go."
            - value: "2"
              trap: "stopped-early"
              text: "2 stands in place 16, and place 16 goes in a later round. Follow the places that are left round by round."
            - value: "7"
              trap: "ignored-condition"
              text: "7 is the last digit of the number, but its place, 63, is odd and goes in the very first round."
            - value: "6"
              trap: "off-by-one"
              text: "6 stands in place 48, and place 48 goes in a later round. Follow the places that are left round by round."
    simpler_case: "Try the number 1234 first. Which digit is crossed out last?"
solution:
  - text: "After the first round the places 2, 4, 6 and so on are left, after the second the places 4, 8, 12, and after each round only the places that divide by twice as much. The place left last is the one that divides by 2 five times, place 32, since place 64 is past the 63 digits. The digits repeat every 7 places, and 32 = 4 × 7 + 4, so the digit in place 32 is 4."
techniques: ["pattern"]
skills:
  primary: ["parity-alternation"]
band: "grades-5-6"
