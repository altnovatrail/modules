  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Ann says: 'Exactly one of us three is a liar.' Ben says: 'Exactly two of us three are liars.' Kim says: 'All three of us are liars.' How many knights are among Ann, Ben and Kim?"
