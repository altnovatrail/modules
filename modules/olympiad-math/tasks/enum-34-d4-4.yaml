id: "enum-34-d4-4"
statement:
  - text: "Masha has 5 different stickers. She gives 2 of them to Dasha and 1 to Pasha. In how many different ways can she do it?"
givens: ["Masha has 5 different stickers.", "She gives 2 of them to Dasha and 1 to Pasha."]
unknown: "In how many different ways she can do it."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "30"
          units: ["way", "ways"]
          trap_values:
            - value: "10"
              trap: "stopped-early"
              text: "10 counts only Dasha's stickers. Pasha still gets one of the 3 left."
            - value: "15"
              trap: "wrong-operation"
              text: "You added 10 and 5. Multiply by the 3 stickers left for Pasha."
            - value: "20"
              trap: "off-by-one"
              text: "After Dasha gets 2, there are 3 stickers left for Pasha, not 2."
            - value: "60"
              trap: "double-count"
              text: "The order of Dasha's two stickers does not matter."
    simpler_case: "Try 3 stickers, 1 for Dasha and 1 for Pasha. In how many ways can she give them?"
solution:
  - text: "She can choose Dasha's 2 stickers in 10 ways. For each choice, 3 stickers are left, and any of them can go to Pasha: 10 × 3 = 30."
