id: "sets-56-d5-2"
statement:
  - text: "Ann writes the numbers 5, 11, 17, 23 and so on, adding 6 each time, as long as they are at most 100. Ben writes 2, 7, 12, 17 and so on, adding 5 each time, also up to 100. How many numbers are on both lists?"
givens: ["Ann writes 5, 11, 17 and so on, adding 6, up to 100.", "Ben writes 2, 7, 12, 17 and so on, adding 5, up to 100."]
unknown: "How many numbers are on both lists."
leading_question: "17 is on both lists. Which number after 17 is the next one on both?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "3"
          units: ["number", "numbers"]
          trap_values:
            - value: "2"
              trap: "missed-case"
              text: "2 misses a number on both lists."
            - value: "33"
              trap: "answered-other-question"
              text: "33 is how many different numbers the two lists hold together. The question asks how many are on both."
            - value: "36"
              trap: "double-count"
              text: "36 counts every number written, so the numbers on both lists are counted twice."
            - value: "30"
              trap: "stopped-early"
              text: "30 is the step between the numbers on both lists, found on the way."
    simpler_case: "Try both lists only up to 30. How many numbers are on both?"
solution:
  - text: "A number on both lists lies after 17 by a number of sixes and also by a number of fives, so by a number of 30s. The numbers on both are 17, 47 and 77, and 107 is past 100. So there are 3."
skills:
  primary: ["logic-sets"]
band: "grades-5-6"
difficulty: 5
