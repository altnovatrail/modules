id: "kl-34-d4-1"
statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Five islanders stand in a row. The first says: 'Exactly 1 of us is a liar.' The second says: 'Exactly 2 of us are liars.' The third says: 'Exactly 3 of us are liars.' The fourth says: 'Exactly 4 of us are liars.' The fifth says: 'Exactly 5 of us are liars.' How many knights are there?"
  - picture: "pictures/kl-34-d4-1.png"
    alt: "Five islanders in a row, numbered 1 to 5."
    width: 272
    height: 74
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Five islanders stand in a row.", "The first says exactly 1 of them is a liar, the second exactly 2, and so on up to the fifth, exactly 5."]
unknown: "How many knights there are."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "1"
          units: ["knight", "knights"]
          trap_values:
            - value: "0"
              trap: "ignored-condition"
              text: "With no knights there would be 5 liars, and the fifth sentence would be true."
            - value: "2"
              trap: "ignored-condition"
              text: "The sentences name different numbers. How many of them can be true?"
            - value: "4"
              trap: "answered-other-question"
              text: "4 is not the number of knights."
            - value: "5"
              trap: "number-from-text"
              text: "5 is how many islanders there are."
    simpler_case: "Try two islanders: the first says 'Exactly 1 of us is a liar', the second 'Exactly 2 of us are liars.' Which of them is a knight?"
solution:
  - text: "The five sentences name different numbers, so at most one of them is true, and at most one islander is a knight. If there were no knights, there would be 5 liars and the fifth sentence would be true, but a liar cannot say it. So there is exactly 1 knight (K) among 4 liars (L): the fourth islander is the knight."
  - text: "5 − 4 = 1"
  - picture: "pictures/kl-34-d4-1-solution.png"
    alt: "The five islanders with L under 1, 2, 3 and 5, and K under 4, which is ringed."
    width: 272
    height: 96
techniques: ["opposite"]
leak_phrases: ["1 knight", "one knight", "exactly one knight"]
