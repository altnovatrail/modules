id: "par-34-d4-1"
statement:
  - text: "In a group of friends, each friend shook hands with exactly 3 others. Which of these can be the number of friends?"
givens: ["Each friend shook hands with exactly 3 others."]
unknown: "Which of the numbers can be the number of friends."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["5", "8", "7", "9", "11"]
        check:
          kind: "choice"
          key: "8"
          trap_values:
            - value: "5"
              trap: "wrong-parity"
              text: "3 × 5 = 15 hand uses cannot make whole handshakes of 2 hands."
            - value: "7"
              trap: "wrong-parity"
              text: "3 × 7 = 21 hand uses cannot make whole handshakes of 2 hands."
            - value: "9"
              trap: "wrong-parity"
              text: "3 × 9 = 27 hand uses cannot make whole handshakes of 2 hands."
            - value: "11"
              trap: "wrong-parity"
              text: "3 × 11 = 33 hand uses cannot make whole handshakes of 2 hands."
    simpler_case: "Try friends who each shook hands with exactly 1 other. How many friends can there be: 3 or 4?"
solution:
  - text: "Count the hands used: each friend used a hand 3 times, and each handshake uses 2 hands. So 3 × (the number of friends) must be even, and the number of friends must be even. Only 8 is even, and it works: 8 friends in a circle each shake hands with both neighbours and with the friend opposite."
techniques: ["parity"]
skills:
  primary: ["parity-alternation"]
band: "grades-3-4"
difficulty: 4
