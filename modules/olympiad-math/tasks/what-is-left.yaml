# reference task frac-56-d3-1, whose numbers are one of its instances.
# The numbers of reference task frac-56-d3-1: left 30.
# Its capital LEFT is the number that the statement shows, a multiple of 3 from 12 to 45, so that the
# quarter of what is left after the book is whole; shares stay those of the reference task, half and
# then a quarter of the rest. The trap values are derived numbers, the mistakes of the reference task.
