id: what-is-left
template:
  parameters:
    left: {from: 12, to: 45}
  derived:
    quarter: left // 3
    after_book: "4 * left // 3"
    of_all: "4 * left"
    spent: "5 * left // 3"
    doubled: "2 * left"
  constraint: left % 3 == 0
  solver:
    program: |
      # For a whole that shares are taken from, a share of the whole or of the rest
      # each time: try every whole and keep the one that leaves what the question
      # says is left. A share that is not a whole number rules a whole out.

      shares = [(1, 2), (1, 4)]  # each share of the rest: top, bottom

      def after(whole):
          left = whole
          for top, bottom in shares:
              if left * top % bottom != 0:
                  return None
              left -= left * top // bottom
          return left

      def solve(numbers):
          wholes = [whole for whole in range(1, 1001) if after(whole) == numbers["left"]]
          if len(wholes) != 1:
              fail("%d wholes leave %d, and the question has one" % (len(wholes), numbers["left"]))
          return {"coins": wholes[0]}
    results: [coins]
statement:
  - text: Oleg spends half of his coins on a book. Then he spends a quarter of the coins he has left on a pen. Now he has {left} coins. How many coins did he have at first?
givens:
  - Oleg spends half of his coins on a book.
  - Then he spends a quarter of what is left on a pen.
  - Now he has {left} coins.
unknown: How many coins he had at first.
canvas:
  kind: handwriting_sheet
  grid: squares
items:
  - answer_slots:
      - binding: anywhere
        check:
          kind: number
          key: "{coins}"
          units: [coin, coins]
          trap_values:
            - value: "{after_book}"
              trap: stopped-early
              text: That is not what he had at first.
            - value: "{of_all}"
              trap: part-whole-swap
              text: That takes the pen's quarter of all his coins, but it was a quarter of the coins he had left.
            - value: "{spent}"
              trap: answered-other-question
              text: That is how many coins he spent on the book and the pen together.
            - value: "{doubled}"
              trap: ignored-condition
              text: That only doubles the {left} and forgets the pen, which he bought after the book.
    simpler_case: "Try: he spends half of his coins and has 15 left. How many did he have?"
solution:
  - text: After the pen he keeps three quarters of what he had, and that is {left} coins. So a quarter is {quarter}, and he had {after_book} coins after the book. Those are half of his coins, so at first he had {coins}.
leak_phrases: ["{coins} coins at first"]
skills:
  primary: [fractions-parts]
  supporting: [core.fractions-of-a-whole]
band: grades-5-6
difficulty: 3
