id: "par-34-d5-4"
statement:
  - text: "The digits 1, 2, 3, 4, 5 and 6 are written in some order. Kolya adds the digits in the 1st, 3rd and 5th places and takes away the digits in the 2nd, 4th and 6th places. Which of these results can he get?"
givens: ["The digits 1 to 6 are written in some order.", "The digits in the 1st, 3rd and 5th places are added, and those in the 2nd, 4th and 6th are taken away."]
unknown: "Which of the results Kolya can get."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["5", "0", "2", "4", "8"]
        check:
          kind: "choice"
          key: "5"
          trap_values:
            - value: "0"
              trap: "wrong-parity"
              text: "The result is always odd, and 0 is even."
            - value: "2"
              trap: "wrong-parity"
              text: "The result is always odd, and 2 is even."
            - value: "4"
              trap: "wrong-parity"
              text: "The result is always odd, and 4 is even."
            - value: "8"
              trap: "wrong-parity"
              text: "The result is always odd, and 8 is even."
    simpler_case: "Try the digits 1 to 4, adding the 1st and 3rd and taking away the 2nd and 4th. Which results can you get?"
solution:
  - text: "All six digits add up to 21, which is odd. The result is 21 minus twice the digits taken away, so it is always odd. Only 5 is odd, and it works: 6 - 1 + 4 - 2 + 3 - 5 = 5."
