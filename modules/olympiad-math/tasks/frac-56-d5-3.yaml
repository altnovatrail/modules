id: "frac-56-d5-3"
statement:
  - text: "Owen had a box of biscuits. He ate some of them, and then his friend Zoe came. They shared the biscuits that were left equally. In the end Owen had eaten 4 times as many biscuits as Zoe. What part of all the biscuits did Owen eat before Zoe came?"
givens: ["Owen ate some biscuits, and then shared the rest equally with Zoe.", "In the end Owen had eaten 4 times as many biscuits as Zoe."]
unknown: "The part of all the biscuits Owen ate before Zoe came."
leading_question: "Call Zoe's share one part. How many such parts did Owen eat in all, and how many of them before Zoe came?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "fraction"
          key: "3/5"
          trap_values:
            - value: "4/5"
              trap: "part-whole-swap"
              text: "4/5 counts what Owen ate after Zoe came too."
            - value: "2/5"
              trap: "answered-other-question"
              text: "2/5 is not what Owen ate before Zoe came."
            - value: "2/3"
              trap: "ignored-condition"
              text: "2/3 makes what Owen ate before Zoe came 4 times Zoe's share. The 4 times counts all Owen ate, his share of what was left too."
            - value: "3/2"
              trap: "part-whole-swap"
              text: "3/2 measures what Owen ate first against what was left, not against all the biscuits."
    simpler_case: "Try the same with 3 times as many instead of 4 times. What part did Owen eat before Zoe came?"
solution:
  - text: "Zoe's share is one part, and Owen's share of what was left is one part too. Owen ate 4 parts in all, so he ate 3 parts before Zoe came. All the biscuits make 3 + 1 + 1 = 5 parts, so Owen ate 3/5 of them before Zoe came."
