id: "ratio-56-d3-2"
statement:
  - text: "Two gear wheels turn together: each time a tooth of the big wheel moves past, one tooth of the small wheel moves past too. The big wheel has 21 teeth and the small wheel has 7. How many turns does the small wheel make while the big wheel makes 6 turns?"
givens: ["Two gear wheels turn together, tooth by tooth.", "The big wheel has 21 teeth and the small wheel 7."]
unknown: "How many turns the small wheel makes while the big wheel makes 6."
leading_question: "How many teeth move past while the big wheel turns 6 times?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "18"
          units: ["turn", "turns"]
          trap_values:
            - value: "2"
              trap: "reversed-relation"
              text: "2 has the small wheel turning more slowly, but a wheel with fewer teeth turns faster."
            - value: "126"
              trap: "stopped-early"
              text: "126 is not a number of turns."
            - value: "6"
              trap: "number-from-text"
              text: "6 is the number of turns of the big wheel, copied from the question; the small wheel turns more often."
            - value: "9"
              trap: "wrong-operation"
              text: "9 reads three times as many teeth as three more turns: 6 + 3."
    simpler_case: "Try a big wheel of 10 teeth and a small one of 5. How many turns does the small wheel make while the big one makes 2?"
solution:
  - text: "6 turns of the big wheel move 6 × 21 = 126 teeth past. The small wheel turns once for every 7 teeth, so it makes 126 ÷ 7 = 18 turns."
