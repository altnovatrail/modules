id: "div-56-d1-3"
statement:
  - text: "When Ann's number is divided by 9, the remainder is 5. When Ben's number is divided by 9, the remainder is 7. What is the remainder when the sum of their two numbers is divided by 9?"
givens: ["Ann's number divided by 9 leaves 5.", "Ben's number divided by 9 leaves 7."]
unknown: "The remainder of the sum of their numbers divided by 9."
leading_question: "Add the two remainders. Is what you get less than 9?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "3"
          trap_values:
            - value: "12"
              trap: "stopped-early"
              text: "12 is the sum of the two remainders, a step on the way; it is more than 9."
            - value: "1"
              trap: "remainder-vs-quotient"
              text: "1 is how many nines the two remainders make together, not what is left over."
            - value: "7"
              trap: "number-from-text"
              text: "7 is the remainder of Ben's number alone, a number from the question."
            - value: "5"
              trap: "number-from-text"
              text: "5 is the remainder of Ann's number alone, a number from the question."
    simpler_case: "Try remainders of 2 and 4 when dividing by 9. What is the remainder of the sum?"
solution:
  - text: "Each number is some nines and its remainder, so the sum is some nines and 5 + 7 = 12. But 12 is one more nine and 3, so the remainder of the sum is 3."
