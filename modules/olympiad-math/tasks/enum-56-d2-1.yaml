id: "enum-56-d2-1"
statement:
  - text: "A café makes sandwiches from white or brown bread, with one of three fillings: cheese, ham or egg. A sandwich also gets one of two sauces, or no sauce at all. How many different sandwiches can the café make?"
givens: ["The bread is white or brown.", "The filling is cheese, ham or egg.", "The sauce is one of two sauces, or none."]
unknown: "How many different sandwiches the café can make."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "18"
          units: ["sandwich", "sandwiches"]
          trap_values:
            - value: "12"
              trap: "missed-case"
              text: "12 leaves out the sandwiches with no sauce: 2 × 3 × 2."
            - value: "8"
              trap: "wrong-operation"
              text: "8 adds the choices, 2 + 3 + 3, but every bread goes with every filling and every choice of sauce."
            - value: "13"
              trap: "missed-case"
              text: "13 counts only one sandwich without sauce, but there is one for every bread and filling: 6 of them."
            - value: "6"
              trap: "stopped-early"
              text: "6 counts the bread and the filling only; each of those sandwiches still gets one of 3 choices for the sauce."
    simpler_case: "Leave the sauce out first. How many ways are there to choose the bread and the filling?"
solution:
  - text: "There are 2 breads and 3 fillings, so 2 × 3 = 6 ways to choose them. Each of those gets one of 3 choices for the sauce: the first sauce, the second or none. That makes 6 × 3 = 18 sandwiches."
