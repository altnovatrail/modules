id: "sets-56-d5-1"
statement:
  - text: "Each of the 30 pupils of a class goes to exactly two of three clubs: chess, music and drama. 20 pupils go to chess and 18 go to music. How many pupils go to drama?"
givens: ["Each of 30 pupils goes to exactly two of three clubs: chess, music and drama.", "20 go to chess and 18 to music."]
