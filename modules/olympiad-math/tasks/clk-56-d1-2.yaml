id: "clk-56-d1-2"
statement:
  - text: "A cuckoo clock calls once at every half hour, and at every full hour it calls as many times as the hour on its face. Its hands show 4:20. Tim turns the minute hand forward 3 whole turns, and the hour hand moves along with it. How many times does the cuckoo call?"
  - picture: "pictures/clk-56-d1-2.png"
    alt: "A clock showing 4:20."
    width: 200
    height: 200
givens: ["The clock calls once at every half hour and, at every full hour, as many times as the hour.", "Its hands show 4:20.", "The minute hand is turned forward 3 whole turns, and the hour hand moves along."]
unknown: "How many times the cuckoo calls."
leading_question: "One whole turn of the minute hand takes the clock on by an hour. Which full hours and half hours does it pass?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "21"
          units: ["time", "times"]
          trap_values:
            - value: "18"
              trap: "ignored-condition"
              text: "18 counts only the calls at the full hours. The half hours call too."
            - value: "25"
              trap: "off-by-one"
              text: "25 counts the calls of 4:00 too, but the hands were already past 4:00 when Tim began."
            - value: "24"
              trap: "double-count"
              text: "24 gives the full hours a half-hour call as well, but at 5:00, 6:00 and 7:00 the cuckoo calls only the hour."
            - value: "6"
              trap: "answered-other-question"
              text: "6 is how many times the cuckoo starts calling. At 5:00, 6:00 and 7:00 it calls several times."
    simpler_case: "Try a clock that shows 1:20, turned forward 1 whole turn. How many times does the cuckoo call?"
solution:
  - text: "Each whole turn of the minute hand moves the clock on by one hour, so the hands go from 4:20 to 7:20. On the way they pass 5:00, 6:00 and 7:00, with 5 + 6 + 7 = 18 calls, and the half hours 4:30, 5:30 and 6:30, with one call each. That makes 18 + 3 = 21 calls."
skills:
  primary: ["time-clocks"]
band: "grades-5-6"
difficulty: 1
