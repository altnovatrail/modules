id: "wp-56-d5-1"
statement:
  - text: "Nine coins lie in a circle, numbered 1 to 9 round it. Five of them, next to each other, are fakes, lighter than the real coins. The real coins all weigh the same, and so do the fakes. Which one weighing on a balance without weights is sure to show two of the fakes?"
givens: ["Nine coins lie in a circle, numbered 1 to 9 round it.", "Five of them, next to each other, are lighter fakes; the real coins weigh the same, and so do the fakes."]
unknown: "The one weighing that is sure to show two of the fakes."
leading_question: "Try each weighing when the pans balance. Which runs of five fakes are still possible then, and do they share two coins?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["Coin 1 against coin 2", "Coin 1 against coin 5", "Coin 1 against coin 4", "Coins 1 and 2 against coins 3 and 4", "Coins 1 and 3 against coins 5 and 7"]
        check:
          kind: "choice"
          key: "Coin 1 against coin 5"
          trap_values:
            - value: "Coin 1 against coin 2"
              trap: "best-case-not-worst"
              text: "This works when a pan sinks. But when the pans balance, the fakes may be coins 4 to 8, or coin 9 and coins 1 to 4, and these share only coin 4."
            - value: "Coin 1 against coin 4"
              trap: "best-case-not-worst"
              text: "This works when a pan sinks. But when the pans balance, the fakes may be coins 5 to 9, or coin 9 and coins 1 to 4, and these share only coin 9."
            - value: "Coins 1 and 2 against coins 3 and 4"
              trap: "missed-case"
              text: "This misses a case. When the pans balance, the fakes may be coins 1 to 5 or coins 5 to 9, and these share only coin 5."
            - value: "Coins 1 and 3 against coins 5 and 7"
              trap: "best-case-not-worst"
              text: "This works when a pan sinks. But when the pans balance, the fakes may be coins 2 to 6, or coins 6 to 9 and coin 1, and these share only coin 6."
    simpler_case: "Try 3 coins in a row, 2 of them fakes next to each other. Which coin is surely a fake?"
solution:
  - text: "Weigh coin 1 against coin 5. If they balance, both are fakes or both are real, and both real is impossible: the coins left, 2 to 4 and 6 to 9, have no five next to each other. So the fakes are coins 1 to 5. If coin 1 is lighter, it is a fake and coin 5 is real, so the fakes start at coin 6, 7, 8 or 9 and run on past coin 1: coins 9 and 1 are fakes in every case. If coin 5 is lighter, the fakes start at coin 2, 3, 4 or 5, and coins 5 and 6 are fakes in every case."
