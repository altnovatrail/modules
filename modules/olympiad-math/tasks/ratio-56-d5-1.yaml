id: "ratio-56-d5-1"
statement:
  - text: "The grass in a meadow grows at the same rate every day. 24 cows would eat all of it in 10 days, and 14 cows in 20 days. How many cows would eat all of it in 40 days?"
givens: ["The grass grows at the same rate every day.", "24 cows would eat all of it in 10 days, and 14 cows in 20 days."]
unknown: "How many cows would eat all of it in 40 days."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "9"
          units: ["cow", "cows"]
          trap_values:
            - value: "6"
              trap: "ignored-condition"
              text: "6 shares out the grass of 24 cows in 10 days over 40 days and leaves out the grass that grows meanwhile."
            - value: "28"
              trap: "wrong-operation"
              text: "28 makes the cows grow with the days, 14 × 40 ÷ 20. More days need fewer cows, not more."
            - value: "14"
              trap: "number-from-text"
              text: "14 is the smaller herd from the question. In 40 days even fewer cows are enough."
            - value: "7"
              trap: "ignored-condition"
              text: "7 shares out the grass of 14 cows in 20 days over 40 days and leaves out the grass that grows after day 20."
    simpler_case: "Try a meadow where the grass does not grow and 10 cows eat it in 4 days. How many cows eat it in 8 days?"
solution:
  - text: "Count the grass in cow-days, what one cow eats in a day. 24 cows in 10 days eat 240 cow-days, and 14 cows in 20 days eat 280. The extra 40 grew in the 10 days between, so 4 cow-days of grass grow every day. At the start the meadow holds 240 − 10 × 4 = 200 cow-days. In 40 days it gives 200 + 40 × 4 = 360 cow-days, which 360 ÷ 40 = 9 cows eat."
