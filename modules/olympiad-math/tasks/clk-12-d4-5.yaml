id: "clk-12-d4-5"
statement:
  - text: "A train leaves at 11:45. The trip takes 35 minutes. At what time does the train arrive?"
  - picture: "pictures/clk-12-d4-5.png"
    alt: "A clock showing 11:45."
    width: 200
    height: 200
  - text: "Write the time as hours and minutes, like 9:15."
givens: ["The train leaves at 11:45.", "The trip takes 35 minutes."]
unknown: "The time when the train arrives."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "choice"
          key: "12:20"
          options: ["11:10", "11:80", "12:10", "12:20", "12:35"]
          trap_values:
            - value: "11:10"
              trap: "reversed-relation"
              text: "The train arrives after it leaves, so count forward."
            - value: "11:80"
              trap: "time-unit-mixup"
              text: "An hour has 60 minutes, so there is no 11:80."
            - value: "12:10"
              trap: "wrong-operation"
              text: "12:10 is only 25 minutes after 11:45."
            - value: "12:35"
              trap: "number-from-text"
              text: "The 35 minutes are added to 11:45, not to 12:00."
    simpler_case: "Try a trip of 10 minutes from 11:45. At what time does the train arrive?"
solution:
  - text: "15 minutes after 11:45 it is 12:00. The other 20 minutes take it to 12:20. 15 + 20 = 35."
