id: "sets-56-d2-2"
statement:
  - text: "Every child in a group likes apples, pears or both. 18 of the children like apples (A), 14 like pears (P), and 7 like both fruits. How many children are in the group?"
  - picture: "pictures/sets-56-d2-2.png"
    alt: "Two overlapping circles, A of 18 and P of 14, with 7 in the overlap, 0 outside both and the total marked ?."
    width: 256
    height: 212
givens: ["Every child likes apples, pears or both.", "18 like apples, 14 like pears, and 7 like both."]
unknown: "How many children are in the group."
leading_question: "Which children were counted with the apples and again with the pears?"
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "25"
          units: ["child", "children"]
          trap_values:
            - value: "32"
              trap: "double-count"
              text: "32 counts each child who likes both fruits twice, once with each fruit."
            - value: "11"
              trap: "answered-other-question"
              text: "11 is how many like apples but not pears."
            - value: "7"
              trap: "number-from-text"
              text: "7 is the number who like both fruits, copied from the question."
            - value: "39"
              trap: "wrong-operation"
              text: "39 adds the 7 who like both instead of taking them away."
    simpler_case: "Try 5 children who like apples, 4 who like pears and 2 who like both, each liking at least one. How many children are there?"
solution:
  - text: "18 + 14 = 32 counts the 7 children who like both fruits twice. Taking them away once gives 32 - 7 = 25 children."
