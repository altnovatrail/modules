id: "kl-34-d2-1"
statement:
  - text: "On an island, knights always tell the truth and liars always lie. Every islander is a knight or a liar. Ann says: 'Ben and I are both liars.' Who are Ann and Ben?"
givens: ["Knights always tell the truth, and liars always lie.", "Every islander is a knight or a liar.", "Ann says: 'Ben and I are both liars.'"]
unknown: "Who Ann and Ben are."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "choice"
        options: ["Both are knights", "Both are liars", "Ann is a knight, Ben is a liar", "It is impossible to tell", "Ann is a liar, Ben is a knight"]
        check:
          kind: "choice"
          key: "Ann is a liar, Ben is a knight"
          trap_values:
            - value: "Both are knights"
              trap: "trusted-statement"
              text: "A knight could not call herself a liar."
            - value: "Both are liars"
              trap: "trusted-statement"
              text: "You believed Ann, but her words may be false."
            - value: "Ann is a knight, Ben is a liar"
              trap: "reversed-relation"
              text: "Could a knight say that she herself is a liar?"
            - value: "It is impossible to tell"
              trap: "stopped-early"
              text: "Find out what Ann is first; her words then tell you about Ben."
    simpler_case: "Try Ann saying only 'I am a liar.' Can she say it?"
solution:
  - text: "A knight cannot say that she is a liar, so Ann is a liar. Then her words are false, so Ann and Ben are not both liars: Ben is a knight."
