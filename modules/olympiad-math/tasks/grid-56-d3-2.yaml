    simpler_case: "Try a 2 by 2 board. In how many ways can the domino be placed?"
solution:
  - text: "Lying across, each row has 2 places, so 3 rows give 6. Standing up, each column has 2 places, so 3 columns give 6. In all, 6 + 6 = 12 ways."
