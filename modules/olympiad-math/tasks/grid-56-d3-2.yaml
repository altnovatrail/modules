id: "grid-56-d3-2"
statement:
  - text: "In a board game, a domino covers two squares of a 3 by 3 board that share a side. Rows are A to C from the top, columns 1 to 3 from the left. Two placements are different if they cover different squares. In how many ways can the domino be placed?"
  - picture: "pictures/grid-56-d3-2.png"
    alt: "An empty 3 by 3 board with rows A to C from the top and columns 1 to 3 from the left."
    width: 149
    height: 154
givens: ["A domino covers two squares of a 3 by 3 board that share a side.", "Placements are different when they cover different squares."]
unknown: "In how many ways the domino can be placed."
leading_question: "Count the places for a domino lying across first, then for one standing up."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "12"
          units: ["way", "ways"]
          trap_values:
            - value: "24"
              trap: "double-count"
              text: "24 counts each placement once from each of its two squares."
            - value: "9"
              trap: "answered-other-question"
              text: "9 is the number of squares on the board."
            - value: "6"
              trap: "missed-case"
              text: "6 forgets the dominoes that stand up."
