id: "grid-56-d1-2"
statement:
  - text: "A square sheet of 4 by 4 cells is folded in half along a line of its grid. Then it is folded in half again along a line at right angles to the first. Now it is a square of 2 by 2 cells, four sheets thick. One cell of this square is cut out through all four sheets. How many cells are missing when the sheet is opened out?"
givens: ["A square sheet of 4 by 4 cells is folded in half, and then in half again at right angles.", "One cell of the folded square is cut out through all four sheets."]
unknown: "How many cells are missing when the sheet is opened."
canvas:
  kind: "handwriting_sheet"
  grid: "squares"
items:
  - answer_slots:
      - binding: "anywhere"
        check:
          kind: "number"
          key: "4"
          units: ["cell", "cells"]
          trap_values:
            - value: "1"
              trap: "ignored-condition"
              text: "1 forgets that the cut goes through all four layers of the folded sheet."
            - value: "2"
              trap: "stopped-early"
              text: "2 counts the layers after the first fold only."
            - value: "8"
              trap: "double-count"
              text: "8 counts every missing cell twice, once for each fold."
            - value: "16"
              trap: "answered-other-question"
              text: "16 is the number of cells of the whole sheet. Only the cells under the cut are missing."
    simpler_case: "Try a strip of 3 cells folded like a fan so that it is 3 sheets thick, with one cell cut out through all of them. How many cells are missing?"
solution:
  - text: "Each fold doubles the layers: 2 after the first fold and 4 after the second. The cut goes through all four layers, so 4 cells of the open sheet are cut out."
techniques: ["draw"]
leak_phrases: ["4 cells are missing", "four cells are missing"]
skills:
  primary: ["geometry-grid"]
band: "grades-5-6"
difficulty: 1
