# A lesson of E3 (T38; R14; docs/architecture.md, sections 3.5 and 3.6 of modules): the skill
# logic-ordering on the band of grades 3–4. Its texts are those of the page ordering of
# mathtrail-standalone's site at 42b4408, put to the learner, and its worked example is the page's
# example of this level. standalone's content in this module carries the MIT notice of NOTICE.
id: logic-ordering-grades-3-4
title: "Ordering: going further"
skills: [logic-ordering]
segments:
  - explanation:
      - text: "Who is taller, who is older, who came first? In these logic puzzles a few comparisons have to be joined into one order: by height, by age, by a place in a queue or in a race. It is a chain of reasoning, in which every clue is a link and none may be left out."
      - text: "Every clue is an arrow. “Ann is taller than Ben” puts Ann before Ben on the line. Whatever a clue compares, height, age or a place in a race, it says who comes first."
      - text: "Read it both ways. “Ben is shorter than Ann” says the same as “Ann is taller than Ben”. Turn every clue round so that all of them point the same way before they go on the line."
      - text: "A chain goes on. If a car is faster than a bus and the bus is faster than a bike, then the car is faster than the bike as well, though no clue says so."
  - worked_example:
      statement:
        - text: "Five children stand in a queue at the canteen: Lena, Max, Nina, Oleg and Pavel. Nina stands third. Oleg stands right behind Nina. Max stands somewhere in front of Lena, and Lena is not last. Who stands last?"
      canvas:
        kind: handwriting_sheet
        grid: squares
      demo:
        - text: "Put down what is certain: Nina is third, and Oleg, right behind her, is fourth. Places 1, 2 and 5 are left for Max, Lena and Pavel."
        - text: "Lena is not last, so she is first or second. Max stands somewhere in front of her, so she cannot be first: Lena is second, and Max first."
        - text: "The only place left, the fifth, is Pavel's. Check every clue: they all hold."
        - text: "Answer: Pavel stands last."
  - explanation:
      - text: "Every clue counts. Without “Lena is not last”, Lena could stand last as well: the short clue with “not” is the one that settles the queue."
  - task: ord-34-d1-1
  - task: ord-34-d3-2
  - task: ord-34-d5-2
  - explanation:
      - text: "How to solve: draw the line."
      - text: "Turn every clue the same way."
      - text: "Put the clues on the line, the certain ones first."
      - text: "Read the answer, and check every clue against it."
