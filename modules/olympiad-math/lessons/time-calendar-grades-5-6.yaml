# A lesson of E3 (T39; R14; docs/architecture.md, sections 3.5 and 3.6 of modules): the skill
# time-calendar on the band of grades 5–6. Its texts are those of the page calendar-and-age of
# mathtrail-standalone's site at 42b4408, put to the learner, and its worked example is the page's
# example of this level. standalone's content in this module carries the MIT notice of NOTICE.
id: time-calendar-grades-5-6
title: "Calendar and age: olympiad level"
skills: [time-calendar]
segments:
  - explanation:
      - text: "Today is Tuesday: what day will it be in 30 days? Mum is 30 and Ann is 6: how old will Ann be when Mum is twice her age? In these calendar and age problems you work with weeks, months and years, and two facts carry most of them: the week comes round every 7 days, and the difference between two ages never changes."
      - text: "The week comes round. Every 7 days the same day of the week comes back. So for 30 days ahead, only the 2 days left after 4 whole weeks matter."
      - text: "Both ends of a period. From 3 May to 10 May is 7 days ahead, but a holiday from the 3rd to the 10th lasts 8 days, because both the first and the last day count."
      - text: "The difference stays. Mum is 24 years older than Ann now, and she will be 24 years older in 10 years: each of them gets one year older every year."
  - worked_example:
      statement:
        - text: "In some month, three Saturdays fall on even dates. What day of the week is the 25th of that month?"
      canvas:
        kind: handwriting_sheet
        grid: squares
      demo:
        - text: "Saturdays come every 7 days, and 7 is odd, so their dates take turns: even, odd, even, odd…"
        - text: "Three even ones need five Saturdays, the first on an even date. The fifth comes 28 days after the first and must still fit in the month, so the first is no later than the 3rd. The only even date among the first three is the 2nd: the Saturdays are the 2nd, 9th, 16th, 23rd and 30th."
        - text: "The 23rd is a Saturday, so the 25th, two days later, is a Monday."
        - text: "Answer: Monday."
  - explanation:
      - text: "Even and odd in the calendar. The key to this task is parity: 7 is odd, so the dates of one day of the week change from even to odd every week."
  - task: cal-56-d1-1
  - task: cal-56-d3-1
  - task: cal-56-d5-1
  - explanation:
      - text: "How to solve: find what does not change."
      - text: "Find what repeats or stays the same."
      - text: "Drop the whole weeks, or work with the difference of ages."
      - text: "Count what is left, and check whether both ends count."
