# A lesson of E3 (T40; R14; docs/architecture.md, sections 3.5 and 3.6 of modules): the skill
# games-strategy on the band of grades 5–6. Its texts are those of the page winning-strategy of
# mathtrail-standalone's site at 42b4408, put to the learner, and its worked example is the page's
# example of this level. standalone's content in this module carries the MIT notice of NOTICE.
id: games-strategy-grades-5-6
title: "Games with a winning strategy: olympiad level"
skills: [games-strategy]
segments:
  - explanation:
      - text: "There are 20 matches on the table, and the players take turns to take 1, 2 or 3 of them. Whoever takes the last match wins, as in the game of Nim. Can the first player always win? In these tasks you look for a plan that wins whatever the other player does, and find it by working back from the end of the game: which positions lose for the player who has to move from them."
      - text: "From the end. Start from the end of the game, where the winner is clear, and go back: a position loses when every move from it leads to one that wins for the other player."
      - text: "Hand over a losing position. A winning move leaves the other player a losing position. If there is no such move, the position loses, however clever the player."
      - text: "Copy and mirror. In many games the winner keeps things even, answering each move so that the two moves add up to the same, or making the same move on the mirrored side."
  - worked_example:
      statement:
        - text: "There are 23 sweets in a bowl. Kim and Leo take turns, and Kim goes first. Each takes 1, 2, 3 or 4 sweets. Whoever takes the last sweet wins. How many sweets must Kim take first to be sure to win?"
      canvas:
        kind: handwriting_sheet
        grid: squares
      demo:
        - text: "From the end: with 1 to 4 sweets left, the player to move takes them all and wins. With 5 left, every move leaves 1 to 4 for the other player, so 5 loses."
        - text: "In the same way 10, 15 and 20 lose: whatever is taken from them, the other player can bring the bowl down to the next multiple of 5."
        - text: "So Kim takes 3 and leaves 20. Whatever Leo takes, Kim takes the rest of 5, leaving 15, 10, 5 and at last nothing."
        - text: "Answer: 3 sweets."
  - explanation:
      - text: "Why not take 4? Taking 4 leaves 19, and Leo takes 4 to leave 15, a losing bowl for Kim. Only the first move to a multiple of 5 wins against a player who makes no mistakes."
  - task: game-56-d1-1
  - task: game-56-d3-2
  - task: game-56-d5-2
  - explanation:
      - text: "How to solve: from the end of the game."
      - text: "Start from the positions at the end."
      - text: "Mark each one winning or losing, from the smallest up."
      - text: "Find the move that leaves the other player a losing one."
