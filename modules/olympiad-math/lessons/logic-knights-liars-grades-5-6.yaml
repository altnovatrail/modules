id: logic-knights-liars-grades-5-6
title: "Knights and liars: olympiad level"
skills: [logic-knights-liars]
segments:
  - explanation:
      - text: "On an island live knights, who always tell the truth, and liars, who always lie: the puzzles also known as knights and knaves. From what they say, you have to work out who is who. It is a first meeting with real logical reasoning: make an assumption, follow where it leads, and notice a contradiction."
      - text: "Knight. Always tells the truth. Every statement a knight makes is true, without exception."
      - text: "Liar. Always lies. Every statement a liar makes is false, and a liar never tells the truth, not even by accident."
      - text: "Nobody else. Every islander is either a knight or a liar. You cannot tell them apart by their looks, only by their words."
  - worked_example:
      statement:
        - text: "Ten islanders sit at a round table. Each of them says: “My neighbour on the right is a liar.” How many knights are at the table?"
      canvas:
        kind: handwriting_sheet
        grid: squares
      demo:
        - text: "If an islander is a knight, the words are true: the neighbour on the right is a liar."
        - text: "If an islander is a liar, the words are false: the neighbour on the right is a knight."
        - text: "So knights and liars take turns round the table: K, L, K, L… Exactly half of the ten are knights: 5 knights."
        - text: "Answer: 5 knights."
  - explanation:
      - text: "And if 9 islanders sit at the table? Taking turns round an odd number of seats never closes up: the last and the first would be of one kind. No such table can exist. Here knights and liars meet parity."
  - task: kl-56-d1-1
  - task: kl-56-d3-1
  - task: kl-56-d5-1
  - explanation:
      - text: "How to solve: “suppose that…”."
      - text: "Suppose."
      - text: "Work out what follows."
      - text: "Find a contradiction, or check the answer."
