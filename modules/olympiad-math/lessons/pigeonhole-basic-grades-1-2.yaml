# A lesson of the first batch (R07, R14; docs/architecture.md, section 3.6 of modules):
# the skill pigeonhole-basic on the band of grades 1–2. Its texts are those of the page
# pigeonhole-principle of mathtrail-standalone's site at 89986bc, put to the learner, and
# its worked example is the page's example of this level. standalone's content in this module
# carries the MIT notice of NOTICE.
id: pigeonhole-basic-grades-1-2
title: "Pigeonhole principle: first steps"
skills: [pigeonhole-basic]
segments:
  - explanation:
      - text: "Five pigeons fly into four holes: some hole is bound to hold two of them. In these tasks you prove that something must happen however unlucky the draw: two socks of one colour from a dark drawer, two birthdays in one month. It is reasoning about the worst case rather than the lucky one."
      - text: "More pigeons than holes. If there are more pigeons than holes, some hole holds at least two. Spread them as evenly as you like: one is always left over."
      - text: "To be sure. “To be sure” means whatever comes out of the bag. So imagine everything going as badly as it can, and see how far bad luck can go."
      - text: "One more settles it. When bad luck has run out, every colour drawn once and every hole filled once, the next one is bound to give what you want."
  - worked_example:
      statement:
        - text: "A jar holds 8 lemon sweets and 2 orange ones. Without looking, how many sweets must Sasha take to be sure of an orange one?"
      canvas:
        kind: handwriting_sheet
        grid: squares
      demo:
        - text: "Sasha wants an orange sweet. The worst luck is lemon after lemon."
        - text: "There are only 8 lemon sweets: after 8 of them, only orange ones are left in the jar."
        - text: "The 9th sweet is bound to be orange: 8 + 1 = 9."
        - text: "Answer: 9 sweets."
  - task: pig-12-d1-2
  - task: pig-12-d3-1
  - task: pig-12-d5-1
  - explanation:
      - text: "How to solve: the worst luck, then one more."
      - text: "Find the holes and the pigeons."
      - text: "Play the worst luck to the end."
      - text: "Add one, and check that it settles it."
