# The solving steps of olympiad mathematics: Pólya's four steps, as the format's example of this
# module has them, after the coach of standalone's prototype; NOTICE says where they came from. No
# step names a number, since every task of the module goes through each.
steps:
  - title: Understand the task
    description: Read the task again, and tick what is known and what you are to find.
    gives: [givens]
    exit_condition: givens_ticked
  - title: Make a plan
    gives: [techniques]
    exit_condition: none
  - title: Solve it
    exit_condition: answer_slots_filled
  - title: Check the answer
    description: Put your answer back into the task, and see whether everything fits.
    exit_condition: none
