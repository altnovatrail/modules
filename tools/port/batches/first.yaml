# The first batch of novatrail/olympiad-math: 27 tasks of standalone, three skills by three bands by
# three difficulties (R07; docs/architecture.md, section 3.6). The units are the word each question
# counts, in the singular and the plural, and for a measure its abbreviation too; the techniques are
# those standalone's site links to each topic, and draw for counting-gaps beside them.
