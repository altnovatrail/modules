# What a person adds to enum-56-d1-3 of standalone; the port writes the task from it (R12).
givens:
  - "The card lists 5 matches."
  - "For each match one of three boxes is ticked: home win, away win or draw."
unknown: "In how many different ways the card can be filled in."
simpler_case: "Try a card of 2 matches first. List the ways."
trap_texts:
  "15": "15 = 3 × 5 adds 3 ways for each match. But every way for one match goes with every way for the others, so the ways are multiplied."
  "125": "125 = 5 × 5 × 5 swaps the two numbers: it gives each match five choices, but a match has only three boxes."
