# What a person adds to gaps-12-d1-1 of standalone; the port writes the task from it (R12).
givens:
  - "Six trees grow in a row."
unknown: "How many gaps there are between the trees."
simpler_case: "Try 3 trees in a row first. Point at each gap between two trees and count the gaps."
trap_texts:
