# What a person adds to tri-56-d1-3 of standalone; the port writes the task from it (R12).
givens:
  - "Tom adds the digits 1 to 6 in turn, again and again."
  - "He stops when the total is exactly 120."
unknown: "Which digit he adds last."
simpler_case: "Try the digits 1 to 3 in turn, stopping at a total of 9. Which digit comes last?"
trap_texts:
