# What a person adds to wp-56-d1-1 of standalone; the port writes the task from it (R12).
givens:
  - "A bag holds 10 coins, and one of them is a heavier fake."
  - "The real coins weigh the same, and the balance has no weights."
unknown: "The smallest number of weighings that always finds the fake."
simpler_case: "Try 4 coins with one heavier fake. How many weighings find it?"
trap_texts:
  "2": "2 weighings find the fake only with luck: they cannot tell apart 10 coins."
  "4": "Count again how many coins each weighing can leave the fake among."
  "5": "5 weighs the coins in pairs, one against one, and only the fifth pair finds the fake in the worst case. With several coins on each pan, fewer weighings are enough."
