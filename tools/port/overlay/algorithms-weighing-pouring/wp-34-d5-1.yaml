# What a person adds to wp-34-d5-1 of standalone; the port writes the task from it (R12).
givens:
  - "Of 12 coins, one is a fake, heavier or lighter, and nobody knows which."
  - "The real coins weigh the same, and the balance has no weights."
unknown: "The smallest number of weighings that finds the fake and tells whether it is heavier or lighter."
simpler_case: "Try 2 coins, one a fake that is heavier or lighter, and a third coin known to be real. How many weighings find the fake and tell which?"
trap_texts:
  "4": "Count the weighings again in the worst case."
  "6": "12 ÷ 2 = 6 is the number of pairs, not of weighings."
